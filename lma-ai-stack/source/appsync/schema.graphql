	# regeneration is in flight: {"source","status","startedAt","updatedAt",
	# "message"}. `source` is "generated" or "manual"; `status` is "running",
	# "failed" or absent. Absent altogether on a meeting summarised before this
	# field existed, which readers treat as a generated summary with nothing
	# running. See ui/src/components/common/summary-state.js for the shape.
