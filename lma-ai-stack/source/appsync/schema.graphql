	labels: [CallLabel]
	audience: String
	meetingContext: String
	checklist: [ChecklistItemDefinition]
	# The people the meeting is to be shared with once the VP creates it, as
	# comma-separated email addresses. Only the meetingSharedWith input sets it,
	# and it does not share the Virtual Participant itself (that is SharedWith).
