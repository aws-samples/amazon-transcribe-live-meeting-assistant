# An estimate of what one meeting cost, built from metering records written
# where the usage happened and a configurable price table. It is an estimate:
# list prices, first usage tier, and only the usage that is metered -- NotIncluded
# names what is left out. See docs/meeting-cost-estimate.md.
type CallCost @aws_cognito_user_pools @aws_iam {
	CallId: ID!
	Currency: String
	# Sum of every priced line. Lines with no price are excluded, and counted in
	# UnpricedCount, so a non-zero count means this total is incomplete.
	TotalCost: Float
	ContextTotals: [CallCostContextTotal]
	Items: [CallCostLineItem]
	UnpricedCount: Int
	# Metering records read for this meeting.
	RecordCount: Int
	# The date the default prices were taken, and from where.
	PricesAsOf: String
	PriceSource: String
	# The deployment's region, and the region whose prices stand in for any
	# region the price table does not list (named in RegionsWithoutListedPrices).
	Region: String
	BaseRegion: String
	RegionsWithoutListedPrices: [String]
	NotIncluded: [String]
	ComputedAt: AWSDateTime
}

type CallCostContextTotal @aws_cognito_user_pools @aws_iam {
	# What the usage was for: Transcription, VirtualParticipant, VoiceAssistant,
	# MeetingAssistant, Summary, SpeakerNaming, Sentiment, PageAutomation.
	Context: String
	Cost: Float
}

type CallCostLineItem @aws_cognito_user_pools @aws_iam {
	Context: String
	# "<service>/<api-or-model>", the key the price table is looked up by.
	Service: String
	Region: String
	Unit: String
	Quantity: Float
	# USD per unit; null when the price table has no price for this unit.
	UnitPrice: Float
	Cost: Float
	# False for a unit that is shown for reference but not billed on its own
	# (requests, sessions, runtime seconds).
	Chargeable: Boolean
	Priced: Boolean
	# Why a figure is approximate or deliberately unpriced, from the price table.
	Note: String
	# How the usage was measured: launch type, sizes, session counts.
	Details: String
}

# A JSON string: {"Default", "Custom", "Effective", "Version", "UpdatedBy",
# "UpdatedAt", "Region"}. Default is the table this release ships, Custom the
# Admin's changes over it, Effective the merge every estimate uses.
type CallPricing @aws_cognito_user_pools {
	Pricing: String
}

input UpdateCallPricingInput {
	# A JSON object holding the changes over the shipped table -- the same shape,
	# naming only what differs. "{}" returns every price to the shipped value.
	Pricing: String!
	# The Version getCallPricing returned; a save against a newer record is refused.
	ExpectedVersion: Int!
	# Recorded on the revision this save creates in the configuration history.
	# Optional; at most 500 characters are kept.
	Comment: String
}

type UpdateCallPricingOutput @aws_cognito_user_pools {
	Success: Boolean!
	Version: Int
}

# Short-lived auth token for reaching a Virtual Participant's noVNC port when
# the VP runs on Lambda MicroVMs (VPLaunchType=MICROVM).
#
# Minting requires IAM credentials (lambda:CreateMicrovmAuthToken), so it happens
# server-side. Tokens are capped at 60 minutes by the service while meetings can
# run up to 8 hours, so the viewer mints one per session and again on reconnect
# rather than receiving one at VP launch.
# Short-lived access token for a Virtual Participant's /vnc/<vpId> path on the
# CloudFront distribution (the ECS launch types).
#
# Minted by an authenticated resolver that first confirms the caller's access to
# the Virtual Participant, and signed with a per-deployment key that the
# Lambda@Edge viewer-request function checks. The payload names the one
# participant and path the token is good for and expires within minutes, so the
# viewer mints one per connection attempt rather than holding one.
type VncEdgeToken @aws_cognito_user_pools {
	token: String!
	expiresAt: AWSDateTime!
	# Credential for the VNC server itself, recorded per task by the VP. Returned
	# alongside the token so an authorized viewer needs one round trip. Null for
	# tasks that started before this was published.
	vncPassword: String
}

type MicrovmVncToken @aws_cognito_user_pools {
	authToken: String!
	expiresAt: AWSDateTime!
}

