enum CallStatus {
	STARTED
	TRANSCRIBING
	ERRORED
	ENDED
}

# The two speech channels: REMOTE is everyone else in the meeting (the meeting
# audio), LOCAL the local side (the user's microphone, or a Virtual Participant's
# voice assistant). See lma_channels in the configuration layer. CALLER and AGENT
# are the names LMA before 0.4.0 wrote for REMOTE and LOCAL, kept (and marked
# @deprecated) so that segments stored by those versions still serialize;
# addTranscriptSegment stores them under the new names, and every reader treats
# them as REMOTE and LOCAL. MEETING_CHAT holds the messages participants typed
# in the meeting chat, which a Virtual Participant adds to the transcript, one
# segment per message; it is not speech, and the readers of what was said leave
# it out. CATEGORY_MATCH, AGENT_VOICETONE and CALLER_VOICETONE are retired: the
# two transcript queries leave out any stored item that still carries one (see
# getTranscriptSegments.request.vtl). (AppSync's schema parser refuses a comment
# between enum values, so this one sits above the enum.)
enum Channel {
	REMOTE
	LOCAL
	MEETING_CHAT
	CALLER @deprecated(reason: "Stored by LMA before 0.4.0; read as REMOTE.")
	AGENT @deprecated(reason: "Stored by LMA before 0.4.0; read as LOCAL.")
	AGENT_ASSISTANT
	CHAT_ASSISTANT
}

