	clientId: String!
	authorizationUrl: String!
	tokenUrl: String!
	scopes: [String!]
	codeChallenge: String!
	serverUrl: String
	serverName: String
}

# authorizationUrl and state are nullable because the resolver answers a request
# it cannot start with {success: false, error: "..."} instead; a non-null field
# would turn that readable message into a null-field error at the client.
type InitOAuthFlowOutput @aws_cognito_user_pools @aws_iam {
	authorizationUrl: String
	state: String
	success: Boolean
	error: String
}

input OAuthCallbackInput {
	code: String!
	state: String!
	codeVerifier: String
}

type OAuthCallbackOutput @aws_cognito_user_pools @aws_iam {
	success: Boolean!
	serverId: String
	error: String
}

type MCPApiKey @aws_cognito_user_pools {
	keyPrefix: String!
	createdAt: String!
	enabled: Boolean!
	# "read": the hosted MCP server answers the key only for the tools that
	# change nothing. "read-write": every tool. "legacy": a key created before
	# keys had a scope, answered for the server's original tools and the tools
	# that change nothing.
	scope: String
}

type GenerateMCPApiKeyOutput @aws_cognito_user_pools {
	keyValue: String!
	keyPrefix: String!
	createdAt: String!
	scope: String
}

