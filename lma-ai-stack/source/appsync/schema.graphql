type VirtualParticipant @aws_cognito_user_pools @aws_iam {
	id: ID!
	meetingName: String
	meetingPlatform: String
	meetingId: String
	meetingPassword: String
	meetingTime: AWSTimestamp
	scheduledFor: AWSDateTime
	isScheduled: Boolean
	scheduleId: String
	status: String
	owner: String
	Owner: String
	SharedWith: String
	# Persisted on the VP row only for SCHEDULED meetings: the launching
	# user's Cognito sub (so the VPScheduler Lambda can pass LMA_USER_SUB to
	# the eventually-launched ECS task) and a flag/duplicate sub indicating
	# whether to fetch the user's Zoom credentials at launch time. Immediate
	# meetings carry these via the Step Functions state-machine input rather
	# than persisting them.
	userSub: String
	userZoomSub: String
	# Whether the VP should capture meeting video (screen recording) in addition
	# to audio. Defaults to true; persisted on the row so the VPScheduler Lambda
	# can plumb ENABLE_VIDEO_RECORDING to scheduled launches.
	enableVideoRecording: Boolean
	createdAt: AWSDateTime
	updatedAt: AWSDateTime
	CallId: ID
	vncEndpoint: String
	vncPort: Int
	vncReady: Boolean
	taskPrivateIp: String
	vncPassword: String
	manualActionType: String
	manualActionMessage: String
	manualActionTimeoutSeconds: Int
	manualActionStartTime: AWSDateTime
	# The status MANUAL_ACTION_REQUIRED interrupted. A prompt can arrive at any
	# point from sign-in to mid-meeting, so this is what the VP goes back to
	# once the user has dealt with it -- there is no single status that is right
	# to return to. Removed with the rest of the prompt when it is cleared.
	statusBeforeManualAction: String
	errorMessage: String
	# Structured identifier of the branch the VP exited through, taken from
	# `ExitInfo.trigger` in the container (e.g. "pre-join:not-admitted",
	# "acs-not-admitted", "attendees-left", "meetingTimeout"). `errorMessage`
	# carries the prose shown to the user; this carries the machine-readable
	# code, so join outcomes can be aggregated by query rather than by
	# grepping container logs.
	endTrigger: String
	# Why the VP was ended from outside: written by endVirtualParticipant,
	# which has carried it on the row all along without it being declared
	# here, so it could not be read back through the API. Prose, supplied by
	# the caller ("User requested termination"); endTrigger above is the
	# machine-readable field.
	endReason: String
	# Set to true by acknowledgeVPFailure when the user clicks "Got it" on
	# the failure banner. The VP container polls this on the FAILED path
	# and proceeds with ALB/VNC tear-down as soon as it flips (or after a
	# hard cap). Lets the user actually read the error in the LMA viewer
	# instead of having the VNC connection drop the moment the failure
	# is set.
	userAcknowledgedFailure: Boolean
}

input CreateVirtualParticipantInput {
	meetingName: String!
	meetingPlatform: String!
	meetingId: String!
	meetingPassword: String
	meetingTime: AWSTimestamp
	isScheduled: Boolean
	status: String!
	# Optional override for the Owner field — used by IAM-authenticated callers
	# (e.g. the MCP analytics Lambda) so the row is owned by the LMA user
	# rather than the calling Lambda's IAM role session.
	# When the caller is a Cognito user the resolver ignores this field and
	# trusts $ctx.identity.username as before.
	owner: String
	# Persisted on the VP row for SCHEDULED meetings only, so the
	# VPScheduler Lambda can pass LMA_USER_SUB / ZOOM_CREDENTIALS_SECRET_NAME
	# to the launched ECS task at meeting time. Immediate (non-scheduled)
	# meetings plumb these through the Step Functions input directly and
	# don't need to persist them on the row.
	userSub: String
	userZoomSub: String
	# Per-VP screen-recording toggle (default true). Persisted on the row so
	# scheduled launches can read it; immediate launches also pass it via the
	# Step Functions input.
	enableVideoRecording: Boolean
}

input UpdateVirtualParticipantInput {
	id: ID!
	# Optional: the resolver writes `status` only when it is supplied, so a
	# caller that owns one unrelated field (linking a CallId, clearing a
	# manual-action prompt) updates that field alone and the row keeps
	# whatever status its own lifecycle last wrote.
	status: String
	CallId: ID
	vncEndpoint: String
	vncPort: Int
	vncReady: Boolean
	taskPrivateIp: String
	vncPassword: String
	manualActionType: String
	manualActionMessage: String
	manualActionTimeoutSeconds: Int
	manualActionStartTime: AWSDateTime
	statusBeforeManualAction: String
	errorMessage: String
	endTrigger: String
	userAcknowledgedFailure: Boolean
	# Clear flags. An omitted field means "leave this attribute as it is", so
	# clearing an attribute needs a signal of its own. Setting one of these to
	# true removes the corresponding attribute(s) from the row; the flag wins
	# over a value supplied for the same attribute in the same call.
	clearErrorMessage: Boolean
	clearManualAction: Boolean
}

