# Configuration history
#
# Every save into the configuration store records a revision of the profile it
# saves into. See docs/configuration-store.md.
type ConfigurationRevision @aws_cognito_user_pools {
	Revision: Int!
	CreatedAt: String
	# The saver's email address, or their username where the token carries none:
	# the same identity the configuration records hold as UpdatedBy.
	CreatedBy: String
	# The sections this revision changed relative to the one before it; for the
	# first revision of a profile, every section it holds. Null when not known.
	Sections: [String]
	Comment: String
	# save, restore, deploy, backfill (the profile as it stood when history
	# began) or recovered (recorded from the profile after its own save could
	# not store it).
	Source: String
	RestoredFrom: Int
	Label: String
	# The profile version the revision was saved as.
	Version: Int
	SizeBytes: Int
	# Whether this revision is the profile's current state.
	Published: Boolean
}

type ConfigurationRevisionList @aws_cognito_user_pools {
	Profile: String!
	# The profile's current version: what a restore sends as ExpectedVersion.
	Version: Int
	LatestRevision: Int
	PublishedRevision: Int
	# Newest first.
	Revisions: [ConfigurationRevision]
}

type ConfigurationRevisionDetail @aws_cognito_user_pools {
	Profile: String!
	Revision: Int!
	CreatedAt: String
	CreatedBy: String
	Sections: [String]
	Comment: String
	Source: String
	RestoredFrom: Int
	Label: String
	Version: Int
	SizeBytes: Int
	Published: Boolean
	# The whole profile body this revision holds, as a JSON string.
