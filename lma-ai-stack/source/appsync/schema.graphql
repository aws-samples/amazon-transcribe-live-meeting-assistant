	# voice id the engine assigned, e.g. 'Other Participant (spk_0)') to a real
	# name, plus any merges of two voice ids onto one person, single-segment
	# overrides and the optional pasted attendee list. Applied wherever a speaker
	# is read rather than written back onto the segments, so naming a voice is one
	# small write and applies retroactively to the whole transcript. See
	# ui/src/components/common/speaker-identities.js for the shape and the
	# resolution order.
