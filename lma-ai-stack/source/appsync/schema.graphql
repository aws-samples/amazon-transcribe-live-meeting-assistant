type Call implements DynamoDbBase @aws_cognito_user_pools
@aws_iam {
	PK: ID!
	SK: ID!
	CreatedAt: AWSDateTime!
	UpdatedAt: AWSDateTime!
	ExpiresAfter: AWSTimestamp
	CallId: ID!
	CustomerPhoneNumber: String
	Sentiment: SentimentAggregation
	SystemPhoneNumber: String
	Status: CallStatus
	RecordingUrl: String
	VideoRecordingUrl: String
	# Every recording link the meeting has been given, oldest first, written
	# beside RecordingUrl and VideoRecordingUrl (which name the latest). A
	# meeting continued by a Virtual Participant rejoin has one file per
	# session; deleting the meeting deletes every one. Absent on a meeting
	# recorded before they were kept.
	RecordingUrls: [String]
	VideoRecordingUrls: [String]
	# The capture session each link in RecordingUrls and VideoRecordingUrls was
	# recorded in, at the same index; null where the writer did not know it.
	# Written with the link, in the same update. Absent, or shorter than the
	# link list, on a meeting recorded by a pre-release build of the rejoin
	# feature; the meeting page then pairs them only where it can.
	RecordingUrlSessions: [Int]
	VideoRecordingUrlSessions: [Int]
	TotalConversationDurationMillis: Float
	AgentId: String
	Metadatajson: String
	CallSummaryText: String
	# Small JSON object describing where the summary text came from and whether a
	# run is in flight: {"source","status","trigger","startedAt","updatedAt",
	# "message"}. `source` is "generated" or "manual"; `status` is "running",
	# "failed", "idle" or absent; `trigger` is "meeting-end" for the summary the
	# pipeline produces when a meeting ends, and absent for a regeneration.
	# Absent altogether on a meeting summarised before this field existed, and
	# on a meeting in a deployment with summaries switched off, which readers
	# treat as a summary with nothing running. See
	# ui/src/components/common/summary-state.js for the shape.
	CallSummaryState: String
	# JSON map from a transcript segment's STORED speaker (its channel plus the
	# voice id the engine assigned, e.g. 'Other Participant (spk_0)') to a real
	# name, plus any merges of two voice ids onto one person, single-segment
	# overrides and the optional pasted attendee list. Applied wherever a speaker
	# is read rather than written back onto the segments, so naming a voice is one
	# small write and applies retroactively to the whole transcript. See
	# ui/src/components/common/speaker-identities.js for the shape and the
	# resolution order.
	SpeakerIdentities: String
	# The meeting's agenda: plain text, one item per line. Written through
	# updateCallAgenda and, for a meeting a Virtual Participant started with an
	# agenda, at creation through createCall. Absent on a meeting nobody gave an
	# agenda. See docs/meeting-agenda.md.
	Agenda: String
	# Where the stored agenda came from: "scheduled" (the Virtual Participant
	# form), "mcp" (an MCP client starting or scheduling a Virtual Participant),
	# "ui" (typed on the meeting page) or "derived" (read from the transcript).
	AgendaSource: String
	# Who last set the agenda -- a username for a person, a fixed label for the
	# backend -- and when.
	AgendaUpdatedBy: String
	AgendaUpdatedAt: AWSDateTime
	# The meeting's preparation, beside its agenda: key/value labels, its
	# audience, a briefing for the assistant and the summary, and the items it
	# should cover. Set when a Virtual Participant creates the meeting (from the
	# values it was started or scheduled with) and through updateCallLabels,
	# updateCallAudience, updateCallMeetingContext, updateCallChecklist and
	# updateCallChecklistItem, which hold a signed-in caller to the
	# updateCallAgenda access rule. Never posted to the meeting chat or spoken by
	# LMA on its own. See docs/meeting-context-and-checklist.md.
	# At most 20. Key [a-z0-9][a-z0-9._-]{0,62}, unique; Value at most 256
	# characters. [] once cleared.
	Labels: [CallLabel]
	# "internal", "external", or absent (unspecified, the default).
	Audience: String
	# When Labels or Audience last changed.
	MeetingMetadataUpdatedAt: AWSDateTime
	# Markdown, at most 20,000 characters, with who last set it and when.
	MeetingContext: String
	MeetingContextUpdatedBy: String
	MeetingContextUpdatedAt: AWSDateTime
	# At most 100 items, and at most 128 KB stored.
	Checklist: [ChecklistItem]
	ChecklistUpdatedAt: AWSDateTime
	# The meeting's consent record: the mode and rule it runs in, its status,
	# whether it may be recorded and transcribed now, and the notices, replies,
	# attestation and evidence behind that. Absent on a meeting whose consent was
	# never started. Written only through the meeting consent mutations, and
	# read with signed evidence links through getMeetingConsent. See
	# docs/meeting-consent.md.
	Consent: MeetingConsent
	# Set by the transcript deletion function while the Retention section deletes
	# transcripts after the summary: when this meeting's transcript is due to be
	# deleted, when it was (the first time; a later sweep keeps it), and how many
	# transcript segments and files were removed in all. See
	# docs/transcript-deletion.md.
	TranscriptDeletionScheduledFor: AWSDateTime
	TranscriptDeletedAt: AWSDateTime
	TranscriptSegmentsDeleted: Int
	TranscriptFilesDeleted: Int
	# How the meeting was captured and transcribed, written when it starts (and
	# again if the engine changes, see updateCaptureContext). Absent on a meeting
	# started before these fields existed. See
	# docs/websocket-streaming-api.md#capture-context.
	# CaptureSource: VIRTUAL_PARTICIPANT, STREAM_AUDIO (the Stream Audio page and
	# its embeddable component), BROWSER_EXTENSION, DESKTOP_APP, UPLOAD, or API
	# (any other client of the streaming API, or one that did not say).
	CaptureSource: String
	# TRANSCRIBE (Amazon Transcribe) or MICROVM_ASR (the on-demand ASR MicroVM).
	# A meeting that fell back from the MicroVM to Amazon Transcribe reads
	# TRANSCRIBE.
	TranscriptionEngine: String
	# The Amazon Transcribe language setting the meeting used: a language code
	# such as en-US, or identify-language / identify-multiple-languages when
	# Transcribe identified the language. Not set for MICROVM_ASR, whose model
	# sets the language; a meeting moved to the MicroVM after START can keep the
	# value START recorded, so read it only when TranscriptionEngine is TRANSCRIBE.
	TranscriptionLanguage: String
	# Which channels speaker separation (diarization) was asked for: BOTH,
	# REMOTE (the meeting audio), LOCAL (the microphone) or NONE.
	SpeakerSeparation: String
	# The languages the speech engine identified in the meeting, as language
	# codes (e.g. en-US, es-US), in the order each was first heard. Added to by
	# addCallDetectedLanguage when a segment arrives in a language the meeting
	# does not list yet. Absent when no segment named a language: a fixed
	# language setting, or the ASR MicroVM engine.
	DetectedLanguages: [String]
	# Whether transcription is paused because someone typed the pause command
	# (LMA pause) to the meeting's Virtual Participant in the meeting chat, as a
	# JSON string: {"Paused": true, "At": <when>, "By": <chat sender, when the
	# chat showed one>}, or {"Paused": false, "At": <when>} once LMA start
	# resumed it. Written through updateTranscriptionPause. Absent on a meeting
	# never paused that way. The meeting page shows a banner while it reads
	# paused and the meeting is live. Consent withholding capture is not
	# recorded here; see Consent.
	TranscriptionPause: String
	# Capture sessions. A meeting is captured in one session unless its owner
	# or an Admin rejoins it with its Virtual Participant (rejoinVirtualParticipant),
	# which reopens it and appends a further session. SessionNumber is the
	# latest session the rejoin allowed (absent: 1), SessionOffsetSeconds where
	# that session starts on the transcript timeline, and ReopenedAt and
	# ReopenedBy when and by whom it was allowed. SessionStartedNumber and
	# SessionStartedAt are written by startCallSession when that session's
	# START event reopens the meeting. See docs/virtual-participant.md#rejoin.
	SessionNumber: Int
	SessionOffsetSeconds: Float
	ReopenedAt: AWSDateTime
	ReopenedBy: String
	SessionStartedNumber: Int
	SessionStartedAt: AWSDateTime
	# Every capture session after the first that has started, oldest first, with
	# where it starts on the transcript timeline: appended by startCallSession.
	# The first session starts at 0 and is not listed. The meeting page's player
	# reads it, with the recording lists above, to play each session's recording
	# at its place on the timeline.
	Sessions: [CallSession]
	Owner: String
	SharedWith: String
}

