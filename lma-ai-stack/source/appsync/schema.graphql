# ----------------------------------------------------------------------------
# Voice enrollment
#
# A voiceprint is biometric data, so consent is first-party: the enrollee
# authenticates as themselves and performs the consent in their own session. An
# admin can revoke; only the enrollee can grant, and no field here lets
# anyone enrol somebody else. These fields are served only in a deployment with
# EnableVoiceEnrollment=true -- the schema advertises them regardless, so a
# deployment without it resolves them to null.
# ----------------------------------------------------------------------------

type VoiceEnrollmentState @aws_cognito_user_pools {
	Success: Boolean
	Message: String
	# none | pending | active | revoked
	Status: String
	DisplayName: String
	ConsentExpiresAt: String
	# True when the terms have changed since this person agreed, so what they
	# agreed to is no longer what the deployment does.
	NeedsReconsent: Boolean
	TermsVersion: String
	# The exact text the enrollee is shown and whose hash is stored with their
	# consent, so a stored consent proves what it was given to.
	Terms: String
}

type VoiceEnrollmentResult @aws_cognito_user_pools {
	Success: Boolean
	Message: String
	Status: String
}

input EnrolMyVoiceInput {
	# The name to label transcripts with, as the enrollee types it.
	DisplayName: String!
	# Base64 PCM recordings. Used to compute the voiceprint and then discarded --
	# they are never written to S3 or to a table.
	Samples: [String!]!
	TotalSeconds: Float!
}

input RevokeVoiceConsentInput {
	# Omitted when withdrawing your own. An admin may name somebody else, for a
	# person who has left; the log records which of them acted.
	SubjectId: ID
}

input UpdateSpeakerIdentitiesInput {
	CallId: ID!
	SpeakerIdentities: String!
}

# ----------------------------------------------------------------------------
# Meeting summary: hand edits and regeneration
#
# The end-of-meeting summary is written by the Kinesis pipeline through
# addCallSummaryText, which is reachable by IAM callers only. These two fields
# are the browser-reachable surface, so each is held to the same access rule the
# read path applies -- Admin, the meeting's owner, or a user it has been shared
# with -- and each enforces it rather than relying on the client.
# ----------------------------------------------------------------------------

input UpdateCallSummaryTextInput {
	CallId: ID!
	# The summary text to store. Optional so the same mutation can record a state
	# change (a run starting, a run failing) without touching the text -- which is
	# what keeps the previous summary intact when a regeneration fails. At least
	# one of CallSummaryText and CallSummaryState must be supplied.
	CallSummaryText: String
	CallSummaryState: String
}

input RegenerateCallSummaryInput {
	CallId: ID!
}

type RegenerateCallSummaryOutput @aws_cognito_user_pools
@aws_iam {
	# True when a run was accepted. The summary itself is not in this response:
	# summarisation outlives a GraphQL request, so the run continues in the
	# background and the new text arrives through onUpdateCall.
	Success: Boolean
	Message: String
}

input ResolveSpeakerNamesInput {
	CallId: ID!
	# True when a user asked for this pass explicitly. An automatic pass skips the
	# model when no new speech could name anybody; pressing the button answers the
	# user regardless. Ignored for a caller without a Cognito identity.
	Force: Boolean
}

type ResolveSpeakerNamesOutput @aws_cognito_user_pools
@aws_iam {
	Success: Boolean
	Message: String
	NamesApplied: Int
