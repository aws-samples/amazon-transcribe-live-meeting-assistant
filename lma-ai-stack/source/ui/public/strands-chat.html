<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
    <title>STRANDS Meeting Assistant</title>
    <link rel="stylesheet" href="css/strands-chat.css">
    <!--
      Vendored locally to avoid an external CDN dependency. Versions are pinned;
      see the banner at the top of each file and the notes in js/render-markdown.js.
        marked v11.1.1    https://github.com/markedjs/marked
        DOMPurify 3.4.15  https://github.com/cure53/DOMPurify
      render-markdown.js composes the two into renderMarkdownSafe(), which is the
      only way this page turns markdown into HTML, so every rendered string has
      been through the sanitizer's allowed tag/attribute set.
    -->
    <script src="js/marked.min.js"></script>
    <script src="js/purify.min.js"></script>
    <script src="js/render-markdown.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <p><em>LMA Meeting Assistant is ready. Ask knowledge base questions or request a summary of the current meeting.</em></p>
                <div class="suggestions-container" id="suggestionsContainer">
                    <!-- Buttons will be loaded dynamically -->
                </div>
            </div>
        </div>
        <div class="input-container">
            <input type="text" class="input-field" id="messageInput" placeholder="Type your question here..." />
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script src="js/strands-chat.js"></script>
</body>
