  ##########################################################################
  # Zoom Credentials Manager - per-user Zoom username/password storage
  # in AWS Secrets Manager, keyed by Cognito sub. Used by the Virtual
  # Participant when joining Zoom meetings that require sign-in (or to
  # improve join reliability). Plaintext password is never returned
  # to the React client; getMyZoomCredentialsStatus returns presence and
  # username only.
  ##########################################################################

  ZoomCredentialsManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ZoomCredentialsManager"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/zoom_credentials_manager
      Description: Per-user Zoom credentials manager (Secrets Manager backed)
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          # NOTE: Uses LMAStackName (parent), not AWS::StackName (which would
          # resolve to this nested AISTACK name and mismatch what the VP
          # container reads). Must agree with the VP TaskRole policy and
          # the runtime fetch path.
          LMA_STACK_NAME: !Ref LMAStackName
          CUSTOMER_MANAGED_KMS_KEY_ID: !Ref CustomerManagedEncryptionKeyArn
          VP_PROFILES_BUCKET: !Ref VPProfilesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:DescribeSecret
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecret
                - secretsmanager:DeleteSecret
                - secretsmanager:RestoreSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${LMAStackName}/zoom-credentials/*"
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
              Condition:
                StringEquals:
                  "kms:ViaService":
                    - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
                    - !Sub "s3.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${VPProfilesBucket}"
            - Effect: Allow
              Action:
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub "arn:aws:s3:::${VPProfilesBucket}/profiles/*"
      LoggingConfig:
        LogGroup: !Sub "/${AWS::StackName}/lambda/ZoomCredentialsManager"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - ZoomCredentialsManagerLogGroup

  ZoomCredentialsManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/ZoomCredentialsManager"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  ZoomCredentialsManagerDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: ZoomCredentialsManager
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt ZoomCredentialsManagerDataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ZoomCredentialsManagerFunction.Arn

  ZoomCredentialsManagerDataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: appsync.amazonaws.com
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
