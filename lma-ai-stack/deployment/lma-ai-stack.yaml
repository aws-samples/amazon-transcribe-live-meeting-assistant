    Condition: ShouldEnableMCPServer
    Properties:
      FunctionName: !GetAtt MCPApiKeyAuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MCPApiKeyRestApi}/authorizers/${MCPApiKeyAuthorizer}"

