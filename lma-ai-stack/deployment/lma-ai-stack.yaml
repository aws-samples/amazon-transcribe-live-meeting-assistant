  # REST API Gateway with Lambda Authorizer
  MCPApiKeyRestApi:
    Type: AWS::ApiGateway::RestApi
    Condition: ShouldEnableMCPServer
    Properties:
      Name: !Sub "${LMAStackName}-MCP-ApiKey"
      Description: "LMA MCP Server - API Key authenticated endpoint"
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Request Validator for MCPApiKey API
  # Validates request parameters and headers. Body validation skipped because
  # MCP protocol uses varying JSON-RPC payloads handled by Lambda authorizer/backend.
  MCPApiKeyRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Condition: ShouldEnableMCPServer
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi
      Name: "MCPApiKeyRequestValidator"
      ValidateRequestBody: false
      ValidateRequestParameters: true

  MCPApiKeyAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Condition: ShouldEnableMCPServer
    Properties:
      Name: MCPApiKeyAuth
      RestApiId: !Ref MCPApiKeyRestApi
      Type: REQUEST
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MCPApiKeyAuthorizerFunction.Arn}/invocations"
      AuthorizerResultTtlInSeconds: 0

  MCPApiKeyResource:
    Type: AWS::ApiGateway::Resource
    Condition: ShouldEnableMCPServer
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi
      ParentId: !GetAtt MCPApiKeyRestApi.RootResourceId
      PathPart: "{proxy+}"

  MCPApiKeyMethod:
    Type: AWS::ApiGateway::Method
    Condition: ShouldEnableMCPServer
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi
      ResourceId: !Ref MCPApiKeyResource
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MCPApiKeyAuthorizer
      RequestValidatorId: !Ref MCPApiKeyRequestValidator
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MCPServerAnalyticsFunction.Arn}/invocations"

  MCPApiKeyRootMethod:
    Type: AWS::ApiGateway::Method
    Condition: ShouldEnableMCPServer
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi
      ResourceId: !GetAtt MCPApiKeyRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MCPApiKeyAuthorizer
      RequestValidatorId: !Ref MCPApiKeyRequestValidator
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MCPServerAnalyticsFunction.Arn}/invocations"

  MCPApiKeyDeployment:
    Type: AWS::ApiGateway::Deployment
    Condition: ShouldEnableMCPServer
    DependsOn:
      - MCPApiKeyMethod
      - MCPApiKeyRootMethod
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi

  MCPApiKeyStage:
    Type: AWS::ApiGateway::Stage
    Condition: ShouldEnableMCPServer
    # checkov:skip=CKV_AWS_73: "X-Ray tracing not required for this API; operational cost consideration"
    # checkov:skip=CKV_AWS_76: "API Gateway access logging (AccessLogSetting) intentionally not configured — same rationale as CKV2_AWS_4 below (requires account-wide AWS::ApiGateway::Account.CloudWatchRoleArn singleton that LMA does not take ownership of). Customers who want per-request MCP access logs can enable them manually after deployment by following the steps in the CKV2_AWS_4 skip comment."
    # checkov:skip=CKV2_AWS_4: "CloudWatch access logging (AccessLogSetting) and method-level execution logging (MethodSettings.LoggingLevel) are intentionally NOT configured on this stage. Both require the account/region-wide AWS::ApiGateway::Account.CloudWatchRoleArn singleton to be set; in brand-new AWS accounts/regions this singleton is unset and stack creation fails with 'CloudWatch Logs role ARN must be set in account settings to enable logging'. LMA is deployed into customer accounts where that singleton may already be owned by another stack, so LMA does not take ownership of it. Customers who want per-request MCP access logs can enable them manually after deployment: (1) create an IAM role trusted by apigateway.amazonaws.com with the AmazonAPIGatewayPushToCloudWatchLogs managed policy; (2) call apigateway:UpdateAccount --cloud-watch-role-arn <role-arn> once per region; (3) re-add AccessLogSetting on the MCP stage. CloudTrail data-event logging on the Lambda integration (MCPServerAnalyticsFunction) and CloudWatch metrics on this stage (MetricsEnabled: true) remain available without any account-level prerequisite."
    # checkov:skip=CKV2_AWS_29: "WAF protection is OPTIONAL via WAFAllowedIPv4Ranges parameter - customer configurable"
    # checkov:skip=CKV_AWS_120: "Caching disabled by design - this is the API Key auth endpoint; caching would serve stale authorization decisions after a user revokes their key. AuthorizerResultTtlInSeconds=0 ensures every request re-evaluates the key hash against DynamoDB."
    Properties:
      RestApiId: !Ref MCPApiKeyRestApi
      DeploymentId: !Ref MCPApiKeyDeployment
      StageName: mcp
      # NOTE: AccessLogSetting and MethodSettings.LoggingLevel are intentionally
      # omitted — see the CKV2_AWS_4 skip comment above for the full rationale.
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true

  MCPApiKeyLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnableMCPServer
    Properties:
      FunctionName: !GetAtt MCPServerAnalyticsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MCPApiKeyRestApi}/*"

  MCPApiKeyAuthorizerPermission:
