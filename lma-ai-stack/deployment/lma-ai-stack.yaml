  # User Management - Admin-only Cognito user CRUD via AppSync
  ##########################################################################

  UserManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-UserManagement"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/user_management
