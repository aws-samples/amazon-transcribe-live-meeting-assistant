  ##########################################################################
  # MCP API Key Authentication
  ##########################################################################

  # API Key Authorizer Lambda
  MCPApiKeyAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldEnableMCPServer
    Properties:
      LogGroupName: !Sub "/${LMAStackName}/lambda/MCPApiKeyAuthorizer"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MCPApiKeyAuthorizerFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldEnableMCPServer
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive DynamoDB table name and log level; AWS-owned key encryption is sufficient"
    Properties:
      FunctionName: !Sub "${LMAStackName}-MCPApiKeyAuthorizer"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/mcp_api_key_authorizer/
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          MCP_API_KEYS_TABLE: !Ref MCPApiKeysTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MCPApiKeysTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
      LoggingConfig:
        LogGroup: !Ref MCPApiKeyAuthorizerLogGroup
    DependsOn:
      - MCPApiKeyAuthorizerLogGroup

  # API Key Manager Lambda (AppSync)
  MCPApiKeyManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldEnableMCPServer
    Properties:
      LogGroupName: !Sub "/${LMAStackName}/lambda/MCPApiKeyManager"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MCPApiKeyManagerFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldEnableMCPServer
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive DynamoDB table name and log level; AWS-owned key encryption is sufficient"
    Properties:
      FunctionName: !Sub "${LMAStackName}-MCPApiKeyManager"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/mcp_api_key_manager/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          MCP_API_KEYS_TABLE: !Ref MCPApiKeysTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MCPApiKeysTable
        - Statement:
            - Effect: Allow
