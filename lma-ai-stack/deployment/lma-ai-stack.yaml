  # Data source for Virtual Participant table
  VirtualParticipantDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: VirtualParticipantTable
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt VirtualParticipantDataSourceRole.Arn
      DynamoDBConfig:
        TableName: !Ref VirtualParticipantTable
        AwsRegion: !Ref AWS::Region

  VirtualParticipantDataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: appsync.amazonaws.com
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt VirtualParticipantTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"

  CreateVirtualParticipantResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      TypeName: Mutation
      FieldName: createVirtualParticipant
      DataSourceName: !GetAtt VirtualParticipantDataSource.Name
      RequestMappingTemplate: |
        #set($id = $util.autoId())
        #set($now = $util.time.nowISO8601())

        ## Determine owner. For Cognito callers, $ctx.identity.username is the
        ## user. For IAM callers (e.g. the MCP analytics Lambda) it's an IAM
        ## ARN session string like AROA...:LMA-Bob-MCPServerAnalytics — in
        ## that case allow the caller to pass an explicit owner override
        ## representing the LMA user on whose behalf they are acting.
        #set($owner = $ctx.identity.username)
        #if($ctx.identity.userArn && !$util.isNullOrBlank($ctx.args.input.owner))
          #set($owner = $ctx.args.input.owner)
        #end

        ## Build input map for DynamoDB
        #set($input = {})
        $util.qr($input.put("id", $id))
        $util.qr($input.put("meetingName", $ctx.args.input.meetingName))
        $util.qr($input.put("meetingPlatform", $ctx.args.input.meetingPlatform))
        $util.qr($input.put("meetingId", $ctx.args.input.meetingId))
        $util.qr($input.put("status", $ctx.args.input.status))
        $util.qr($input.put("owner", $owner))
        $util.qr($input.put("Owner", $owner))
        $util.qr($input.put("SharedWith", ""))
        $util.qr($input.put("createdAt", $now))
        $util.qr($input.put("updatedAt", $now))
        
        ## Add optional fields
        #if(!$util.isNullOrBlank($ctx.args.input.meetingPassword))
          $util.qr($input.put("meetingPassword", $ctx.args.input.meetingPassword))
        #end
        
        #if($ctx.args.input.meetingTime)
          $util.qr($input.put("meetingTime", $ctx.args.input.meetingTime))
          #set($meetingTimeMillis = $util.math.multiply($ctx.args.input.meetingTime, 1000))
          #set($scheduledDateTime = $util.time.epochMilliSecondsToISO8601($meetingTimeMillis))
          $util.qr($input.put("scheduledFor", $scheduledDateTime))
        #end
        
        #if(!$util.isNullOrBlank($ctx.args.input.isScheduled))
          $util.qr($input.put("isScheduled", $ctx.args.input.isScheduled))
        #end

        ## userSub / userZoomSub are persisted on the row for SCHEDULED
        ## meetings so the VPScheduler Lambda can plumb LMA_USER_SUB and
        ## ZOOM_CREDENTIALS_SECRET_NAME to the eventually-launched ECS task.
        #if(!$util.isNullOrBlank($ctx.args.input.userSub))
          $util.qr($input.put("userSub", $ctx.args.input.userSub))
        #end
        #if(!$util.isNullOrBlank($ctx.args.input.userZoomSub))
          $util.qr($input.put("userZoomSub", $ctx.args.input.userZoomSub))
        #end

        ## Per-VP video-recording toggle (Boolean, default true). Persisted so
        ## the VPScheduler Lambda can plumb ENABLE_VIDEO_RECORDING to scheduled
        ## launches; immediate launches also pass it via the Step Functions input.
        #if(!$util.isNull($ctx.args.input.enableVideoRecording))
          $util.qr($input.put("enableVideoRecording", $ctx.args.input.enableVideoRecording))
        #end

        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($id)
          },
          "attributeValues": $util.dynamodb.toMapValuesJson($input)
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $util.error($ctx.error.message, $ctx.error.type)
        #end
        $util.toJson($ctx.result)

  UpdateVirtualParticipantResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      TypeName: Mutation
      FieldName: updateVirtualParticipant
      DataSourceName: !GetAtt VirtualParticipantDataSource.Name
      RequestMappingTemplate: |
        #set( $UpdatedAt = $util.time.nowISO8601() )
        ## Set up tracking for dynamic updates **
        #set( $expNames = {} )
        #set( $expValues = {} )
        #set( $expSet = {} )
        ## Attributes to drop from the row. An omitted input field means **
        ## "leave this attribute alone", so clearing one needs its own **
        ## signal -- the clearErrorMessage / clearManualAction flags below. **
        #set( $expRemove = [] )

        ## Write status only when the caller supplied one, so a caller that **
        ## owns a single unrelated field leaves the lifecycle status alone. **
        #if( !$util.isNullOrBlank($ctx.args.input.status) )
            $util.qr( $expSet.put("#status", ":status") )
            $util.qr( $expNames.put("#status", "status") )
            $util.qr( $expValues.put(":status", $util.dynamodb.toDynamoDB($ctx.args.input.status)) )
        #end

        $util.qr( $expSet.put("#updatedAt", ":updatedAt") )
        $util.qr( $expNames.put("#updatedAt", "updatedAt") )
        $util.qr( $expValues.put(":updatedAt", $util.dynamodb.toDynamoDB($UpdatedAt)) )
        
        ## Add CallId if provided **
        #if( !$util.isNullOrBlank($ctx.args.input.CallId) )
            $util.qr( $expSet.put("#CallId", ":CallId") )
            $util.qr( $expNames.put("#CallId", "CallId") )
            $util.qr( $expValues.put(":CallId", $util.dynamodb.toDynamoDB($ctx.args.input.CallId)) )
        #end
        
        ## Add VNC fields if provided **
        #if( !$util.isNullOrBlank($ctx.args.input.vncEndpoint) )
            $util.qr( $expSet.put("#vncEndpoint", ":vncEndpoint") )
            $util.qr( $expNames.put("#vncEndpoint", "vncEndpoint") )
            $util.qr( $expValues.put(":vncEndpoint", $util.dynamodb.toDynamoDB($ctx.args.input.vncEndpoint)) )
        #end
        
        #if( !$util.isNull($ctx.args.input.vncPort) )
            $util.qr( $expSet.put("#vncPort", ":vncPort") )
            $util.qr( $expNames.put("#vncPort", "vncPort") )
            $util.qr( $expValues.put(":vncPort", $util.dynamodb.toDynamoDB($ctx.args.input.vncPort)) )
        #end
        
        #if( !$util.isNull($ctx.args.input.vncReady) )
            $util.qr( $expSet.put("#vncReady", ":vncReady") )
            $util.qr( $expNames.put("#vncReady", "vncReady") )
            $util.qr( $expValues.put(":vncReady", $util.dynamodb.toDynamoDB($ctx.args.input.vncReady)) )
        #end
        
        ## Manual action fields. clearManualAction drops the whole set in one **
        ## call -- the prompt, its type, its timeout, its start time and the **
        ## status it interrupted all describe a single prompt, so they are **
        ## cleared together once the user has dealt with it. The status to **
        ## resume is supplied by the same call that clears the prompt. **
        #if( $util.defaultIfNull($ctx.args.input.clearManualAction, false) == true )
            $util.qr( $expNames.put("#manualActionType", "manualActionType") )
            $util.qr( $expRemove.add("#manualActionType") )
            $util.qr( $expNames.put("#manualActionMessage", "manualActionMessage") )
            $util.qr( $expRemove.add("#manualActionMessage") )
            $util.qr( $expNames.put("#manualActionTimeoutSeconds", "manualActionTimeoutSeconds") )
            $util.qr( $expRemove.add("#manualActionTimeoutSeconds") )
            $util.qr( $expNames.put("#manualActionStartTime", "manualActionStartTime") )
            $util.qr( $expRemove.add("#manualActionStartTime") )
            $util.qr( $expNames.put("#statusBeforeManualAction", "statusBeforeManualAction") )
            $util.qr( $expRemove.add("#statusBeforeManualAction") )
        #else
            #if( !$util.isNullOrBlank($ctx.args.input.statusBeforeManualAction) )
                $util.qr( $expSet.put("#statusBeforeManualAction", ":statusBeforeManualAction") )
                $util.qr( $expNames.put("#statusBeforeManualAction", "statusBeforeManualAction") )
                $util.qr( $expValues.put(":statusBeforeManualAction", $util.dynamodb.toDynamoDB($ctx.args.input.statusBeforeManualAction)) )
            #end

            #if( !$util.isNullOrBlank($ctx.args.input.manualActionType) )
                $util.qr( $expSet.put("#manualActionType", ":manualActionType") )
                $util.qr( $expNames.put("#manualActionType", "manualActionType") )
                $util.qr( $expValues.put(":manualActionType", $util.dynamodb.toDynamoDB($ctx.args.input.manualActionType)) )
            #end

            #if( !$util.isNullOrBlank($ctx.args.input.manualActionMessage) )
                $util.qr( $expSet.put("#manualActionMessage", ":manualActionMessage") )
                $util.qr( $expNames.put("#manualActionMessage", "manualActionMessage") )
                $util.qr( $expValues.put(":manualActionMessage", $util.dynamodb.toDynamoDB($ctx.args.input.manualActionMessage)) )
            #end

            #if( !$util.isNull($ctx.args.input.manualActionTimeoutSeconds) )
                $util.qr( $expSet.put("#manualActionTimeoutSeconds", ":manualActionTimeoutSeconds") )
                $util.qr( $expNames.put("#manualActionTimeoutSeconds", "manualActionTimeoutSeconds") )
                $util.qr( $expValues.put(":manualActionTimeoutSeconds", $util.dynamodb.toDynamoDB($ctx.args.input.manualActionTimeoutSeconds)) )
            #end

            #if( !$util.isNullOrBlank($ctx.args.input.manualActionStartTime) )
                $util.qr( $expSet.put("#manualActionStartTime", ":manualActionStartTime") )
                $util.qr( $expNames.put("#manualActionStartTime", "manualActionStartTime") )
                $util.qr( $expValues.put(":manualActionStartTime", $util.dynamodb.toDynamoDB($ctx.args.input.manualActionStartTime)) )
            #end
        #end

        ## The human-readable status detail (e.g. "Asked to leave by Jeremy.", **
        ## or a join sub-step while the VP is still JOINING). The VP backend **
        ## writes it on terminal states so the UI can show why the meeting **
        ## actually ended instead of a generic message, and clears it when the **
        ## VP reaches a healthy state so a detail from an earlier attempt **
        ## cannot outlive the condition it described. **
        #if( $util.defaultIfNull($ctx.args.input.clearErrorMessage, false) == true )
            $util.qr( $expNames.put("#errorMessage", "errorMessage") )
            $util.qr( $expRemove.add("#errorMessage") )
        #elseif( !$util.isNullOrBlank($ctx.args.input.errorMessage) )
            $util.qr( $expSet.put("#errorMessage", ":errorMessage") )
            $util.qr( $expNames.put("#errorMessage", "errorMessage") )
            $util.qr( $expValues.put(":errorMessage", $util.dynamodb.toDynamoDB($ctx.args.input.errorMessage)) )
        #end

        ## Machine-readable counterpart of errorMessage: the structured exit **
        ## trigger (e.g. "pre-join:not-admitted"), so join outcomes can be **
        ## aggregated by query instead of by grepping container logs. **
        #if( !$util.isNullOrBlank($ctx.args.input.endTrigger) )
            $util.qr( $expSet.put("#endTrigger", ":endTrigger") )
            $util.qr( $expNames.put("#endTrigger", "endTrigger") )
            $util.qr( $expValues.put(":endTrigger", $util.dynamodb.toDynamoDB($ctx.args.input.endTrigger)) )
        #end

        ## Build the update expression. updatedAt is always set, so the SET **
        ## clause is never empty; REMOVE is appended only when something is **
        ## actually being cleared. No attribute can appear in both clauses -- **
        ## each clear flag above skips the SET for the attributes it removes. **
        #set( $expression = "SET" )
        #foreach( $entry in $expSet.entrySet() )
            #set( $expression = "${expression} ${entry.key} = ${entry.value}" )
            #if ( $foreach.hasNext )
                #set( $expression = "${expression}," )
            #end
        #end

        #if( !$expRemove.isEmpty() )
            #set( $expression = "${expression} REMOVE" )
            #foreach( $name in $expRemove )
                #set( $expression = "${expression} ${name}" )
                #if ( $foreach.hasNext )
                    #set( $expression = "${expression}," )
                #end
            #end
        #end

        ## Conditions on the write. Each one is added to $conditions with the **
        ## names and values it uses, and the request carries them ANDed. **
        #set( $conditions = [] )
        #set( $conditionNames = {} )
        #set( $conditionValues = {} )

        ## A caller clearing a prompt decided what to do from a read of the row, **
        ## so both of its forms are conditional on the row still being what that **
        ## read saw. Whichever way the race goes, the writer that acted on **
        ## current information wins and this one drops out; the caller treats the **
        ## conditional-check failure as exactly that. **
        ##                                                                        **
        ## With a status, the caller is restoring the status a prompt interrupted, **
        ## which is only correct while that prompt is still the current state -- **
        ## otherwise a status written in between, by the user ending the meeting **
        ## or by the task reaper, would be replaced by a value chosen before it **
        ## existed. **
        ##                                                                        **
        ## Without one, the caller is clearing opportunistically, having seen a **
        ## row that was not prompting -- so the condition is the converse. A **
        ## prompt raised between that read and this write would otherwise have **
        ## its description removed from under it, leaving a row that reports a **
        ## prompt it cannot describe. **
        #if( $util.defaultIfNull($ctx.args.input.clearManualAction, false) == true )
          $util.qr( $conditionNames.put("#conditionStatus", "status") )
          $util.qr( $conditionValues.put(":promptingStatus", $util.dynamodb.toDynamoDB("MANUAL_ACTION_REQUIRED")) )
          #if( !$util.isNullOrBlank($ctx.args.input.status) )
            $util.qr( $conditions.add("#conditionStatus = :promptingStatus") )
          #else
            $util.qr( $conditions.add("(attribute_not_exists(#conditionStatus) OR #conditionStatus <> :promptingStatus)") )
          #end
        #end

        ## A progress (non-terminal) status lands only on a row whose end has **
        ## not been recorded. endReason is written by the end request alone -- **
        ## the user's Leave/End, and deletion, which ends first -- and that **
        ## request also stops the task, so a progress status arriving after it **
        ## is the participant reporting a step it will not complete: typically **
        ## a write that was already in flight when the stop arrived. Terminal **
        ## statuses are not conditioned, so the participant can still record how **
        ## it ended. A FAILED written by the launcher state machine or the task **
        ## reaper carries no endReason, so a participant that is in fact still **
        ## running can carry on reporting progress after one. A write that **
        ## supplies no status -- a join sub-step's detail line, a CallId -- is **
        ## not conditioned: it cannot move an ended row's status. The terminal **
        ## set matches TERMINAL_VP_STATUSES in the VP container's **
        ## status-manager.ts, and a VP backend test checks the two agree. **
        #set( $terminalStatuses = ["COMPLETED", "FAILED", "ENDED", "CANCELLED"] )
        #if( !$util.isNullOrBlank($ctx.args.input.status) && !$terminalStatuses.contains($ctx.args.input.status) )
          $util.qr( $conditionNames.put("#conditionEndReason", "endReason") )
          $util.qr( $conditions.add("attribute_not_exists(#conditionEndReason)") )
        #end

        #set( $conditionExpression = "" )
        #foreach( $condition in $conditions )
            #set( $conditionExpression = "${conditionExpression}${condition}" )
            #if ( $foreach.hasNext )
                #set( $conditionExpression = "${conditionExpression} AND " )
            #end
        #end

        {
          "version": "2018-05-29",
          "operation": "UpdateItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($ctx.args.input.id)
          },
          "update": {
            "expression": "$expression",
            "expressionNames": $utils.toJson($expNames),
            "expressionValues": $utils.toJson($expValues)
          }
        #if( !$conditions.isEmpty() )
          ,"condition": {
            "expression": "$conditionExpression",
            "expressionNames": $utils.toJson($conditionNames)
            #if( !$conditionValues.isEmpty() )
            ,"expressionValues": $utils.toJson($conditionValues)
            #end
          }
        #end
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $util.error($ctx.error.message, $ctx.error.type)
        #end
        $util.toJson($ctx.result)

  AcknowledgeVPFailureResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      TypeName: Mutation
      FieldName: acknowledgeVPFailure
      DataSourceName: !GetAtt VirtualParticipantDataSource.Name
      RequestMappingTemplate: |
        ## Sets userAcknowledgedFailure=true on the VP row so the running
        ## container can short-circuit its post-FAILED grace-period wait
        ## and tear down the ALB/VNC mapping immediately.
        {
          "version": "2018-05-29",
          "operation": "UpdateItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($ctx.args.virtualParticipantId)
          },
          "update": {
            "expression": "SET #uack = :uack, #updatedAt = :updatedAt",
            "expressionNames": {
              "#uack": "userAcknowledgedFailure",
              "#updatedAt": "updatedAt"
            },
            "expressionValues": {
              ":uack": $util.dynamodb.toDynamoDBJson(true),
              ":updatedAt": $util.dynamodb.toDynamoDBJson($util.time.nowISO8601())
            }
          }
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $util.error($ctx.error.message, $ctx.error.type)
        #end
        true

