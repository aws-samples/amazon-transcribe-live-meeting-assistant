---
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Amazon Transcribe Live Meeting Assist - AI Stack

Parameters:
  # Required
  LMAStackName:
    Type: String
    Description: LMA Stack Name

  CallDataStream:
    Type: String
    Description: >-
      The Name of Kinesis Data Stream to write the call data to.
  CallDataStreamArn:
    Type: String
    Description: >-
      The Arn of Kinesis Data Stream to write the call data to.


  LMASettingsParameterName:
    Type: String
    Description: LMA settings SSM Parameter store

  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: ARN of the customer managed KMS key for encryption

  AudioRecordingExpirationInDays:
    Type: Number
    Description:
      "Number of days after which audio recordings will be deleted from
      the Recordings bucket."
    Default: 90

  CallAudioSource:
    Type: String
    AllowedValues:
      - Demo Asterisk PBX Server
      - Amazon Chime SDK Voice Connector (SIPREC)
      - Genesys Cloud Audiohook Web Socket
      - Amazon Connect Contact Lens

    Description: >
      Choose whether to automatically install a demo Asterisk PBX server for easy
      standalone testing, a
      Amazon Chime SDK Voice Connector to use for standards based SIPREC/NBR integration
      with your contact center,
      or a Web Socket interface to use for Audiohook integration with your Genesys
      Cloud CX contact center.

  S3BucketName:
    Type: String
    Default: ""
    Description: >
      Existing bucket where call recording files will be stored.
    # yamllint disable rule:line-length
    AllowedPattern: '( *|(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$))'
    # yamllint enable rule:line-length

  AudioFilePrefix:
    Type: String
    Default: lma-audio-recordings/
    Description: >-
      The Amazon S3 prefix where the audio files will be saved (must end
      in "/")

  TranscriptFilePrefix:
    Type: String
    Default: lma-transcripts/
    Description: >-
      The Amazon S3 prefix where the transript files will be saved (must end in "/")

  TranscriptFileBucketName:
    Type: String
    Default: ""
    Description: >
      Existing bucket where transcript files will be stored.
    # yamllint disable rule:line-length
    AllowedPattern: '( *|(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$))'
    # yamllint enable rule:line-length

  IsSentimentAnalysisEnabled:
    Type: String
    Default: "true"
    Description: >-
      Enable sentiment analysis
    AllowedValues:
      - "true"
      - "false"
  SentimentNegativeScoreThreshold:
    Type: Number
    Default: 0.9
    MinValue: 0
    MaxValue: 1
    Description: >-
      Minimum negative sentiment confidence required to declare a phrase as having
      negative sentiment, in the range 0-1.  Not applicable when using Contact Lens
      or Transcribe Call Analytics (as sentiment is pre-calculated).

  SentimentPositiveScoreThreshold:
    Type: Number
    Default: 0.4
    MinValue: 0
    MaxValue: 1
    Description: >-
      Minimum positive sentiment confidence required to declare a phrase as having
      positive sentiment, in the range 0-1.
      Not applicable when using Contact Lens or Transcribe Call Analytics (as sentiment
      is pre-calculated).
  ComprehendLanguageCode:
    Type: String
    Description: >-
      Language code to be used for Amazon Comprehend to detect sentiment. This
      should match the Amazon Transcribe language.
    Default: en
    AllowedValues:
      - en
      - es
      - fr
      - de
      - it
      - pt
      - ar
        # - hi
      - ja
      - ko
      - zh
        # - zh-TW

  TranscriptLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) If present, the specified Lambda function is invoked by the LMA Call
      Event Processor Lambda function for each completed  (non-partial) transcript
      segment. The function can capture and/or modify the text of the transcript,
      for example to implement custom
      redaction logic, profanity filtering, or custom rules to highlight patterns
      in the transcript.

  TranscriptLambdaHookFunctionNonPartialOnly:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Specifies if Transcript Lambda Hook Function (if specified) is invoked for Non-Partial
      transcript segments only (true), or for
      both Partial and Non-Partial transcript segments (false).

  EndOfCallTranscriptSummary:
    Default: "BEDROCK"
    Type: String
    AllowedValues:
      - "LAMBDA"
      - "BEDROCK"

    Description: >
      Set to enable call summarization by a Large Language Model. Currently only BEDROCK
      and LAMBDA are supported.
      BEDROCK option requires you to choose one of the supported model IDs from the  provided
      list (BedrockModelId). The LAMBDA option requires you to provide a function
      ARN below.

  BedrockModelId:
    Default: "global.anthropic.claude-sonnet-5-5"
    Type: String
    # Kept in step with the BedrockModelId parameter of the same name in
    # lma-main.yaml, which is where every deployment sets it: lma-main passes its
    # own value straight through to this stack, so a value offered there and not
    # here fails the nested update. test_ai_stack_template.py asserts the two
    # lists match.
    AllowedValues:
      - "amazon.nova-micro-v1:0"
      - "amazon.nova-lite-v1:0"
      - "amazon.nova-pro-v1:0"
      - "us.amazon.nova-premier-v1:0"
      - "global.amazon.nova-2-lite-v1:0"
      - "us.amazon.nova-2-lite-v1:0"
      - "us.anthropic.claude-opus-4-20250514-v1:0"
      - "us.anthropic.claude-opus-4-1-20250805-v1:0"
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-4-6"
      - "us.anthropic.claude-opus-4-6-v1"
      - "us.anthropic.claude-haiku-5-5"
      - "us.anthropic.claude-sonnet-5-5"
      - "us.anthropic.claude-opus-5-5"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "global.anthropic.claude-sonnet-4-6"
      - "global.anthropic.claude-opus-4-6-v1"
      - "global.anthropic.claude-haiku-5-5"
      - "global.anthropic.claude-sonnet-5-5"
      - "global.anthropic.claude-opus-5-5"

    Description: >
      If EndOfCallTranscriptSummary is BEDROCK, then choose a model ID from the list
      of supported models. Includes Nova models (cost-effective) and Claude 4+ (cutting-edge).
      Some models require inference profiles.
      Defaults to 'global.anthropic.claude-haiku-4-5-20251001-v1:0'

  EndOfCallLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) If 'End Of Call Transcript Summary' is LAMBDA, provide ARN for a
      Lambda function. The specified Lambda function is invoked by the LMA Call Event
      Processor Lambda function  for end of call event. The function is passed en
      event with CallId as input.
      This function can implement custom logic that is relevant to end of call processing,
      for example, creating a call summary.

  StartOfCallLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) The specified Lambda function is invoked by the LMA Call Event Processor
      Lambda function for beginning or start of  call event. This function can implement
      custom logic that is relevant to beginning of call processing, for example,
      retrieving
      call summary details logged into a case in a CRM.

  PostCallSummaryLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) The specified Lambda function is invoked by the LMA Call Event Processor
      Lambda function after the call summary is processed.
      This function can implement custom logic that is relevant to post processing,
      for example, updating the call summary to a CRM system.

  UpdateLMASettingsFunctionArn:
    Type: String
    Description: Update LMA Settings Lambda function ARN

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    Description: >-
      Specify the CloudFront price class. See https://aws.amazon.com/cloudfront/pricing/
      for a
      description of each price class.
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    ConstraintDescription: >-
      Allowed Price Classes PriceClass_100 PriceClass_200 and PriceClass_All

  CloudFrontAllowedGeos:
    Type: String
    Default: ""
    Description: >-
      Specify a comma separated list of two letter country codes (uppercase ISO 3166-1)
      that are
      allowed to access the web user interface via CloudFront. For example: US,CA.
      Leave empty if
      you do not want geo restrictions to be applied.
    AllowedPattern: "^(|[A-Z]{2}(,[A-Z]{2})*)$"
    ConstraintDescription: >-
      Comma separated list of uppercase two letter country codes or empty

  IsLambdaAgentAssistEnabled:
    Type: String
    Default: "false"
    Description: >-
      Enables the Lambda Agent Assist feature. The AgentAssistExistingLambdaFunctionArn
      parameters should have values if this is set to 'true'
    AllowedValues:
      - "true"
      - "false"

  AgentAssistExistingLambdaFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      Used only if IsLambdaAgentAssistEnabled is set to "true".
      Provide the function ARN of an existing Lambda function to be used for Agent
      Assist."

  MeetingRecordExpirationInDays:
    Type: Number
    Default: 90
    Description: >-
      Number of days to retain meeting records. Meetings will be automatically deleted
      from LMA after this time.
      Specify partial days like 0.5 to retain meeting records for half a day.

  TranscriptionExpirationInDays:
    Type: Number
    Default: 90
    Description: >-
      Number of days to retain turn by turn meeting transcriptions.  Transcriptions
      will be automatically deleted from LMA after this time.
      Specify partial days like 0.5 to retain transcriptions for half a day.

  MeetingInactivityTimeoutInMinutes:
    Type: Number
    Default: 240
    MinValue: 0
    MaxValue: 10080
    Description: >-
      Number of minutes a meeting may go without producing a finalized transcript
      segment before LMA ends it on the meeting's behalf. A meeting whose client
      disconnects without sending its end-of-meeting event stays "In Progress"
      until this timeout elapses. Set to 0 to leave such meetings open.

  MeetingInactivityLookbackInDays:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 90
    Description: >-
      How far back to look for meetings to close. A meeting that started longer
      ago than this is never closed automatically, so raise it temporarily if you
      are updating a deployment that has accumulated older meetings stuck in
      progress. Higher values read more meeting records on every run.

  # NOTE: These parameters are dynamically updated during release
  BootstrapBucketBaseName:
    Type: String
    Default: aws-bigdata-blog
    Description: >-
      Base name of bootstrap S3 bucket. The region is appended to the bucket name.
      For example if
      you provide a base name `mybucket`, a bucket with a region suffix must exist
      in the region
      you are deploying (e.g. `mybucket-us-east-1`)
      The bucket contains pre-staged packaged templates and source artifacts
    # yamllint disable rule:line-length
    AllowedPattern: '(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$)'
    # yamllint enable rule:line-length

  BootstrapS3Prefix:
    Type: String
    Default: artifacts/lca
    Description: >
      S3 prefix where the templates and source are stored under

  BootstrapVersion:
    Type: String
    Default: 0.2.11
    Description: >
      Artifacts version (semver). Used to point to a specific release in the S3
      bootstrap bucket

  AssistantWakePhraseRegEx:
    Type: String
    Default: "(OK|Okay)[.,! ]*[Aa]ssistant"
    Description: >
      A regular expression for the wake phrase that invokes the Meeting Assistant.
      Default is 'OK Assistant'.

  EnableVoiceToneAnalysis:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Whether or not to show the voice tone analysis panel in the UI

  LLMPromptTemplateTableName:
    Type: String
    Description: >
      The DynamoDB table holding the summary prompt templates before the shared
      configuration table. Read once, by the configuration seeder, so that an
      existing deployment's edited prompts are carried into the shared table
      rather than reset by the upgrade.

  Domain:
    Type: String
    Default: "Default"
    AllowedValues:
      - "Default"
      - "Healthcare"
    Description: >-
      Which set of summary prompt templates this deployment ships. Must be the
      same value the llm-template-setup stack is given: that stack still seeds
      the table a rollback reads, and the two disagreeing would leave one
      holding the general prompts and the other the healthcare ones.

  ConfigurationSeedHash:
    Type: String
    Default: ""
    Description: >
      A digest of the configuration content this release ships and of the code
      that processes it, substituted by the publish step. CloudFormation
      re-invokes a custom resource only when one of its properties changes, so
      this is what makes a new release's configuration reach the table; a
      constant here would mean the seeder never ran again after the first
      deployment.

  ChatButtonConfigTableName:
    Type: String
    Description:
      The DynamoDB table the default and custom STRANDS agent chat button
      configurations were stored in before they moved into the configuration
      table. Read by the configuration seeder only, to carry custom buttons
      across on upgrade.

  AsrConfigTableName:
    Type: String
    Default: ""
    Description: >-
      The table the MicroVM ASR engine's runtime switches were stored in before
      they moved into the configuration table; read by the configuration seeder
      only, to carry them across on upgrade. Empty when that engine is not
      deployed, in which case the Transcription Engine page is not offered and
      its resolvers are not created.

  AsrConfigTableArn:
    Type: String
    Default: ""
    Description: ARN of the runtime ASR configuration table.

  AsrLauncherFunctionArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of the MicroVM ASR session launcher. Voice enrollment needs
      it to open a short-lived embedding session; empty means that engine is not
      deployed, and enrolling a voice is refused rather than appearing to work.

  NovaSonicConfigTableName:
    Type: String
    Description:
      The DynamoDB table name where the default and custom Nova Sonic voice assistant
      configurations are stored.

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 14
    Description: The number of days log events are kept in CloudWatch Logs.

  EnableAppSyncApiCache:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable or disable the AppSync Api Cache.

  AppSyncApiCacheInstanceType:
    Type: String
    Default: SMALL
    AllowedValues:
      - SMALL
      - MEDIUM
      - LARGE
      - XLARGE
    Description: >-
      If you set the EnableAppSyncApiCache is true, choose a value that meets your workload requirements. 
      This parameter is ignored if the EnableAppSyncApiCache parameter is set to false (default behavior).

  UserPoolId:
    Type: String
    Description: >
      Cognito User Pool ID

  CognitoClientId:
    Type: String
    Description: Cognito User Pool Client ID

  AppIdentityPoolId:
    Type: String
    Description: Cognito Identity Pool used by the UI

  AllowedSignUpEmailDomain:
    Type: String
    Default: ""
    Description: >-
      Email address domain (example.com) or comma separated list of email domains  (example1.com,
      example2.com) allowed to signin and signup using the web UI.
      If left empty, signup via the web UI is disabled and users will have to be created
      using
      Cognito.
    AllowedPattern: '^(|([\w-]+\.)+[\w-]{2,6}(, *([\w-]+\.)+[\w-]{2,6})*)$'

  BedrockKnowledgeBaseID:
    Type: String
    Default: ""
    AllowedPattern: "^(|[0-9a-zA-Z]{10})$"
    Description: >
      Provide the *id* (not name) of an existing Bedrock Knowledge Base to be used for Agent Assist bot.

  EnableMCPServer:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Enable MCP Server integration to allow external applications (Amazon Quick Suite,
      Claude Desktop, custom agentic systems) to access LMA meeting data via MCP protocol.

  MCPServerCallbackURLs:
    Type: String
    Default: ""
    Description: >-
      (Optional) Comma-separated list of additional OAuth callback URLs for custom MCP clients.

  WAFAllowedIPv4Ranges:
    Type: String
    Default: "0.0.0.0/0"
    Description: >-
      (Optional) Comma-separated list of IPv4 CIDR ranges allowed to access protected
      regional resources (MCP API Gateway, and optionally other regional resources).
      Default "0.0.0.0/0" disables WAF and allows all IPs.
      Example to restrict: "192.168.1.0/24, 10.0.0.0/16"
      When set to any non-default value, a REGIONAL WAFv2 WebACL is created and associated
      with eligible resources (currently the MCP API Gateway stage when EnableMCPServer=true).
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}(,\s*([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2})*$'
    ConstraintDescription: Must be valid comma-separated list of IPv4 CIDR ranges

  CognitoUserPoolDomain:
    Type: String
    Default: ""
    Description: >-
      Cognito User Pool domain prefix for OAuth URLs (passed from COGNITOSTACK)

  LoggingBucketName:
    Type: String
    Description: Name of the logging bucket for S3 access logs

  VPC:
    Type: String
    Description: VPC ID for ALB deployment

  PublicSubnet1:
    Type: String
    Description: Public subnet 1 for ALB

  PublicSubnet2:
    Type: String
    Description: Public subnet 2 for ALB

  VPLaunchType:
    Type: String
    # Must match the default in lma-main.yaml and the VP stack. lma-main always
    # passes this explicitly, so the default only applies to a standalone deploy
    # of this stack — but a mismatch there would create an idle VNC ALB (or omit
    # one that is needed), so the three are kept in step.
    Default: MICROVM
    AllowedValues:
      - EC2
      - FARGATE
      - MICROVM
    Description: >-
      How Virtual Participants are hosted. Under MICROVM each MicroVM exposes its
      own HTTPS endpoint for noVNC, so the VNC ALB, its target group, listener and
      security group are not created at all (they would otherwise sit idle with no
      registered targets).

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM managed policy to use as permissions boundary for IAM roles.
      If provided, this policy will limit the maximum permissions that can be granted to IAM roles
      in this stack, providing an additional layer of security.

  EnableDataRetentionOnDelete:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable data retention on stack deletion for compliance requirements.
      When true (default), DynamoDB tables will be retained. When false, all resources deleted.

  VPScheduleGroupName:
    Type: String
    Default: "LMA-VIRTUALPARTICIPANTSTACK-1ICEYE8S4JXFV-vp-schedules"  # pragma: allowlist secret
    Description: >-
      Name of the EventBridge Schedule Group for Virtual Participants from the VP stack.
      This should match the schedule group name created by the Virtual Participant stack.

  VoiceAssistantActivationMode:
    Type: String
    Default: "wake_phrase"
    AllowedValues:
      - "always_active"
      - "wake_phrase"
    Description: >-
      (Informational) Activation mode used by the Virtual Participant voice assistant.
      Forwarded from the main stack so the Nova Sonic Configuration admin UI can
      indicate whether Meeting Mode settings (Group / Translator) are active.
      These modes only take effect when this value is 'always_active'.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: >-
      Logging level for Lambda functions. Set to DEBUG for troubleshooting,
      INFO for normal operation.

  EnableVoiceEnrollment:
    Type: String
    Default: "false"
    Description: >-
      Let people enrol their voice so they are labelled by name in meetings from
      their first word. A voiceprint is biometric data about a person: while this
      is false the enrollment table, the consent log and the consent portal do
      not exist in the deployment at all. Turning it on creates obligations that
      are yours -- biometric data is separately regulated in many jurisdictions
      and typically requires informed consent before collection, a published
      retention schedule and deletion on request. See docs/voice-enrollment.md.
      Matching also needs EnableMicrovmAsr=true, since Amazon Transcribe exposes
      no speaker embedding.
    AllowedValues:
      - "true"
      - "false"
  VoiceEnrollmentRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    MaxValue: 3650
    Description: >-
      How long a voice-enrollment consent stands before it must be renewed. When
      it lapses the voiceprint is deleted and the person is asked to consent
      again. Consent that never expires is not meaningfully informed.
  VoiceEnrollmentTermsVersion:
    Type: String
    Default: "1"
    AllowedPattern: "^[A-Za-z0-9._-]{1,32}$"
    Description: >-
      Bump this to require everybody to re-consent. An enrollment whose consent
      is to a superseded version stops being used for matching until its owner
      agrees to the current terms.

Globals:
  Function:
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: Amazon S3 Configuration
        Parameters:
          - S3BucketName
      - Label:
          default: Amazon CloudFront Configuration
        Parameters:
          - CloudFrontPriceClass
          - CloudFrontAllowedGeos
    ParameterLabels:
      S3BucketName:
        default: Call Audio Bucket Name
      CloudFrontPriceClass:
        default: CloudFront Price Class
      CloudFrontAllowedGeos:
        default: CloudFront Allowed Geographies
      IsSentimentAnalysisEnabled:
        default: Enable Sentiment Analysis
      ComprehendLanguageCode:
        default: Comprehend Sentiment Analysis Language Code
      TranscriptLambdaHookFunctionArn:
        default:
          Lambda Hook Function ARN for Custom Transcript Segment Processing
          (existing)
      TranscriptLambdaHookFunctionNonPartialOnly:
        default: Lambda Hook Function Mode Non-Partial only
      EndOfCallLambdaHookFunctionArn:
        default: Lambda Hook Function ARN for Custom End of Call Processing (existing)
      EndOfCallTranscriptSummary:
        default: End of Call Transcript Summary
      BedrockModelId:
        default: Bedrock supported LLM model ID
      StartOfCallLambdaHookFunctionArn:
        default: Lambda Hook Function ARN for Custom Start of Call Processing (existing)
      PostCallSummaryLambdaHookFunctionArn:
        default:
          Lambda Hook Function ARN for Custom Post Processing, after the Call
          Transcript Summary is processed (existing)

Conditions:
  ShouldRetainDataOnDelete: !Equals [!Ref EnableDataRetentionOnDelete, "true"]
  ShouldDeleteDataOnDelete: !Equals [!Ref EnableDataRetentionOnDelete, "false"]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  # The VNC ALB exists only to route the UI's noVNC connection to an ECS task's
  # websockify port. MicroVMs each return a dedicated HTTPS endpoint from
  # RunMicrovm, so under MICROVM the ALB has no targets and is pure cost.
  ShouldCreateVNCALB: !Not [!Equals [!Ref VPLaunchType, "MICROVM"]]
  ShouldAllowSignUpEmailDomain:
    !Not [!Equals [!Ref AllowedSignUpEmailDomain, ""]]
  ShouldEnableGeoRestriction: !Not [!Equals [!Ref CloudFrontAllowedGeos, ""]]
  # A timeout of 0 keeps the reaper's resources in the stack but stops its
  # schedule, so the setting can be turned back on without a resource replace.
  ShouldReapInactiveMeetings:
    !Not [!Equals [!Ref MeetingInactivityTimeoutInMinutes, 0]]
  ShouldEnableMCPServer: !Equals [!Ref EnableMCPServer, "true"]
  # Biometric data, so this gates the EXISTENCE of the resources rather than
  # just their use: with it false there is nowhere for a voiceprint to be stored.
  ShouldEnableVoiceEnrollment: !Equals [!Ref EnableVoiceEnrollment, "true"]
  # Enrolling needs the on-demand engine, because it is the only one that
  # computes speaker embeddings. Storage and the portal exist without it; what
  # cannot happen is creating a voiceprint.
  CanEmbedVoiceEnrollments:
    !And [
      !Equals [!Ref EnableVoiceEnrollment, "true"],
      !Not [!Equals [!Ref AsrLauncherFunctionArn, ""]],
    ]
  HasCustomMCPServerCallbackURLs: !Not [!Equals [!Ref MCPServerCallbackURLs, ""]]
  # Generic WAF enablement - true when WAFAllowedIPv4Ranges is restricted (not 0.0.0.0/0).
  # The WebACL is REGIONAL and can be associated with any eligible regional resource
  # (API Gateway REST APIs, ALBs, AppSync APIs, etc.). Naming uses "Regional" to
  # distinguish from potential CloudFront-scoped WAF which must be created in us-east-1.
  IsRegionalWafEnabled: !Not [!Equals [!Ref WAFAllowedIPv4Ranges, "0.0.0.0/0"]]
  # MCP API Gateway WAF is only associated when both MCP server is enabled AND WAF is enabled
  ShouldAssociateMCPApiWithWaf: !And
    - !Condition ShouldEnableMCPServer
    - !Condition IsRegionalWafEnabled
  ShouldEnableLambdaAgentAssist:
    !Equals [!Ref IsLambdaAgentAssistEnabled, "true"]
  ShouldEnableTranscriptLambdaHookFunction:
    !Not [!Equals [!Ref TranscriptLambdaHookFunctionArn, ""]]
  ShouldEnableStartOfCallLambdaHookFunction:
    !Not [!Equals [!Ref StartOfCallLambdaHookFunctionArn, ""]]
  ShouldEnablePostCallSummaryLambdaHookFunction:
    !Not [!Equals [!Ref PostCallSummaryLambdaHookFunctionArn, ""]]
  ShouldEnableEndOfCallLambdaHookFunction:
    !Equals [!Ref EndOfCallTranscriptSummary, "LAMBDA"]
  ShouldEnableBedrockSummarizer:
    !Equals [!Ref EndOfCallTranscriptSummary, "BEDROCK"]
  HasAsrConfigTable: !Not [!Equals [!Ref AsrConfigTableName, ""]]

  IsTranscriptSummaryEnabled: !Or
    - !Condition ShouldEnableEndOfCallLambdaHookFunction
    - !Condition ShouldEnableBedrockSummarizer

  ShouldEnableAppSyncApiCache: !Equals [!Ref EnableAppSyncApiCache, "true"]
  

Outputs:
  QuickSightManifestUrl:
    Description: S3 URL for QuickSight manifest file to import recordings bucket data
    Value: !Sub "https://${S3BucketName}.s3.${AWS::Region}.amazonaws.com/quicksight-recordingsbucket-manifest.json"
  CloudfrontEndpoint:
    Description: Endpoint for Cloudfront distribution
    Value: !Sub "https://${WebAppCloudFrontDistribution.DomainName}/"
  ConfigurationTableName:
    Description: >-
      The DynamoDB table holding runtime configuration: the deployment
      baseline, the operator's profiles and the pointer naming the active one
    Value: !Ref ConfigurationTable
  ConfigurationProfileOrigin:
    Description: >-
      How this stack's configuration profile came to exist, whenever that was:
      'created' (a new, empty profile), 'created-from-previous-table' (the
      summary prompt templates were carried across from the table they used to
      live in), 'created-previous-table-unreadable', or 'unknown' (a profile
      written by something other than the seeder). Stamped on the record when it
      is created and reported by every later deployment, so the one value to act
      on does not vanish: 'created-previous-table-unreadable' means prompt
      templates customized before the upgrade were not carried across and have
      to be applied again from the Transcript Summary page.
    Value: !GetAtt SeedConfiguration.ProfileOrigin
  ConfigurationSectionAdoption:
    Description: >-
      For each configuration store moved into the configuration table after
      the profile existed, what the latest deployment that ran the seeder found,
      as section=outcome pairs. 'adopted-from-previous-table' and
      'nothing-to-adopt' are reported once; every later run reports
      'already-present'. 'previous-table-unreadable' means the settings saved
      before the upgrade were not carried across yet: the section is left unset
      and the next deployment that runs the seeder tries again, and saving the
      settings from their page in the meantime makes that unnecessary.
    Value: !GetAtt SeedConfiguration.SectionAdoption
  ConfigurationBucketName:
    Description: >-
      The S3 bucket holding the bodies of configuration revisions, under
      config_revisions/<profile>/
    Value: !Ref ConfigurationBucket
  ConfigurationRevisionHistory:
    Description: >-
      What the latest deployment that ran the configuration seeder found of the
      configuration profile's revision history, as profile=outcome. 'present'
      means the profile's current state is a recorded revision, which is what a
      new deployment, an upgrade and every later deployment report. 'started'
      means a profile that had no history had its state recorded as its first
      revision. 'not-started' means the history could not be written at deploy
      time: nothing is lost, and the first save from a configuration page
      records the profile before replacing it, but check the seeder's log.
    Value: !GetAtt SeedConfiguration.RevisionHistory
  EventSourcingTableName:
    Description:
      The Name for the DynamoDB that is used to store transcriptions and
      events
    Value: !Ref EventSourcingTable
  EventSourcingTableArn:
    Description: >-
      The ARN of the DynamoDB table created to store events and the contact
      details used in this solution
    Value: !GetAtt EventSourcingTable.Arn
  CallEventProcessorFunctionRoleName:
    Description: The Name of the IAM role used by CallEventProcessorFunction
    Value: !Sub "${CallEventProcessorFunction}Role"
  SNSTopic:
    Description: The SNS topic name that LMA publishes category events to
    Value: !GetAtt CategorySNSTopic.TopicName
  FetchTranscriptArn:
    Description:
      The arn for a Lambda function that fetches a call transcript as a
      string
    Value: !GetAtt FetchTranscript.Arn
  CloudFrontDistributionId:
    Description: The ID of the CloudFront distribution for LMA's main web ui
    Value: !Ref WebAppCloudFrontDistribution
  WebAppBucket:
    Description: Name of S3 web app bucket
    Value: !Ref WebAppBucket
  CloudFrontDomainName:
    Description: The full domain name of the CloudFront distribution
    Value: !GetAtt WebAppCloudFrontDistribution.DomainName
  TranscriptSummaryFunctionArn:
    Description: Call Summarizer Lambda function ARN
    Value:
      !If [
        ShouldEnableBedrockSummarizer,
        !GetAtt BedrockSummaryLambda.Arn,
        !Ref EndOfCallLambdaHookFunctionArn,
      ]
  VoiceEnrollmentSeedsFunctionArn:
    Description: >-
      ARN of the function the WebSocket transcriber asks for the enrolled voices
      a starting meeting may label by name. Empty when voice enrollment is off,
      which is how the transcriber knows not to ask.
    Value:
      !If [ShouldEnableVoiceEnrollment, !GetAtt VoiceEnrollmentSeedsFunction.Arn, ""]
  LocalUITestingEnv:
    Description: Copy to create .env file for local UI testing
    Value: !Sub
      - >-
        VITE_USER_POOL_ID=${UserPoolId}
        VITE_USER_POOL_CLIENT_ID=${CognitoClientId}
        VITE_IDENTITY_POOL_ID=${AppIdentityPoolId}
        VITE_APPSYNC_GRAPHQL_URL=${AppSyncApiEncrypted.GraphQLUrl}
        VITE_AWS_REGION=${AWS::Region}
        VITE_SETTINGS_PARAMETER=${LMASettingsParameterName}
        VITE_ENABLE_MCP_SERVER=${EnableMCPServer}
        VITE_MCP_SERVER_ENDPOINT=${McpServerEndpointValue}
        VITE_MCP_SERVER_API_KEY_ENDPOINT=${McpServerApiKeyEndpointValue}
        VITE_MCP_SERVER_AUTH_URL=${McpServerAuthUrlValue}
        VITE_MCP_SERVER_TOKEN_URL=${McpServerTokenUrlValue}
        VITE_MCP_SERVER_CLIENT_ID=${McpServerClientIdValue}
        VITE_MCP_SERVER_USER_POOL_ID=${McpServerUserPoolIdValue}
        VITE_OAUTH_CALLBACK_URL=https://${WebAppCloudFrontDistribution.DomainName}/#/oauth/callback
      - McpServerEndpointValue: !If [ShouldEnableMCPServer, !GetAtt MCPServerGateway.GatewayUrl, ""]
        McpServerApiKeyEndpointValue: !If [ShouldEnableMCPServer, !Sub "https://${MCPApiKeyRestApi}.execute-api.${AWS::Region}.amazonaws.com/mcp", ""]
        McpServerAuthUrlValue: !If [ShouldEnableMCPServer, !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize", ""]
        McpServerTokenUrlValue: !If [ShouldEnableMCPServer, !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token", ""]
        McpServerClientIdValue: !If [ShouldEnableMCPServer, !Ref MCPServerExternalAppClient, ""]
        McpServerUserPoolIdValue: !If [ShouldEnableMCPServer, !Ref UserPoolId, ""]
  VPTaskRegistryTableName:
    Description: Name of the VPTaskRegistry DynamoDB table
    Value: !Ref VPTaskRegistry
  DomSelectorCacheTableName:
    Description: Name of the DomSelectorCache DynamoDB table (shared by VP tasks for AI-discovered selectors)
    Value: !Ref DomSelectorCache
  VPProfilesBucketName:
    Description: Name of the S3 bucket holding per-user persisted Chromium profiles
    Value: !Ref VPProfilesBucket
  VirtualParticipantTableName:
    Description: Name of the VirtualParticipant DynamoDB table
    Value: !Ref VirtualParticipantTable
  VirtualParticipantTableStreamArn:
    Description: ARN of the VirtualParticipant DynamoDB table stream
    Value: !GetAtt VirtualParticipantTable.StreamArn
  AppSyncGraphQLUrl:
    Description: AppSync GraphQL endpoint URL
    Value: !GetAtt AppSyncApiEncrypted.GraphQLUrl
  AppSyncEventApiId:
    Description: AppSync Event API ID
    Value: !GetAtt AppSyncEventApi.ApiId
  AppSyncEventApiUrl:
    Description: AppSync Event API WebSocket URL for MCP commands
    Value: !GetAtt EventApiDns.WebSocketUrl
  AppSyncEventApiHttpUrl:
    Description: AppSync Event API HTTP URL for publishing
    Value: !GetAtt EventApiDns.HttpUrl
  # Empty string under MICROVM, where no ALB is created. The VP stack accepts
  # these as plain (defaultable) String parameters and only wires them into the
  # ECS launch paths, which are themselves not created under MICROVM.
  VNCTargetGroupArn:
    Description: ARN of the VNC Target Group for Virtual Participant ECS tasks
    Value: !If [ShouldCreateVNCALB, !Ref VNCTargetGroup, ""]
  VNCALBSecurityGroupId:
    Description: Security Group ID for VNC ALB
    Value: !If [ShouldCreateVNCALB, !Ref ALBSecurityGroup, ""]
  VPSecurityGroupId:
    Description: Security Group ID for Virtual Participant ECS tasks
    Value: !Ref VPSecurityGroup
  VNCALBListenerArn:
    Description: ARN of the VNC ALB Listener for dynamic routing rules
    Value: !If [ShouldCreateVNCALB, !Ref VNCALBListener, ""]
    # No Export: an exported empty string is still an export, and cross-stack
    # export values cannot be changed while an importer exists. Nothing in this
    # solution imports it (the VP stack takes it as a parameter), so dropping
    # the export removes a needless update constraint.
  # The ARN, not the value: whichever principal creates a listener rule on the
  # VNC listener needs the origin-verify condition, and reads the value itself
  # rather than receiving it through a stack parameter or a task environment
  # variable. The Virtual Participant creates one rule per participant at run
  # time (status-manager.ts), which is the consumer this is published for.
  VncOriginVerifyHeaderValueSecretArn:
    Description: ARN of the secret holding the VNC origin-verify header value
    Value: !If [ShouldCreateVNCALB, !Ref VncOriginVerifyHeaderValueSecret, ""]
  VncOriginVerifyHeaderName:
    Description: Name of the header carrying the VNC origin-verify value
    Value: x-lma-vnc-origin-verify
  MCPServersTableName:
    Description: Name of the MCP Servers DynamoDB table
    Value: !Ref MCPServersTable
  MCPLayerBuildProjectName:
    Description: Name of the CodeBuild project for MCP layer building
    Value: !Ref MCPLayerBuildProject
  OAuthCallbackUrl:
