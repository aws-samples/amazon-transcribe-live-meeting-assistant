  # ----------------------------------------------------------------------------
  # Speaker name resolution
  #
  # Speaker separation can tell voices apart but cannot know who they are, so a
  # conference-room meeting reads "Other Participant (spk_0)". This function
  # reads the transcript, asks a model for evidence of who each voice is, and
  # verifies every proposal against the turn index before applying it. Reachable
  # from the Speakers panel and invoked once at the end of a meeting, before the
  # summary, so the summary reads names rather than voice ids.
  # ----------------------------------------------------------------------------
  SpeakerNameResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt SpeakerNameResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/speaker_name_resolver
      Description: Infers speaker names from the transcript and stores them on the meeting
      MemorySize: 512
      # A model call over a bounded number of turns, plus the paged transcript
      # read. Deliberately shorter than the summary orchestrator's socket timeout
      # for this invoke (SPEAKER_NAME_READ_TIMEOUT, 75s), so the caller never
      # gives up on a pass that is still running and retries it.
      Timeout: 60
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          APPSYNC_GRAPHQL_URL: !GetAtt AppSyncApiEncrypted.GraphQLUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION_OVERRIDE: !Ref AWS::Region
          # Token usage per naming pass, for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      # Carries lma_metering. Pure Python, so it does not pin this function to an
      # architecture.
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/SpeakerNameResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a function whose work is re-runnable on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names, an endpoint and a model id"
    DependsOn:
      - SpeakerNameResolverFunctionLogGroup

  SpeakerNameResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/SpeakerNameResolverFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  SpeakerNameResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: SpeakerNameResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-SpeakerNameResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Read only: the names are written back through AppSync, so that
              # open meeting pages re-label from the onUpdateCall publish.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
              # The one write: metering records for the meeting cost estimate,
              # and only under the mtr# partitions.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "mtr#*"
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource: !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncApiEncrypted.ApiId}/types/Mutation/fields/updateSpeakerIdentities"
              # Scoped the same way BedrockSummaryLambda and
              # MeetingInvitationParser scope the identical call, since
              # BedrockModelId may name a foundation model, a custom model or an
              # inference profile. Only converse() is called, so the streaming
              # action is not granted.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncSpeakerNameResolverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AppSyncInvokeSpeakerNameResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SpeakerNameResolverFunction.Arn

  SpeakerNameResolverLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: SpeakerNameResolverLambda
      Description: Lambda function for resolveSpeakerNames
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncSpeakerNameResolverLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt SpeakerNameResolverFunction.Arn

  ResolveSpeakerNamesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      DataSourceName: !GetAtt SpeakerNameResolverLambdaDataSource.Name
      TypeName: Mutation
      FieldName: resolveSpeakerNames
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: ../source/appsync/resolveSpeakerNames.js

  SummaryRegeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Named explicitly so its own execution role can grant it permission to
      # invoke itself without a circular dependency on the function resource.
      # The second leg of a regeneration is an asynchronous self-invoke: a
      # model call per prompt template routinely outlives the 30 seconds
      # AppSync allows a resolver, so the mutation starts the run and returns.
      FunctionName: !Sub "${AWS::StackName}-SummaryRegenerator"
      Handler: index.handler
      Role: !GetAtt SummaryRegeneratorFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/summary_regenerator
      Description: Re-runs a meeting's summary on demand and stores the result
      MemorySize: 256
      # Lambda's maximum. The Bedrock summariser it waits on has the same
      # ceiling, which is why SUMMARY_READ_TIMEOUT below stops the wait early
      # rather than matching it.
      Timeout: 900
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          APPSYNC_GRAPHQL_URL: !GetAtt AppSyncApiEncrypted.GraphQLUrl
          # The same summariser the end-of-meeting orchestrator uses, so a
          # regeneration is a re-run of that path rather than a second one.
          TRANSCRIPT_SUMMARY_FUNCTION_ARN:
            !If [
              ShouldEnableBedrockSummarizer,
              !GetAtt BedrockSummaryLambda.Arn,
              !Ref EndOfCallLambdaHookFunctionArn,
            ]
          # Deliberately shorter than this function's own Timeout, so that a
          # summariser which never answers is abandoned with enough time left
          # to record the failure on the meeting. Both functions stop at
          # Lambda's 900s maximum, so waiting one out in full is not possible.
          SUMMARY_READ_TIMEOUT: 780
      # The platform's own retries are off for this function. Its second leg is
      # an asynchronous invoke, which Lambda retries twice by default, and a
      # retry re-runs every model call for a summary already computed in the
      # frame that failed -- and rewrites the Knowledge Base snapshot again. The
      # only error that reaches Lambda is a failure to store a finished result,
      # and write_summary retries that itself, within the one invocation, which
      # is the retry that costs nothing. Two further attempts would also stretch
      # a single run past SUMMARY_REGENERATION_STALE_SECONDS, after which a
      # second run can be accepted beside the first.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/SummaryRegeneratorFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a function whose work is re-runnable on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names, function ARNs and an endpoint"
    DependsOn:
      - SummaryRegeneratorFunctionLogGroup

  SummaryRegeneratorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/SummaryRegeneratorFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  SummaryRegeneratorFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: SummaryRegenerator Function Lambda Role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-SummaryRegenerator
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Read only: the summary is written back through AppSync, so that
              # open meeting pages show it without being reloaded.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource: !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncApiEncrypted.ApiId}/types/Mutation/fields/updateCallSummaryText"
              # The configured summariser, plus this function itself for the
              # second leg of a run. Spelled out rather than taken from the
              # function resource, which would be circular.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-SummaryRegenerator"
              - !If
                - ShouldEnableBedrockSummarizer
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: !GetAtt BedrockSummaryLambda.Arn
                - !Ref AWS::NoValue
              - !If
                - ShouldEnableEndOfCallLambdaHookFunction
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: !Sub "${EndOfCallLambdaHookFunctionArn}"
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncSummaryRegeneratorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AppSyncInvokeSummaryRegenerator
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SummaryRegeneratorFunction.Arn

  SummaryRegeneratorLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: SummaryRegeneratorLambda
      Description: Lambda function for regenerateCallSummary
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncSummaryRegeneratorLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt SummaryRegeneratorFunction.Arn

  RegenerateCallSummaryResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      DataSourceName: !GetAtt SummaryRegeneratorLambdaDataSource.Name
      TypeName: Mutation
      FieldName: regenerateCallSummary
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: ../source/appsync/regenerateCallSummary.js

  UpdateAsrConfigLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Condition: HasAsrConfigTable
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: UpdateAsrConfigLambda
      Description: Lambda function for updateAsrConfig with input validation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateAsrConfigLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateAsrConfigResolverFunction.Arn


  # Served by the same Lambda as the mutation rather than by a DynamoDB data
  # source, for the reason given at the LLM prompt template resolvers below: the
  # switches live compressed in the shared configuration table. The function
  # answers with the effective switches, so an operator who never saved any gets
  # the shipped ones -- all off -- as before.
  GetAsrConfigResolver:
    Type: AWS::AppSync::Resolver
    Condition: HasAsrConfigTable
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      DataSourceName: !GetAtt UpdateAsrConfigLambdaDataSource.Name
      TypeName: Query
      FieldName: getAsrConfig
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';

        export function request(ctx) {
          return {
            operation: 'Invoke',
            payload: {
              arguments: ctx.arguments,
              identity: ctx.identity,
              info: { fieldName: ctx.info.fieldName }
            }
          };
        }

        export function response(ctx) {
          if (ctx.error) {
            util.error(ctx.error.message, ctx.error.type);
          }
          return ctx.result;
        }

  UpdateAsrConfigResolver:
    Type: AWS::AppSync::Resolver
    Condition: HasAsrConfigTable
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      DataSourceName: !GetAtt UpdateAsrConfigLambdaDataSource.Name
      TypeName: Mutation
      FieldName: updateAsrConfig
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';

        // The arguments, the identity the function re-checks group membership
        // from, and the field name it dispatches on -- the same function answers
        // Query.getAsrConfig.
        export function request(ctx) {
          return {
            operation: 'Invoke',
            payload: {
              arguments: ctx.arguments,
              identity: ctx.identity,
              info: { fieldName: ctx.info.fieldName }
            }
          };
        }

        export function response(ctx) {
          if (ctx.error) {
            util.error(ctx.error.message, ctx.error.type);
          }
          return ctx.result;
        }

  ##########################################################################
  # LLM Prompt Template Config - Lambda, IAM, DataSources
  ##########################################################################

  UpdateLLMPromptTemplateResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UpdateLLMPromptTemplateResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/update_llm_prompt_template_resolver
      Description: >-
        Lambda resolver for the summary prompt templates: reads the stored
        record and saves an edit, with input validation
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/UpdateLLMPromptTemplateResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UpdateLLMPromptTemplateResolverFunctionLogGroup
      # As for the summariser: the Transcript Summary page should not open on an
      # unseeded table and show an administrator an empty set of prompts.
      - SeedConfiguration

  UpdateLLMPromptTemplateResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/UpdateLLMPromptTemplateResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UpdateLLMPromptTemplateResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UpdateLLMPromptTemplateResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-UpdateLLMPromptTemplate
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetItem as well as PutItem: a save reads the record's current
              # version so a write that another session has superseded can be
              # refused, and the editor's own read is served from here too.
              # Deliberately no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ConfigurationTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncUpdateLLMPromptTemplateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UpdateLLMPromptTemplateResolverFunction.Arn

  UpdateLLMPromptTemplateLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: UpdateLLMPromptTemplateLambda
      Description: Lambda function for updateLLMPromptTemplate with input validation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateLLMPromptTemplateLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateLLMPromptTemplateResolverFunction.Arn

  ##########################################################################
  # Per-meeting cost estimate: Query.getCallCost computes an itemised estimate
  # from the meeting's metering records (PK mtr#<CallId> in EventSourcingTable)
  # and the call_pricing section of the configuration store. getCallPricing and
  # updateCallPricing let an Admin read and change that price table. See
  # docs/meeting-cost-estimate.md.
  ##########################################################################

  CallCostResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt CallCostResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/call_cost_resolver
      Description: >-
        Lambda resolver for the per-meeting cost estimate and the price table it
        is computed with
      MemorySize: 256
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          ADMIN_GROUP: "Admin"
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/CallCostResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names and a group name"
    DependsOn:
      - CallCostResolverFunctionLogGroup
      # An estimate drawn before the price table is seeded would show every
      # line as unpriced.
      - SeedConfiguration

  CallCostResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/CallCostResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  CallCostResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CallCostResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-CallCostResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Reads only: a meeting's metering records and the Owner and
              # SharedWith of its call row, which decide who may see it.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt EventSourcingTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "c#*"
                      - "mtr#*"
              # The price table. PutItem is the Admin's save, which is a
              # conditional write of the custom profile; no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ConfigurationTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncCallCostLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CallCostResolverFunction.Arn

  CallCostLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: CallCostLambda
      Description: Lambda function for the per-meeting cost estimate and its price table
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncCallCostLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CallCostResolverFunction.Arn

  ##########################################################################
  # Configuration history: list, read, compare, restore and label the
  # revisions every configuration save records. See
  # docs/configuration-store.md.
  ##########################################################################

  ConfigurationRevisionsResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt ConfigurationRevisionsResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/configuration_revisions_resolver
      Description: >-
        Lambda resolver for the configuration history: lists, reads, compares,
        restores and labels configuration revisions
      MemorySize: 256
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/ConfigurationRevisionsResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment holds only resource names and a group name"
    DependsOn:
      - ConfigurationRevisionsResolverFunctionLogGroup
      # A restore writes the profile the seeder creates.
      - SeedConfiguration

  ConfigurationRevisionsResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/ConfigurationRevisionsResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  ConfigurationRevisionsResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: ConfigurationRevisionsResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-ConfigurationRevisionsResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # PutItem is a restore, which is a conditional write of the
              # profile like any other save; no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ConfigurationTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncConfigurationRevisionsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
