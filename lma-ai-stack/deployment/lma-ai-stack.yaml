  BedrockSummaryLambda:
    Type: AWS::Serverless::Function
    Condition: ShouldEnableBedrockSummarizer
    Properties:
      Role: !GetAtt BedrockSummaryLambdaExecutionRole.Arn
      Runtime: python3.12
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FETCH_TRANSCRIPT_LAMBDA_ARN: !GetAtt FetchTranscript.Arn
          PROCESS_TRANSCRIPT: "True"
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          S3_BUCKET_NAME: !Ref S3BucketName
          S3_PREFIX: !Ref TranscriptFilePrefix
          # Token usage per summary section, for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      Timeout: 900
      MemorySize: 512
      Handler: index.handler
      CodeUri: ../source/lambda_functions/bedrock_summary_lambda
      Layers:
        - !Ref ConfigurationPythonLayer
      Description:
        This AWS Lambda Function runs a transcript summary inference on
        the call transcript using Bedrock API
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/BedrockSummaryLambda
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - BedrockSummaryLambdaLogGroup
      # Ordered behind the seeding custom resource so that a stack update cannot
      # put this code live before the configuration baseline it reads exists. A
      # summary run in that window would have no prompts to work from.
      - SeedConfiguration

  BedrockSummaryLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    # Matches BedrockSummaryLambda's condition, so the group exists exactly when
    # something writes to it. The trade is deliberate: a deployment that had the
    # summariser on, then turned it off, loses the group and the logs in it on
    # the next update. Keeping the group behind while the function is gone would
    # instead leave it in the way of its own re-creation when the summariser is
    # turned back on.
    Condition: ShouldEnableBedrockSummarizer
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/BedrockSummaryLambda
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  BedrockSummaryLambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableBedrockSummarizer
    Properties:
      Description: Bedrock Summary Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-Bedrock-Fetch-Transcript
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "lambda:InvokeFunction"
                Resource: !GetAtt FetchTranscript.Arn
              # Read-only, and only on the shared configuration table: the
              # summariser reads the prompt templates and has never written
              # them.
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                Resource:
                  - !GetAtt ConfigurationTable.Arn
              # Metering records for the meeting cost estimate: PutItem only,
              # and only under the mtr# partitions.
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                Resource: !GetAtt EventSourcingTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "mtr#*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"
        - PolicyName: !Sub ${AWS::StackName}-BedrockSummary
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - "bedrock:GetInferenceProfile"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
        - PolicyName: !Sub ${AWS::StackName}-S3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"

