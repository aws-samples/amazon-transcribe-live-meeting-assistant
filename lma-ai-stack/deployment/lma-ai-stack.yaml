  StrandsChatInterfaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt StrandsChatInterfaceFunctionExecutionRole.Arn
      Runtime: python3.12
      # No SnapStart here: `ApplyOn: PublishedVersions` only takes effect for a
      # published version, and this function is reached through an unqualified
      # $LATEST ARN (the StrandsChatDataSource AppSync data source uses
      # `!GetAtt StrandsChatInterfaceFunction.Arn`), so no version is ever
      # published and the setting was inert. Measured before removing it: init
      # 440 ms, exec 297 ms — SnapStart targets multi-second inits, and paying
      # for a version cache plus alias-qualified wiring buys nothing at 440 ms.
      Environment:
        Variables:
          ASYNC_AGENT_ASSIST_ORCHESTRATOR_ARN: !GetAtt AsyncAgentAssistOrchestrator.Arn
      Timeout: 30
      MemorySize: 128
      Handler: lambda_function.lambda_handler
      CodeUri: ../source/lambda_functions/strands_chat_interface
      Description: This AWS Lambda Function handles STRANDS chat interface messages.
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/StrandsChatInterfaceFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for chat interface function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like function ARNs"
    DependsOn:
      - StrandsChatInterfaceFunctionLogGroup

  StrandsChatInterfaceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/StrandsChatInterfaceFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  StrandsChatInterfaceFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: STRANDS Chat Interface Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-StrandsChatInterface
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt AsyncAgentAssistOrchestrator.Arn

  AsyncAgentAssistOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/AsyncAgentAssistOrchestrator
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  AsyncAgentAssistOrchestratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Async Agent Assist Orchestrator Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AsyncAgentAssist
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kinesis:PutRecord
                Resource: !Ref CallDataStreamArn
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource:
                  - !Sub "${AppSyncApiEncrypted.Arn}/*"
              - Effect: Allow
                Action:
                  - appsync:EventConnect
                  - appsync:EventSubscribe
                  - appsync:EventPublish
                Resource:
                  - !Sub "arn:aws:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncEventApi.ApiId}/*"
              - !If
                - ShouldEnableLambdaAgentAssist
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - !Sub
                      - "arn:aws:lambda:${Region}:${AccountId}:function:STRANDS-${StackName}-*"
                      - Region: !Ref AWS::Region
                        AccountId: !Ref AWS::AccountId
                        StackName: !Ref LMAStackName
                    - !Sub "${AgentAssistExistingLambdaFunctionArn}"
                - Ref: AWS::NoValue

  AsyncTranscriptSummaryOrchestrator:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AsyncTranscriptSummaryOrchestratorExecutionRole.Arn
      Runtime: python3.12
      Environment:
        Variables:
          TRANSCRIPT_SUMMARY_FUNCTION_ARN:
            !If [
              ShouldEnableBedrockSummarizer,
              !GetAtt BedrockSummaryLambda.Arn,
              !Ref EndOfCallLambdaHookFunctionArn,
            ]
          CALL_DATA_STREAM_NAME: !Ref CallDataStream
          BOTO_READ_TIMEOUT: 60
          SPEAKER_NAME_RESOLVER_ARN: !GetAtt SpeakerNameResolverFunction.Arn
          # Must exceed the resolver's own 60s timeout, so a pass that is still
          # running is never abandoned and retried from here.
          SPEAKER_NAME_READ_TIMEOUT: 75
      Timeout: 240
      MemorySize: 128
      Handler: lambda_function.handler
      Layers:
        - !Ref TranscriptEnrichmentPythonLayer
      CodeUri: ../source/lambda_functions/async_transcript_summary_orchestrator
      Description: This AWS Lambda Function orchestrates call summary processing processing.
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/AsyncTranscriptSummaryOrchestrator
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - AsyncTranscriptSummaryOrchestratorLogGroup

  AsyncTranscriptSummaryOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/AsyncTranscriptSummaryOrchestrator
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  AsyncTranscriptSummaryOrchestratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Async Transcript Summary Orchetrator Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-AsyncTranscriptSummary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kinesis:PutRecord
                Resource: !Ref CallDataStreamArn
              - !If
                - ShouldEnableEndOfCallLambdaHookFunction
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: !Sub "${EndOfCallLambdaHookFunctionArn}"
                - Ref: AWS::NoValue
              - !If
                - ShouldEnableBedrockSummarizer
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - !GetAtt BedrockSummaryLambda.Arn
                - Ref: AWS::NoValue
              # Named before the transcript is summarised, so the summary reads
              # names rather than the engine's voice ids.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt SpeakerNameResolverFunction.Arn


  ##########################################################################
  # SNS Topic for Category Event Notifications
  ##########################################################################
  CategorySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # Call Event Processor
  ##########################################################################
  CallEventProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
          - id: W11
            reason: comprehend does not support resource-level permissions
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/call_event_processor
      Description: !Sub >-
        Call Event and Transcript Processor for stack: ${AWS::StackName}
      Events:
        TranscriptKds:
          Type: Kinesis
          Properties:
            # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-function-kinesis.html#sam-property-function-kinesis--examples
            BatchSize: 200
            BisectBatchOnFunctionError: true
            # Batches that remain unprocessable after the retry and record-age
            # bounds below are described to this queue so the shard can advance.
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt CallEventProcessorDiscardedRecordsQueue.Arn
            Enabled: true
            # The function answers with the Kinesis sequence numbers that need to
            # be redelivered, so a single failing record no longer replays the
            # records that already succeeded alongside it.
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumRetryAttempts: 2
            MaximumBatchingWindowInSeconds: 0
            ParallelizationFactor: 10
            # Upper bound on how long a record may be retried before it is
            # reported to the on-failure destination and the shard moves past
            # it. One hour absorbs a lengthy downstream outage or throttling
            # episode, while keeping the worst-case delay for live meeting
            # transcripts sharing the shard well inside the stream's retention
            # period, so a record that can never succeed cannot stall the shard
            # for the full retention window.
            MaximumRecordAgeInSeconds: 3600
            StartingPosition: LATEST
            Stream: !GetAtt DataStreamConsumer.ConsumerARN
            # Tumbling Window is used for aggregations over different invocations
            # https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html#services-kinesis-windows
            TumblingWindowInSeconds: 0
      Handler: lambda_function.handler
      Layers:
        - !Ref TranscriptEnrichmentPythonLayer
        # lma_metering, for the Comprehend sentiment counter. Pure Python, so
        # compatible with this function's arm64 architecture.
        - !Ref ConfigurationPythonLayer
      MemorySize: 3000
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventSourcingTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref CategorySNSTopic
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${LMASettingsParameterName}"
            - Effect: Allow
              Action:
                - appsync:GraphQL
              Resource:
                # XXX specific mutation - addEnrichment
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Mutation/*"
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/fields/__schema"
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/fields/getCall"
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/*"
            - Effect: Allow
              Action:
                - comprehend:DetectSentiment
              Resource: "*"
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
            - !If
              - ShouldEnableTranscriptLambdaHookFunction
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "${TranscriptLambdaHookFunctionArn}"
              - Ref: AWS::NoValue
            - !If
              - ShouldEnableStartOfCallLambdaHookFunction
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "${StartOfCallLambdaHookFunctionArn}"
              - Ref: AWS::NoValue
            - !If
              - ShouldEnablePostCallSummaryLambdaHookFunction
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "${PostCallSummaryLambdaHookFunctionArn}"
              - Ref: AWS::NoValue
            - !If
              - IsTranscriptSummaryEnabled
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt AsyncTranscriptSummaryOrchestrator.Arn
              - Ref: AWS::NoValue
            # Named before the summary is triggered, so the summary reads names
            # rather than the engine's voice ids. Not gated on the summary being
            # enabled: the names are worth having on the meeting page either way.
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SpeakerNameResolverFunction.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt AsyncAgentAssistOrchestrator.Arn
            # Two senders share this grant: the event source mapping uses this
            # role to describe unprocessable batches to the on-failure
            # destination queue, and the function writes one message per record
            # it skipped as undecodable.
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CallEventProcessorDiscardedRecordsQueue.Arn
            # The discarded records queue is encrypted with a customer-managed
            # KMS key, so the sender needs a data key for it.
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
              Condition:
                StringEquals:
                  "kms:ViaService":
                    - !Sub "sqs.${AWS::Region}.${AWS::URLSuffix}"
      Runtime: python3.12
      Timeout: 900
      Environment:
        Variables:
          # The CloudWatch namespace this function's application metrics are
          # published under. LMAStackName, not AWS::StackName: this is a nested
          # stack, so AWS::StackName is a generated name nobody can predict,
          # while the dashboard and the alarms live in the parent template and
          # select on the parent's name. Writing it as anything else publishes
          # to a namespace nothing reads.
          #
          # No cloudwatch:PutMetricData grant accompanies this. The metrics are
          # written as Embedded Metric Format records on stdout and extracted by
          # CloudWatch Logs, which AWS documents as needing only the
          # log-writing permission the function already has.
          METRIC_NAMESPACE: !Ref LMAStackName
          # Powertools' own name for the same thing, kept equal to it. Nothing
          # reads this today -- the emitter is passed METRIC_NAMESPACE
          # explicitly -- but aws-lambda-powertools is on this function's layer,
          # so anything later written with powertools Metrics picks this up by
          # default. Two names for one namespace that disagreed would publish
          # half the metrics where nothing is looking; a gate asserts they match.
          POWERTOOLS_METRICS_NAMESPACE: !Ref LMAStackName
          POWERTOOLS_SERVICE_NAME: TranscriptProcessor
          # Used by transcript_enrichment_layer's get_owner_from_jwt to validate
          # Cognito access tokens against the JWKS for the LMA user pool.
          VITE_AWS_REGION: !Ref AWS::Region
          VITE_USER_POOL_ID: !Ref UserPoolId
          # XXX add trace parameter or map
          POWERTOOLS_TRACE_DISABLED: false
          APPSYNC_GRAPHQL_URL: !GetAtt AppSyncApiEncrypted.GraphQLUrl
          STATE_DYNAMODB_TABLE_NAME: !Ref EventSourcingTable
          COMPREHEND_LANGUAGE_CODE: !Ref ComprehendLanguageCode
          IS_SENTIMENT_ANALYSIS_ENABLED: !Ref IsSentimentAnalysisEnabled
          SENTIMENT_NEGATIVE_THRESHOLD: !Ref SentimentNegativeScoreThreshold
          SENTIMENT_POSITIVE_THRESHOLD: !Ref SentimentPositiveScoreThreshold
          CALL_AUDIO_SOURCE: !Ref CallAudioSource
          # Lambda Agent Assist
          IS_LAMBDA_AGENT_ASSIST_ENABLED: !Ref IsLambdaAgentAssistEnabled
          MEETING_RECORD_EXPIRATION_IN_DAYS: !Ref MeetingRecordExpirationInDays
          TRANSCRIPTION_RECORD_EXPIRATION_IN_DAYS: !Ref TranscriptionExpirationInDays
          TRANSCRIPT_LAMBDA_HOOK_FUNCTION_ARN: !Ref TranscriptLambdaHookFunctionArn
          START_OF_CALL_LAMBDA_HOOK_FUNCTION_ARN: !Ref StartOfCallLambdaHookFunctionArn
          POST_CALL_SUMMARY_LAMBDA_HOOK_FUNCTION_ARN: !Ref PostCallSummaryLambdaHookFunctionArn
          TRANSCRIPT_LAMBDA_HOOK_FUNCTION_NONPARTIAL_ONLY: !Ref TranscriptLambdaHookFunctionNonPartialOnly
          IS_TRANSCRIPT_SUMMARY_ENABLED:
            !If [IsTranscriptSummaryEnabled, "true", "false"]
          ASYNC_TRANSCRIPT_SUMMARY_ORCHESTRATOR_ARN: !GetAtt AsyncTranscriptSummaryOrchestrator.Arn
          SPEAKER_NAME_RESOLVER_ARN: !GetAtt SpeakerNameResolverFunction.Arn
          ASYNC_AGENT_ASSIST_ORCHESTRATOR_ARN: !GetAtt AsyncAgentAssistOrchestrator.Arn
          CALL_DATA_STREAM_NAME: !Ref CallDataStream
          SNS_TOPIC_ARN: !Ref CategorySNSTopic
          PARAMETER_STORE_NAME: !Ref LMASettingsParameterName
          # Where records that cannot be decoded are copied. Skipping such a
          # record does not fail the invocation, so the event source mapping's
          # on-failure destination never sees it.
          DISCARDED_RECORDS_QUEUE_URL: !Ref CallEventProcessorDiscardedRecordsQueue
          # Comprehend sentiment requests, counted for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/CallEventProcessorFunction
    DependsOn:
      - CallEventProcessorFunctionLogGroup

  CallEventProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/CallEventProcessorFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # Destination for transcript records the pipeline did not apply, from two
  # sources. The Kinesis event source mapping writes a description of each batch
  # it gave up on - stream ARN, shard id and the failing sequence number range -
  # rather than the record payloads, which remain in the Kinesis stream for the
  # rest of its retention period and can be replayed from there. The function
  # itself writes one message per record it skipped as undecodable, carrying that
  # record's shard id, sequence number and raw payload, because a skipped record
  # does not fail the invocation and so never reaches the mapping's destination.
  CallEventProcessorDiscardedRecordsQueue:
    Type: AWS::SQS::Queue
    # Un-triaged skip records are data nobody has looked at yet, so they follow
    # the same retention setting as the tables rather than disappearing with the
    # stack. Messages still expire on their own after MessageRetentionPeriod.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
      KmsDataKeyReusePeriodSeconds: 300
      # 14 days, the SQS maximum. These messages are the only durable record
      # that a batch was skipped, so they are kept long enough to survive a
      # weekend or a holiday before an operator triages them.
      MessageRetentionPeriod: 1209600

  ##########################################################################
  # Transcript Enrichment Lambda Layers
  ##########################################################################
  TranscriptEnrichmentPythonLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: python3.12
    Properties:
      Description: !Sub "Transcript Enrichment Python Layer for stack: ${AWS::StackName}"
      ContentUri: ../source/lambda_layers/transcript_enrichment_layer
      CompatibleArchitectures:
        - arm64
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  ##########################################################################
  # Unified configuration store
  #
  # One table for runtime configuration, one accessor in a layer, and a
  # deploy-time seeder. See docs/configuration-store.md for the key layout and
  # the caching tiers.
  ##########################################################################

  ConfigurationTable:
    Type: AWS::DynamoDB::Table
    # Holds configuration edited from the web UI, which no redeployment can
    # reproduce once a deployment has customized it.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        # One HASH key and no sort key: every record is distinguished by a
        # prefix on this attribute (Config#default, Config#<profile>,
        # Config#__active, Schema), so a profile can be fetched by key alone
        # and no secondary index is needed.
        - AttributeName: Configuration
          AttributeType: S
      KeySchema:
        - AttributeName: Configuration
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # Every save records a revision (bodies in ConfigurationBucket, the index
      # here), and a revision is the ordinary route back from a bad save. This
      # is the route back for the table itself, index included, to any moment
      # in the window.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
      # Deliberately no TimeToLiveSpecification: configuration is current until
      # an operator changes it, and a record that expired on its own would take
      # a deployment's behaviour with it.

  # The shared accessor. Pure Python over the runtime's own boto3, so it carries
  # no compiled dependency and is declared compatible with both architectures --
  # which is what lets it be attached to every function that reads
  # configuration, whichever architecture that function runs on.
  ConfigurationPythonLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: python3.12
    Properties:
      Description: !Sub "Shared configuration accessor and meeting metering for stack: ${AWS::StackName}"
      ContentUri: ../source/lambda_layers/configuration_layer
      CompatibleArchitectures:
        - arm64
        - x86_64
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  ConfigurationSeederFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/ConfigurationSeederFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  ConfigurationSeederFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ConfigurationSeeder"
      Handler: lambda_function.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/configuration_seeder
      Description: Writes the deployment's configuration baseline when the stack is deployed
      Role: !GetAtt ConfigurationSeederRole.Arn
      MemorySize: 256
      Timeout: 120
      Tracing: Active
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup: !Ref ConfigurationSeederFunctionLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >-
              Function does not require VPC access — only interacts with
              DynamoDB and the CloudFormation response endpoint
          - id: W92
            reason: >-
              Function does not require reserved concurrency; it runs once when
              the stack is created, and on an update only when the shipped
              configuration or the code that processes it has changed
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency; it runs at deploy time only"
    # checkov:skip=CKV_AWS_116: "DLQ not applicable to a synchronous CloudFormation custom resource"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment holds only the stack-wide log level; table names arrive as custom resource properties"
    DependsOn:
      - ConfigurationSeederFunctionLogGroup

  ConfigurationSeederRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Configuration seeder Lambda role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        # The function sets Tracing: Active, and the role is declared here
        # rather than generated, so SAM adds nothing: without this the traces
        # the function is configured to emit have nowhere to go. Same policy and
        # same reason as GetEventApiDnsRole and GetCloudFrontPrefixListRole, the
        # other custom resources in this template that trace.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-ConfigurationSeeder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ConfigurationTable.Arn
              # Read-only on the tables the prompt templates, the Nova Sonic
              # settings, the chat buttons and the ASR switches used to live in:
              # the seeder carries an existing deployment's edits across once
              # and never writes there.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                    - Table: !Ref LLMPromptTemplateTableName
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                    - Table: !Ref NovaSonicConfigTableName
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                    - Table: !Ref ChatButtonConfigTableName
                  - !If
                    - HasAsrConfigTable
                    - !Ref AsrConfigTableArn
                    - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  SeedConfiguration:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ConfigurationSeederFunction.Arn
      ConfigurationTableName: !Ref ConfigurationTable
      # Where revision bodies are kept. On the deployment that introduces
      # it, the profile as it stands is recorded as revision 1.
      ConfigurationBucketName: !Ref ConfigurationBucket
      Domain: !Ref Domain
      LegacyPromptTemplateTableName: !Ref LLMPromptTemplateTableName
      # Read once, while the operator's profile holds no Nova Sonic section, to
      # carry the settings saved before the upgrade across.
      LegacyNovaSonicConfigTableName: !Ref NovaSonicConfigTableName
      # Likewise for the chat buttons, and for the ASR switches when the
      # on-demand engine is deployed (empty otherwise).
      LegacyChatButtonConfigTableName: !Ref ChatButtonConfigTableName
      LegacyAsrConfigTableName: !Ref AsrConfigTableName
      # Changes when the shipped configuration content or the code that
      # processes it changes, and is the only reason CloudFormation re-invokes
      # this resource on a stack update.
      SeedContentHash: !Ref ConfigurationSeedHash

  # Revision bodies for the configuration history: one gzipped object per
  # revision at config_revisions/<profile>/<nnnnnn>.json.gz, with the metadata
  # index in ConfigurationTable. The number is allocated exclusively by the
  # profile's own conditional write, so an object is written once; versioning
  # keeps a replaced or pruned object recoverable for the window below.
  ConfigurationBucket:
    Type: AWS::S3::Bucket
    # Holds the history of configuration edited from the web UI, which nothing
    # can reproduce once it is gone; retained on the same terms as the table.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CustomerManagedEncryptionKeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucketName
        LogFilePrefix: "configuration-bucket-logs/"
      LifecycleConfiguration:
        Rules:
          # No expiry of current objects: how many revisions a profile keeps is
          # a count, applied by the application, which a lifecycle rule cannot
          # express. A pruned or replaced object stays recoverable as a
          # non-current version for 35 days -- the table's point-in-time
          # recovery window, so a table restored to any moment in it still
          # finds the bodies its index names.
          - Id: ExpireReplacedRevisionObjects
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 35
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ConfigurationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigurationBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ConfigurationBucket.Arn
              - !Sub "${ConfigurationBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # Empties and deletes the bucket on stack delete, only when data retention is
  # disabled; with retention on, the bucket is retained with its contents.
  RemoveConfigurationBucketOnDelete:
    Type: Custom::RemoveConfigurationBucketOnDelete
    Condition: ShouldDeleteDataOnDelete
    Properties:
      ServiceToken: !GetAtt BucketDeleteLambda.Arn
      BucketName: !Ref ConfigurationBucket

  # What every function that writes configuration needs to record its history.
  # One policy, attached to each of those roles, so that a writer cannot be
  # given the table without the history: a template test asserts that every
  # role able to write ConfigurationTable attaches this.
  ConfigurationRevisionWriteAccess:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Record and read configuration revisions in the configuration bucket and table
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Put for each revision a save records, Get to read one back or to
          # see whether it is already stored, Delete for what the retention cap
          # prunes.
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub "${ConfigurationBucket.Arn}/config_revisions/*"
          # Without it, S3 answers a read of a missing object with 403 rather
          # than 404, and a revision that is not there would be indistinguishable
          # from a permission fault.
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt ConfigurationBucket.Arn
          # The revision index items, appended to on every save and rewritten
          # when pruning or labelling; and a profile's revision counters, set in
          # place when its history starts, without rewriting the profile.
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt ConfigurationTable.Arn
            Condition:
              ForAllValues:StringLike:
                "dynamodb:LeadingKeys":
                  - "ConfigRevIndex#*"
                  - "Config#*"
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !Ref CustomerManagedEncryptionKeyArn
            Condition:
              StringEquals:
                "kms:ViaService": !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"

