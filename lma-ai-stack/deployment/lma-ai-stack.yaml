  ##########################################################################
  # MicroVM VNC auth tokens
  #
  # When a Virtual Participant runs on Lambda MicroVMs (VPLaunchType=MICROVM)
  # there is no ALB in front of noVNC — the browser connects straight to the
  # MicroVM's own HTTPS endpoint, which requires a port-scoped JWE auth token.
  #
  # Minting needs IAM credentials (lambda:CreateMicrovmAuthToken), so it happens
  # here rather than in the browser. Tokens are capped at 60 minutes by the
  # service while meetings can run to 8 hours, so the viewer mints one per
  # session (and again on reconnect) instead of receiving one at VP launch.
  #
  # Created unconditionally: this stack does not receive VPLaunchType, and an
  # unused Lambda + resolver costs nothing. The mutation simply returns an error
  # for VPs that are not running on a MicroVM.
  ##########################################################################

  MicrovmVncTokenFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "CreateMicrovmAuthToken does not support resource-level permissions"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'lambda-microvms does not support resource-level permissions for CreateMicrovmAuthToken'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: MintMicrovmAuthToken
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:CreateMicrovmAuthToken
                Resource: "*"
              - Effect: Allow
                # Look up the caller's VP to (a) find its microvmId and (b) verify
                # ownership before handing out a token.
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt VPTaskRegistry.Arn
                  - !GetAtt VirtualParticipantTable.Arn
              # Both tables are encrypted with the customer-managed key, so
              # dynamodb:GetItem alone is not enough — the read fails with a KMS
              # AccessDeniedException and the VNC viewer shows only
              # "Failed to connect: undefined".
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"

  # Dedicated, KMS-encrypted log group, matching every other function in this
  # stack. The function logs VP ids and caller identities, so its logs must not
  # land in an unencrypted default group.
  MicrovmVncTokenFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/MicrovmVncTokenFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MicrovmVncTokenFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - MicrovmVncTokenFunctionLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function only calls AWS public APIs; no VPC resources"
          - id: W92
            reason: "Reserved concurrency not required; invoked once per viewer session"
    # checkov:skip=CKV_AWS_115: "Reserved concurrency not required"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a synchronous AppSync resolver"
    # checkov:skip=CKV_AWS_117: "VPC access not required; AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only table names"
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt MicrovmVncTokenFunctionRole.Arn
      Environment:
        Variables:
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistry
          VP_TABLE_NAME: !Ref VirtualParticipantTable
      CodeUri: ../source/lambda_functions/microvm_vnc_token
      LoggingConfig:
        LogGroup: !Ref MicrovmVncTokenFunctionLogGroup

  MicrovmVncTokenDataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: appsync.amazonaws.com
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MicrovmVncTokenFunction.Arn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  MicrovmVncTokenDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: MicrovmVncTokenManager
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt MicrovmVncTokenDataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt MicrovmVncTokenFunction.Arn

  CreateMicrovmVncTokenResolver:
