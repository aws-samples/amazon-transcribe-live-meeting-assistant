          USER_POOL_ID: !Ref UserPoolId
          ADMIN_GROUP: "Admin"
          ALLOWED_SIGNUP_EMAIL_DOMAINS: !Ref AllowedSignUpEmailDomain
      LoggingConfig:
        LogGroup: !Sub "/${AWS::StackName}/lambda/UserManagement"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
