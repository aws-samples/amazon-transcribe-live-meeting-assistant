  ##############################################################################
  # GSI-backed meeting list resolvers (listCallsDateRange, getCallCount)
  # Replace legacy shard/hour/scan VTL resolvers with a single Lambda that
  # queries the TypeDateIndex GSI on EventSourcingTable, then enriches each
  # matching list row with the corresponding call-detail item via
  # BatchGetItem — so the client receives fully-hydrated Call records in
  # one round-trip and we never scan.
  ##############################################################################

  ListCallsGsiResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/ListCallsGsiResolver"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  ListCallsGsiResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ListCallsGsiResolver"
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/list_calls_gsi_resolver
      Description: AppSync resolver for listCallsDateRange / getCallCount — queries TypeDateIndex GSI and BatchGetItems call-detail rows
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          EVENT_SOURCING_TABLE_NAME: !Ref EventSourcingTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventSourcingTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
