          "SharedWith": $ctx.args.input.SharedWith
        })


  ##########################################################################
  # Lambda@Edge for VNC Authentication
  ##########################################################################

  # Key used to sign the short-lived access tokens for the /vnc/* behavior.
  #
  # Generated once per deployment and read by exactly two principals: the
  # resolver that mints tokens (VncEdgeTokenFunction) and the Lambda@Edge
  # function that checks them. Created unconditionally, matching
  # MicrovmVncTokenFunction, so the AppSync resolver is always present.
  VncEdgeTokenSigningSecret:
    Type: AWS::SecretsManager::Secret
    # checkov:skip=CKV_AWS_149: "Encrypted with the stack's customer-managed key"
    Properties:
      Description: !Sub "Signing key for ${AWS::StackName} Virtual Participant VNC access tokens"
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      GenerateSecretString:
        # Punctuation excluded only so the value stays convenient to handle in
        # shell/JSON contexts; 64 alphanumeric characters is ample for an
        # HMAC-SHA256 key.
        PasswordLength: 64
        ExcludePunctuation: true

  # IAM Role for Lambda@Edge function (must be assumable by both lambda and edgelambda)
  EdgeAuthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        # Scoped to the one secret the edge function needs, and nothing else.
        - PolicyName: ReadVncTokenSigningSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref VncEdgeTokenSigningSecret
              # The secret is encrypted with the customer-managed key, so
              # GetSecretValue alone is not enough to read it.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"

  # Custom resource Lambda to deploy Lambda@Edge in us-east-1
  EdgeAuthDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ManageLambdaEdge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                Resource: !Sub 'arn:aws:lambda:us-east-1:${AWS::AccountId}:function:${AWS::StackName}-VNCEdgeAuth*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EdgeAuthFunctionRole.Arn

  EdgeAuthDeployerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-EdgeAuthDeployer'
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt EdgeAuthDeployerRole.Arn
      CodeUri: ../source/lambda_functions/edge_auth_deployer
      LoggingConfig:
        LogGroup: !Sub '/${AWS::StackName}/lambda/EdgeAuthDeployer'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for custom resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    DependsOn:
      - EdgeAuthDeployerLogGroup

  EdgeAuthDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${AWS::StackName}/lambda/EdgeAuthDeployer'
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # Custom resource to create Lambda@Edge function in us-east-1.
  #
  # Authenticates the /vnc/* CloudFront behavior, so it is only needed for the
  # ECS launch types. Under MICROVM the viewer authenticates with a port-scoped
  # MicroVM auth token instead (see MicrovmVncTokenFunction), and this
  # replicated edge function would otherwise linger in us-east-1 unused.
  EdgeAuthFunction:
    Type: Custom::EdgeAuthFunction
    Condition: ShouldCreateVNCALB
    Properties:
      ServiceToken: !GetAtt EdgeAuthDeployerFunction.Arn
      FunctionName: !Sub '${AWS::StackName}-VNCEdgeAuth'
      RoleArn: !GetAtt EdgeAuthFunctionRole.Arn
      # Baked into the edge source at create/update time: Lambda@Edge supports
      # no environment variables, and the replicated function has to be told
      # which region holds the secret.
      SigningSecretArn: !Ref VncEdgeTokenSigningSecret
      SigningSecretRegion: !Ref AWS::Region
      # Hash of the Lambda@Edge code - changing this forces the custom resource to update
      # This value is replaced during the build process by the Makefile
      CodeHash: "EDGE_AUTH_CODE_HASH_PLACEHOLDER"

  ##########################################################################
  # Token minting for the /vnc/* CloudFront behavior
  #
  # The viewer calls createVncEdgeToken(vpId) before connecting. This resolver
  # confirms the caller's access to that Virtual Participant against the VP
  # record, then returns a few-minute token signed with
  # VncEdgeTokenSigningSecret and scoped to that VP's /vnc/<vpId> path, which is
  # what the Lambda@Edge function checks.
  #
  # Created unconditionally (like MicrovmVncTokenFunction) so the resolver is
  # always attached; the token is only used by the ECS launch types, where the
  # ALB and CloudFront behavior exist.
  ##########################################################################

  VncEdgeTokenFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: MintVncEdgeToken
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref VncEdgeTokenSigningSecret
              - Effect: Allow
                # Look up the caller's VP to confirm access before signing, and
                # to read the VNC server credential the VP task recorded there.
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt VirtualParticipantTable.Arn
              # Both the table and the secret are encrypted with the
              # customer-managed key, so the read actions above are not
              # sufficient on their own.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"
                      - !Sub "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"

  # Dedicated, KMS-encrypted log group, matching every other function in this
  # stack. The function logs VP ids and caller identities, so its logs must not
  # land in an unencrypted default group.
  VncEdgeTokenFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/VncEdgeTokenFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  VncEdgeTokenFunction:
    Type: AWS::Serverless::Function
    # The log group is created by this stack, so it must exist before the
    # function's first invocation could create it implicitly and collide.
    DependsOn: VncEdgeTokenFunctionLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function only calls AWS public APIs; no VPC resources"
          - id: W92
            reason: "Reserved concurrency not required; invoked once per viewer session"
    # checkov:skip=CKV_AWS_115: "Reserved concurrency not required"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a synchronous AppSync resolver"
    # checkov:skip=CKV_AWS_117: "VPC access not required; AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only a table name and a secret ARN"
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt VncEdgeTokenFunctionRole.Arn
      Environment:
        Variables:
          VP_TABLE_NAME: !Ref VirtualParticipantTable
          SIGNING_SECRET_ARN: !Ref VncEdgeTokenSigningSecret
      CodeUri: ../source/lambda_functions/vnc_edge_token
      LoggingConfig:
        LogGroup: !Ref VncEdgeTokenFunctionLogGroup

  VncEdgeTokenDataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: appsync.amazonaws.com
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VncEdgeTokenFunction.Arn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  VncEdgeTokenDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      Name: VncEdgeTokenManager
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt VncEdgeTokenDataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt VncEdgeTokenFunction.Arn

  CreateVncEdgeTokenResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApiEncrypted.ApiId
      TypeName: Mutation
      FieldName: createVncEdgeToken
      DataSourceName: !GetAtt VncEdgeTokenDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "Invoke",
          "payload": {
            "arguments": $utils.toJson($context.arguments),
            "identity": $utils.toJson($context.identity),
            "info": {
              "fieldName": "createVncEdgeToken"
            }
          }
        }
      ResponseMappingTemplate: |
        #if($context.error)
          $utils.error($context.error.message, $context.error.type)
        #end
        $utils.toJson($context.result)

  ##########################################################################
  # VNC Application Load Balancer for VNC Viewer Remove FrameBuffer Stream
  ##########################################################################

  # Custom resource to get CloudFront prefix list ID dynamically.
  #
  # Only the VNC ALB security group consumes the prefix list, so this whole
  # trio (role, function, custom resource) is gated with the ALB itself.
  GetCloudFrontPrefixListRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateVNCALB
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: DescribePrefixLists
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeManagedPrefixLists
                Resource: '*'

  GetCloudFrontPrefixListFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldCreateVNCALB
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/GetCloudFrontPrefixListFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  GetCloudFrontPrefixListFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - GetCloudFrontPrefixListFunctionLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    Condition: ShouldCreateVNCALB
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      Role: !GetAtt GetCloudFrontPrefixListRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetCloudFrontPrefixListFunctionLogGroup
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  ec2 = boto3.client('ec2')
                  response = ec2.describe_managed_prefix_lists(
                      Filters=[
                          {
                              'Name': 'prefix-list-name',
                              'Values': ['com.amazonaws.global.cloudfront.origin-facing']
                          }
                      ]
                  )
                  
                  if response['PrefixLists']:
                      prefix_list_id = response['PrefixLists'][0]['PrefixListId']
                      print(f"Found CloudFront prefix list: {prefix_list_id}")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, 
                                     {'PrefixListId': prefix_list_id})
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                     reason='CloudFront prefix list not found')
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                 reason=str(e))

  CloudFrontPrefixList:
    Type: Custom::CloudFrontPrefixList
    Condition: ShouldCreateVNCALB
    Properties:
      ServiceToken: !GetAtt GetCloudFrontPrefixListFunction.Arn

  # ECS Security Group for Virtual Participant tasks
  VPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Virtual Participant ECS tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: !Sub ${LMAStackName}-vp-sg

  # ALB Security Group - Allow traffic from CloudFront only
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: ShouldCreateVNCALB
    Properties:
      GroupDescription: Security group for VNC Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !GetAtt CloudFrontPrefixList.PrefixListId
          Description: Allow HTTP from CloudFront
      Tags:
        - Key: Name
          Value: !Sub ${LMAStackName}-alb-sg

  # Security group rules between ALB and ECS
  ALBToECSEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateVNCALB
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 5901
      ToPort: 5901
      DestinationSecurityGroupId: !Ref VPSecurityGroup
      Description: Allow traffic to ECS tasks on websockify port

  ECSFromALBIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ShouldCreateVNCALB
    Properties:
      GroupId: !Ref VPSecurityGroup
      IpProtocol: tcp
      FromPort: 5901
      ToPort: 5901
      SourceSecurityGroupId: !Ref ALBSecurityGroup
      Description: Allow websockify traffic from ALB

  # Application Load Balancer
  VNCALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # checkov:skip=CKV_AWS_91: "ALB ingress is restricted to CloudFront prefix list only; request-level audit trail is maintained via CloudFront access logs written to the shared logging bucket. ALB access logs would only show CloudFront edge IPs (not client IPs)."
    # checkov:skip=CKV_AWS_150: "Deletion protection not required for this deployment-managed resource; stack deletion is expected to clean up all resources"
    Condition: ShouldCreateVNCALB
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub ${LMAStackName}-vnc-alb

  # Target Group for ECS tasks
  VNCTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: ShouldCreateVNCALB
    Properties:
      Port: 5901
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${LMAStackName}-vnc-tg

  # Shared value that identifies a request as having come through this
  # deployment's own CloudFront distribution.
  #
  # The ALB is internet-facing, because CloudFront needs a publicly resolvable
  # origin unless VPC origins are used. Two controls narrow who it answers, and
  # they establish different things. The ingress rule above admits the
  # `com.amazonaws.global.cloudfront.origin-facing` managed prefix list, which is
  # the address range CloudFront uses when it calls an origin -- a range the
  # service shares across the distributions it serves. This value is what ties a
  # request to this deployment's own distribution: the distribution attaches it to
  # every origin request (OriginCustomHeaders on the vnc-alb origin), and the
  # listener forwards only when it matches. Keep both.
  #
  # Only the value is generated. The header NAME is a constant, because it
  # travels in clear text on every origin request and so carries no secrecy --
  # generating it would add a secret to manage without adding entropy. (The
  # WebSocket transcriber stack generates both; the value is the part that
  # matters in each.)
  VncOriginVerifyHeaderValueSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ShouldCreateVNCALB
    # checkov:skip=CKV_AWS_149: "Encrypted with the stack's customer-managed key"
    Properties:
      Description: !Sub "Identifies ${AWS::StackName} CloudFront requests to the Virtual Participant VNC load balancer"
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      GenerateSecretString:
        SecretStringTemplate: '{"header_value": "vnc_origin_verify"}'
        GenerateStringKey: headersecret
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\;.:+' %"
        ExcludePunctuation: true

  # HTTP Listener (port 80)
  #
  # The default action refuses the request. Every route to a Virtual Participant
  # is expressed as a rule that names its condition, so a request reaching the
  # load balancer that matches none of them is answered here rather than
  # forwarded to whichever target group happened to be the default.
  VNCALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    # checkov:skip=CKV_AWS_103: ALB uses HTTP for internal traffic; TLS termination handled at CloudFront layer with Lambda@Edge auth
    # checkov:skip=CKV_AWS_2: ALB uses HTTP for internal traffic; TLS termination handled at CloudFront layer with Lambda@Edge auth; ALB security group restricts traffic to CloudFront only
    Condition: ShouldCreateVNCALB
    Properties:
      LoadBalancerArn: !Ref VNCALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: "Access denied"
            StatusCode: "403"

  # Forwards to the shared VNC target group, which the ECS service registers its
  # tasks into, for requests carrying this deployment's origin-verify header.
  #
  # Priority 50000 is the lowest the service allows, so this is evaluated after
  # the per-VP rules that the VP task creates at run time (those use priorities
  # 1000-49999, see status-manager.ts generateRulePriority). Ordering matters:
  # at a higher priority this rule would claim /vnc/* before the per-VP rule
  # could route to that participant's own target group.
  VNCALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: ShouldCreateVNCALB
    DependsOn: VncOriginVerifyHeaderValueSecret
    Properties:
      ListenerArn: !Ref VNCALBListener
      Priority: 50000
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/vnc/*"
        - Field: http-header
          HttpHeaderConfig:
            # Must stay identical to the OriginCustomHeaders entry on the
            # vnc-alb origin. The template has no Mappings section to hold a
            # shared constant, so test_ai_stack_vnc_alb.py asserts the two
            # spellings match rather than relying on them being edited together.
            HttpHeaderName: x-lma-vnc-origin-verify
            Values:
              - !Sub "{{resolve:secretsmanager:${VncOriginVerifyHeaderValueSecret}::headersecret}}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref VNCTargetGroup

  ##########################################################################
  # Web Site
  ##########################################################################

  # Custom resource to empty and delete WebApp bucket when stack is deleted

  BucketDeleteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:DeleteBucket"
                  - "s3:ListBucket"
                  - "s3:ListBucketVersions"
                  - "s3:DeleteObject"
                  - "s3:DeleteObjectVersion"
                Resource:
                  - !Sub "arn:aws:s3:::${WebAppBucket}"
                  - !Sub "arn:aws:s3:::${WebAppBucket}/*"
                  - !Sub "arn:aws:s3:::${VPProfilesBucket}"
                  - !Sub "arn:aws:s3:::${VPProfilesBucket}/*"
                  - !GetAtt ConfigurationBucket.Arn
                  - !Sub "${ConfigurationBucket.Arn}/*"
          PolicyName: deleteBucketS3Policy

  BucketDeleteLambda:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.lambda_handler"
      Runtime: python3.12
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt BucketDeleteLambdaRole.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def deleteS3Bucket(bucketName):
             print("Deleting S3 Bucket %s" % bucketName)
             bucket = boto3.resource("s3").Bucket(bucketName)
             bucket.object_versions.all().delete()
             bucket.delete()
          def lambda_handler(event, context):
            print(event)
            responseData = {}
            status = cfnresponse.SUCCESS
            reason = "Success"
            if event['RequestType'] == 'Delete':
              try:
                deleteS3Bucket(event['ResourceProperties']['BucketName'])
              except Exception as e:
                print(e)
                reason = f"Exception thrown: {e}"
                status = cfnresponse.FAILED
            cfnresponse.send(event, context, status, responseData, reason=reason)
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/BucketDeleteLambda
    DependsOn:
      - BucketDeleteLambdaLogGroup

  BucketDeleteLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/BucketDeleteLambda
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # Lambda to upload QuickSight manifest file
  UploadManifestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}/quicksight-recordingsbucket-manifest.json"
          PolicyName: uploadManifestS3Policy

  UploadManifestLambda:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.lambda_handler"
      Runtime: python3.12
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt UploadManifestLambdaRole.Arn
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: !Sub |
          import boto3
          import json
          import cfnresponse
          
          def lambda_handler(event, context):
            print(event)
            responseData = {}
            status = cfnresponse.SUCCESS
            reason = "Success"
            
            if event['RequestType'] in ['Create', 'Update']:
              try:
                s3 = boto3.client('s3')
                bucket_name = event['ResourceProperties']['BucketName']
                prefix = event['ResourceProperties']['Prefix']
                
                # Standard manifest for nested JSON
                manifest = {
                  "fileLocations": [
                    {
                      "URIPrefixes": [
                        f"s3://{bucket_name}/{prefix}"
                      ]
                    }
                  ],
                  "globalUploadSettings": {
                    "format": "JSON"
                  }
                }
                
                s3.put_object(
                  Bucket=bucket_name,
                  Key='quicksight-recordingsbucket-manifest.json',
                  Body=json.dumps(manifest, indent=2),
                  ContentType='application/json'
                )
                
                print(f"Uploaded manifest to s3://{bucket_name}/quicksight-recordingsbucket-manifest.json")
                
              except Exception as e:
                print(e)
                reason = f"Exception thrown: {e}"
                status = cfnresponse.FAILED
                
            elif event['RequestType'] == 'Delete':
              # Skip deletion - the S3BucketCleanupHandler in main stack will handle this
              # Deleting here causes race condition where manifest is recreated after bucket cleanup
              print("Skipping manifest deletion - will be cleaned up by S3BucketCleanupHandler")
                
            cfnresponse.send(event, context, status, responseData, reason=reason)
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/UploadManifestLambda
    DependsOn:
      - UploadManifestLambdaLogGroup

  UploadManifestLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/UploadManifestLambda
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UploadQuickSightManifest:
    Type: Custom::UploadQuickSightManifest
    Properties:
      ServiceToken: !GetAtt UploadManifestLambda.Arn
      BucketName: !Ref S3BucketName
      Prefix: !Ref TranscriptFilePrefix

  RemoveWebAppBucketOnDelete:
    Type: Custom::RemoveWebAppBucketOnDelete
    Properties:
      ServiceToken: !GetAtt BucketDeleteLambda.Arn
      BucketName: !Ref WebAppBucket

  WebAppBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18: "Access logging configured via LoggingConfiguration property"
    Properties:
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucketName
        LogFilePrefix: "webapp-bucket-logs/"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  WebAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "${WebAppBucket.Arn}/*"
          - Effect: "Deny"
            Action:
              - "s3:*"
            Principal: "*"
            Resource:
              - !GetAtt WebAppBucket.Arn
              - !Sub "${WebAppBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers-policy"
        Comment: "Security headers policy for LMA web application"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # Tightened CSP for LMA SPA:
            #   - connect-src: restricted to AWS service hostnames (*.amazonaws.com
            #     covers AppSync, Cognito, S3, API Gateway, etc.) and the
            #     CloudFront-fronted WebSocket transcriber/VNC endpoints
            #     (*.cloudfront.net), plus wss for realtime subscriptions and
            #     ws://localhost for dev mode. NOTE: CSP host-sources only allow '*'
            #     as the leftmost label, so mid-domain wildcards like
            #     cognito-idp.*.amazonaws.com are invalid (browser ignores them) and
            #     are intentionally omitted -- they are already covered by *.amazonaws.com.
            #     registry.modelcontextprotocol.io is allowed so the MCP Servers UI can
            #     browse/install servers from the official MCP registry.
            #     wss://*.lambda-microvm.<region>.on.aws is the per-MicroVM noVNC
            #     endpoint used when VPLaunchType=MICROVM (there is no ALB/CloudFront
            #     in that path). Region-scoped rather than *.on.aws to keep the
            #     allowlist tight. A missing entry here fails SILENTLY with no
            #     backend logs, which is painful to diagnose.
            #   - default-src: 'self'. This is the fallback for every fetch
            #     directive not named below. Because adding it changes the
            #     effective policy for directives that were previously absent,
            #     the ones the app actually needs are now named explicitly
            #     (frame-src, media-src, font-src, worker-src) so their behaviour
            #     is unchanged. The same silent-failure caveat as connect-src
            #     applies: a resource type that is neither 'self' nor listed just
            #     stops loading, with nothing in the backend logs.
            #   - script-src: 'self' only for host-sources. Every script the SPA
            #     loads is served from this distribution -- the Vite bundles under
            #     /assets, the vendored libraries under /js used by
            #     strands-chat.html, and the audio worklet under /worklets -- so
            #     no external script origin is required. 'unsafe-inline' is kept
            #     for the inline handlers on strands-chat.html and 'unsafe-eval'
            #     for React SPA compatibility.
            #   - frame-src: 'self'. Both <iframe> elements in the UI (CallPanel
            #     and the embed view) point at /strands-chat.html on this same
            #     distribution.
            #   - media-src: meeting audio and video are played from S3 presigned
            #     URLs of the form https://<bucket>.s3.<region>.<urlsuffix>, which
            #     is why the URL suffix is allowed here; blob: covers locally
            #     generated object URLs. AWS::URLSuffix is used rather than a
            #     literal amazonaws.com so this directive does not have to change
            #     later, but note it delivers no GovCloud or China benefit today:
            #     the UI builds those URLs in
            #     src/components/common/generate-s3-presigned-url.js, which still
            #     hardcodes amazonaws.com. Playback in a non-standard partition
            #     needs that fixed too.
            #   - font-src: 'self' and data:. The built stylesheets contain no
            #     external font references; Cloudscape uses system font stacks.
            #   - worker-src: 'self' and blob:. The audio worklet is served from
            #     this origin; blob: covers workers the AWS SDK may create.
            #   - style-src: 'unsafe-inline' retained for React SPA compatibility.
            #   - object-src: 'none' (no plugins needed).
            #   - base-uri: 'none' (prevent base tag injection).
            #   - frame-ancestors: 'self' (prevent clickjacking).
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; frame-src 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.${AWS::URLSuffix} https://*.cloudfront.net; font-src 'self' data:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https://*.amazonaws.com https://*.cloudfront.net https://*.amazoncognito.com https://*.s3-accelerate.amazonaws.com https://registry.modelcontextprotocol.io wss://*.amazonaws.com wss://*.cloudfront.net wss://*.lambda-microvm.${AWS::Region}.on.aws ws://localhost:*;"
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "CloudFront OAI for ${WebAppBucket}"

  WebAppCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    # checkov:skip=CKV_AWS_86: "CloudFront access logging configured via Logging property"
    # checkov:skip=CKV_AWS_174: "TLS v1.2 enforced via ViewerCertificate configuration"
    # checkov:skip=CKV_AWS_68: "WAF protection is optional for this distribution based on customer requirements"
    Properties:
      DistributionConfig:
        Comment: !Sub "Web app cloudfront distribution ${AWS::StackName}"
        Logging:
          Bucket: !Sub "${LoggingBucketName}.s3.amazonaws.com"
          Prefix: "cloudfront-logs/"
          IncludeCookies: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        CustomErrorResponses:
          # Send errors to index file
          - ErrorCachingMinTTL: 300
            ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCachingMinTTL: 300
            ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          TargetOriginId: webapp-s3-bucket
          ViewerProtocolPolicy: redirect-to-https
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          DefaultTTL: 600
          MinTTL: 300
          MaxTTL: 900
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        # The vnc-alb origin and its /vnc/* behavior exist only for the ECS
        # launch types. Under MICROVM the viewer connects straight to each
        # MicroVM's own HTTPS endpoint, so both are omitted -- CloudFormation
        # rejects a distribution whose origin references an ALB that the
        # ShouldCreateVNCALB condition did not create.
        Origins: !If
          - ShouldCreateVNCALB
          - - Id: webapp-s3-bucket
              DomainName: !GetAtt WebAppBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
            - Id: vnc-alb
              DomainName: !GetAtt VNCALB.DNSName
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
              # Identifies the request as having come through this deployment's
              # own distribution, which the load balancer's listener rule
              # requires. The header name must stay identical to the one in
              # VNCALBListenerRule; test_ai_stack_vnc_alb.py pins them together.
              OriginCustomHeaders:
                - HeaderName: x-lma-vnc-origin-verify
                  HeaderValue: !Sub "{{resolve:secretsmanager:${VncOriginVerifyHeaderValueSecret}::headersecret}}"
          - - Id: webapp-s3-bucket
              DomainName: !GetAtt WebAppBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
        CacheBehaviors: !If
          - ShouldCreateVNCALB
          - - PathPattern: /vnc/*
              TargetOriginId: vnc-alb
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - POST
                - PATCH
                - DELETE
              CachedMethods:
                - GET
                - HEAD
              ForwardedValues:
                QueryString: true
                Headers:
                  - "*"
                Cookies:
                  Forward: all
              Compress: false
              DefaultTTL: 0
              MinTTL: 0
              MaxTTL: 0
              LambdaFunctionAssociations:
                - EventType: viewer-request
                  LambdaFunctionARN: !GetAtt EdgeAuthFunction.FunctionArn
          - !Ref AWS::NoValue
        PriceClass: !Ref CloudFrontPriceClass
        Restrictions: !If
          - ShouldEnableGeoRestriction
          - GeoRestriction:
              RestrictionType: whitelist
              Locations: !Split [",", !Ref CloudFrontAllowedGeos]
          - GeoRestriction:
              RestrictionType: none
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W70
            reason:
              This is using Cloudfront default TLS, can be changed by customer
              if needed.
