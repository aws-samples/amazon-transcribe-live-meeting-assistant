  # Virtual Participant Manager Lambda Function
  VirtualParticipantManagerFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for management function"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive table names, stream names, schedule group names, and ARNs; AWS-owned key encryption is sufficient"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-VirtualParticipantManager"
      Handler: index.lambda_handler
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/virtual_participant_manager
      Description: Enhanced Virtual Participant Manager with ECS termination and Kinesis events
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref VirtualParticipantTable
          KINESIS_STREAM_NAME: !Ref CallDataStream
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistry
          VP_SCHEDULE_GROUP_NAME: !Ref VPScheduleGroupName
          # Empty under MICROVM (no ALB). The manager only uses this to clean up
          # per-VP listener rules and target groups, which exist solely on the
          # ECS launch paths.
          ALB_LISTENER_ARN: !If [ShouldCreateVNCALB, !Ref VNCALBListener, ""]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VirtualParticipantTable
        - Statement:
            - Effect: Allow
              Action:
                - kinesis:PutRecord
                - kinesis:PutRecords
                - kinesis:DescribeStream
              Resource: !Ref CallDataStreamArn
            - Effect: Allow
              Action:
                - ecs:ListClusters
                - ecs:ListTasks
                - ecs:DescribeTasks
                - ecs:StopTask
                - ecs:DescribeTaskDefinition
              Resource: "*"
            - Effect: Allow
              Action:
                - ecs:DescribeClusters
              Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt VPTaskRegistry.Arn
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
              Condition:
                StringEquals:
                  "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action:
                - dynamodb:ListTables
              Resource: "*"
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource: 
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${VPScheduleGroupName}/*"
            - Effect: Allow
              Action:
                - elasticloadbalancing:DescribeTargetGroups
                - elasticloadbalancing:DeleteTargetGroup
                - elasticloadbalancing:DescribeRules
                - elasticloadbalancing:DeleteRule
                - elasticloadbalancing:DeregisterTargets
                - elasticloadbalancing:DescribeTargetHealth
                - elasticloadbalancing:DescribeTags
              Resource: "*"
            # Terminate a MicroVM-hosted VP. Without this, ending a meeting had
            # no effect under VPLaunchType=MICROVM and the MicroVM ran until its
            # 8-hour duration limit. MicroVM ids are generated per launch, so
            # there is no ARN pattern to scope to.
            - Effect: Allow
              Action:
                - lambda:TerminateMicrovm
                - lambda:GetMicrovm
              Resource: "*"
      LoggingConfig:
        LogGroup: !Ref VirtualParticipantManagerLogGroup
    DependsOn:
      - VirtualParticipantManagerLogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement

  VirtualParticipantManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/VirtualParticipantManager"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # VP Task Registry Table - stores task ARNs for efficient termination
  VPTaskRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-VPTaskRegistry"
      AttributeDefinitions:
        - AttributeName: vpId
          AttributeType: S
      KeySchema:
        - AttributeName: vpId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # VP Profiles Bucket - per-user persisted Chromium userDataDir
  # backed by S3. Each user's profile lives under profiles/{cognitoSub}/{platform}/.
  # On launch the VP container hydrates the local userDataDir from this prefix
  # and uploads it back at meeting end. Once a user has signed in once and
  # cleared any CAPTCHA / 2FA, the session cookies persist here so subsequent
  # meetings reuse them and sign in cleanly without re-prompting.
  # Empty and delete the VP profiles bucket on stack delete, but only when
  # data retention is disabled. When ShouldRetainDataOnDelete is true the
  # bucket carries DeletionPolicy: Retain and is left in place with its
  # contents intact, so we must not create this cleanup resource.
  RemoveVPProfilesBucketOnDelete:
    Type: Custom::RemoveVPProfilesBucketOnDelete
    Condition: ShouldDeleteDataOnDelete
    Properties:
      ServiceToken: !GetAtt BucketDeleteLambda.Arn
      BucketName: !Ref VPProfilesBucket

  VPProfilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      # No BucketName: let CloudFormation generate a globally-unique
      # lowercase name. Avoids issues with stack names that contain
      # uppercase characters (S3 bucket names must be all-lowercase) and
      # avoids cross-account/region collisions on a fixed name.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CustomerManagedEncryptionKeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: ExpireIdleProfiles
            Status: Enabled
            ExpirationInDays: 365
            Prefix: "profiles/"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Access logging would target the access logs bucket - profiles are scoped per-user via prefix"

  VPProfilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VPProfilesBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${VPProfilesBucket}"
              - !Sub "arn:aws:s3:::${VPProfilesBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # DOM Selector Cache Table - shared across VP tasks. Stores AI-discovered
  # CSS selectors for meeting-platform UI elements (e.g. Zoom join inputs)
  # so subsequent meetings benefit from selectors discovered by earlier ones.
  # Entries auto-expire 30 days after lastUsedAt via the expiresAt TTL attribute.
  DomSelectorCache:
    Type: AWS::DynamoDB::Table
    # Rebuildable cache, but the policy is applied uniformly so that a stack
    # delete never removes a table whose contents were not inspected.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-DomSelectorCache"
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

