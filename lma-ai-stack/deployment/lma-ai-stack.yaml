  ##########################################################################
  # Meeting Controls Lambda - To share and delete meetings
  ##########################################################################
  MeetingControlsResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt MeetingControlsResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/meeting_controls_resolver
      Layers:
        - !Ref TranscriptEnrichmentPythonLayer
      Description: Lambda function for meeting controls
      MemorySize: 512
      Timeout: 60
      FunctionName: !Sub '${LMAStackName}-MeetingControlsLambda'
      Environment:
        Variables:
          LCA_CALL_EVENTS_TABLE: !Ref EventSourcingTable
          VITE_AWS_REGION: !Ref AWS::Region
          VITE_USER_POOL_ID: !Ref UserPoolId
          APPSYNC_GRAPHQL_URL: !GetAtt AppSyncApiEncrypted.GraphQLUrl
          S3_BUCKET_NAME: !Ref S3BucketName
          S3_RECORDINGS_PREFIX: !Ref AudioFilePrefix
          S3_TRANSCRIPTS_PREFIX: !Ref TranscriptFilePrefix
          VP_TABLE_NAME: !Ref VirtualParticipantTable
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistry
          KINESIS_STREAM_NAME: !Ref CallDataStream

      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/MeetingControlsResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - MeetingControlsResolverFunctionLogGroup

  MeetingControlsResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/MeetingControlsResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MeetingControlsResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MeetingControlsResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-MeetingControls
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt EventSourcingTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource:
                  # XXX specific mutation - addEnrichment
                  - !Sub "${AppSyncApiEncrypted.Arn}/types/Mutation/*"
                  - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/fields/__schema"
                  - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/fields/getCall"
                  - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/*"
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:DeleteObject"
                  - "s3:DeleteObjectVersion"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: 
                  - !GetAtt VirtualParticipantTable.Arn
                  - !GetAtt VPTaskRegistry.Arn
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                Resource: !Ref CallDataStreamArn
              - Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:DescribeTasks
                Resource: "*"

  AppSyncMeetingControlsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt MeetingControlsResolverFunction.Arn

  UploadMeetingInitiatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UploadMeetingInitiatorFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/upload_meeting_initiator
      Description: AppSync resolver that mints a presigned upload URL for a new pre-recorded meeting
      MemorySize: 256
      Timeout: 30
      FunctionName: !Sub '${LMAStackName}-UploadMeetingInitiator'
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          UPLOADS_PENDING_PREFIX: lma-uploads-pending/
          UPLOAD_URL_TTL_SECONDS: "900"
          UPLOAD_JOB_TTL_DAYS: "14"
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingInitiatorFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for synchronous AppSync resolver"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UploadMeetingInitiatorFunctionLogGroup

  UploadMeetingInitiatorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingInitiatorFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UploadMeetingInitiatorFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UploadMeetingInitiator Lambda execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-UploadMeetingInitiator
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Mint presigned PUT URLs scoped to the lma-uploads-pending/ prefix.
              # PutObject is required by sigv4 signing for the presigned URL to be valid,
              # even though the actual upload is done by the end-user's browser.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-uploads-pending/*"
              # Persist / condition-check the UploadJob row.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt EventSourcingTable.Arn
              # The EventSourcing table is encrypted with a customer-managed KMS key.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.amazonaws.com"
                      - !Sub "s3.${AWS::Region}.amazonaws.com"

  AppSyncUploadMeetingInitiatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UploadMeetingInitiatorFunction.Arn

  UploadMeetingProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UploadMeetingProcessorFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/upload_meeting_processor
      Description: Triggered by S3 ObjectCreated on lma-uploads-pending/ — emits a START Kinesis event and starts a Transcribe batch job
      MemorySize: 256
      Timeout: 60
      FunctionName: !Sub '${LMAStackName}-UploadMeetingProcessor'
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          CALL_DATA_STREAM_NAME: !Ref CallDataStream
          S3_BUCKET_NAME: !Ref S3BucketName
          UPLOADS_PENDING_PREFIX: lma-uploads-pending/
          TRANSCRIPTS_PREFIX: !Ref TranscriptFilePrefix
          DEFAULT_LANGUAGE_CODE: "en-US"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingProcessorFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for S3-triggered processor; Lambda retries + CloudWatch monitor errors"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UploadMeetingProcessorFunctionLogGroup

  UploadMeetingProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingProcessorFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UploadMeetingProcessorFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UploadMeetingProcessor Lambda execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-UploadMeetingProcessor
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-uploads-pending/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-transcripts/*"
              # Read + update the UploadJob row (PK/SK uj#<callId>).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt EventSourcingTable.Arn
              # Emit the START event. Same permission the transcriber container has.
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource: !Ref CallDataStreamArn
              # Start the batch job. Transcribe has no resource-level IAM for
              # StartTranscriptionJob; the service itself reads the S3 object
              # using its own service-linked permissions.
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:TagResource
                Resource: "*"
              # KMS: EventSourcingTable is CMK-encrypted; Transcribe writes its
              # output JSON back to RecordingsBucket which may also be CMK-
              # encrypted in some deployments.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.amazonaws.com"
                      - !Sub "s3.${AWS::Region}.amazonaws.com"
                      - !Sub "kinesis.${AWS::Region}.amazonaws.com"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "transcribe:StartTranscriptionJob does not support resource-level permissions"

  UploadMeetingProcessorFunctionS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UploadMeetingProcessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  UploadMeetingFinalizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UploadMeetingFinalizerFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/upload_meeting_finalizer
      Description: Triggered by Transcribe Job State Change — reads transcript JSON and emits segments + END
      MemorySize: 512
      Timeout: 300
      FunctionName: !Sub '${LMAStackName}-UploadMeetingFinalizer'
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          CALL_DATA_STREAM_NAME: !Ref CallDataStream
          S3_BUCKET_NAME: !Ref S3BucketName
          UPLOADS_PENDING_PREFIX: lma-uploads-pending/
          RECORDINGS_PREFIX: !Ref AudioFilePrefix
          TRANSCRIPTS_PREFIX: !Ref TranscriptFilePrefix
          # Batch transcription seconds, for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      # lma_metering; pure Python, so compatible with this function's arm64.
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingFinalizerFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required; EventBridge retries + CW alarms cover the failure surface"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UploadMeetingFinalizerFunctionLogGroup

  UploadMeetingFinalizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/UploadMeetingFinalizerFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UploadMeetingFinalizerFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UploadMeetingFinalizer Lambda execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-UploadMeetingFinalizer
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Read the transcript JSON Transcribe wrote, read the uploaded
              # media to copy it, and write it to the long-term recordings
              # prefix + delete the pending copy.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-uploads-pending/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-transcripts/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/lma-audio-recordings/*"
              # Read the UploadJob row + mark it COMPLETED/FAILED.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt EventSourcingTable.Arn
              # Metering records for the meeting cost estimate: PutItem only,
              # and only under the mtr# partitions.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt EventSourcingTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "mtr#*"
              # Emit transcript-segment / recording-url / END events onto the
              # same Kinesis stream the live websocket transcriber uses; the
              # existing call_event_processor consumes them.
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource: !Ref CallDataStreamArn
              # Inspect the completed job's tags so we can confirm it's ours.
              # transcribe:GetTranscriptionJob has no resource-level IAM.
              - Effect: Allow
                Action:
                  - transcribe:GetTranscriptionJob
                Resource: "*"
              # KMS — same scope as the processor Lambda.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.amazonaws.com"
                      - !Sub "s3.${AWS::Region}.amazonaws.com"
                      - !Sub "kinesis.${AWS::Region}.amazonaws.com"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "transcribe:GetTranscriptionJob does not support resource-level permissions"

  UploadMeetingFinalizerEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-UploadMeetingFinalizer"
      Description: Fires upload_meeting_finalizer on every Transcribe job COMPLETED/FAILED
      EventPattern:
        source:
          - aws.transcribe
        detail-type:
          - "Transcribe Job State Change"
        detail:
          TranscriptionJobStatus:
            - COMPLETED
            - FAILED
      State: ENABLED
      Targets:
        - Arn: !GetAtt UploadMeetingFinalizerFunction.Arn
          Id: UploadMeetingFinalizerTarget

  UploadMeetingFinalizerEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UploadMeetingFinalizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UploadMeetingFinalizerEventRule.Arn

  ##########################################################################
  # Stale Meeting Reaper — ends meetings whose client stopped sending
  # activity without sending its end-of-meeting event. The Virtual
  # Participant has the VP stack's task reaper and uploaded recordings have
  # UploadMeetingFinalizer; this covers the websocket streaming clients
  # (Stream Audio tab, desktop capture app, browser extension).
  ##########################################################################

  StaleMeetingReaperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.handler
      Role: !GetAtt StaleMeetingReaperFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      Layers:
        - !Ref TranscriptEnrichmentPythonLayer
      CodeUri: ../source/lambda_functions/stale_meeting_reaper
      Description: Ends meetings with no recent activity by emitting an END event
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          CALL_DATA_STREAM_NAME: !Ref CallDataStream
          MEETING_INACTIVITY_TIMEOUT_IN_MINUTES: !Ref MeetingInactivityTimeoutInMinutes
          # How far back a run looks for candidates. Has to exceed the longest
          # meeting a deployment expects plus the inactivity timeout, because a
          # meeting that started before the window is not examined — which is why
          # it is a parameter: an upgrade that inherits older stuck meetings needs
          # to widen it once without editing the template.
          REAPER_LOOKBACK_IN_DAYS: !Ref MeetingInactivityLookbackInDays
          # Caps the meeting rows read per run. Candidates cannot be narrowed on
          # the index (it projects no Status), so each one costs part of a
          # BatchGetItem; the newest are read first and the rest wait for the
          # next run.
          REAPER_MAX_CANDIDATES: 500
          # Caps the END events emitted per run.
          REAPER_MAX_MEETINGS_PER_RUN: 100
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/StaleMeetingReaperFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency; it runs once per schedule tick"
    # checkov:skip=CKV_AWS_116: "DLQ not required; the next scheduled run retries any meeting it did not close"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - StaleMeetingReaperFunctionLogGroup

  StaleMeetingReaperFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/StaleMeetingReaperFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  StaleMeetingReaperFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Stale Meeting Reaper Lambda execution role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-StaleMeetingReaper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Find candidate meetings through the TypeDateIndex GSI, then read
              # the meeting and upload-job rows for each candidate.
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub "${EventSourcingTable.Arn}/index/TypeDateIndex"
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                Resource: !GetAtt EventSourcingTable.Arn
              # Emit the same END event the meeting's client would have sent;
              # call_event_processor applies it.
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource: !Ref CallDataStreamArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"
                      - !Sub "kinesis.${AWS::Region}.${AWS::URLSuffix}"

  StaleMeetingReaperScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-StaleMeetingReaper"
      Description: >-
        Runs the stale meeting reaper. The interval bounds how long after
        MeetingInactivityTimeoutInMinutes a meeting keeps showing as in progress.
      ScheduleExpression: "rate(15 minutes)"
      State: !If [ShouldReapInactiveMeetings, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt StaleMeetingReaperFunction.Arn
          Id: StaleMeetingReaperTarget

  StaleMeetingReaperSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StaleMeetingReaperFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StaleMeetingReaperScheduleRule.Arn

