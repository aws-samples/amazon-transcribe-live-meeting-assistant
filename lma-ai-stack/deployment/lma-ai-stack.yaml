  ##########################################################################
  # MCP Server Resources - Allow external applications to access LMA data
  # (Separate from existing MCP client functionality above)
  ##########################################################################
  
  # External App Cognito Client for MCP Server authentication (Authorization Code flow)
  MCPServerExternalAppClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: ShouldEnableMCPServer
    Properties:
      ClientName: "LMA-MCPServer-ExternalApp-Client"
      UserPoolId: !Ref UserPoolId
      GenerateSecret: true  # pragma: allowlist secret
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !If
        - HasCustomMCPServerCallbackURLs
        - !Split [",", !Ref MCPServerCallbackURLs]
        - - !Sub "https://${WebAppCloudFrontDistribution.DomainName}/#/oauth/callback"
      LogoutURLs:
        - !Sub "https://${WebAppCloudFrontDistribution.DomainName}/"
      SupportedIdentityProviders:
        - COGNITO

  # MCP Server Gateway Execution Role
  MCPServerGatewayExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableMCPServer
    Properties:
      RoleName: !Sub "${LMAStackName}-MCPServerGatewayRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MCPServerAnalyticsFunction.Arn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  # MCP Server Analytics Lambda
  MCPServerAnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldEnableMCPServer
    Properties:
      LogGroupName: !Sub "/${LMAStackName}/lambda/MCPServerAnalytics"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MCPServerAnalyticsFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldEnableMCPServer
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_116: "DLQ not required for MCP handler"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive configuration (table names, S3 bucket name, KB IDs, model IDs, SSM parameter names); no secrets"
    Properties:
      FunctionName: !Sub "${LMAStackName}-MCPServerAnalytics"
      CodeUri: ../source/lambda_functions/mcp_analytics/
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          CALLS_TABLE: !Ref EventSourcingTable
          RECORDINGS_BUCKET: !Ref S3BucketName
          TRANSCRIPT_PREFIX: !Ref TranscriptFilePrefix
          TRANSCRIPT_KB_ID: !Ref BedrockKnowledgeBaseID
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          APPSYNC_GRAPHQL_URL: !GetAtt AppSyncApiEncrypted.GraphQLUrl
          LMA_SETTINGS_PARAMETER: !Ref LMASettingsParameterName
          LMA_WEB_APP_URL: !Sub "https://${WebAppCloudFrontDistribution.DomainName}"
          # Used by start_meeting_now to resolve user email → Cognito sub so
          # the MCP-launched VP can use the user's stored Zoom credentials.
          USER_POOL_ID: !Ref UserPoolId
          LMA_STACK_NAME: !Ref LMAStackName
          # Group whose members see every meeting in the account rather than
          # only their own. Matches UserManagementFunction.
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup: !Ref MCPServerAnalyticsLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventSourcingTable
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:RetrieveAndGenerate
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            - Effect: Allow
              Action:
                - appsync:GraphQL
              Resource:
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Mutation/fields/createVirtualParticipant"
                # Query/* covers getVirtualParticipant used by the new
                # get_virtual_participant_status tool.
                - !Sub "${AppSyncApiEncrypted.Arn}/types/Query/*"
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:StartSyncExecution
              Resource:
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${LMAStackName}-LMAVirtualParticipantScheduler"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${LMASettingsParameterName}"
            # Used by start_meeting_now: email→sub lookup so the MCP-launched
            # VP can use the user's stored Zoom credentials when present.
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
              Resource:
                - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
            # Read-only: only check whether a user has a Zoom secret stored.
            # We never need to read the secret value here — that happens in
            # the VP container's own scoped IAM.
            - Effect: Allow
              Action:
                - secretsmanager:DescribeSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${LMAStackName}/zoom-credentials/*"
    DependsOn:
      - MCPServerAnalyticsLogGroup

  # MCP Server Gateway (Native CloudFormation)
  MCPServerGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Condition: ShouldEnableMCPServer
    DependsOn:
      - MCPServerAnalyticsFunction
      - MCPServerExternalAppClient
      - MCPServerGatewayExecutionRole
    Properties:
      Name: !Sub "${LMAStackName}-MCP-Gateway"
      Description: "LMA MCP Server Gateway for external application access"
      ProtocolType: MCP
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration"
          AllowedClients:
            - !Ref MCPServerExternalAppClient
      RoleArn: !GetAtt MCPServerGatewayExecutionRole.Arn
      Tags:
        Application: LMA
        Component: MCPServer

  # MCP Server Gateway Target (Lambda)
  MCPServerGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: ShouldEnableMCPServer
    DependsOn: MCPServerGateway
    Properties:
      GatewayIdentifier: !Ref MCPServerGateway
      Name: "LMAAnalyticsTarget"
      Description: "LMA meeting analytics and transcript access tools"
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            # Spelled out rather than !GetAtt MCPServerAnalyticsFunction.Arn because
            # LambdaArn carries "format": "AWS::Lambda::Function.Arn", and cfn-lint
            # does not resolve that format through the SAM transform for an
            # AWS::Serverless::Function. The format failure invalidates the Lambda
            # branch of TargetConfiguration.Mcp's oneOf, which then reports every
            # other branch as missing - 12 errors from one false positive. The Ref
            # keeps the same implicit dependency GetAtt gave us.
            LambdaArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${MCPServerAnalyticsFunction}"
            ToolSchema:
              InlinePayload:
                - Name: search_lma_meetings
                  Description: "Search across all meeting transcripts and summaries using natural language queries"
                  InputSchema:
                    Type: object
                    Properties:
                      query:
                        Type: string
                        Description: "Natural language search query"
                      startDate:
                        Type: string
                        Description: "Optional ISO 8601 start date"
                      endDate:
                        Type: string
                        Description: "Optional ISO 8601 end date"
                      maxResults:
                        Type: number
                        Description: "Maximum results to return"
                    Required:
                      - query
                - Name: get_meeting_transcript
                  Description: "Retrieve the complete transcript for a specific meeting"
                  InputSchema:
                    Type: object
                    Properties:
                      meetingId:
                        Type: string
                        Description: "Meeting ID (CallId)"
                      format:
                        Type: string
                        Description: "Output format (json, text, or srt)"
                    Required:
                      - meetingId
                - Name: get_meeting_summary
                  Description: "Get AI-generated summary and action items for a meeting"
                  InputSchema:
                    Type: object
                    Properties:
                      meetingId:
                        Type: string
                        Description: "Meeting ID (CallId)"
                      includeActionItems:
                        Type: boolean
                        Description: "Include action items"
                      includeTopics:
                        Type: boolean
                        Description: "Include key topics"
                    Required:
                      - meetingId
                - Name: list_meetings
                  Description: "List meetings with optional filters"
                  InputSchema:
                    Type: object
                    Properties:
                      startDate:
                        Type: string
                        Description: "ISO 8601 start date"
                      endDate:
                        Type: string
                        Description: "ISO 8601 end date"
                      participant:
                        Type: string
                        Description: "Filter by participant name"
                      status:
                        Type: string
                        Description: "Meeting status filter"
                      limit:
                        Type: number
                        Description: "Maximum number of meetings to return"
                - Name: schedule_meeting
                  Description: "Schedule a future meeting with virtual participant"
                  InputSchema:
                    Type: object
                    Properties:
                      meetingName:
                        Type: string
                        Description: "Name/title of the meeting"
                      meetingPlatform:
                        Type: string
                        Description: "Platform (Zoom, Teams, Chime, Webex)"
                      meetingId:
                        Type: string
                        Description: "Meeting ID (numeric ID only)"
                      scheduledTime:
                        Type: string
                        Description: "ISO 8601 datetime when meeting should start"
                      meetingPassword:
                        Type: string
                        Description: "Optional meeting password"
                    Required:
                      - meetingName
                      - meetingPlatform
                      - meetingId
                      - scheduledTime
                - Name: start_meeting_now
                  Description: >-
                    Start a meeting immediately with a virtual participant.
                    When the user has stored Zoom credentials in LMA, the VP
                    signs in to Zoom with them by default for a more reliable
                    join; pass useStoredZoomCredentials=false to force a guest
                    join. Returns immediately with virtualParticipantId; the VP
                    may take up to 60s to fully join. Use
                    get_virtual_participant_status to poll progress, especially
                    to detect MANUAL_ACTION_REQUIRED (CAPTCHA, 2FA, SSO) where
                    the human user must complete a challenge in the LMA viewer.
                  InputSchema:
                    Type: object
                    Properties:
                      meetingName:
                        Type: string
                        Description: "Name/title of the meeting"
                      meetingPlatform:
                        Type: string
                        Description: "Platform (Zoom, Teams, Chime, Webex)"
                      meetingId:
                        Type: string
                        Description: "Meeting ID (numeric ID only)"
                      meetingPassword:
                        Type: string
                        Description: "Optional meeting password"
                      useStoredZoomCredentials:
                        Type: boolean
                        Description: >-
                          Default true. When the user has stored Zoom
                          credentials, the VP signs in to Zoom before joining
                          the meeting. Set to false to force a guest join.
                    Required:
                      - meetingName
                      - meetingPlatform
                      - meetingId
                - Name: get_virtual_participant_status
                  Description: >-
                    Get the current status of a virtual participant launched via
                    start_meeting_now. Returns status, a human-readable summary,
                    and — critically — manualActionRequired=true with a
                    manualActionMessage when the VP is blocked on a CAPTCHA / 2FA
                    / SSO / consent challenge that the human user must complete
                    in the LMA viewer (virtualParticipantUrl). Poll this every
                    5–10 seconds for ~2 minutes after start_meeting_now if you
                    need to confirm the meeting was joined or surface a
                    manual-action prompt back to your user.
                  InputSchema:
                    Type: object
                    Properties:
                      virtualParticipantId:
                        Type: string
                        Description: "VP id returned by start_meeting_now"
                    Required:
                      - virtualParticipantId

  VirtualParticipantLambdaDataSourceRole:
