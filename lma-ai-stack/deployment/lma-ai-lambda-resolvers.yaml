  ##########################################################################
  # LLM Prompt Template Config - Lambda, IAM, DataSources
  ##########################################################################
  UpdateLLMPromptTemplateResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UpdateLLMPromptTemplateResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/update_llm_prompt_template_resolver
      Description: >-
        Lambda resolver for the summary prompt templates: reads the stored
        record and saves an edit, with input validation
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateLLMPromptTemplateResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UpdateLLMPromptTemplateResolverFunctionLogGroup

  UpdateLLMPromptTemplateResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateLLMPromptTemplateResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UpdateLLMPromptTemplateResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UpdateLLMPromptTemplateResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AIStackName}-UpdateLLMPromptTemplate
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetItem as well as PutItem: a save reads the record's current
              # version so a write that another session has superseded can be
              # refused, and the editor's own read is served from here too.
              # Deliberately no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncUpdateLLMPromptTemplateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UpdateLLMPromptTemplateResolverFunction.Arn

  UpdateLLMPromptTemplateLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: UpdateLLMPromptTemplateFunction
      Description: Lambda function for updateLLMPromptTemplate with input validation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateLLMPromptTemplateLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateLLMPromptTemplateResolverFunction.Arn

  ##########################################################################
  # Per-meeting cost estimate: Query.getCallCost computes an itemised estimate
  # from the meeting's metering records (PK mtr#<CallId> in EventSourcingTable)
  # and the call_pricing section of the configuration store. getCallPricing and
  # updateCallPricing let an Admin read and change that price table. See
  # docs/meeting-cost-estimate.md.
  ##########################################################################

  CallCostResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt CallCostResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/call_cost_resolver
      Description: >-
        Lambda resolver for the per-meeting cost estimate and the price table it
        is computed with
      MemorySize: 256
      Timeout: 30
      Tracing: Active
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          ADMIN_GROUP: "Admin"
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/CallCostResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names and a group name"
    DependsOn:
      - CallCostResolverFunctionLogGroup

  CallCostResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/CallCostResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  CallCostResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CallCostResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: !Sub ${AIStackName}-CallCostResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Reads only: a meeting's metering records and the Owner and
              # SharedWith of its call row, which decide who may see it.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Ref EventSourcingTableArn
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "c#*"
                      - "mtr#*"
              # The price table. PutItem is the Admin's save, which is a
              # conditional write of the custom profile; no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncCallCostLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CallCostResolverFunction.Arn

  CallCostLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: CallCostFunction
      Description: Lambda function for the per-meeting cost estimate and its price table
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncCallCostLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CallCostResolverFunction.Arn

  ##########################################################################
  # Meeting preparation: a meeting's labels, audience, meeting context and
  # checklist (Call.Labels, Audience, MeetingContext, Checklist). One resolver
  # Lambda for the five mutations, and for the check the Virtual Participant
  # create and scheduled-edit pipelines run on the same inputs. See
  # docs/meeting-context-and-checklist.md.
  ##########################################################################
  MeetingPreparationResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt MeetingPreparationResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      Architectures:
        - arm64
      CodeUri: ../source/lambda_functions/meeting_preparation_resolver
      Description: >-
        Lambda resolver for a meeting's labels, audience, meeting context and
        checklist
      MemorySize: 256
      # One read and one write, repeated a few times on a conflict.
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          ADMIN_GROUP: "Admin"
          LOG_LEVEL: !Ref LogLevel
      # Carries lma_meeting_preparation (the rules). Pure Python, so it does
      # not pin an architecture.
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/MeetingPreparationResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only a table name and a group name"
    DependsOn:
      - MeetingPreparationResolverFunctionLogGroup

  MeetingPreparationResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/MeetingPreparationResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MeetingPreparationResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: MeetingPreparationResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: !Sub ${AIStackName}-MeetingPreparationResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # The meeting rows (c# partitions): read for their Owner,
              # SharedWith and checklist, which decide who may write and what
              # the checklist holds; updated with the preparation fields only.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Ref EventSourcingTableArn
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "c#*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncMeetingPreparationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
