---
# The Lambda functions behind the AI stack's Lambda-backed AppSync data sources,
# with their execution roles, log groups, data sources and the roles AppSync
# assumes to invoke them. A nested stack of lma-ai-stack.yaml, which keeps the
# GraphQL API, its schema and every resolver: a resolver there names its data
# source through this stack's outputs. Split out because one template may hold
# at most 500 resources after the SAM transform, and test_resource_budget.py in
# lma-ai-stack/test keeps the AI stack well under it.
#
# What belongs here: a function the web UI reaches through an AppSync data
# source, whose role no policy in the parent stack names. Other functions may
# invoke one by the ARN this stack outputs. Tables, buckets, keys, layers and the
# API itself stay in the parent and arrive as parameters.
#
# Log groups are named /<AI stack name>/resolvers/lambda/<function>: under the AI
# stack's own prefix, so the troubleshooting agent and `lma logs` find them as
# before, and distinct from the names these functions used while they were in
# the parent, so an update can create them before it deletes the old ones.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Amazon Transcribe Live Meeting Assist - AI Stack - Lambda resolvers

Parameters:
  AIStackName:
    Type: String
    Description: >-
      The AI stack's own name. Prefixes this stack's log groups
      (/<AI stack name>/resolvers/lambda/<function>) and names its inline
      policies as the AI stack did.
  AppSyncApiId:
    Type: String
  AppSyncGraphQLUrl:
    Type: String
  AsyncAgentAssistOrchestratorArn:
    Type: String
  BedrockKnowledgeBaseID:
    Type: String
  CloudWatchLogsExpirationInDays:
    Type: Number
  ConfigurationBucket:
    Type: String
  ConfigurationPythonLayer:
    Type: String
    Description: ARN of the AI stack's configuration layer version.
  ConfigurationRevisionWriteAccess:
    Type: String
    Description: ARN of the managed policy that lets a writer record configuration revisions.
  ConfigurationTable:
    Type: String
  ConfigurationTableArn:
    Type: String
  CustomerManagedEncryptionKeyArn:
    Type: String
  EventSourcingTable:
    Type: String
  EventSourcingTableArn:
    Type: String
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Logging level for Lambda functions.
  MeetingRecordExpirationInDays:
    Type: Number
  PermissionsBoundaryArn:
    Type: String
  VirtualParticipantTable:
    Type: String
  VirtualParticipantTableArn:
    Type: String
  VncEdgeTokenSigningSecret:
    Type: String
    Description: ARN of the secret the /vnc/* edge tokens are signed with.
  VPTaskRegistry:
    Type: String
  VPTaskRegistryArn:
    Type: String

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Globals:
  Function:
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel

Resources:
  StrandsChatInterfaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt StrandsChatInterfaceFunctionExecutionRole.Arn
      Runtime: python3.12
      # No SnapStart here: `ApplyOn: PublishedVersions` only takes effect for a
      # published version, and this function is reached through an unqualified
      # $LATEST ARN (the StrandsChatDataSource AppSync data source uses
      # `!GetAtt StrandsChatInterfaceFunction.Arn`), so no version is ever
      # published and the setting was inert. Measured before removing it: init
      # 440 ms, exec 297 ms — SnapStart targets multi-second inits, and paying
      # for a version cache plus alias-qualified wiring buys nothing at 440 ms.
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          ASYNC_AGENT_ASSIST_ORCHESTRATOR_ARN: !Ref AsyncAgentAssistOrchestratorArn
      Timeout: 30
      MemorySize: 128
      Handler: lambda_function.lambda_handler
      CodeUri: ../source/lambda_functions/strands_chat_interface
      Description: This AWS Lambda Function handles STRANDS chat interface messages.
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/StrandsChatInterfaceFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for chat interface function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like function ARNs"
    DependsOn:
      - StrandsChatInterfaceFunctionLogGroup

  StrandsChatInterfaceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/StrandsChatInterfaceFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  StrandsChatInterfaceFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: STRANDS Chat Interface Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AIStackName}-StrandsChatInterface
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref AsyncAgentAssistOrchestratorArn

  QueryKnowledgeBaseResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt QueryKnowledgeBaseResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/query_knowledgebase_resolver
      Description: Lambda function to query the meeting transcript knowledge base
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          KB_ID: !Ref BedrockKnowledgeBaseID
          KB_ACCOUNT_ID: !Ref AWS::AccountId
          KB_REGION: !Ref AWS::Region
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/QueryKnowledgeBaseResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - QueryKnowledgeBaseResolverFunctionLogGroup

  MeetingInvitationParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt MeetingInvitationParserFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/meeting_invitation_parser
      Description: Lambda function to parse meeting invitations using Bedrock AI
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_REGION_OVERRIDE: !Ref AWS::Region
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/MeetingInvitationParserFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    DependsOn:
      - MeetingInvitationParserFunctionLogGroup

  MeetingInvitationParserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/MeetingInvitationParserFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  MeetingInvitationParserFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Meeting Invitation Parser Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AIStackName}-MeetingInvitationParser
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - "bedrock:GetInferenceProfile"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Read-only, on the shared configuration table: the model this
              # function calls is read from its Amazon Bedrock Models section.
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  QueryKnowledgeBaseResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/QueryKnowledgeBaseResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  QueryKnowledgeBaseResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: QueryKnowledgeBaseResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AIStackName}-BedrockKnowledgeBase
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:Retrieve"
                  - "bedrock:RetrieveAndGenerate"
                #TODO: Figure out how to restrict to target Transcript KB - created in a parallel nested stack
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource: 
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - "bedrock:GetInferenceProfile"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Read-only, on the shared configuration table: the model this
              # function calls is read from its Amazon Bedrock Models section.
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: 
                  - !GetAtt QueryKnowledgeBaseResolverFunction.Arn
                  - !GetAtt MeetingInvitationParserFunction.Arn

  UpdateChatButtonConfigResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UpdateChatButtonConfigResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/update_chat_button_config_resolver
      Description: >-
        Lambda resolver for the Meeting Assist chat buttons: reads a stored
        record and saves an edit against an allowed field list
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateChatButtonConfigResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UpdateChatButtonConfigResolverFunctionLogGroup

  UpdateChatButtonConfigResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateChatButtonConfigResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UpdateChatButtonConfigResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UpdateChatButtonConfigResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AIStackName}-UpdateChatButtonConfig
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetItem as well as PutItem: the chat panel's read is served from
              # here, and a save reads the profile's current version so a write
              # that another session has superseded can be refused.
              # Deliberately no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncUpdateChatButtonConfigLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UpdateChatButtonConfigResolverFunction.Arn

  UpdateChatButtonConfigLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: UpdateChatButtonConfigFunction
      Description: Lambda data source backing the updateChatButtonConfig mutation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateChatButtonConfigLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateChatButtonConfigResolverFunction.Arn

  ##########################################################################
  # Nova Sonic Config - Lambda, IAM, DataSources
  ##########################################################################

  UpdateNovaSonicConfigResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UpdateNovaSonicConfigResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/update_nova_sonic_config_resolver
      Description: >-
        Lambda resolver for the Nova Sonic voice assistant settings: reads the
        stored record and saves an edit, with input validation
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateNovaSonicConfigResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UpdateNovaSonicConfigResolverFunctionLogGroup

  UpdateNovaSonicConfigResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateNovaSonicConfigResolverFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UpdateNovaSonicConfigResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UpdateNovaSonicConfigResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AIStackName}-UpdateNovaSonicConfig
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetItem as well as PutItem: a save reads the profile's current
              # version so a write that another session has superseded can be
              # refused, and the page's own read is served from here too.
              # Deliberately no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncUpdateNovaSonicConfigLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              Service:
                - appsync.amazonaws.com
      Policies:
        - PolicyName: lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UpdateNovaSonicConfigResolverFunction.Arn

  UpdateNovaSonicConfigLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: UpdateNovaSonicConfigFunction
      Description: Lambda function for updateNovaSonicConfig with input validation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateNovaSonicConfigLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UpdateNovaSonicConfigResolverFunction.Arn

  ##########################################################################
  # ASR runtime config (the asr_engine section) - Lambda, IAM, DataSources
  #
  # Created whether or not the on-demand engine is deployed: the Virtual
  # Participant reads its voice separation switch through getAsrConfig on
  # Amazon Transcribe as well.
  ##########################################################################

  UpdateAsrConfigResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt UpdateAsrConfigResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/update_asr_config_resolver
      Description: >-
        Lambda resolver for the ASR runtime switches: reads the effective
        switches and saves an edit, with input validation
      MemorySize: 256
      Timeout: 30
      Layers:
        - !Ref ConfigurationPythonLayer
      Environment:
        Variables:
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Every save records a revision there; see ConfigurationRevisionWriteAccess.
          CONFIGURATION_BUCKET_NAME: !Ref ConfigurationBucket
          ADMIN_GROUP: "Admin"
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateAsrConfigResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    DependsOn:
      - UpdateAsrConfigResolverFunctionLogGroup

  UpdateAsrConfigResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/UpdateAsrConfigResolverFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  UpdateAsrConfigResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: UpdateAsrConfigResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref ConfigurationRevisionWriteAccess
      Policies:
        - PolicyName: !Sub ${AIStackName}-UpdateAsrConfig
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetItem as well as PutItem: every read is served from here, and a
              # save reads the profile's current version so a write that another
              # session has superseded can be refused. Deliberately no DeleteItem.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Ref ConfigurationTableArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncUpdateAsrConfigLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: appsync.amazonaws.com
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt UpdateAsrConfigResolverFunction.Arn

  # ----------------------------------------------------------------------------
  # Speaker name resolution
  #
  # Speaker separation can tell voices apart but cannot know who they are, so a
  # conference-room meeting reads "Other Participant (spk_0)". This function
  # reads the transcript, asks a model for evidence of who each voice is, and
  # verifies every proposal against the turn index before applying it. Reachable
  # from the Speakers panel and invoked once at the end of a meeting, before the
  # summary, so the summary reads names rather than voice ids.
  # ----------------------------------------------------------------------------
  SpeakerNameResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt SpeakerNameResolverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/speaker_name_resolver
      Description: Infers speaker names from the transcript and stores them on the meeting
      MemorySize: 512
      # A model call over a bounded number of turns, plus the paged transcript
      # read. Deliberately shorter than the summary orchestrator's socket timeout
      # for this invoke (SPEAKER_NAME_READ_TIMEOUT, 75s), so the caller never
      # gives up on a pass that is still running and retries it.
      Timeout: 60
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          APPSYNC_GRAPHQL_URL: !Ref AppSyncGraphQLUrl
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          BEDROCK_REGION_OVERRIDE: !Ref AWS::Region
          # Token usage per naming pass, for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      # Carries lma_metering and lma_config. Pure Python, so it does not pin this
      # function to an architecture.
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/SpeakerNameResolverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a function whose work is re-runnable on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names, an endpoint and a model id"
    DependsOn:
      - SpeakerNameResolverFunctionLogGroup

  SpeakerNameResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/SpeakerNameResolverFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  SpeakerNameResolverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: SpeakerNameResolver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AIStackName}-SpeakerNameResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Read only: the names are written back through AppSync, so that
              # open meeting pages re-label from the onUpdateCall publish.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
              # The one write: metering records for the meeting cost estimate,
              # and only under the mtr# partitions.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "mtr#*"
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource: !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncApiId}/types/Mutation/fields/updateSpeakerIdentities"
              # Read-only, on the shared configuration table: the model is read
              # from its Amazon Bedrock Models section. The KMS grant below
              # covers decrypting it.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !Ref ConfigurationTableArn
              # Scoped the same way BedrockSummaryLambda and
              # MeetingInvitationParser scope the identical call, since
              # the configured model may name a foundation model, a custom model or an
              # inference profile. Only converse() is called, so the streaming
              # action is not granted.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncSpeakerNameResolverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: !Sub ${AIStackName}-AppSyncInvokeSpeakerNameResolver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SpeakerNameResolverFunction.Arn

  SpeakerNameResolverLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: SpeakerNameResolverFunction
      Description: Lambda function for resolveSpeakerNames
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncSpeakerNameResolverLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt SpeakerNameResolverFunction.Arn

  # ----------------------------------------------------------------------------
  # Agenda derivation
  #
  # Reads a meeting's transcript for an agenda somebody stated, and stores it
  # only if one was. Invoked once, asynchronously, by the call event processor
  # about five minutes into a meeting with no agenda, and on demand from the
  # Agenda panel's "Derive agenda" button. See docs/meeting-agenda.md.
  # ----------------------------------------------------------------------------
  AgendaDeriverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt AgendaDeriverFunctionExecutionRole.Arn
      Runtime: python3.12
      CodeUri: ../source/lambda_functions/agenda_deriver
      Description: Derives a meeting's agenda from its transcript when one was stated
      MemorySize: 512
      # One model call over a bounded transcript, plus the paged transcript read.
      # The on-demand pass answers an AppSync request, which AppSync abandons at
      # 30 seconds. The transcript bound in pure.py keeps the call short, but a
      # reasoning model or Bedrock retries can still outlast that; the function
      # then usually finishes on its own within this timeout, any agenda it
      # finds arrives through onUpdateCall, and the Agenda panel says so.
      Timeout: 60
      Environment:
        Variables:
          EVENT_SOURCING_TABLE: !Ref EventSourcingTable
          APPSYNC_GRAPHQL_URL: !Ref AppSyncGraphQLUrl
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          BEDROCK_REGION_OVERRIDE: !Ref AWS::Region
          # Token usage per pass, for the meeting cost estimate.
          METERING_TABLE_NAME: !Ref EventSourcingTable
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      # Carries lma_metering and lma_config. Pure Python, so it does not pin this
      # function to an architecture.
      Layers:
        - !Ref ConfigurationPythonLayer
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AIStackName}/resolvers/lambda/AgendaDeriverFunction
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a function whose work is re-runnable on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only table names, an endpoint and a model id"
    DependsOn:
      - AgendaDeriverFunctionLogGroup

  AgendaDeriverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AIStackName}/resolvers/lambda/AgendaDeriverFunction
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  AgendaDeriverFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AgendaDeriver Function Lambda Role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${AIStackName}-AgendaDeriver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # The meeting record and its transcript segments. The agenda itself
              # is written back through AppSync, so open meeting pages update.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
              # The automatic pass's once-per-meeting claim, a conditional write
              # on the meeting record, and only under the c# partitions.
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "c#*"
              # Metering records for the meeting cost estimate, only under mtr#.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTable}"
                Condition:
                  ForAllValues:StringLike:
                    "dynamodb:LeadingKeys":
                      - "mtr#*"
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource: !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncApiId}/types/Mutation/fields/updateCallAgenda"
              # Read-only, on the shared configuration table: the model is read
              # from its Amazon Bedrock Models section. The KMS grant below
              # covers decrypting it.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !Ref ConfigurationTableArn
              # Scoped as the speaker name resolver scopes the identical call.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:custom-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"

  AppSyncAgendaDeriverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: !Sub "appsync.${AWS::URLSuffix}"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: !Sub ${AIStackName}-AppSyncInvokeAgendaDeriver
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AgendaDeriverFunction.Arn

  AgendaDeriverLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: AgendaDeriverFunction
      Description: Lambda function for deriveCallAgenda
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncAgendaDeriverLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt AgendaDeriverFunction.Arn

  UpdateAsrConfigLambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref AppSyncApiId
      Name: UpdateAsrConfigFunction
      Description: Lambda function for updateAsrConfig with input validation
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncUpdateAsrConfigLambdaRole.Arn
      LambdaConfig:
