AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon LMA - On-demand streaming ASR and speaker diarization on AWS Lambda
  MicroVMs, as an alternative to Amazon Transcribe streaming (v0.3.7)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Model selection
        Parameters:
          - AsrModelBundle
      - Label:
          default: Runtime sizing and tuning
        Parameters:
          - AsrMaxMeetingSeconds
          - AsrLogLevel

Parameters:
  LMAStackName:
    Type: String
    Description: Name of the parent LMA stack, used to name the image and log group.

  SourceCodeLocation:
    Type: String
    Description: >-
      bucket/key of the published ASR MicroVM image source zip (Dockerfile at the
      zip root). Rewritten per stack with the resolved model selection.

  LambdaArtifactBucket:
    Type: String
    Description: Bucket holding the published Lambda deployment packages.

  AsrLauncherS3Key:
    Type: String
    Description: S3 key of the ASR launcher Lambda deployment package.

  AsrImageSourceS3Key:
    Type: String
    Description: S3 key of the ASR image-source packager Lambda deployment package.

  AsrModelBundle:
    Type: String
    Default: parakeet-tdt-v3-live-nemotron35-sortformer
    AllowedValues:
      - fastconformer-titanet-small
      - fastconformer-transcription-only
      - nemotron35-titanet-small
      - nemotron-titanet-small
      - parakeet-tdt-v3-titanet-small
      - parakeet-tdt-v2-titanet-small
      - qwen3-asr-titanet-small
      - qwen3-asr-transcription-only
      - cohere-transcribe-titanet-small
      - parakeet-tdt-v3-live-titanet-small
      - parakeet-tdt-v3-live-nemotron35-titanet-small
      - parakeet-tdt-v3-sortformer
      - parakeet-tdt-v3-live-sortformer
      - parakeet-tdt-v3-live-nemotron35-sortformer
    Description: >-
      Which model bundle the MicroVM ASR engine is built from. A bundle names the
      ASR model, the speaker-embedding model and the turn-detection model TOGETHER
      WITH the diarization operating point measured for them, so nothing has to be
      tuned. The default pairs the Parakeet TDT 0.6B v3 offline model (CC-BY-4.0)
      with TitaNet-small speaker labels; every bundle except nemotron-titanet-small
      is permissively licensed and redistributable, and the transcription-only
      bundles label by audio channel and carry no speaker weights. Set from the
      AsrDefaults mapping in lma-main.yaml. Changing it rebuilds the MicroVM image
      (~20 minutes).

  AsrMaxMeetingSeconds:
    Type: Number
    Default: 14400
    MinValue: 600
    MaxValue: 28800
    Description: >-
      Hard ceiling on one ASR MicroVM's lifetime. Also the cost backstop: a
      transcriber task that dies without releasing the MicroVM cannot leak
      compute for longer than this. The service maximum is 8 hours.

  AsrLogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - INFO
      - DEBUG
    Description: >-
      DEBUG adds a throttled per-session ingest/decode/emit heartbeat to the
      MicroVM log group.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - INFO
      - DEBUG
    Description: Log level for the ASR control-plane Lambda functions.

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 14
    Description: >-
      Retention for this stack's Lambda log groups. Without an explicit group these
      functions log to an implicit /aws/lambda/<name> group that keeps everything
      forever and is not encrypted with the customer-managed key.

  CustomerManagedEncryptionKeyArn:
    Type: String
    Default: ""
    Description: ARN of the customer managed KMS key used to encrypt the config table.

  LoggingBucketName:
    Type: String
    Default: ""
    Description: Optional bucket for S3 server access logs.

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary applied to created roles.

  EnableDataRetentionOnDelete:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Retain the ASR config table when the stack is deleted. It holds the
      diarization operating point tuned from the web UI's ASR Config page,
      including any calibration the deployment measured for itself.

Conditions:
  ShouldRetainDataOnDelete: !Equals [!Ref EnableDataRetentionOnDelete, "true"]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasLoggingBucket: !Not [!Equals [!Ref LoggingBucketName, ""]]
  HasEncryptionKey: !Not [!Equals [!Ref CustomerManagedEncryptionKeyArn, ""]]

Mappings:
  # ONNX Runtime threads should match the baseline vCPU count (2 GiB per vCPU).
  # Baseline memory per bundle. Duplicated from catalog.json because
  # MinimumMemoryInMiB needs a CloudFormation-typed number and a Mapping cannot be
  # keyed on a value resolved by a custom resource. AsrImageSource is passed this
  # figure and FAILS the stack if it disagrees with the bundle, so the two cannot
  # drift silently. Threads are derived by the resolver (2 GiB per vCPU).
  BundleMemory:
    fastconformer-titanet-small:
      MiB: 8192
    fastconformer-transcription-only:
      MiB: 8192
    nemotron35-titanet-small:
      MiB: 8192
    nemotron-titanet-small:
      MiB: 8192
    parakeet-tdt-v3-titanet-small:
      MiB: 8192
    parakeet-tdt-v2-titanet-small:
      MiB: 8192
    qwen3-asr-titanet-small:
      MiB: 8192
    qwen3-asr-transcription-only:
      MiB: 8192
    cohere-transcribe-titanet-small:
      MiB: 8192
    parakeet-tdt-v3-live-titanet-small:
      MiB: 8192
    parakeet-tdt-v3-live-nemotron35-titanet-small:
      MiB: 8192
    parakeet-tdt-v3-sortformer:
      MiB: 8192
    parakeet-tdt-v3-live-sortformer:
      MiB: 8192
    parakeet-tdt-v3-live-nemotron35-sortformer:
      MiB: 8192

Resources:
  ##########################################################################
  # Per-stack image source artifact
  ##########################################################################

  AsrImageSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Access logging is enabled when a logging bucket is supplied by the parent stack"
    # checkov:skip=CKV_AWS_18: "Access logging is conditional on the parent stack's logging bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration: !If
        - HasLoggingBucket
        - DestinationBucketName: !Ref LoggingBucketName
          LogFilePrefix: !Sub "${LMAStackName}-asr-image-source/"
        - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSupersededSources
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AsrImageSourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AsrImageSourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AsrImageSourceBucket.Arn
              - !Sub "${AsrImageSourceBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  AsrImageSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: PackageImageSource
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}/lambda/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SourceCodeLocation}"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "${AsrImageSourceBucket.Arn}/*"
              # The bucket is versioned; a stack delete has to empty every version.
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !GetAtt AsrImageSourceBucket.Arn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  AsrImageSourceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/AsrImageSourceFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !If [HasEncryptionKey, !Ref CustomerManagedEncryptionKeyArn, !Ref "AWS::NoValue"]

  AsrImageSourceFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: "Log write permissions are granted inline on the execution role"
          - id: W89
            reason: "Reaches S3 public APIs only; VPC attachment is not required"
          - id: W92
            reason: "Runs a handful of times per stack lifecycle; reserved concurrency is unnecessary"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "CloudFormation reports failures; a DLQ adds nothing"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches S3 public APIs only"
    Properties:
      FunctionName: !Sub "${LMAStackName}-AsrImageSource"
      LoggingConfig:
        LogGroup: !Ref AsrImageSourceFunctionLogGroup
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 1024
      TracingConfig:
        Mode: Active
      Role: !GetAtt AsrImageSourceRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AsrImageSourceS3Key

  # Resolves the model parameters against source/catalog.json and republishes the
  # image source zip with the selection baked in. CreateMicrovmImage has no
  # build-arg passthrough, so the selection has to travel inside the artifact.
  AsrImageSource:
    Type: Custom::AsrImageSource
    Properties:
      ServiceToken: !GetAtt AsrImageSourceFunction.Arn
      SourceLocation: !Ref SourceCodeLocation
      DestBucket: !Ref AsrImageSourceBucket
      DestPrefix: image-source
      BundleId: !Ref AsrModelBundle
      BaselineMemoryMiB: !FindInMap [BundleMemory, !Ref AsrModelBundle, MiB]

  # Where the Transcription Engine switches were stored before the shared
  # configuration table; the configuration seeder reads it once, on upgrade, to
  # carry them across (docs/configuration-store.md). Records written by older
  # releases can also hold retired diarization tuning fields: the operating point
  # is now the model bundle's, baked into the image (see source/catalog.json).
  AsrConfigTable:
    Type: AWS::DynamoDB::Table
    # DDB-002: Data plane logging disabled due to cost; control plane logging via CloudTrail is sufficient
    # A calibrated threshold is measured against a deployment's own meetings and
    # cannot be regenerated by redeploying, so the table follows the stack's data
    # retention setting.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      KeySchema:
        - AttributeName: AsrConfigId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: AsrConfigId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasEncryptionKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
        - !Ref AWS::NoValue
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ##########################################################################
  # MicroVM image
  ##########################################################################

  AsrMicrovmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: AsrMicrovmImageBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${AsrImageSourceBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"

  # Assumed by the running MicroVM. The ASR server makes no AWS API calls -- the
  # transcriber owns Kinesis -- so this grants logging only.
  AsrMicrovmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: AsrMicrovmRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"

  # Destination for the image build and for every ASR MicroVM's stdout -- the
  # highest-volume stream in this stack, so it is declared here to carry the
  # stack's retention setting and the customer-managed key rather than being
  # created by the service with no expiry and the AWS-owned key.
  #
  # Two settings route output here, and both are needed. The image's
  # Logging.CloudWatch.LogGroup covers only the build, snapshot and /validate
  # output. Each running MicroVM's output goes to the group named in that
  # RunMicrovm call's own `logging` member, which AsrLauncherFunction passes
  # from MICROVM_LOG_GROUP_NAME; a RunMicrovm that names no group logs to a
  # service-created `/aws/lambda-microvms/<image name>` group instead.
  # AsrMicrovmExecutionRole writes the runtime streams.
  #
  # The name deliberately differs from the group earlier releases logged to
  # (`/aws/lambda-microvms/${LMAStackName}-asr`). That group is already present
  # in any stack that has built the image, and CloudFormation cannot adopt an
  # existing log group: declaring it under the same name fails the update with
  # "already exists". The previous group is left in place with the logs it
  # already holds.
  #
  # Kept under the /aws/lambda-microvms/ prefix so AsrMicrovmBuildRole's and
  # AsrMicrovmExecutionRole's existing log-group scoping still covers it.
  AsrMicrovmLogGroup:
    Type: AWS::Logs::LogGroup
    # Treated as stateful, like the other log groups that hold meeting-time
    # output: a stack delete would otherwise take with it the post-mortem logs
    # for the compute path that is hardest to debug.
    #
    # RetainExceptOnCreate rather than Retain, because the update that first
    # creates this group is the same one that rebuilds the image, and that build
    # downloads the model bundle from an external host. If the build fails, the
    # update rolls back -- and a plain Retain is honoured even when rolling back
    # the operation that created the resource, which would leave the group behind
    # and make the retry fail with "already exists". The retry has to be able to
    # create this group again.
    #
    # Retaining it on a real delete has the consequence every retained resource
    # in LMA has: the name is derived from the parent stack's name, so turning
    # EnableMicrovmAsr off and on again with retention enabled leaves the
    # retained group in the way of the new one. Delete it by hand first.
    DeletionPolicy: !If [ShouldRetainDataOnDelete, RetainExceptOnCreate, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda-microvms/${LMAStackName}-asr-logs"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !If [HasEncryptionKey, !Ref CustomerManagedEncryptionKeyArn, !Ref "AWS::NoValue"]

  AsrMicrovmImage:
    Type: AWS::Lambda::MicrovmImage
    # Logging.CloudWatch.LogGroup is a destination name, not a group the
    # resource owns, so the group has to exist before the first build writes to
    # it -- and has to outlive the image on a stack delete.
    DependsOn:
      - AsrMicrovmLogGroup
    # cfn-lint ships no schema for this resource type yet (service launched
    # 2026-06), so E3006 would otherwise fail the lint.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      Name: !Sub "${LMAStackName}-asr"
      Description: !Sub "LMA streaming ASR + diarization (${LMAStackName})"
      BaseImageArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:microvm-image:al2023-1"
      # Major version only; "1.0" is rejected at create time.
      BaseImageVersion: "1"
      BuildRoleArn: !GetAtt AsrMicrovmBuildRole.Arn
      CpuConfigurations:
        - Architecture: ARM_64
      Logging:
        CloudWatch:
          LogGroup: !Ref AsrMicrovmLogGroup
      # The Lambda-managed pool is enough: egress is only used at build time to
      # download the model, and the running ASR server makes no outbound calls.
      EgressNetworkConnectors:
        - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
      CodeArtifact:
        Uri: !GetAtt AsrImageSource.SourceUri
      Resources:
        - MinimumMemoryInMiB: !FindInMap [BundleMemory, !Ref AsrModelBundle, MiB]
      # Required by the CloudFormation resource even though the ASR server needs
      # no extra Linux capabilities (unlike the Virtual Participant's Chromium
      # sandbox, which needs ALL). Empty is the least-privilege value.
      AdditionalOsCapabilities: []
      EnvironmentVariables:
        - Key: ASR_NUM_THREADS
          Value: !GetAtt AsrImageSource.NumThreads
        - Key: ASR_LOG_LEVEL
          Value: !Ref AsrLogLevel
      Hooks:
        Port: 9000
        MicrovmImageHooks:
          # /ready returning 200 is when the snapshot is taken, so it only
          # succeeds once the model is loaded AND a decode has run through the
          # real WebSocket path.
          Ready: ENABLED
          ReadyTimeoutInSeconds: 900
          # /validate lets Lambda sample which snapshot pages the decode touches
          # so it can prefetch them on later launches.
          Validate: ENABLED
          ValidateTimeoutInSeconds: 900
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 30
          Suspend: DISABLED
          Resume: DISABLED
          Terminate: ENABLED
          TerminateTimeoutInSeconds: 30

  # Keeps the image below its 50-version cap. Each rebuild adds a version, so a
  # stack deployed often would otherwise reach the cap and the next image build
  # would fail -- stopping the update at the first resource it touches.
  AsrMicrovmImagePrunerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: MicrovmImageVersions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetMicrovmImage
                  - lambda:ListMicrovmImageVersions
                  - lambda:DeleteMicrovmImageVersion
                Resource: !GetAtt AsrMicrovmImage.ImageArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}/lambda/*"

  AsrMicrovmImagePrunerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/AsrMicrovmImagePruner"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !If [HasEncryptionKey, !Ref CustomerManagedEncryptionKeyArn, !Ref "AWS::NoValue"]

  AsrMicrovmImagePrunerFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: "Log write permissions are granted inline on the execution role"
          - id: W89
            reason: "Reaches AWS public APIs only; VPC attachment is not required"
          - id: W92
            reason: "Runs once per stack operation"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: "python3.12 is an actively supported Lambda runtime"
    # checkov:skip=CKV_AWS_115: "Function runs once per stack operation; reserved concurrency not required"
    # checkov:skip=CKV_AWS_116: "DLQ not required for a Cfn custom resource that reports its own outcome"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    Properties:
      LoggingConfig:
        LogGroup: !Ref AsrMicrovmImagePrunerLogGroup
      Handler: image_version_pruner.lambda_handler
      Runtime: python3.12
      # Deletes are serialised and a blocked one is retried over several passes.
      # The handler stops and reports while 30s remain, so it does not rely on
      # this being generous enough for the worst case.
      Timeout: 600
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Role: !GetAtt AsrMicrovmImagePrunerRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      Code:
        # The same deployment package as the launcher: the handler imports
        # microvm_client.py, which ships alongside it.
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AsrLauncherS3Key

  AsrMicrovmImagePruner:
    Type: Custom::MicrovmImageVersionPruner
    Properties:
      ServiceToken: !GetAtt AsrMicrovmImagePrunerFunction.Arn
      # The GetAtt is what orders this after the image, so no DependsOn.
      ImageArn: !GetAtt AsrMicrovmImage.ImageArn
      # How many versions to leave behind beyond the active one.
      KeepVersions: 5
      # Carried only to trigger the prune. A custom resource is only invoked
      # when one of its properties changes, and this one changes on every
      # successful rebuild -- including rebuilds caused by a property change
      # rather than new source, which the source location would miss. A rebuild
      # whose version FAILS consumes a version number without changing this,
      # so a long run of consecutive failures would not be pruned until the
      # next success.
      LatestActiveImageVersion: !GetAtt AsrMicrovmImage.LatestActiveImageVersion

  ##########################################################################
  # Session control plane called by the WebSocket transcriber
  ##########################################################################

  AsrLauncherRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "RunMicrovm/GetMicrovm/TerminateMicrovm/CreateMicrovmAuthToken do not support resource-level permissions"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "lambda-microvms actions are scoped by region and account; the service has no resource-level permissions for RunMicrovm"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: AsrMicrovmSessions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}/lambda/*"
              - Effect: Allow
                Action:
                  - lambda:RunMicrovm
                  - lambda:GetMicrovm
                  - lambda:TerminateMicrovm
                  - lambda:CreateMicrovmAuthToken
                Resource: "*"
              # Attaching a connector is authorized on the connector itself;
              # RunMicrovm permission alone is not sufficient.
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:ALL_INGRESS"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
              # No iam:PassedToService condition: RunMicrovm does not populate
              # that context key, so any condition on it evaluates to a deny.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AsrMicrovmExecutionRole.Arn

  AsrLauncherFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/AsrLauncherFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !If [HasEncryptionKey, !Ref CustomerManagedEncryptionKeyArn, !Ref "AWS::NoValue"]

  AsrLauncherFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: "Log write permissions are granted inline on the execution role"
          - id: W89
            reason: "Called by the transcriber task over the Lambda API; VPC attachment is not required"
          - id: W92
            reason: "Concurrency is bounded by the number of concurrent meetings"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: "python3.12 is an actively supported Lambda runtime"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "The caller handles failures and falls back to Amazon Transcribe"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive ARNs and limits"
    Properties:
      FunctionName: !Sub "${LMAStackName}-AsrLauncher"
      LoggingConfig:
        LogGroup: !Ref AsrLauncherFunctionLogGroup
      Handler: index.lambda_handler
      Runtime: python3.12
      # RunMicrovm plus the wait for RUNNING.
      Timeout: 300
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Role: !GetAtt AsrLauncherRole.Arn
      Environment:
        Variables:
          MICROVM_IMAGE_ARN: !GetAtt AsrMicrovmImage.ImageArn
          EXECUTION_ROLE_ARN: !GetAtt AsrMicrovmExecutionRole.Arn
          # Passed as RunMicrovm's `logging` member. The image's Logging setting
          # covers only its build output; without this, each session's MicroVM
          # output goes to a service-created group with no expiry.
          MICROVM_LOG_GROUP_NAME: !Ref AsrMicrovmLogGroup
          MAX_MEETING_SECONDS: !Ref AsrMaxMeetingSeconds
          # Reported on acquire so the transcriber can meter the MicroVM for the
          # meeting cost estimate. The same figure as the image's
          # MinimumMemoryInMiB.
          MICROVM_MEMORY_MIB: !Sub
            - "${Mib}"
            - Mib: !FindInMap [BundleMemory, !Ref AsrModelBundle, MiB]
          LOG_LEVEL: !Ref LogLevel
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref AsrLauncherS3Key

Outputs:
  AsrLauncherFunctionArn:
    Description: ARN of the ASR session launcher invoked by the WebSocket transcriber.
    Value: !GetAtt AsrLauncherFunction.Arn

  AsrMicrovmImageArn:
    Description: ARN of the ASR MicroVM image.
    Value: !GetAtt AsrMicrovmImage.ImageArn

  AsrModelBundleId:
    Description: Pre-vetted model pairing baked into the image.
    Value: !GetAtt AsrImageSource.BundleId

  AsrModelBundleName:
    Description: Display name of that bundle, shown in the Transcription Engine section of the Configuration page.
    Value: !GetAtt AsrImageSource.BundleName

  AsrModelBundleStatus:
    Description: >-
      "calibrated" when the bundle carries an operating point measured for its
      speaker model under this engine's segmentation policy; "vetted" when this
      exact pairing has additionally been validated end to end on a live
      multi-speaker meeting; "experimental" for a bundle whose diarizer has no
      operating point to measure and is still being validated live;
      "uncalibrated" when the catalog states no status.
    Value: !GetAtt AsrImageSource.BundleStatus

  AsrLicenceSummary:
    Description: Licences of every weight in the bundle.
    Value: !GetAtt AsrImageSource.LicenceSummary

  AsrRedistributable:
    Description: >-
      Whether every weight in this bundle may be redistributed. "false" means the
      image must not be copied outside this account.
    Value: !GetAtt AsrImageSource.Redistributable

  AsrModelId:
    Description: Model baked into the image.
    Value: !GetAtt AsrImageSource.ModelId
  AsrPreviewModelId:
    Description: Streaming model previewing the open utterance in a two-pass bundle, or none.
    Value: !GetAtt AsrImageSource.PreviewModelId
  AsrDiarizerModelId:
    Description: End-to-end diarization model labelling the offline engine's words, or none.
    Value: !GetAtt AsrImageSource.DiarizerModelId

  AsrModelLicense:
    Description: Licence of the model baked into the image.
    Value: !GetAtt AsrImageSource.ModelLicense

  AsrSpeakerModelId:
    Description: Speaker-embedding model baked into the image.
    Value: !GetAtt AsrImageSource.SpeakerModelId

  DiarizationAvailable:
    Description: Whether the image can produce speaker labels.
    Value: !GetAtt AsrImageSource.DiarizationAvailable

  TurnDetectionAvailable:
    Description: >-
      Whether a speaker-turn detection model is baked in, so one endpointed
      utterance containing two voices can be split rather than labelled once.
    Value: !GetAtt AsrImageSource.TurnDetectionAvailable

  SpeakerThreshold:
    Description: >-
      Calibrated cosine similarity operating point for this bundle, empty when the
      pairing has never been measured. Passed to the transcriber as its default.
    Value: !GetAtt AsrImageSource.SpeakerThreshold

  MinSegmentMs:
    Description: >-
      Shortest utterance worth embedding for this bundle. A shorter one inherits the
      current speaker rather than minting an identity from an unreliable vector.
    Value: !GetAtt AsrImageSource.MinSegmentMs

  AsrConfigTableName:
    Description: Runtime ASR configuration table, edited from the Transcription Engine admin page.
    Value: !Ref AsrConfigTable

  AsrConfigTableArn:
    Description: ARN of the runtime ASR configuration table.
    Value: !GetAtt AsrConfigTable.Arn

  MicrovmLogGroup:
    Description: CloudWatch log group for ASR MicroVM sessions.
    Value: !Ref AsrMicrovmLogGroup
