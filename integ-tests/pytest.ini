[pytest]
markers =
    live: opt-in tests that place a Virtual Participant into a real meeting (require --vp-meeting-id)
    external_meeting: joins a real third-party meeting; skips when no meeting is configured (LMA_TEST_MEET_URL, LMA_TEST_VP_LIVE_MEETING) or the platform turns its guest away
    optional_feature: tests of a stack feature that is off by default, which skip cleanly where it is not enabled
addopts = -v -ra
