#
# LMA GitLab CI/CD pipeline.
#
# Three stages:
#   fast_checks            — no-AWS lint + unit tests + build checks. Runs on
#                            every push and MR so developers get feedback
#                            without a deploy.
#   security_review        — SRT (Sample Security Review Tool). See
#                            docs/security-scanning.md.
#   scheduled_integration  — the end-to-end suite against a live stack. Runs
#                            ONLY from a pipeline schedule, never on a push or
#                            an MR, because it needs AWS credentials and a
#                            deployed stack. One-time setup is required; see
#                            docs/scheduled-integration-tests.md.
#
# What is intentionally NOT here: docker-build-check needs a Docker daemon and
# is run locally via `make docker-build-check`. See the 'integ-tests' skill and
# docs/dependency-upgrade-validation-runbook.md.

image: public.ecr.aws/docker/library/python:3.13-bookworm

default:
  timeout: 1h

stages:
  - fast_checks
  - security_review
  - scheduled_integration

# Avoid duplicate (branch + MR) pipelines: prefer the MR pipeline when an MR is
# open for the branch.
workflow:
  rules:
    # Listed first and unconditionally: a scheduled pipeline runs on a branch
    # ref, so without this the `$CI_OPEN_MERGE_REQUESTS` rule below could
    # cancel the nightly whenever an MR happens to be open for that branch.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── fast_checks: lint + unit tests + build checks (no AWS) ──────────────────
code_checks:
  stage: fast_checks
  interruptible: true
  # Larger runner: the Vite production build + tsc/eslint are CPU-bound.
  tags:
    - size:large
  rules:
    # Excluded from schedules so a nightly pipeline's red/green means one thing:
    # whether the integration suite passed. The fast checks already run on every
    # push and MR.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  # Cache UI deps across runs, keyed on the lockfile.
  cache:
    key:
      files:
        - lma-ai-stack/source/ui/package-lock.json
    paths:
      - lma-ai-stack/source/ui/node_modules/
  before_script:
    - apt-get update -y
    - apt-get install -y make curl git
    # Node 22 LTS (>=22.22.2 required by jsdom 30; vite 8 / rolldown native
    # bindings are optional deps that npm silently skips on an older engine).
    # The exact version comes from .nvmrc, shared with `make setup-node` and
    # the GitHub Actions workflow.
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
    - curl -fsSL https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node --version && npm --version
    # Python venv + lint tools + SDK/CLI with test extras (used by all pytest suites).
    - make setup-python
    - make setup-cli-dev
  script:
    # CloudFormation lint (no AWS).
    - make lint-cfn
    # Python unit suites (all mock boto3 / use dummy env — no AWS).
    - make test-sdk
    - make test-cli
    - make test-lambdas
    # UI: lint + tests (force = ignore the local checksum cache).
    - make lint-ui-force
    - make test-ui-force
    # TypeScript build checks for the transcriber + VP stacks (tsc/eslint).
    - make lint-typescript
    # Virtual Participant backend unit tests (launch modes, MicroVM hooks).
    - make test-vp
    # VP CloudFormation template invariants (state machine renders for each
    # launch type; ECS paths unchanged by the MICROVM addition).
    - make test-vp-template
    # Static AI stack tests: the AppSync contract (every resolver attaches to a
    # field schema.graphql declares, every UI operation validates against it) and
    # the CloudFormation template's invariants (every Ref/GetAtt resolves,
    # lma-main.yaml's expected outputs are still declared).
    - make test-ai-stack
    # Unit tests for the scheduled integration run's own machinery (credential
    # resolution, the --no-skips hook). Covered here rather than only in the
    # nightly, because it is what keeps a nightly from reporting green after
    # skipping everything.
    - make test-integ-plumbing
    # ASR MicroVM runtime unit tests + ruff (no AWS, no model weights).
    - make test-asr
    # WebSocket transcriber: unit tests (tsc + eslint via `npm run build`, then
    # node --test on dist) followed by the Fastify 5 websocket smoke test, which
    # boots the server and round-trips a frame — runtime coverage the unit tests
    # do not provide.
    - cd lma-websocket-transcriber-stack/source/app && npm ci && npm test && npm run smoke
    # Browser extension. `npm install`, not `npm ci`: the in-stack CodeBuild
    # project builds it that way (see the BuildSpec in
    # lma-browser-extension-stack/template.yaml) and its lockfile has repeatedly
    # drifted such that `npm ci` fails where the real build succeeds.
    # CI=true keeps react-scripts out of watch mode for the tests. CI=false for
    # the build is required rather than an oversight: GitLab sets CI=true, which
    # makes react-scripts treat lint warnings as errors, and the extension
    # carries pre-existing warnings in six files — so that build would fail
    # here while the CodeBuild one succeeds. Clearing those warnings would let
    # this be tightened.
    - |
      cd "$CI_PROJECT_DIR/lma-browser-extension-stack"
      npm install --no-audit --no-fund
      CI=true npm test
      CI=false npm run build

# ── security_review: SRT ────────────────────────────────────────────────────
# Runs on MRs targeting `develop` only. Review decisions are read from the
# committed .srt/suppressions.json: `make srt-scan` depends on `srt-seed`, which
# restores .srt/issues.json (the working file SRT reads and rewrites, generated
# output and therefore not committed) from those decisions before the scan.
srt_security_review:
  stage: security_review
  timeout: 30m
  needs: []
  tags:
    - size:large  # SRT needs ~16 GB RAM for the full scan toolchain

  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: on_success
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install -y curl make git
    - pip install --upgrade pip pexpect

  script:
    - make srt-setup
    - make srt-scan

  after_script:
    - |
      if [ -d ".srt" ]; then
        [ -f ".srt/issues.json" ]          && cp .srt/issues.json          srt-issues.json
        [ -f ".srt/dashboard.html" ]       && cp .srt/dashboard.html       srt-dashboard.html
        [ -f ".srt/bandit-summary.json" ]  && cp .srt/bandit-summary.json  srt-bandit-summary.json
        [ -f ".srt/semgrep-summary.json" ] && cp .srt/semgrep-summary.json srt-semgrep-summary.json
        [ -f ".srt/syft-summary.json" ]    && cp .srt/syft-summary.json    srt-syft-summary.json
        [ -f ".srt/project-summary.md" ]   && cp .srt/project-summary.md   srt-project-summary.md
      fi

  artifacts:
    when: always
    paths:
      - srt-issues.json
      - srt-dashboard.html
      - srt-bandit-summary.json
      - srt-semgrep-summary.json
      - srt-syft-summary.json
      - srt-project-summary.md
    expire_in: 1 week

# ── scheduled_integration: build the branch, deploy it, then test it ───────
# Runs ONLY from a pipeline schedule. The suite in integ-tests/ is the only
# thing in this repository that exercises the WebSocket transcriber, Amazon
# Transcribe, Kinesis, the Call Event Processor and AppSync together, and until
# these jobs existed it ran only when someone remembered to.
#
# THREE JOBS, in order: publish → deploy → tests. The split is not cosmetic.
#
#   * It is what makes the nightly test THIS COMMIT. The stack is rebuilt from
#     the scheduled ref and deployed before the suite runs, so a green nightly
#     means the branch works rather than that some older build still does.
#
#   * ⚠️ It is also the only way the run fits in its AWS credentials. The
#     runner's credential vendor is a one-shot `pre_clone` step: it assumes the
#     role once, writes the default profile, and never refreshes. Those
#     credentials are a role-chained session, so STS caps them at ONE HOUR
#     whatever the role's MaxSessionDuration says. A single job that published,
#     deployed and tested would run past that and die on an expired token
#     somewhere in the middle, with the failure landing wherever the next AWS
#     call happened to be. Each job here re-enters the pipeline and so gets its
#     own fresh hour, and each carries a timeout BELOW that hour, so the
#     credentials cannot expire mid-job: a job that overruns is killed by its
#     timeout and says so, which is a diagnosis rather than a mystery.
#     Anything added here must keep that property. Do not merge these jobs.
#
# ONE-TIME SETUP IS REQUIRED — these jobs do nothing until it is done, and fail
# rather than passing quietly if it is half-done. See
# docs/scheduled-integration-tests.md for the full procedure:
#
#   1. A pipeline schedule (Build > Pipeline schedules), on `develop`, with
#      `NIGHTLY_INTEG` = `true`.
#   2. CI/CD variables on the schedule or the project:
#        AWS_CREDS_TARGET_ROLE     the IAM role the runner's credential vendor
#                                  assumes (masked; it contains the account id,
#                                  which must not be committed to this public
#                                  repository)
#        LMA_TEST_USER_SECRET_ID   Secrets Manager secret holding the Cognito
#                                  test user, as {"username":…, "password":…}
#        LMA_INTEG_STACK           optional; defaults to lma-integtest1
#        AWS_DEFAULT_REGION        optional; defaults to us-west-2, where
#                                  lma-integtest1 lives
#        SLACK_WEBHOOK_URL         optional; a Slack Workflow Builder webhook.
#                                  MASKED and NOT PROTECTED — see the
#                                  after_script below. Absent, the post is
#                                  skipped with one log line.
#   3. An IAM role in the stack's account trusting this GitLab instance's
#      credential vendor, scoped by the group and project session tags. It
#      deploys the stack, so it needs permissions to do that — see the doc.
#
# Failures surface four ways, so a red nightly cannot go unnoticed: exactly one
# Slack post per run, from whichever job failed (or from the tests on a good
# run); GitLab's own "pipeline failed" notification for scheduled pipelines,
# which goes to the schedule's owner by email; the JUnit report, attached to
# the pipeline so the failing test is visible without opening a log; and
# `--no-skips` (see integ-tests/conftest.py), which turns a skipped test into a
# failure, so a lapsed secret or a dropped dependency reports red rather than
# green having run nothing.

# Shared by all three jobs. Anchored rather than repeated so the three cannot
# drift apart — in particular the rule, where a mismatch would leave a job out
# of the scheduled pipeline and silently skip a stage.
.nightly_rules: &nightly_rules
  - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_INTEG == "true"
  - when: never

.nightly_variables: &nightly_variables
  LMA_INTEG_STACK: lma-integtest1
  # lma-integtest1 is in us-west-2, not the us-east-1 that a bare profile
  # resolves to. A wrong region here reports the stack as non-existent.
  AWS_DEFAULT_REGION: us-west-2
  # The publish job uploads here and the deploy job reads back from it. The
  # CLI appends the region to the basename, and the main template always lands
  # at <prefix>/lma-main.yaml, so both jobs can name the same URL from these
  # two values without passing an artifact between them.
  LMA_ARTIFACT_BUCKET_BASENAME: lma-integtest-nightly-artifacts
  LMA_ARTIFACT_PREFIX: nightly

# One Slack post per run. The publish and deploy jobs post only when they fail,
# because on a good night the tests job has the result worth reading; the tests
# job posts either way. So a run produces exactly one message, from the stage
# that decided the outcome.
#
# ⚠️ WHY THIS IS HERE AND NOT GitLab's OWN SLACK INTEGRATION. That integration
# fires on `pipeline_events` for a branch and, like the pipeline BADGE, cannot
# filter by pipeline SOURCE — so it would post every push pipeline to `develop`
# as well, which is most of them and is not what anybody subscribed for. These
# jobs are the only place that knows the run was the scheduled one, and the
# tests job is the only place with the JUnit report to summarise.
#
# SLACK_WEBHOOK_URL is a MASKED CI variable, never a committed value: this
# repository is public and a webhook URL is a bearer credential that lets
# anyone post to the channel. Absent, this prints one line and exits 0.
#
# ⚠️ The variable must be MASKED and **NOT PROTECTED**. A protected variable is
# absent from pipelines on unprotected branches, so unless `develop` is a
# protected branch here the block would log "not set" forever and look like it
# was working.
#
# ⚠️ PAYLOAD SHAPE is a contract with the Slack workflow, and getting it wrong
# posts a message with a blank variable rather than failing. The four keys and
# the reason the target is a Workflow Builder webhook rather than an incoming
# one are documented in integ-tests/junit_summary.py — read that before
# changing either side.
.nightly_slack_post: &nightly_slack_post
  # Built unconditionally, even when no webhook is configured and even when
  # this job is not the one that will post: it costs nothing, it prints the
  # stage's verdict to the end of the log (readable form on stderr, JSON on
  # stdout), and it means the declared artifact always exists rather than
  # emitting a "no matching files" warning.
  #
  # python3 from the image, not .venv/bin/python: junit_summary is stdlib-only,
  # and this has to work even when the failure being reported is
  # `make setup-python` itself. The webhook URL is never passed to it.
  - >
    python3 integ-tests/junit_summary.py
    --report integ-tests-report.xml
    --status "$CI_JOB_STATUS"
    --stage "$NIGHTLY_STAGE"
    --job-url "$CI_JOB_URL"
    --commit "$CI_COMMIT_SHA"
    --stack "$LMA_INTEG_STACK"
    --region "$AWS_DEFAULT_REGION" > slack-payload.json
  - |
    if [ "$NIGHTLY_POST_WHEN" = "on_failure" ] && [ "$CI_JOB_STATUS" = "success" ]; then
      echo "ℹ️ $NIGHTLY_STAGE succeeded — the tests job posts the night's result"
    elif [ -z "$SLACK_WEBHOOK_URL" ]; then
      echo "ℹ️ SLACK_WEBHOOK_URL not set — skipping the Slack post"
    elif [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
      echo "ℹ️ Not the scheduled run (source=$CI_PIPELINE_SOURCE) — skipping the Slack post"
    else
      # --fail so a 4xx from Slack is visible rather than silently discarded,
      # but the `else` branch keeps a notification problem from changing the
      # job's verdict: the stage's result is what this job reports.
      if curl -sS --fail -X POST -H 'Content-type: application/json' \
           --data @slack-payload.json "$SLACK_WEBHOOK_URL" >/dev/null; then
        echo "💬 Nightly result posted to Slack"
      else
        echo "⚠️ Slack post failed (HTTP error, bad webhook, or curl missing)"
        echo "   The $NIGHTLY_STAGE result above is unaffected."
      fi
    fi

# ── 1/3: build this commit and publish its artifacts ───────────────────────
nightly_publish:
  stage: scheduled_integration
  needs: []
  # Node for the UI and extension bundles, python3.12 because that is the
  # Lambda runtime and this build has no container to pin it (see below).
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  tags:
    - size:large
  # Below the one-hour credential ceiling, deliberately. See the note above.
  timeout: 55m
  interruptible: false
  # Serialised with the other two against the same stack, so two nights — or a
  # night and a manual run — cannot publish and deploy over each other.
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: publish
    NIGHTLY_POST_WHEN: on_failure
    # ⚠️ Build the Lambda bundles with the runner's own interpreter rather than
    # in SAM's build container: these runners have no Docker daemon and cannot
    # start one (no `services:` support, no socket), so `--use-container` fails
    # before it builds anything. That is sound HERE and nowhere else — the
    # runner is linux/amd64 on python3.12, which is what Lambda is, so the
    # wheels it resolves are the wheels Lambda wants. See the flag's comment in
    # lma-ai-stack/Makefile.
    SAM_BUILD_IN_CONTAINER: "false"

  before_script:
    - apt-get update -y
    - apt-get install -y make git curl zip unzip
    # Node from .nvmrc, the same pin code_checks and `make setup-node` use.
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
    - curl -fsSL https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node --version && npm --version
    - pip install --quiet aws-sam-cli
    - sam --version
    - make setup-python
    - make setup-cli
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"

  script:
    # --force: skip the SHA-based change detection. A nightly that reused a
    # previous build when it thought nothing had changed would be back to
    # testing an older artifact, which is the thing this job exists to stop.
    - >
      .venv/bin/lma publish
      --source-dir .
      --bucket-basename "$LMA_ARTIFACT_BUCKET_BASENAME"
      --prefix "$LMA_ARTIFACT_PREFIX"
      --region "$AWS_DEFAULT_REGION"
      --force

  after_script: *nightly_slack_post

  artifacts:
    when: always
    paths:
      - slack-payload.json
    expire_in: 1 month

# ── 2/3: deploy what was just published ────────────────────────────────────
nightly_deploy:
  stage: scheduled_integration
  needs:
    - nightly_publish
  image: public.ecr.aws/docker/library/python:3.13-bookworm
  # Below the one-hour credential ceiling, deliberately. See the note above.
  timeout: 55m
  interruptible: false
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: deploy
    NIGHTLY_POST_WHEN: on_failure

  before_script:
    - apt-get update -y
    - apt-get install -y make git curl
    - make setup-python
    - make setup-cli
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"

  script:
    # The URL the publish job uploaded to. Named from the same two variables
    # rather than passed as an artifact or scraped from the other job's log:
    # the CLI builds it the same way (lib/lma_sdk/lma_sdk/_core/publish.py),
    # and a value derived twice from one source cannot go stale.
    - export TEMPLATE_URL="https://s3.${AWS_DEFAULT_REGION}.amazonaws.com/${LMA_ARTIFACT_BUCKET_BASENAME}-${AWS_DEFAULT_REGION}/${LMA_ARTIFACT_PREFIX}/lma-main.yaml"
    - echo "Deploying $TEMPLATE_URL"
    - >
      .venv/bin/lma deploy
      --stack-name "$LMA_INTEG_STACK"
      --region "$AWS_DEFAULT_REGION"
      --template-url "$TEMPLATE_URL"
      --wait

  after_script: *nightly_slack_post

  artifacts:
    when: always
    paths:
      - slack-payload.json
    expire_in: 1 month

# ── 3/3: run the suite against the stack just deployed ─────────────────────
nightly_integ_tests:
  stage: scheduled_integration
  needs:
    - nightly_deploy
  # ~40 min of wall time is expected; the cap leaves room for a slow Transcribe
  # stream without letting a wedged run hold the schedule all day, and stays
  # below the one-hour credential ceiling. See the note above.
  timeout: 50m
  # Never cancelled mid-run: the suite creates a meeting row and a Virtual
  # Participant registry entry and cleans them up in a `finally`, which a
  # cancellation would skip.
  interruptible: false
  # Two runs against one stack would race on those same rows.
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: tests
    NIGHTLY_POST_WHEN: always

  # AWS credentials come from this GitLab instance's credential vendor, which
  # assumes $AWS_CREDS_TARGET_ROLE for the job and writes the result to the
  # default profile in the credential search order. They are short-lived and
  # job-scoped; no long-lived access key is stored anywhere.
  #
  # ⚠️ Do NOT set AWS_SHARED_CREDENTIALS_FILE or AWS_PROFILE in this job. The
  # vendor writes the default profile at the default path, so either one points
  # the SDK somewhere the credentials are not.
  #
  # ⚠️ Nor is AWS_CREDS_TARGET_ROLE set here: it holds the account id, which
  # must not appear in this public repository. It is a masked project variable,
  # and the job checks for it below rather than failing inside a test.
  #
  # The OIDC route that an `id_tokens` block would take is not available on this
  # instance: its OpenID discovery and JWKS endpoints sit behind the same
  # authenticating edge as the rest of it, so IAM cannot reach them to validate
  # a job token. The credential vendor is the supported path here — see
  # https://docs.hub.amazon.dev/docs/gitlab/user-guide/howto/vending-aws-credentials/
  before_script:
    - apt-get update -y
    # curl is used by the after_script's Slack post, and is installed here (not
    # there) so an after_script never has to install anything.
    - apt-get install -y make git curl
    - make setup-python
    - make setup-cli-dev
    # pycognito + websockets, needed by the audio streaming test. If these are
    # missing that test skips, which --no-skips then turns into a failure.
    - .venv/bin/pip install -r integ-tests/requirements.txt
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    # Fail here, with the identity in the log, rather than inside a test. This
    # is also what proves the vendor ran: an empty or unexpected ARN means the
    # trust policy did not match this group and project, not that a test broke.
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"

  script:
    - make integ-tests-nightly STACK="$LMA_INTEG_STACK"

  after_script: *nightly_slack_post

  artifacts:
    when: always
    reports:
      junit: integ-tests-report.xml
    paths:
      - integ-tests-report.xml
      # The posted message, so "what did Slack get told" is answerable from the
      # pipeline when the channel post looks wrong. Contains no credentials.
      - slack-payload.json
    expire_in: 1 month
