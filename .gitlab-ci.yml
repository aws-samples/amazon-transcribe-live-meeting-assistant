#
# LMA GitLab CI/CD pipeline.
#
# Three stages:
#   fast_checks            — no-AWS lint + unit tests + build checks. Runs on
#                            every push and MR so developers get feedback
#                            without a deploy.
#   security_review        — SRT (Sample Security Review Tool). See
#                            docs/security-scanning.md.
#   scheduled_integration  — the end-to-end suite against a live stack. Runs
#                            ONLY from a pipeline schedule, never on a push or
#                            an MR, because it needs AWS credentials and a
#                            deployed stack. One-time setup is required; see
#                            docs/scheduled-integration-tests.md.
#
# What is intentionally NOT here: docker-build-check needs a Docker daemon and
# is run locally via `make docker-build-check`. See the 'integ-tests' skill and
# docs/dependency-upgrade-validation-runbook.md.

image: public.ecr.aws/docker/library/python:3.13-bookworm

default:
  timeout: 1h

stages:
  - fast_checks
  - security_review
  - scheduled_integration

# Avoid duplicate (branch + MR) pipelines: prefer the MR pipeline when an MR is
# open for the branch.
workflow:
  rules:
    # Listed first and unconditionally: a scheduled pipeline runs on a branch
    # ref, so without this the `$CI_OPEN_MERGE_REQUESTS` rule below could
    # cancel the nightly whenever an MR happens to be open for that branch.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── fast_checks: lint + unit tests + build checks (no AWS) ──────────────────
code_checks:
  stage: fast_checks
  interruptible: true
  # Larger runner: the Vite production build + tsc/eslint are CPU-bound.
  tags:
    - size:large
  rules:
    # Excluded from schedules so a nightly pipeline's red/green means one thing:
    # whether the integration suite passed. The fast checks already run on every
    # push and MR.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  # Cache UI deps across runs, keyed on the lockfile.
  cache:
    key:
      files:
        - lma-ai-stack/source/ui/package-lock.json
    paths:
      - lma-ai-stack/source/ui/node_modules/
  before_script:
    - apt-get update -y
    - apt-get install -y make curl git
    # Node 22 LTS (>=22.22.2 required by jsdom 30; vite 8 / rolldown native
    # bindings are optional deps that npm silently skips on an older engine).
    # The exact version comes from .nvmrc, shared with `make setup-node` and
    # the GitHub Actions workflow.
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
    - curl -fsSL https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node --version && npm --version
    # Python venv + lint tools + SDK/CLI with test extras (used by all pytest suites).
    - make setup-python
    - make setup-cli-dev
  script:
    # CloudFormation lint (no AWS).
    - make lint-cfn
    # ruff check + format check over the Lambda functions, the Lambda layers and
    # scripts/pr_review (read-only; `make lint-python` is the fixing form).
    - make lint-python-check
    # Python unit suites (all mock boto3 / use dummy env — no AWS).
    - make test-sdk
    - make test-cli
    - make test-lambdas
    # UI: lint + tests (force = ignore the local checksum cache).
    - make lint-ui-force
    - make test-ui-force
    # TypeScript build checks for the transcriber + VP stacks (tsc/eslint).
    - make lint-typescript
    # Virtual Participant backend unit tests (launch modes, MicroVM hooks).
    - make test-vp
    # VP CloudFormation template invariants (state machine renders for each
    # launch type; ECS paths unchanged by the MICROVM addition).
    - make test-vp-template
    # Static AI stack tests: the AppSync contract (every resolver attaches to a
    # field schema.graphql declares, every UI operation validates against it) and
    # the CloudFormation template's invariants (every Ref/GetAtt resolves,
    # lma-main.yaml's expected outputs are still declared).
    - make test-ai-stack
    # Unit tests for the scheduled integration run's own machinery (credential
    # resolution, the --no-skips hook). Covered here rather than only in the
    # nightly, because it is what keeps a nightly from reporting green after
    # skipping everything.
    - make test-integ-plumbing
    # ASR MicroVM runtime unit tests + ruff (no AWS, no model weights).
    - make test-asr
    # The advisory AI review's own machinery: the disclosure guard that decides
    # whether a model-written comment reaches the public repository, and the four
    # properties of the review job most likely to be deleted by accident.
    - make test-pr-review
    # WebSocket transcriber: unit tests (tsc + eslint via `npm run build`, then
    # node --test on dist) followed by the Fastify 5 websocket smoke test, which
    # boots the server and round-trips a frame — runtime coverage the unit tests
    # do not provide.
    - cd lma-websocket-transcriber-stack/source/app && npm ci && npm test && npm run smoke
    # Browser extension. `npm install`, not `npm ci`: the in-stack CodeBuild
    # project builds it that way (see the BuildSpec in
    # lma-browser-extension-stack/template.yaml) and its lockfile has repeatedly
    # drifted such that `npm ci` fails where the real build succeeds.
    # CI=true keeps react-scripts out of watch mode for the tests. CI=false for
    # the build is required rather than an oversight: GitLab sets CI=true, which
    # makes react-scripts treat lint warnings as errors, and the extension
    # carries pre-existing warnings in six files — so that build would fail
    # here while the CodeBuild one succeeds. Clearing those warnings would let
    # this be tightened.
    - |
      cd "$CI_PROJECT_DIR/lma-browser-extension-stack"
      npm install --no-audit --no-fund
      CI=true npm test
      CI=false npm run build

# ── security_review: SRT ────────────────────────────────────────────────────
# Runs on MRs targeting `develop` only. Review decisions are read from the
# committed .srt/suppressions.json: `make srt-scan` depends on `srt-seed`, which
# restores .srt/issues.json (the working file SRT reads and rewrites, generated
# output and therefore not committed) from those decisions before the scan.
srt_security_review:
  stage: security_review
  timeout: 30m
  needs: []
  tags:
    - size:large  # SRT needs ~16 GB RAM for the full scan toolchain

  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: on_success
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install -y curl make git
    - pip install --upgrade pip pexpect

  script:
    - make srt-setup
    - make srt-scan

  after_script:
    - |
      if [ -d ".srt" ]; then
        [ -f ".srt/issues.json" ]          && cp .srt/issues.json          srt-issues.json
        [ -f ".srt/dashboard.html" ]       && cp .srt/dashboard.html       srt-dashboard.html
        [ -f ".srt/bandit-summary.json" ]  && cp .srt/bandit-summary.json  srt-bandit-summary.json
        [ -f ".srt/semgrep-summary.json" ] && cp .srt/semgrep-summary.json srt-semgrep-summary.json
        [ -f ".srt/syft-summary.json" ]    && cp .srt/syft-summary.json    srt-syft-summary.json
        [ -f ".srt/project-summary.md" ]   && cp .srt/project-summary.md   srt-project-summary.md
      fi

  artifacts:
    when: always
    paths:
      - srt-issues.json
      - srt-dashboard.html
      - srt-bandit-summary.json
      - srt-semgrep-summary.json
      - srt-syft-summary.json
      - srt-project-summary.md
    expire_in: 1 week

# ── fast_checks: advisory AI review ────────────────────────────────────────
# The GitLab counterpart of the `ai_pr_review` job in
# .github/workflows/ai-pr-review.yml. Runs Claude Code (via Amazon Bedrock) over
# the MR diff with .claude/skills/pr-review.md plus .claude/skills/pr-review-ci.md
# and posts the result as an MR note. Both jobs run the same harness,
# scripts/pr_review/ai_pr_review.py.
#
# ⚠️ NOT A GATE — `allow_failure: true`. A model's opinion must not decide whether
# code merges; `code_checks` and `srt_security_review` do that. Exit 1 here means
# the tooling failed, never that a review found something.
#
# ⚠️ INERT UNTIL TWO CI VARIABLES EXIST, and it says so loudly rather than failing:
#   GITLAB_REVIEW_TOKEN  project access token, `api` scope, MASKED. The note is
#                        posted as this token's identity. CI_JOB_TOKEN cannot
#                        create notes, so there is no fallback — without this the
#                        job prints SKIPPED and exits 0.
#   AWS credentials      bedrock:InvokeModel on the model below, and NOTHING else.
#                        Give this job its own Bedrock-only role; do not reuse the
#                        nightly deploy credentials, which carry S3, CloudFormation
#                        and CodeBuild grants this job has no use for.
#
# ⚠️ THIS REPOSITORY IS PUBLIC (the GitLab remote is a mirror of the public GitHub
# repository, and an MR note here can be quoted into a PR there). The published
# text is constrained by .claude/skills/pr-review-ci.md §2 and enforced by
# `scan_for_disclosure` in the harness, which withholds a whole review rather than
# publish a description of a weakness. See the header of
# .github/workflows/ai-pr-review.yml for the full reasoning, including why the
# withheld text is written to no artifact and no log.
#
# ⚠️ COST, and the three things that bound it. A review is a real Bedrock spend.
# Measured on this repository: $0.83 for a 24-file, +1704/-131 pull request on
# us.anthropic.claude-opus-5-5, so roughly $0.30-1.50 per review for LMA's usual
# sizes. Reviews are idempotent per HEAD SHA, so a NEW push means a NEW paid
# review:
#   - `interruptible: true` — a push while a review is running cancels it, so a
#     burst of pushes costs roughly one review rather than one per push. This is
#     the main protection and it is easy to delete by accident.
#   - idempotent per HEAD SHA — a re-run of the same pipeline posts nothing.
#   - Draft MRs are excluded, so the WIP phase (where pushes are frequent) is free.
# What is NOT bounded: pushes spaced further apart than a review takes. An MR
# revised over a week pays per revision. If that becomes the dominant cost, the
# cheapest fix is a cooldown in ai_pr_review.py (skip if the last review note is
# younger than N hours) rather than going back to a manual button.
#
# NO SCHEDULED SWEEP HERE, deliberately. The harness supports one (`--all-open`)
# and the script block below still dispatches to it, but no
# `$CI_PIPELINE_SOURCE == "schedule"` rule exists, so in this pipeline it is
# unreachable. The sweep exists on GitHub for fork pull requests, which have no
# GitLab equivalent — this mirror takes no outside contributions. To turn it on
# later, add `- if: $CI_PIPELINE_SOURCE == "schedule"` above the terminal `never`
# and create the schedule; read the cost note above first.
ai_mr_review:
  stage: fast_checks
  interruptible: true
  # Sized so the SWEEP's own bound is the limit that fires, not this one: --max-mrs
  # 2 at --timeout 1200 is a 40-minute worst case plus ~3 minutes of install. See
  # the arithmetic at the script block. Matches the GitHub job's timeout-minutes.
  timeout: 70m
  allow_failure: true

  # Reviewing is read-only, but it reads the whole checkout at the MR head and a
  # large diff wants memory for the model client plus a git worktree.
  tags:
    - size:large

  rules:
    # Non-Draft MRs targeting develop, automatically. Ordered before the catch-all
    # so a Draft falls through to `never` — a review posted on somebody's WIP is
    # noise they did not ask for, and the Draft phase is where pushes are frequent,
    # so excluding it is a cost control as well as a courtesy.
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      when: on_success
    - when: never

  # Nothing to wait for: it reads the MR, not another job's artifacts. In
  # particular it does NOT wait for code_checks — a lint failure is exactly when a
  # review is most useful, and gating the review on the gates would mean the MRs
  # most in need of one never get it.
  needs: []

  variables:
    # Pinned for the same reason the GitHub job pins its action SHAs: an unpinned
    # tool on an automatic job changes behaviour with no commit here. The test
    # suite compares this against CLAUDE_CODE_VERSION in the GitHub workflow.
    CLAUDE_CODE_VERSION: "2.1.308"
    # Bedrock inference-profile id. Must be one this account has model access to;
    # keep in step with the GitHub workflow and with DEFAULT_MODEL in the harness.
    ANTHROPIC_MODEL: "us.anthropic.claude-opus-5-5"
    AWS_REGION: "us-east-1"
    # Full history: the review diffs the MR head against its merge base with
    # develop, which a shallow clone does not have.
    GIT_DEPTH: 0

  before_script:
    - apt-get update -y
    - apt-get install -y curl git
    # Node from .nvmrc, the same source of truth code_checks and the GitHub
    # workflow use. @anthropic-ai/claude-code needs >=22, and an older major fails
    # in the quietest way available: npm's EBADENGINE is only a warning, both
    # `npm install` and `claude --version` succeed on 20, and the CLI then exits 1
    # with an empty stderr on the first real session. So the RUNTIME is asserted
    # below rather than the intent — a check on the download URL stays green when
    # the download is what failed.
    #
    # ⚠️ `$NODE_PIN` comes from the MR's OWN `.nvmrc` and is interpolated into a URL
    # in a job that holds credentials, so it is QUOTED here. The `code_checks` job
    # above (line ~76) and `nightly_publish` spell the same two lines unquoted;
    # `nightly_deploy` already uses the quoted form. Quoting does not validate the
    # value — a hostile `.nvmrc` still produces a wrong URL — but it stops the
    # expansion being word-split and re-globbed before `curl` ever sees it, and
    # `curl -f` fails closed on anything that is not a real release tarball.
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
    - >-
      curl -fsSL "https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz"
      | tar -xJ -C /usr/local --strip-components=1
    - node --version
    - >-
      node -e 'const m=+process.versions.node.split(".")[0];
      if (m < 22) { console.error("FATAL: node "+process.versions.node+
      " but @anthropic-ai/claude-code needs >=22. The .nvmrc install did not take.");
      process.exit(1); }'
    - npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude --version

  script:
    # ⚠️ PIN THE HARNESS TO THE TARGET BRANCH BEFORE RUNNING IT.
    #
    # This checkout is the MR head, so without this the reviewer is the MR's own
    # copy of itself: the permission mode, both tool lists, the secret-stripping
    # list, THE DISCLOSURE GUARD and the prompt are all author-controlled, and the
    # script's internal pinning of instruction files runs too late to matter because
    # the code doing the pinning is also the MR's. The blast radius is this job's
    # environment, which holds an AWS credential and GITLAB_REVIEW_TOKEN.
    #
    # So the harness comes from the target branch and only the DIFF comes from the
    # MR. The tradeoff is explicit: an MR that improves the reviewer is not
    # exercised by its own pipeline — it takes effect once merged. That is the same
    # trade the instruction-file pinning makes, for the same reason.
    #
    # ⚠️ ON FAILURE THIS SKIPS THE REVIEW AND EXITS 0, in step with the GitHub
    # workflow. It used to warn and then RUN THE MR'S OWN COPY, which is the one
    # thing this step exists to prevent — the warning made it visible in a log but
    # did not stop it. The two platforms now behave identically: no pinned harness
    # means no review.
    #
    # `exit 1` stays for the two paths that always exist on the target branch. A
    # failure to resolve those means a rename nobody updated here, which is a real
    # defect; the other two legitimately do not exist until this change merges.
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
      git fetch -q origin "$TARGET"
      ALWAYS=".claude/skills/pr-review.md CLAUDE.md"
      HARNESS="scripts/pr_review/ai_pr_review.py .claude/skills/pr-review-ci.md"
      HARNESS="$HARNESS $ALWAYS"

      MISSING=""
      for path in $HARNESS; do
        if ! git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
          MISSING="$MISSING $path"
        fi
      done

      if [ -n "$MISSING" ]; then
        echo "⚠️  origin/$TARGET does not carry:$MISSING"
        echo "    NOT running the MR's own copy of the reviewer."
        for path in $MISSING; do
          case " $ALWAYS " in
            *" $path "*)
              echo "❌ $path always exists on $TARGET, so it has been renamed or"
              echo "   removed without this step's path list being updated."
              exit 1
              ;;
          esac
        done
        echo "    Everything missing is a file this MR itself adds, so there is"
        echo "    nothing to fix: no review will run and this job stays green."
        exit 0
      fi

      # Unquoted on purpose: $HARNESS is a LIST and must word-split into four
      # pathspecs. Quoting it passes one argument containing spaces, matching nothing.
      git checkout FETCH_HEAD -- $HARNESS
      echo "Harness pinned to origin/$TARGET:$HARNESS"
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        python3 scripts/pr_review/ai_pr_review.py \
          --forge gitlab --remote origin --mr "$CI_MERGE_REQUEST_IID"
      else
        # --max-mrs 2, and the arithmetic has to close: at --timeout 1200 (20
        # minutes) a batch of two is a 40-minute worst case, plus ~3 minutes of Node
        # and CLI install, against this job's 70m timeout. So the SWEEP's bound is
        # the one that fires and the job timeout is never reached mid-review, which
        # is the whole point of having a bound. It was 3 against a 45m timeout, which
        # is 63 > 45 — the job limit would have fired first and cut a review off
        # halfway. (Unreachable today: no schedule rule exists, so CI always takes
        # the --mr branch above.)
        python3 scripts/pr_review/ai_pr_review.py \
          --forge gitlab --remote origin --all-open --max-mrs 2
      fi

  # Carries exactly the text that was published, and nothing more — see the
  # disclosure note above and in the GitHub workflow header.
  artifacts:
    when: always
    paths:
      - ai-reviews/
    expire_in: 1 week

# ── scheduled_integration: build the branch, deploy it, then test it ───────
# Runs ONLY from a pipeline schedule. The suite in integ-tests/ is the only
# thing in this repository that exercises the WebSocket transcriber, Amazon
# Transcribe, Kinesis, the Call Event Processor and AppSync together, and until
# these jobs existed it ran only when someone remembered to.
#
# THREE JOBS, in order: publish → deploy → tests. The split is not cosmetic.
#
#   * It is what makes the nightly test THIS COMMIT. The stack is rebuilt from
#     the scheduled ref and deployed before the suite runs, so a green nightly
#     means the branch works rather than that some older build still does.
#
#   * ⚠️ It is also the only way the run fits in its AWS credentials. The
#     runner's credential vendor is a one-shot `pre_clone` step: it assumes the
#     role once, writes the default profile, and never refreshes. Those
#     credentials are a role-chained session, so STS caps them at ONE HOUR
#     whatever the role's MaxSessionDuration says. A single job that published,
#     deployed and tested would run past that and die on an expired token
#     somewhere in the middle, with the failure landing wherever the next AWS
#     call happened to be. Each job here re-enters the pipeline and so gets its
#     own fresh hour, and each carries a timeout BELOW that hour, so the
#     credentials cannot expire mid-job: a job that overruns is killed by its
#     timeout and says so, which is a diagnosis rather than a mystery.
#     Anything added here must keep that property. Do not merge these jobs.
#
# ONE-TIME SETUP IS REQUIRED — these jobs do nothing until it is done, and fail
# rather than passing quietly if it is half-done. See
# docs/scheduled-integration-tests.md for the full procedure:
#
#   1. A pipeline schedule (Build > Pipeline schedules), on `develop`, with
#      `NIGHTLY_INTEG` = `true`.
#   2. CI/CD variables on the schedule or the project:
#        AWS_CREDS_TARGET_ROLE     the IAM role the runner's credential vendor
#                                  assumes (masked; it contains the account id,
#                                  which must not be committed to this public
#                                  repository)
#        LMA_TEST_USER_SECRET_ID   Secrets Manager secret holding the Cognito
#                                  test user, as {"username":…, "password":…}
#        LMA_INTEG_STACK           optional; defaults to lma-integtest1
#        AWS_DEFAULT_REGION        optional; defaults to us-west-2, where
#                                  lma-integtest1 lives
#        SLACK_WEBHOOK_URL         optional; a Slack Workflow Builder webhook.
#                                  MASKED and NOT PROTECTED — see the
#                                  after_script below. Absent, the post is
#                                  skipped with one log line.
#        LMA_FAILURE_AGENT         optional; `1` enables the triage agent that
#                                  diagnoses a failed run. Off by default.
#        LMA_FAILURE_AGENT_ROLE_ARN  required IF the agent is enabled: the
#                                  READ-ONLY role it runs as (masked). Without
#                                  it the agent refuses to run rather than
#                                  inherit this job's administrative
#                                  credentials. See integ-tests/failure_agent.py.
#   3. An IAM role in the stack's account trusting this GitLab instance's
#      credential vendor, scoped by the group and project session tags. It
#      deploys the stack, so it needs permissions to do that — see the doc.
#
# Failures surface four ways, so a red nightly cannot go unnoticed: exactly one
# Slack post per run, from whichever job failed (or from the tests on a good
# run); GitLab's own "pipeline failed" notification for scheduled pipelines,
# which goes to the schedule's owner by email; the JUnit report, attached to
# the pipeline so the failing test is visible without opening a log; and
# `--no-skips` (see integ-tests/conftest.py), which turns a skipped test into a
# failure, so a lapsed secret or a dropped dependency reports red rather than
# green having run nothing.

# Shared by all three jobs. Anchored rather than repeated so the three cannot
# drift apart — in particular the rule, where a mismatch would leave a job out
# of the scheduled pipeline and silently skip a stage.
.nightly_rules: &nightly_rules
  - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_INTEG == "true"
  - when: never

.nightly_variables: &nightly_variables
  LMA_INTEG_STACK: lma-integtest1
  # lma-integtest1 is in us-west-2, not the us-east-1 that a bare profile
  # resolves to. A wrong region here reports the stack as non-existent.
  AWS_DEFAULT_REGION: us-west-2
  # The publish job uploads here and the deploy job reads back from it. The
  # CLI appends the region to the basename, and the main template always lands
  # at <prefix>/lma-main.yaml, so both jobs can name the same URL from these
  # two values without passing an artifact between them.
  LMA_ARTIFACT_BUCKET_BASENAME: lma-integtest-nightly-artifacts
  LMA_ARTIFACT_PREFIX: nightly
  # Derived once, here, from the three values above. The deploy job deploys it
  # and the notification names it, so "which artifacts was this?" has an answer
  # in the channel rather than only in a job log.
  LMA_TEMPLATE_URL: "https://s3.${AWS_DEFAULT_REGION}.amazonaws.com/${LMA_ARTIFACT_BUCKET_BASENAME}-${AWS_DEFAULT_REGION}/${LMA_ARTIFACT_PREFIX}/lma-main.yaml"

# One Slack post per run. The publish and deploy jobs post only when they fail,
# because on a good night the tests job has the result worth reading; the tests
# job posts either way. So a run produces exactly one message, from the stage
# that decided the outcome.
#
# ⚠️ WHY THIS IS HERE AND NOT GitLab's OWN SLACK INTEGRATION. That integration
# fires on `pipeline_events` for a branch and, like the pipeline BADGE, cannot
# filter by pipeline SOURCE — so it would post every push pipeline to `develop`
# as well, which is most of them and is not what anybody subscribed for. These
# jobs are the only place that knows the run was the scheduled one, and the
# tests job is the only place with the JUnit report to summarise.
#
# SLACK_WEBHOOK_URL is a MASKED CI variable, never a committed value: this
# repository is public and a webhook URL is a bearer credential that lets
# anyone post to the channel. Absent, this prints one line and exits 0.
#
# ⚠️ The variable must be MASKED and **NOT PROTECTED**. A protected variable is
# absent from pipelines on unprotected branches, so unless `develop` is a
# protected branch here the block would log "not set" forever and look like it
# was working.
#
# ⚠️ PAYLOAD SHAPE is a contract with the Slack workflow, and getting it wrong
# posts a message with a blank variable rather than failing. The four keys and
# the reason the target is a Workflow Builder webhook rather than an incoming
# one are documented in integ-tests/junit_summary.py — read that before
# changing either side.
.nightly_slack_post: &nightly_slack_post
  # Why a publish or deploy failed, for the post below to quote. Each of those
  # jobs captures its main step's output to $NIGHTLY_STAGE-output.log, and the
  # deploy's cause is read from the stack's own events as well, through every
  # nested stack down to the build log of a failed in-stack CodeBuild run. The
  # venv's python when the job got as far as creating it (it has boto3), the
  # image's otherwise; either way a failure here only means less detail. The
  # file is created either way so the declared artifact always exists, and
  # empty is what junit_summary reads as "no cause to quote".
  - |
    : > failure-cause.txt
    if [ "$CI_JOB_STATUS" != "success" ] && [ "$NIGHTLY_STAGE" != "tests" ]; then
      CAUSE_PY=python3; [ -x .venv/bin/python ] && CAUSE_PY=.venv/bin/python
      "$CAUSE_PY" integ-tests/failure_cause.py --stage "$NIGHTLY_STAGE" \
        --log "$NIGHTLY_STAGE-output.log" \
        --stack "$LMA_INTEG_STACK" --region "$AWS_DEFAULT_REGION" \
        --since "$CI_JOB_STARTED_AT" > failure-cause.txt \
        || echo "⚠️ Could not determine the failure cause; posting without it"
    fi
  # Built unconditionally, even when no webhook is configured and even when
  # this job is not the one that will post: it costs nothing, it prints the
  # stage's verdict to the end of the log (readable form on stderr, JSON on
  # stdout), and it means the declared artifact always exists rather than
  # emitting a "no matching files" warning.
  #
  # python3 from the image, not .venv/bin/python: junit_summary is stdlib-only,
  # and this has to work even when the failure being reported is
  # `make setup-python` itself. The webhook URL is never passed to it.
  # --agent-report names a file that usually does not exist: the triage agent
  # is opt-in, only runs on a failure, and produces nothing when it cannot
  # reach a conclusion. All three cases are normal and leave the notification
  # as it would have been.
  - >
    python3 integ-tests/junit_summary.py
    --report integ-tests-report.xml
    --status "$CI_JOB_STATUS"
    --stage "$NIGHTLY_STAGE"
    --job-url "$CI_JOB_URL"
    --commit "$CI_COMMIT_SHA"
    --stack "$LMA_INTEG_STACK"
    --region "$AWS_DEFAULT_REGION"
    --template-url "$LMA_TEMPLATE_URL"
    --cause failure-cause.txt
    --agent-report triage-report.txt > slack-payload.json
  - |
    if [ "$NIGHTLY_POST_WHEN" = "on_failure" ] && [ "$CI_JOB_STATUS" = "success" ]; then
      echo "ℹ️ $NIGHTLY_STAGE succeeded — the tests job posts the night's result"
    elif [ -z "$SLACK_WEBHOOK_URL" ]; then
      echo "ℹ️ SLACK_WEBHOOK_URL not set — skipping the Slack post"
    elif [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
      echo "ℹ️ Not the scheduled run (source=$CI_PIPELINE_SOURCE) — skipping the Slack post"
    else
      # --fail so a 4xx from Slack is visible rather than silently discarded,
      # but the `else` branch keeps a notification problem from changing the
      # job's verdict: the stage's result is what this job reports.
      if curl -sS --fail -X POST -H 'Content-type: application/json' \
           --data @slack-payload.json "$SLACK_WEBHOOK_URL" >/dev/null; then
        echo "💬 Nightly result posted to Slack"
      else
        echo "⚠️ Slack post failed (HTTP error, bad webhook, or curl missing)"
        echo "   The $NIGHTLY_STAGE result above is unaffected."
      fi
    fi

# ── 1/3: build this commit and publish its artifacts ───────────────────────
nightly_publish:
  stage: scheduled_integration
  needs: []
  # Node for the UI and extension bundles, python3.12 because that is the
  # Lambda runtime and this build has no container to pin it (see below).
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  # ⚠️ arch:amd64 is REQUIRED, not a preference. This instance has arm64
  # runners too, and an unpinned job lands on either. Building without SAM's
  # container means the runner's own wheels go into the bundles, so an arm64
  # runner would produce arm64 wheels for an x86_64 Lambda — a build that
  # succeeds and deploys and then fails at runtime on import. The script
  # asserts the architecture as well; the tag is how it gets the right one.
  tags:
    - arch:amd64
    - size:large
  # Below the one-hour credential ceiling, deliberately. See the note above.
  timeout: 55m
  interruptible: false
  # Serialised with the other two against the same stack, so two nights — or a
  # night and a manual run — cannot publish and deploy over each other.
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: publish
    NIGHTLY_POST_WHEN: on_failure
    # ⚠️ Build the Lambda bundles with the runner's own interpreter rather than
    # in SAM's build container: these runners have no Docker daemon and cannot
    # start one (no `services:` support, no socket), so `--use-container` fails
    # before it builds anything. That is sound HERE and nowhere else — the
    # runner is linux/amd64 on python3.12, which is what Lambda is, so the
    # wheels it resolves are the wheels Lambda wants. See the flag's comment in
    # lma-ai-stack/Makefile.
    SAM_BUILD_IN_CONTAINER: "false"

  before_script:
    # Refuse to build before checking the two things SAM_BUILD_IN_CONTAINER=false
    # relies on. Both are guaranteed by the image and the arch tag, which is
    # exactly why they are worth asserting: if either ever stops holding, this
    # job would otherwise keep succeeding and publish bundles that Lambda
    # cannot import, and the first sign of it would be a runtime error in a
    # deployed stack rather than a failed build.
    - |
      ARCH=$(uname -m)
      PY=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
      echo "Builder: $ARCH, python $PY (building in container: ${SAM_BUILD_IN_CONTAINER})"
      if [ "$SAM_BUILD_IN_CONTAINER" = "false" ]; then
        if [ "$ARCH" != "x86_64" ]; then
          echo "Refusing to build: an uncontainerised build needs an x86_64 builder, got $ARCH." >&2
          echo "Add or fix the arch:amd64 tag on this job." >&2
          exit 1
        fi
        if [ "$PY" != "3.12" ]; then
          echo "Refusing to build: an uncontainerised build needs python3.12 to match the" >&2
          echo "Lambda runtime, got $PY. Fix this job's image." >&2
          exit 1
        fi
      fi
    - apt-get update -y
    - apt-get install -y make git curl zip unzip
    # The AWS CLI, because `cfn package` shells out to it for every nested
    # stack. boto3 alone is not enough for this job, unlike the other two.
    - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    - unzip -q awscliv2.zip && ./aws/install && rm -rf awscliv2.zip aws
    - aws --version
    # Node from .nvmrc, the same pin code_checks and `make setup-node` use.
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
    - curl -fsSL https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node --version && npm --version
    - pip install --quiet aws-sam-cli
    - sam --version
    - make setup-python
    - make setup-cli
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"

  script:
    # --force: skip the SHA-based change detection. A nightly that reused a
    # previous build when it thought nothing had changed would be back to
    # testing an older artifact, which is the thing this job exists to stop.
    #
    # Captured to publish-output.log as well as the log, so a failure's Slack
    # post can quote why (see .nightly_slack_post). pipefail so the pipe
    # reports the publish's exit status rather than tee's.
    - |
      set -o pipefail
      .venv/bin/lma publish \
        --source-dir . \
        --bucket-basename "$LMA_ARTIFACT_BUCKET_BASENAME" \
        --prefix "$LMA_ARTIFACT_PREFIX" \
        --region "$AWS_DEFAULT_REGION" \
        --force 2>&1 | tee publish-output.log

  after_script: *nightly_slack_post

  artifacts:
    when: always
    paths:
      - slack-payload.json
      - publish-output.log
      - failure-cause.txt
    expire_in: 1 month

# ── 2/3: deploy what was just published ────────────────────────────────────
nightly_deploy:
  stage: scheduled_integration
  needs:
    - nightly_publish
  image: public.ecr.aws/docker/library/python:3.13-bookworm
  # Below the one-hour credential ceiling, deliberately. See the note above.
  timeout: 55m
  interruptible: false
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: deploy
    NIGHTLY_POST_WHEN: on_failure

  before_script:
    - apt-get update -y
    - apt-get install -y make git curl
    - make setup-python
    - make setup-cli
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"

  script:
    # A stack whose last rollback could not finish refuses every update, so
    # one bad night would otherwise fail every night after it. Resumed once,
    # skipping nothing; a no-op on a stack in any other state. See the script.
    # Captured to deploy-output.log, as the deploy below is, so the Slack post
    # can quote it if this is what failed (see .nightly_slack_post).
    - |
      set -o pipefail
      .venv/bin/python integ-tests/resume_rollback.py \
        --stack "$LMA_INTEG_STACK" \
        --region "$AWS_DEFAULT_REGION" 2>&1 | tee deploy-output.log
    # $LMA_TEMPLATE_URL is the URL the publish job uploaded to, derived in the
    # shared variables above rather than passed as an artifact or scraped from
    # the other job's log: the CLI builds it the same way (see
    # lib/lma_sdk/lma_sdk/_core/publish.py), and a value derived from one
    # source cannot go stale against it.
    - echo "Deploying $LMA_TEMPLATE_URL"
    # --fail-if-unchanged is the point of this job. Without it a deploy that
    # CloudFormation declines as a no-op reports success, the suite then runs
    # against whatever the stack was already running, and the Slack summary
    # says the stack "was built and deployed from this commit" when it was not.
    # A stack that silently stops tracking `develop` is worse than a red
    # pipeline, because the green one is read as evidence about the branch.
    #
    # Appended to deploy-output.log, after the rollback step's output.
    - |
      set -o pipefail
      .venv/bin/lma deploy \
        --stack-name "$LMA_INTEG_STACK" \
        --region "$AWS_DEFAULT_REGION" \
        --template-url "$LMA_TEMPLATE_URL" \
        --fail-if-unchanged \
        --wait 2>&1 | tee -a deploy-output.log

  after_script: *nightly_slack_post

  artifacts:
    when: always
    paths:
      - slack-payload.json
      - deploy-output.log
      - failure-cause.txt
    expire_in: 1 month

# ── 3/3: run the suite against the stack just deployed ─────────────────────
nightly_integ_tests:
  stage: scheduled_integration
  needs:
    - nightly_deploy
  # ~40 min of wall time is expected; the cap leaves room for a slow Transcribe
  # stream without letting a wedged run hold the schedule all day, and stays
  # below the one-hour credential ceiling. See the note above.
  timeout: 50m
  # Never cancelled mid-run: the suite creates a meeting row and a Virtual
  # Participant registry entry and cleans them up in a `finally`, which a
  # cancellation would skip.
  interruptible: false
  # Two runs against one stack would race on those same rows.
  resource_group: integ-stack-$LMA_INTEG_STACK

  rules: *nightly_rules

  variables:
    <<: *nightly_variables
    NIGHTLY_STAGE: tests
    NIGHTLY_POST_WHEN: always

  # AWS credentials come from this GitLab instance's credential vendor, which
  # assumes $AWS_CREDS_TARGET_ROLE for the job and writes the result to the
  # default profile in the credential search order. They are short-lived and
  # job-scoped; no long-lived access key is stored anywhere.
  #
  # ⚠️ Do NOT set AWS_SHARED_CREDENTIALS_FILE or AWS_PROFILE in this job. The
  # vendor writes the default profile at the default path, so either one points
  # the SDK somewhere the credentials are not.
  #
  # ⚠️ Nor is AWS_CREDS_TARGET_ROLE set here: it holds the account id, which
  # must not appear in this public repository. It is a masked project variable,
  # and the job checks for it below rather than failing inside a test.
  #
  # The OIDC route that an `id_tokens` block would take is not available on this
  # instance: its OpenID discovery and JWKS endpoints sit behind the same
  # authenticating edge as the rest of it, so IAM cannot reach them to validate
  # a job token. The credential vendor is the supported path here — see
  # https://docs.hub.amazon.dev/docs/gitlab/user-guide/howto/vending-aws-credentials/
  before_script:
    - apt-get update -y
    # curl is used by the after_script's Slack post, and is installed here (not
    # there) so an after_script never has to install anything.
    - apt-get install -y make git curl
    - make setup-python
    - make setup-cli-dev
    # pycognito + websockets, needed by the audio streaming test. If these are
    # missing that test skips, which --no-skips then turns into a failure.
    - .venv/bin/pip install -r integ-tests/requirements.txt
    - |
      if [ -z "$AWS_CREDS_TARGET_ROLE" ]; then
        echo "AWS_CREDS_TARGET_ROLE is not set, so the runner vended no AWS credentials." >&2
        echo "See docs/scheduled-integration-tests.md" >&2
        exit 1
      fi
    # Fail here, with the identity in the log, rather than inside a test. This
    # is also what proves the vendor ran: an empty or unexpected ARN means the
    # trust policy did not match this group and project, not that a test broke.
    - >
      .venv/bin/python -c "import boto3;
      print(boto3.client('sts').get_caller_identity()['Arn'])"
    # The declared artifact always exists, so a green night does not emit a
    # "no matching files" warning for a report there was no failure to write.
    # Empty is the signal junit_summary reads as "no triage", so this is also
    # what keeps the notification unchanged on a passing run.
    - touch triage-report.txt

  script:
    # The suite's output is captured to a file as well as the log, because the
    # triage agent greps that file. pipefail so the pipe reports the SUITE's
    # exit status rather than tee's, which is always 0.
    #
    # The failure is held rather than propagated so the agent can run while the
    # stack is still up and inside this job's credentials, and the held status
    # is re-raised at the end — so the job is still red, and $CI_JOB_STATUS in
    # the after_script is still the truth. The agent runs HERE and not in the
    # after_script because an after_script gets five minutes by default, which
    # is less than the agent's own budget.
    - |
      # `set +e` explicitly: the runner may or may not have errexit on, and
      # with it on the held-status pattern below would never be reached.
      set +e
      set -o pipefail
      make integ-tests-nightly STACK="$LMA_INTEG_STACK" 2>&1 | tee integ-tests-output.log
      TEST_STATUS=$?
      echo "suite exit status: $TEST_STATUS"
      if [ "$TEST_STATUS" != "0" ]; then
        # Node only on the failure path: Claude Code needs it, and a green
        # night should not pay to install it. Failure to install is not fatal —
        # the agent is advisory and declines cleanly without it.
        if ! command -v npm >/dev/null 2>&1; then
          NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
          NODE_PIN=$(tr -d '[:space:]' < .nvmrc)
          curl -fsSL "https://nodejs.org/dist/v$NODE_PIN/node-v$NODE_PIN-linux-$NODE_ARCH.tar.xz" \
            | tar -xJ -C /usr/local --strip-components=1 || echo "node install failed; triage will be skipped"
        fi
        .venv/bin/python integ-tests/failure_agent.py \
          --report integ-tests-report.xml \
          --log integ-tests-output.log \
          --stack "$LMA_INTEG_STACK" \
          --region "$AWS_DEFAULT_REGION" \
          --out triage-report.txt || echo "triage agent errored; continuing"
      fi
      exit "$TEST_STATUS"

  after_script: *nightly_slack_post

  artifacts:
    when: always
    reports:
      junit: integ-tests-report.xml
    paths:
      - integ-tests-report.xml
      # The suite's full output and the agent's reading of it, so a failure can
      # be re-examined after the fact without re-running the night.
      - integ-tests-output.log
      - triage-report.txt
      # The posted message, so "what did Slack get told" is answerable from the
      # pipeline when the channel post looks wrong. Contains no credentials.
      - slack-payload.json
    expire_in: 1 month
