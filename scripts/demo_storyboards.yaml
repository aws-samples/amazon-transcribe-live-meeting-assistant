#
# Storyboards for the product-demo skill (.claude/skills/product-demo.md).
#
# A storyboard is a demo that has been proposed, confirmed by a person and (usually)
# recorded once. It is kept so the same demo can be re-recorded on a later release
# without re-deriving what to show and what to say.
#
# This file is memory, not scope. A demo run starts from what the user asks for
# (a changelog section, a PR, a feature) and proposes three storyboards; an entry
# here is offered as one of the three when it covers the request. Add an entry
# AFTER the user has confirmed it, when its chapters, fixtures and narration have
# been rehearsed against a real stack. Written beforehand it encodes a guess.
#
# The first entry below is the exception: it was written to show the format and
# has not been rehearsed or recorded (last_recorded is null). Rehearse it before
# offering it as written, and replace it once a real storyboard exists.
#
# Storyboards hold no meeting content, account ids, stack names or people, so
# they are safe to commit. The recordings themselves live under
# scratch/ux-recordings/ and are never committed.
#
# Fields:
#   id             Stable slug. The session's docs-entry and report name it.
#   title          The title card and the docs/demo-videos.md heading.
#   source         What the demo is of: a CHANGELOG section and entries, a PR,
#                  or a feature doc.
#   audience       Who it is for, in a phrase.
#   hook           One sentence: what the viewer can do after watching. Spoken on
#                  the title card (start --say).
#   persona        The role the demo is recorded as: Admin (the Admin Cognito
#                  group) or User (a user in no group, who sees only their own
#                  meetings and those shared with them).
#   duration_target  "m:ss". Aim for 2–4 minutes.
#   fixtures       What must exist before recording, and how to make it. Shipped
#                  fixtures and synthetic audio unless the user agreed otherwise.
#   chapters       One per `mark`. `label` is the chapter name, `say` the narration
#                  spoken before the action (first person plural, present tense,
#                  why before what), `do` the browser steps precise enough to
#                  rehearse from.
#   closing        Spoken on the end card (stop --say): the takeaway and the doc.
#   takeaways      3–5 lines for the Key takeaways end card. Claims, not a table
#                  of contents.
#   not_shown      What the demo deliberately leaves out, and why.
#   docs           The docs page (and anchor) the docs entry links to.
#   category       The docs/demo-videos.md heading the entry belongs under.
#   last_recorded  {date, version} of the most recent recording, or null.

storyboards:
  - id: meeting-to-summary-and-answers
    title: From a recorded meeting to a summary and answers
    source: 'Feature: docs/web-ui-guide.md (Meeting Detail Page) and docs/transcript-summarization.md'
    audience: People evaluating LMA who have not used it yet
    hook: >-
      After a meeting ends, LMA gives you the transcript with each speaker, a
      written summary, and an assistant that answers questions about what was said.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - One finished meeting made from the shipped two-speaker recording
        utilities/load-simulator/lma_load/fixtures/stereo-demo-call.wav, uploaded on
        the Upload Audio page with a neutral meeting topic, and left until its
        status is Ended and the summary has appeared (a few minutes).
      - Retention > Delete the transcript after the summary left at Off (the
        default) on the Configuration page; otherwise the transcript is gone by
        the time the demo is recorded.
      - The recorded tab signed in as an Admin, on the Meetings List.
    chapters:
      - label: The meetings list
        say: >-
          Every meeting LMA has captured is listed here, whichever way it was
          captured, with its status and when it happened.
        do:
          - Show the Meetings List with the fixture meeting at the top; hover its row.
      - label: The transcript, by speaker
        say: >-
          We open the meeting. The transcript shows each speaker on their own
          line, with the time each of them spoke.
        do:
          - Open the fixture meeting; scroll the Transcript panel slowly through
            the first exchanges.
      - label: The summary
        say: >-
          When the meeting ended, LMA wrote a summary of it, in sections an
          administrator chooses. It can be copied, edited, or regenerated.
        do:
          - Scroll to the Meeting Summary panel; let the sections stay on screen.
      - label: Ask about the meeting
        say: >-
          The meeting assistant has read the whole meeting. One of the shortcut
          buttons asks it for the action items, and the answer streams in.
        do:
          - In the Chat panel, press the action-items shortcut; wait for the answer
            to finish streaming.
      - label: A question of our own
        say: >-
          We can also ask in our own words, and the assistant answers from what
          was said in this meeting.
        do:
          - Type a question about a detail from the recording into the chat box and
            send it; wait for the answer.
    closing: >-
      That is a meeting turned into a transcript, a summary and answers. The Web UI
      guide in the LMA documentation describes every panel on the meeting page.
    takeaways:
      - Every meeting is transcribed with each speaker on their own line
      - A summary is written automatically when the meeting ends
      - The meeting assistant answers questions about what was said
    not_shown:
      - Capturing a meeting live (Stream Audio, Virtual Participant), which is its
        own demo; this one starts on a finished meeting
      - Editing the summary prompt templates on the Configuration page
    docs: docs/web-ui-guide.md#meeting-detail-page
    category: Overview
    last_recorded: null

  - id: whats-new-0-4-0-meeting-life
    title: 'What''s new in LMA 0.4.0: a meeting''s life'
    source: 'CHANGELOG [Unreleased] (0.4.0) and the LMA feature docs'
    audience: Existing LMA users and evaluators who want the 0.4.0 highlights in one video
    hook: >-
      LMA 0.4.0 follows a meeting from the invitation to a summary you can share: with LMA in the meeting and answering in its chat, informed consent from the first minute, and transcripts kept only as long as you choose.
    persona: Admin
    duration_target: '4:30'
    fixtures:
      - 'Live: a Google Meet with open access, VP launched in chapter 1 as alex@example.com, guest "Conference Room 4" (Fargate) playing a synthetic two-voice meeting and typing the chat question'
      - 'Finished meetings: "Mobile app planning" (run 2) and "Quarterly business review" (slides)'
    chapters:
      - label: 'Invite LMA to a Google Meet'
        say: >-
          We start from a meeting invitation. LMA now joins Google Meet, and it works the same way in Zoom, Microsoft Teams, Webex and Amazon Chime. We paste the invitation, and LMA reads the meeting's name, link and agenda from it, then joins. The participant's page lists every setting it was launched with, so anyone can check how it was set up, and a scheduled one can still be edited before it starts.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Informed consent, from the first minute'
        say: >-
          As soon as it joins, LMA tells everyone in the meeting chat that the meeting is being recorded and transcribed, who invited it, and how to object. Any objection stops recording. A deployment can instead require everyone to opt in before anything is recorded. The meeting's page shows that consent was granted, and the transcript fills in as people speak. Two people are talking from one conference room, and LMA is already telling their voices apart.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Ask LMA what was just discussed'
        say: >-
          Anyone in the meeting can ask LMA a question in the chat. The answer is posted back to the chat and kept in the transcript with everything else, under the name of who asked.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The summary and the agenda'
        say: >-
          After the meeting, the page opens on a compact header with tabs. The summary comes in sections we can fold and jump between, and under the agenda, how well the meeting covered each item.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Speakers, named automatically'
        say: >-
          Two people shared one seat, Conference Room 4. LMA told their voices apart, and named each one from the words where they introduced themselves, shown beside each name.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The shared screen'
        say: >-
          When someone shares their screen, LMA keeps a key frame of each new slide or page, with a short title and the text on it, so we can find what was shown as well as what was said.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'How the meeting was captured, and what it cost'
        say: >-
          The Details tab records how the meeting was captured and transcribed, its consent record, and how long its transcript is kept, next to an estimated cost itemised by what it was spent on.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Retention you control'
        say: >-
          Transcripts are kept only as long as you choose. An administrator sets how many days they are kept, or has each meeting's transcript deleted as soon as its summary is written, immediately or after a short delay. The summary, recording and consent record stay.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Share it and follow up'
        say: >-
          One Download menu exports the summary or the transcript to Markdown, Word, plain text or Excel, or copies it to the clipboard. The meeting assistant has new quick actions. CLARITY CHECK reads the whole meeting and lists the points that were left unclear, so they can be settled before anyone acts on them.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Configuration, for administrators'
        say: >-
          For administrators, one configuration page holds named profiles, with form, JSON and YAML editing and a revision history. Comparing two profiles shows only the settings that differ. And when something fails, the Troubleshooting page asks an agent that reads the deployment's own logs and explains the cause, with its evidence.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is LMA 0.4.0: from the invitation to the summary, with consent and retention under your control. The release notes in the LMA documentation list every change, with a guide for each feature.
    takeaways:
      - 'LMA joins Google Meet, Zoom, Teams, Webex and Chime, and works in the meeting chat'
      - 'Informed consent from the first minute, with an auditable record'
      - 'Transcripts kept only as long as you choose, or deleted after the summary'
      - 'Speakers told apart and named; shared slides kept as searchable key frames'
      - 'Named configuration profiles and a troubleshooting agent for administrators'
    not_shown:
      - 'Zoom, Teams, Webex and Chime joins (Google Meet stands in); Opt-in consent in a live meeting; Diagnose on a meeting page (see the defects list)'
    docs: docs/INDEX.md
    category: "What's new in LMA 0.4.0"
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}

  - id: vp-in-depth
    title: 'The Virtual Participant in depth'
    source: 'CHANGELOG [Unreleased] (0.4.0)'
    audience: LMA users and administrators who want one area of 0.4.0 in depth
    hook: >-
      LMA's Virtual Participant can be scheduled ahead and changed before it starts, and once in the meeting it takes its instructions from the meeting chat, even with more than one LMA in the room.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - 'a Google Meet with open access with the host present (camera and mic off); VPs for alex@example.com and jordan@example.com launched with `lma vp create --as-user`; guest "Conference Room 4" (Fargate task) typing the chat commands'
    chapters:
      - label: 'Schedule a participant for later'
        say: >-
          We schedule LMA for a design review later today. We give the meeting a name, choose Google Meet and its meeting code, pick the time it should join, and add the agenda it should follow. LMA will join on its own when the time comes.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Change it before it starts'
        say: >-
          Plans change. A scheduled participant can be edited before it starts, with every field from the form. We move the meeting to later in the evening and save. The schedule moves with the edit, and the launch settings show the new time.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'LMA in the meeting'
        say: >-
          Here is LMA in a meeting that is under way. The live view shows the participant's own screen, steady rather than flickering, with the meeting chat open. Two LMAs have joined, one for Alex and one for Jordan.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Ask LMA for help'
        say: >-
          Anyone can ask LMA what it can do. With two LMAs present, we address Alex's by name, and it lists its chat commands and how to reach it.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Pause and resume'
        say: >-
          LMA pause stops the transcript and the recording without leaving the meeting, and LMA start picks it up again. Each command is acknowledged in the chat.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Two LMAs, each addressed by name'
        say: >-
          Each LMA answers only to its own name. We ask Jordan's LMA to leave, and only that one goes; Alex's stays and keeps recording.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is the Virtual Participant: scheduled, edited, and directed from the meeting chat. The Virtual Participant guide in the LMA documentation covers every command.
    takeaways:
      - 'Schedule LMA ahead and edit it before it starts; the schedule follows the edit'
      - 'The live view shows the participant''s own screen, steadily'
      - 'LMA takes its instructions from the meeting chat: help, pause, start, leave'
      - 'With several LMAs in a meeting, each answers only to its own name'
    not_shown:
      - 'Voice assistant: assistant/translator switching and stopping it mid-answer (needs a voice assistant configured)'
      - 'Zoom, Teams, Webex and Chime; a VP that needs a sign-in or CAPTCHA (manual action)'
    docs: docs/virtual-participant.md
    category: "What's new in LMA 0.4.0"
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}

  - id: meeting-page-in-depth
    title: 'The meeting page in depth'
    source: 'CHANGELOG [Unreleased] (0.4.0)'
    audience: LMA users and administrators who want one area of 0.4.0 in depth
    hook: >-
      The meeting page in LMA 0.4.0 puts everything about a meeting in one compact place: what was said, what it was about, and what to do next.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - 'Finished meeting "Mobile app planning" (rehearsal run 2: Google Meet, VP, two voices on one seat, agenda from the invitation)'
    chapters:
      - label: 'Header and tabs'
        say: >-
          A compact header gives the meeting's status, platform, owner, speakers, consent and an estimated cost at a glance. Below it, tabs separate the summary, the transcript, the shared screen and the details.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The recording follows the transcript'
        say: >-
          Each line of the transcript can play the recording from that moment. As it plays, the transcript keeps up, highlighting the line being spoken, with the chapter shown under the player.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Search the transcript'
        say: >-
          Searching the transcript finds every mention, and we step from one match to the next.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Filter by speaker'
        say: >-
          Speaker filters narrow the transcript to one person. Here, only what Priya said.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Regenerate the summary'
        say: >-
          After the speakers were named, we ask LMA to regenerate the summary, so it uses their names.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Edit the summary by hand'
        say: >-
          Before it replaces anything, LMA stops to ask. This summary was edited by hand earlier, and regenerating would discard that edit.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Regenerating keeps your edits safe'
        say: >-
          We confirm, and LMA writes a new summary from the latest transcript. It reads the whole meeting again, in sections: the summary itself, the details, the action items, how the agenda was covered, the shared screen, the chapters and the links shared in the chat. This time it uses the speakers' names, Priya and Marcus, instead of the voices of one conference room.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Edit the summary by hand'
        say: >-
          A summary can also be edited by hand, in Markdown. We add a follow-up that was agreed after the meeting, and save it; the download uses the edited version too.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The agenda, and AGENDA CHECK'
        say: >-
          The agenda came from the invitation and is kept with the meeting, where anyone working on it can edit it. The assistant's AGENDA CHECK goes item by item through what was decided, what is still open, and what nobody has picked up yet, with the moment in the meeting where each was discussed.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Download'
        say: >-
          One Download menu exports the summary or the transcript as Markdown, Word, plain text or Excel, or copies it to the clipboard.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is the meeting page in LMA 0.4.0. The Web UI guide in the LMA documentation describes every part of it.
    takeaways:
      - 'A compact header and tabs put the whole meeting in one place'
      - 'The recording, search and speaker filters work together on the transcript'
      - 'Summaries can be regenerated or edited by hand, with hand edits protected'
      - 'The agenda is kept with the meeting, and AGENDA CHECK reports what is still open'
      - 'One Download menu: Markdown, Word, text, Excel or clipboard'
    not_shown:
      - 'Translated transcript lines; the Share dialog; Email summary (beta)'
    docs: docs/web-ui-guide.md#meeting-detail-page
    category: "What's new in LMA 0.4.0"
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}

  - id: speakers-and-screen-share
    title: 'Speakers and the shared screen'
    source: 'CHANGELOG [Unreleased] (0.4.0)'
    audience: LMA users and administrators who want one area of 0.4.0 in depth
    hook: >-
      LMA 0.4.0 works out who said what, even when several people share one microphone, and keeps a searchable record of everything that was shown on screen.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - '"Mobile app planning" run 1 (voice separation off) and run 2 (on); "Quarterly business review" slides meeting (desktop_video_probe.py)'
    chapters:
      - label: 'When there is nothing to name'
        say: >-
          Identify speakers reads the transcript and names voices from what people say. In this meeting the platform already named every voice, and LMA says so, and what to do instead, rather than silently doing nothing.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Voices told apart and named'
        say: >-
          In this meeting two people shared one conference room. LMA told their voices apart, and named each one from the words where they introduced themselves, shown beside each name.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Merge a stray voice'
        say: >-
          When one person was heard as two voices, Same person as joins them, so every line ends up under one name.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'One person or several people'
        say: >-
          For each name the platform gave, we choose whether it is one person or several. One person shows the whole room under its name; several people shows each voice separately.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Enroll your own voice'
        say: >-
          People can also enroll their own voice, so meetings label them by name from their first word. The page explains exactly what is stored, a voiceprint rather than a recording, and what it is used for, before anyone agrees.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Search the shared screen'
        say: >-
          When slides are shared, LMA keeps a key frame of each one, gives it a short title and reads the text on it. Searching that text finds the slide where churn came up.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The shared screen in the summary'
        say: >-
          The summary has its own section for what was shown on screen, slide by slide, alongside what was said.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is speakers and the shared screen in LMA 0.4.0. The Web UI, Voice Enrollment and Meeting Video guides in the LMA documentation go further.
    takeaways:
      - 'Several people on one microphone are told apart and named from what they say'
      - 'Identify speakers explains when there is nothing to name'
      - 'Merge voices, and choose one person or several people per name'
      - 'People can enroll their own voice, with a clear account of what is stored'
      - 'Shared slides become searchable key frames, summarised slide by slide'
    not_shown:
      - 'Recording an enrollment and a meeting labelled from it (needs a person speaking into the browser); Paste attendee list; camera-frame filtering'
    docs: docs/meeting-video.md
    category: "What's new in LMA 0.4.0"
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}

  - id: assistant-consent-privacy
    title: 'The assistant, consent and privacy'
    source: 'CHANGELOG [Unreleased] (0.4.0)'
    audience: LMA users and administrators who want one area of 0.4.0 in depth
    hook: >-
      LMA 0.4.0 makes the meeting assistant sharper and cheaper, and gives administrators clear control over consent, retention and where AI processing happens.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - 'Finished meeting "Mobile app planning" (run 2); active profile conference-rooms (Custom, consent Notify)'
    chapters:
      - label: 'Who owns the follow-ups?'
        say: >-
          A new quick action, MISSING ACTION OWNER or ETA, reads the whole meeting and lists the follow-ups that nobody took on, or that have no date. The answer streams in as it is written: here the trade-off write-up, the sign-in change, and both support hires lack an owner, a deadline, or both.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Better answers at lower cost'
        say: >-
          The meeting assistant now uses Claude Haiku 5.5 by default, at low reasoning effort, with Amazon Bedrock prompt caching turned on. Summaries use Claude Sonnet 5.5. Each can be changed here.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Where models run'
        say: >-
          Model inference geography decides where Amazon Bedrock may process meeting content: globally, within this deployment's geography, or in its own Region only.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Meeting consent'
        say: >-
          Meeting consent can be off, can notify participants that the meeting is recorded, with any objection stopping it, or can require their agreement before anything is recorded.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Delete transcripts after the summary'
        say: >-
          For teams that only need the summary, each meeting's transcript can be deleted once its summary is written, immediately or after a short delay.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'A choice for each meeting'
        say: >-
          Whoever starts a meeting can choose its consent mode, unless the deployment requires a stricter one.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The consent record'
        say: >-
          Every meeting keeps an auditable consent record: the mode it ran under, whether consent was granted, and whether recording and transcription were allowed, alongside how long its transcript is kept.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is the assistant, consent and privacy in LMA 0.4.0. The Meeting Consent, Transcript Deletion and Configuration guides in the LMA documentation have the details.
    takeaways:
      - 'New quick actions find follow-ups with no owner or date'
      - 'Claude Haiku 5.5 at low effort, with prompt caching, by default'
      - 'Choose where Amazon Bedrock may process meeting content'
      - 'Consent: off, notify or opt-in, chosen per meeting, with a record kept'
      - 'Transcripts can be deleted as soon as the summary is written'
    not_shown:
      - 'Opt-in consent in a live meeting; the consent evidence check (its verdict on this meeting was wrong, see report); prompt-cache savings in the cost breakdown'
    docs: docs/meeting-consent.md
    category: "What's new in LMA 0.4.0"
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}

  - id: configuration-and-admin
    title: 'Configuration and administration'
    source: 'CHANGELOG [Unreleased] (0.4.0)'
    audience: LMA users and administrators who want one area of 0.4.0 in depth
    hook: >-
      LMA 0.4.0 brings every runtime setting into one configuration page, organised as named profiles that administrators can compare, version and switch between.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - 'Profiles: conference-rooms (Custom, active, 2 revisions) and the shipped Managed presets; the demo saves conference-rooms-thorough (not activated)'
    chapters:
      - label: 'Named profiles'
        say: >-
          Settings live in named profiles. One is active at a time and every meeting uses it. This deployment runs conference-rooms, a custom profile, and Managed presets ship with LMA.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Managed presets'
        say: >-
          Managed presets cover common situations, such as regulated meetings that require consent and keep no transcript, or internal meetings that notify participants. One can be chosen as the starting point when LMA is deployed.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Form, JSON or YAML'
        say: >-
          A profile can be edited as a form, or as JSON or YAML when that is quicker, for example to review or paste a whole configuration.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Revision history'
        say: >-
          Every save is kept as a revision, with who made it and why. Comparing two revisions shows exactly what changed: here, voice separation was turned on.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Save edits as a new profile'
        say: >-
          To try a change without touching the live profile, we make the edit, here a more thorough meeting assistant, and save it as a new profile. The active profile is left as it was.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'The latest models'
        say: >-
          The model lists offer the Claude 5.5 models for summaries and for the meeting assistant, and models past their end of life are no longer offered.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
