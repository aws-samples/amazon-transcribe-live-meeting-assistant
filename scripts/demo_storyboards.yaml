  - id: lma-complete-demo
    title: 'Live Meeting Assistant: an AI teammate in your meetings'
    source: 'CHANGELOG [Unreleased] (0.4.0) and the LMA feature docs'
    audience: 'People new to LMA: decision makers, evaluators and builders'
    hook: >-
      Live Meeting Assistant is much more than a note taker. It brings an AI assistant into the meeting itself: one that listens, answers questions while you talk, reaches out to your other systems, and keeps consent and your data under your control. It runs in your own AWS account.
    persona: Admin
    duration_target: '8:00'
    fixtures:
      - 'Live: a Google Meet with open access and a silent guest keeping it open; VP launched in the first chapter (consent Notify); scripted guest Conference Room 4 playing a synthetic two-voice meeting and typing a chat question; Tavily web search; DeepWiki connected as a custom MCP server'
      - 'The guest posts a link in the meeting chat once the conversation starts, for the summary''s chat and shared links section'
      - 'Finished meeting Quarterly business review (synthetic slides) for the slide chapters; concept slides 1-5'
    chapters:
      - label: 'Invite LMA to the meeting; every meeting, online or in the room'
        say: >-
          We invite LMA to a meeting by pasting its invitation. LMA reads the meeting's name, its link and its agenda, and joins as a participant. Here it is Google Meet; it works the same way in Zoom, Microsoft Teams, Webex and Amazon Chime. LMA joins online meetings on every major platform. People can also stream a meeting from their browser, the Chrome extension or the desktop app, or upload a recording. In hybrid meetings, several people sharing one conference-room microphone are told apart and named. And with the voice assistant turned on, anyone in the meeting can ask a question out loud and hear the answer spoken, or switch it to interpreter mode, where it translates between two languages as people speak, with an optional avatar on camera.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Speech recognition on your terms; informed consent; a live transcript'
        say: >-
          LMA offers two speech engines, and an administrator chooses one for each kind of meeting: Amazon Transcribe, fully managed, with personal information redaction and custom vocabularies; or LMA's own on-demand engine, which runs open speech models on AWS Lambda MicroVMs, one per meeting, and gives text and speaker labels together. The moment it joins, LMA tells everyone in the meeting chat that the meeting is being recorded and transcribed, who invited it, and how to object. An objection stops recording, and a deployment can require everyone to opt in first. On LMA's own page, the transcript appears as people speak. Two people share one conference-room microphone, and LMA tells their voices apart. The header shows the meeting in progress, with consent granted and an estimated cost so far.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'In any language; ask the assistant during the meeting; answers in seconds'
        say: >-
          Anyone following along can translate the transcript live, into the language they read best, here Spanish. Each line keeps its speaker and time, and the original stays as it was said. This is where LMA goes beyond notes. While the meeting is still going, we ask the assistant which decisions are still open, and who owns them. It reads everything said so far and answers in seconds: whether offline sync blocks the launch, and who writes up the trade-offs, are both still open with no owner named, and the second support hire waits on budget. The app store submission, though, is settled: Marcus's team owns it, by March the tenth.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Search the web, mid-meeting; an answer with sources; quick actions'
        say: >-
          The assistant can reach outside the meeting too. Offline sync just came up, so we ask it to search the web for current best practices. It searches the web and brings back a short, practical answer, with the sources it used, without anyone leaving the meeting. Quick actions ask the most useful questions with a single button: the action items, a fact check of what was just said, how the meeting is doing against its agenda, or, as here, which points are still unclear and should be settled before the meeting ends.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'What is still unclear; ask LMA in the meeting chat; kept in the transcript'
        say: >-
          It lists what is still open or ambiguous, each with the time it came up: the second support hire, waiting on a budget meeting with no date, and launch timing, where a nine-day app store review from March the tenth leaves a single day before the launch. Participants can ask too, without leaving the meeting. Someone types a question for LMA in the meeting chat, and LMA posts the answer back there within seconds. Both the question and the answer are kept in the transcript, under the name of whoever asked.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Connect it to your own systems; add a connector; after the meeting; chat and links, kept'
        say: >-
          The assistant is extensible. Besides its built-in tools, it can call any MCP server: a CRM such as Salesforce, internal APIs, ticketing systems or knowledge bases. Connectors are added on the MCP Servers page, from the public MCP registry, where Salesforce servers are listed, or by entering your own endpoint. Here, DeepWiki is already connected, and the assistant can use it in any meeting. When the meeting ends, LMA writes the summary in sections: the decisions, the action items, how each agenda item was covered, and the chapters. The meeting chat is part of the record too. The summary has its own section for what was said in the chat and every link that was shared, here the beta feedback notes.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'The recording, audio or video; speakers named for you; the slides, captured'
        say: >-
          LMA keeps the recording, audio only or with video of the meeting screen, and it plays from any line of the transcript. LMA named the two voices from the conference room after the people themselves, from the words where they introduced themselves. When someone presents, LMA captures each slide as a key frame, gives it a short title, reads its text, and describes it, so a meeting can be searched by what was shown as well as what was said. The slides can be downloaded as a PDF.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Ask about the slides; slides in the summary; ask across all your meetings'
        say: >-
          The assistant can read the slides too, during the meeting or after: describe a slide, compare two, or, as here, translate one into German. And the summary has a section for what was shown on screen, slide by slide, with a thumbnail of each. Questions are not limited to one meeting. The Meetings Query Tool searches every meeting you have access to, and answers from their transcripts and summaries, here what has been decided about the launch, and what is still open.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Consent and retention you can audit; bring meetings into your AI agents'
        say: >-
          For the people responsible for privacy, every meeting keeps an auditable consent record. Transcripts are kept only for the days you set, or deleted as soon as the summary is written, and you choose where AI processing may happen. LMA encrypts recordings with your key and keeps meeting content out of its logs. LMA is also an MCP server itself. AI agents such as Amazon Quick, Claude Desktop or your own can search your meetings, read transcripts and summaries, and even send LMA into a meeting, with each user seeing only their own meetings.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'What each meeting costs; built for administrators'
        say: >-
          Every meeting carries an estimated cost, itemised by service, so you can see what LMA spends and where. Administrators manage every setting as named configuration profiles, with presets for consent, retention and privacy. And when something goes wrong, a troubleshooting agent reads the deployment's own logs and explains the cause.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
    closing: >-
      That is Live Meeting Assistant: an AI teammate that joins your meetings, helps while they happen, connects to your systems and agents, and keeps consent and your data under your control. The LMA documentation has a quick start guide to deploy it in your own AWS account.
    takeaways:
      - 'An AI assistant that joins the meeting, on every major platform'
      - 'Ask it during the meeting, in LMA or in the meeting chat; it can search the web'
      - 'Extend it with MCP connectors; use it from agents like Amazon Quick'
      - 'Consent records and retention you control, in your own AWS account'
      - 'Summaries, named speakers, key frames and questions across all your meetings'
    not_shown:
      - 'A Salesforce connector in use (needs a Salesforce org); Amazon Quick calling LMA (shown as a slide and the Hosted MCP Access page); the voice assistant; the Desktop Capture App and Chrome extension in use'
    docs: docs/quick-start-guide.md
    category: 'Overview'
    last_recorded: {date: 2026-11-13, version: 0.4.0.dev3}

  - id: consent-and-compliance
    title: 'Meeting consent and compliance'
    source: 'Feature: docs/meeting-consent.md and docs/privacy-and-data-handling.md; CHANGELOG [Unreleased] consent given in advance, Participant role, shared meetings, video sentence, private chat, recordings deletion'
    audience: 'Compliance, privacy and legal teams evaluating how LMA handles recording consent'
    hook: >-
      This video is for compliance teams. It shows how LMA tells participants that a meeting is recorded, waits for their agreement where your rules require it, lets people give that agreement before the meeting, and keeps an auditable record of what happened, with policies you can set for each jurisdiction or context.
    persona: Admin
    duration_target: '9:00'
    fixtures:
      - 'Two throwaway accounts from scripts/ux_test_session.py: an Admin (records the meeting) and a Participant shown as Avery Lin; a second Participant shown as Sam Ortiz with a standing consent made off camera'
      - 'Configuration: Allow consent given in advance on; Video sentence at its default; Delete the recordings after the summary at 15 minutes; Virtual Participant display name LMA'
      - 'A scheduled Virtual Participant for a Google Meet ("Vendor security review"), with Avery Lin and Sam Ortiz on its participant list, consent mode Opt-in (each participant) for this meeting, Record meeting video on'
      - 'Live: the Meet held open by a silent guest named Sam Ortiz; a scripted guest named Avery Lin; a scripted guest named Conference Room 4 who types I consent, I object and I consent'
      - 'Concept card for private chat messages (Zoom, Webex); finished meetings and profiles from the 0.4.0 recording reused for chapters 10 and 11 where still on the stack, otherwise remade the same way'
    chapters:
      - label: 'Different rules, one record'
        say: >-
          Recording and transcription rules differ between countries, states and organizations: some require every participant to agree, some only one. LMA does not decide which rules apply. You choose the policy, with whoever advises your organization, and LMA applies it and keeps the evidence of what was said and agreed. That record is supporting evidence, not a legal determination.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Consent modes, the notice and the video sentence'
        say: >-
          Consent is set on the Configuration page, in the Meeting Consent section. Off records as LMA always has. Notify tells participants the meeting is recorded and how to object. Opt-in records nothing until consent is given: by every participant, or by the meeting owner confirming that everyone agreed. The notice and the consent request are yours to word. When the meeting's video is recorded, every client ends them with the video sentence, also yours to word. The phrases that count as consent, and as an objection, are listed too, and objections are always looked for first.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Around consent; which options work where'
        say: >-
          Further settings decide whether a meeting may choose a different mode, whether evidence screenshots are kept and which vision model checks them, how streaming clients without a consent step are treated, and whether the Virtual Participant leaves after an objection. New in this release: people can give their consent before the meeting, for at most as many days as you allow, and you decide whether the device they gave it from is kept with it. The Virtual Participant runs the whole flow inside the meeting. Stream Audio, the browser extension and the Desktop Capture App show the notice to the LMA user to share, who confirms it was given or that everyone agreed. And the Virtual Participant acts only on chat messages sent to everyone. On Zoom and Webex, a consent, an objection or a command sent to it privately is not read at all, so participants reply where everyone can see it.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Consent given in advance'
        say: >-
          The meeting's owner lists who is expected, and sends them the meeting's consent link from the Participants section. Someone with no LMA account gets a Participant account, the role for people who take part in meetings without capturing them. Avery signs in and opens My consents. They can agree for this meeting only, or for every meeting this organizer holds until a date, or, without a link, for every meeting on this deployment. The exact text they agree to is shown first, and is kept with the consent.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'In the meeting: who is covered, and everyone else'
        say: >-
          The meeting starts with opt-in, and every participant must agree. LMA posts its request as always, then names, by display name only, the attendees whose consent given in advance is on record when it posts. Here that is Sam. On the meeting's page, Sam and Avery are both covered by consents given in advance. Everyone else is asked as usual: Conference Room 4 has not replied yet, so nothing is recorded or transcribed. Conference Room 4 types I consent, and with everyone present covered, recording and transcription begin.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'An objection still wins'
        say: >-
          A consent given in advance never outweighs what someone says in the meeting. Conference Room 4 types I object, and LMA stops recording and transcribing at once. When they consent again, their latest reply counts, and recording resumes.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Withdrawing stops capture'
        say: >-
          Avery changes their mind during the meeting. They withdraw their consent on My consents. Within seconds the meeting records it as Avery's objection. In the meeting chat, LMA posts that Avery withdrew the consent they gave in advance, and stops recording and transcribing. On the meeting's page, Avery is now listed as objected, and capture is withheld.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'What a Participant sees afterwards'
        say: >-
          Meetings are shared with the people on their participant list. Avery has a Shared meetings page, and reads the meeting without changing it: its summary, transcript and consent record. The meeting assistant is there for Avery too. Asked for the action items, it answers from this meeting only: what the security review asked for, from data stored in the European Union to quarterly access reviews and incident notice within 24 hours. A Participant's question never reaches the owner's other meetings, the meeting's context or checklist, and it is not added to the transcript.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'The consent record; recordings deleted after the summary'
        say: >-
          The consent record is the audit trail: the mode and rule, the notice exactly as posted, with its video sentence, each participant's latest reply, the consents given in advance that counted, objections and withdrawals, evidence screenshots checked by a vision model, and a timeline of every change. With Delete the recordings after the summary, the audio and video are removed once the summary is written, and the meeting page says when and why. The summary and the consent record stay with the meeting.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Profiles for different policies'
        say: >-
          Different places and teams need different policies, so each can be kept as its own configuration profile. LMA ships presets for common ones, such as Regulated, consent required, and Internal meetings, notify participants. Comparing two shows only what differs. One profile is active at a time, and a meeting can still choose a stricter mode than the active profile's.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
    closing: >-
      That is meeting consent in LMA: your policy, applied in the meeting, agreed in advance where people prefer, with a record you can audit. The Meeting Consent and Privacy and Data Handling guides in the LMA documentation have every detail.
    takeaways:
      - 'You choose the policy: off, notify, or opt-in by each participant or the owner'
      - 'People on the participant list can consent before the meeting, and withdraw at any time'
      - 'An objection in the meeting always wins, and stops recording at once'
      - 'Participants read the meetings shared with them, and nothing else'
      - 'Every meeting keeps an auditable consent record with evidence and a timeline'
    not_shown:
      - 'Private chat live (Google Meet has none; shown as a concept card); spoken replies; the Desktop Capture App and the Stream Audio consent step in detail (in the 0.4.0 recording); standing consent for every meeting on the deployment given on camera (named, not given); device details (off as shipped)'
    docs: docs/meeting-consent.md
    category: 'Overview'
    last_recorded: {date: 2026-11-26, version: 0.4.1.dev1}

  - id: requirements-workshop-coach
    title: 'An AI coach for a requirements workshop'
    source: 'Feature: the meeting assistant and its quick actions'
    audience: 'Teams that run discovery or requirements meetings with customers'
    hook: >-
      LMA can coach a meeting while it happens. Here a software vendor gathers requirements from a customer, and the meeting assistant helps them ask the right questions, catch what is vague, check facts, cover the agenda and log the actions, and then drafts the specification.
    persona: Admin
    duration_target: '5:00'
    fixtures:
      - 'Live: a Google Meet with a silent guest keeping it open; VP launched from a pasted invitation with a five-item agenda (consent Notify); guest Northwind Board Room playing a synthetic three-voice workshop (Amazon Polly) with pauses where the vendor consults LMA; fictional companies and people'
    chapters:
      - label: 'The scenario'
        say: >-
          Dana Ortiz, lead business analyst at Brightpath Software, is meeting Sam Patel and Grace Kim of Northwind Logistics in their board room, to gather the requirements for a new returns processing application. The room joins a Google Meet, and Dana brings LMA.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Invite LMA, with the agenda; consent first'
        say: >-
          Dana invited LMA by pasting the meeting invitation. The participant's page shows what LMA read from it: the meeting's name, its link, and the five agenda items, which it keeps track of during the meeting. As soon as it joins, LMA tells everyone in the meeting chat that the meeting is recorded and transcribed, who invited it, and how to object. Any objection stops recording.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Three voices, one microphone; check the facts'
        say: >-
          On Dana's screen, the transcript fills in as people speak. Three people share the board room's microphone, and LMA tells their voices apart. Sam has just quoted the maximum GDPR fine as two percent of turnover. Dana asks LMA to fact-check the recent statements.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'The fact check; catch what is vague'
        say: >-
          LMA marks the statement as incorrect: two percent is only the lower tier of GDPR fines, and the maximum is higher, up to four percent of global annual turnover. It also says which claims it cannot verify from outside, such as the five-day refund time, so the team can confirm them. The requirements so far include: it needs to be fast, it has to handle a lot of returns, and it must integrate with our systems. CLARITY CHECK lists what is still too vague to build from.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'What is still unclear'
        say: >-
          It lists the points that are still too vague to build from, each with the time it came up: no retention period for the damage photos, the GDPR figure, which systems to integrate, when a driver takes a photo, and a lot of returns with no numbers. Security, scale and the timeline are still to come.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Ask the right questions; the questions to ask'
        say: >-
          Dana pauses to check her notes, and asks LMA which important questions she has not asked yet. LMA lists the questions still to ask, grouped by topic: which systems exactly to integrate with, how people sign in, which compliance rules apply and how long photos may be kept, how many returns a day and at the holiday peak, the response time and uptime needed, and the go-live date and pilot.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Dana follows up; agenda coverage'
        say: >-
          Dana asks those questions, and the answers are specific: about three thousand returns a day and fifteen thousand at the January peak, scans in under two seconds, offline use on rural routes, the systems to integrate, and single sign-on with multi-factor authentication. Near the end, AGENDA CHECK goes through the agenda item by item, with the times each came up: business goals and users covered, security and scale covered apart from compliance beyond GDPR and how long photos are kept, and the timeline just started, with Dana's question not yet answered.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Log the actions; follow-ups without an owner or a date'
        say: >-
          As the meeting closes, MISSING ACTION OWNER or ETA lists the follow-ups that lack an owner or a date. It finds the gaps: nobody owns confirming the photo retention period with legal, the prototype has no date, the paper forms are due only by Friday, and the draft specification next week, both worth turning into calendar dates.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'The summary; a draft specification'
        say: >-
          When the meeting ends, LMA writes the summary in sections, with the decisions, the requirements discussed, and the action items, each with its owner and date where one was given. Finally, Dana asks LMA to turn the meeting into a requirements specification.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Ready to refine and send'
        say: >-
          It drafts one from what was said: goals, users, the core workflows, numbered functional requirements, non-functional requirements with the figures the customer gave, integrations with SAP, the carrier API, Salesforce and Okta, security and compliance with the corrected GDPR figure, the timeline, open questions and next steps with their owners. Items still to confirm are marked as such.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
    closing: >-
      That is LMA as a coach in a requirements workshop: better questions, clearer requirements, and a specification drafted from the meeting itself. The Meeting Assistant guide in the LMA documentation explains each quick action.
    takeaways:
      - 'The meeting assistant coaches the meeting while it happens'
      - 'FACT CHECK and CLARITY CHECK catch wrong figures and vague requirements in time'
      - 'Ask what to ask next, and track the agenda and the follow-ups'
      - 'Several people on one room microphone are told apart and named'
      - 'A draft specification straight from what the customer said'
    not_shown:
      - 'The meeting assistant''s web search and MCP tools; the voice assistant answering out loud'
    docs: docs/meeting-assistant.md
    category: 'Overview'
    last_recorded: {date: 2026-11-13, version: 0.4.0.dev3}

  - id: whats-new-meeting-life
    title: 'What''s new in this release: a meeting''s life'
    source: 'CHANGELOG [Unreleased]'
    audience: 'Existing LMA users and evaluators'
    hook: >-
      This release follows a meeting from before it starts to after it ends: who is expected, consent given in advance, guidance while it runs, and a summary that reaches the people who were there.
    persona: Admin
    duration_target: '4:30'
    fixtures:
      - 'The live Google Meet from the consent video, held open by two guests; a VP created on camera with participants, context, labels and checklist (its launch shown, the join done off camera)'
      - 'A finished meeting with structured action items, chat, whiteboard, summary profile; a Participant account with a consent given in advance'
    chapters:
      - label: 'Before: who is expected, and what the meeting is for'
        say: >-
          We invite LMA to a meeting. Besides the meeting link and the agenda, we list the people expected at it, by name and email address. The meeting will be shared with each of them, and they can be asked for consent before it starts.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Meeting preparation'
        say: >-
          Meeting preparation gives the assistant what it needs to help. A summary profile, here Discovery session, with structured action items. A label, so the meeting can be found with others for the same customer. A short briefing on what the meeting is for, and a checklist of what it should cover: where the data is stored, and the incident notification window. For this meeting we choose notify for consent, and turn live guidance on.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Consent given in advance'
        say: >-
          The people on the list can give their consent before the meeting, on a My consents page, for one meeting, an organizer's meetings or every meeting on the deployment, and the Virtual Participant counts it when they join. Anyone can still object in the meeting.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'During: the live transcript and whiteboards'
        say: >-
          While the meeting runs, the transcript streams in, and whiteboards hold decisions and open questions for everyone who can see the meeting. We turn on the assistant's updates and start one from a template.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'Live guidance and the checklist'
        say: >-
          Live guidance reads the meeting as it happens, keeps the checklist up to date, and offers what to raise next in the Notifications drawer, for the owner and the people the meeting is shared with. The assistant has filled in its whiteboard too.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
      - label: 'In the meeting chat'
        say: >-
          People in the meeting can ask LMA in the meeting chat, within the limits an administrator sets. LMA answers there, and reads only messages sent to everyone.
        do:
          - 'Perform the steps the narration describes, on the fixtures above.'
