  - id: lma-complete-demo
    title: 'Live Meeting Assistant: an AI teammate in your meetings'
    source: 'CHANGELOG [Unreleased] (0.4.0) and the LMA feature docs'
    audience: 'People new to LMA: decision makers, evaluators and builders'
    hook: >-
      Live Meeting Assistant is much more than a note taker. It brings an AI assistant into the meeting itself, one that listens, answers questions while you talk, reaches out to your other systems, and keeps consent and your data under your control.
    persona: Admin
    duration_target: '5:00'
    fixtures:
      - 'Live: a Google Meet with open access, VP launched in chapter 1 as alex@example.com, guest "Conference Room 4" (Fargate); Tavily web search; DeepWiki connected as a custom MCP server'
      - 'Finished meetings: "Mobile app planning" (run 2) and "Quarterly business review" (slides); four concept slides (scratch/demo-slides)'
    chapters:
      - label: 'Invite LMA to the meeting'
        say: >-
          We invite LMA to a meeting by pasting its invitation. LMA reads the meeting's link and agenda, and joins as a participant. Here it is Google Meet; it works the same way in Zoom, Microsoft Teams, Webex and Amazon Chime.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Every meeting, online or in the room'
        say: >-
          LMA joins online meetings on every major platform. People can also stream a meeting from their browser, the Chrome extension, or the desktop app, or upload a recording. And in hybrid meetings, several people sharing one microphone in a conference room are told apart and named. Turn on the voice assistant, and anyone in the meeting can ask it a question out loud and hear the answer spoken, with an optional avatar on camera.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Informed consent'
        say: >-
          The moment it joins, LMA tells everyone in the meeting chat that the meeting is being recorded and transcribed, and how to object. An objection stops recording, and deployments can require everyone to opt in first.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'A live transcript, in any language'
        say: >-
          On LMA's own page, the transcript appears as people speak. Two people share one conference room microphone, and LMA tells their voices apart. Anyone following along can translate the transcript live, here into Spanish.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Ask the assistant during the meeting'
        say: >-
          This is where LMA goes beyond notes. While the meeting is still going, we ask the assistant which decisions are still open and who owns them. It reads everything said so far and answers in seconds: the offline sync decision, the trade-off write-up and the budget for the second hire are all still open. The assistant can also reach outside the meeting. Offline sync just came up, so we ask it to search the web for current best practices, and it brings back an answer with its sources.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Ask LMA in the meeting chat'
        say: >-
          Participants can ask too, without leaving the meeting. A question typed in the meeting chat is answered there, and both land in the transcript. With the voice assistant on, they can simply say its wake phrase and ask. LMA's answer is posted back to the meeting chat within seconds, and kept in the transcript under the question.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Connect it to your own systems'
        say: >-
          The assistant is extensible. Besides its built-in tools, it can call any MCP server: a CRM such as Salesforce, internal APIs, ticketing systems or knowledge bases. Connectors are added on the MCP Servers page, from the public MCP registry, where Salesforce servers are listed, or by entering your own endpoint. Here, DeepWiki is already connected, and the assistant can use it in any meeting.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'After the meeting'
        say: >-
          When the meeting ends, LMA writes the summary in sections, with action items and how well each agenda item was covered, and keeps a searchable key frame of every slide that was shared. Questions are not limited to one meeting. The Meetings Query Tool searches every meeting you have access to, and answers from their transcripts and summaries, here listing what has been decided about the launch across our meetings, and what is still open.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Consent and retention you can audit'
        say: >-
          For the people responsible for privacy, every meeting keeps an auditable consent record. Retention is under your control: transcripts are kept only for the days you set, or deleted as soon as the summary is written. LMA runs in your own AWS account, encrypts recordings with your key, and keeps meeting content out of its logs.
        do:
          - Perform the steps the narration describes, on the fixtures above.
      - label: 'Bring meetings into your AI agents'
        say: >-
          LMA is also an MCP server itself. AI agents such as Amazon Quick, Claude Desktop or your own can search your meetings, read transcripts and summaries, and even send LMA into a meeting, with each user seeing only their own meetings. Administrators manage every setting as named profiles, and when something goes wrong, a troubleshooting agent reads the deployment's own logs and explains the cause.
        do:
          - Perform the steps the narration describes, on the fixtures above.
    closing: >-
      That is Live Meeting Assistant: an AI teammate that joins your meetings, helps while they happen, connects to your systems and agents, and keeps consent and your data under your control. The LMA documentation has a quick start guide to deploy it in your own AWS account.
    takeaways:
      - 'An AI assistant that joins the meeting, on every major platform'
      - 'Ask it during the meeting, in LMA or in the meeting chat; it can search the web'
      - 'Extend it with MCP connectors such as Salesforce; use it from agents like Amazon Quick'
      - 'Consent records and retention you control, in your own AWS account'
      - 'Summaries, key frames and questions across all your meetings'
    not_shown:
      - 'A Salesforce connector in use (needs a Salesforce org); Amazon Quick calling LMA (shown as a slide and the Hosted MCP Access page); the voice assistant; the Desktop Capture App and Chrome extension in use'
    docs: docs/quick-start-guide.md
    category: 'Overview'
    last_recorded: {date: 2026-11-08, version: 0.4.0.dev2}
