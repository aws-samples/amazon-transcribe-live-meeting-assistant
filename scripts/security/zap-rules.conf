# OWASP ZAP rule configuration for scripts/security/zap_scan.py (make stacktest-zap).
# Passed to every packaged scan with `-c zap-rules.conf`; zap_scan.py also drops
# the IGNORE'd plugins from the counts it reports, which ZAP's own -c leaves in
# its JSON report for informational alerts.
#
# Format: <pluginId> <TAB> <action> <TAB> <comment>
#   IGNORE  the rule does not apply to these targets; its alerts are dropped.
#   WARN    reported; the default for every rule not listed here.
#   FAIL    reported as a failure by ZAP. zap_scan.py is WARN-only today and
#           exits 0 whatever ZAP reports, so FAIL changes the label, not the
#           exit status, until the run is made to gate (docs/security-testing.md).
#
# Triage: run `make stacktest-zap`, read scratch/zap-reports/latest/summary.md and
# the HTML reports, then for each recurring alert either change the code, mark
# the rule IGNORE here with the reason it does not apply, or leave it WARN.
# Write the reason as a statement about LMA's code, not about what the alert
# would otherwise allow (CLAUDE.md, Security Disclosure Hygiene).
#
# Plugin ids: https://www.zaproxy.org/docs/alerts/

# --- Not applicable to these targets ---------------------------------------
# The GraphQL API and the MCP endpoint answer JSON to authenticated POSTs.
10096	IGNORE	(Timestamp Disclosure: the JSON answers carry meeting timestamps by design)
10027	IGNORE	(Information Disclosure - Suspicious Comments: matches words in minified third-party bundles and JSON)
10049	IGNORE	(Non-Storable Content: authenticated API answers are not meant to be cached)
100000	IGNORE	(A Client Error response code was returned: ZAP's generated arguments are refused with 4xx by design)

