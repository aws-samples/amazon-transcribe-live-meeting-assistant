AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Amazon Transcribe Live Meeting Assist - Meeting Assist Setup

Parameters:
  # Required
  LMAStackName:
    Type: String
    Description: LMA Stack Name

  # Required
  AISTACK:
    Type: String
    Description: AISTACK Stack ARN

  COGNITOSTACK:
    Type: String
    Description: COGNITOSTACK Stack ARN

  MeetingAssistService:
    Type: String
    Description: Choose which knowledge base / LLM service to use

  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
    AllowedPattern: "^(|[0-9a-zA-Z]{10})$"

  BedrockKnowledgeBaseS3BucketName:
    Type: String

  MeetingAssistServiceBedrockModelID:
    Type: String
    # lma-main.yaml always passes this through, so the default is only reached by
    # a standalone deployment of this template. It tracks lma-main's own default
    # rather than naming a model no longer offered there.
    Default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"

  MeetingAssistKnowledgeBaseModelID:
    Type: String
    # The model the Bedrock Knowledge Bases generate their answers with, kept
    # separate from the agent's model above because RetrieveAndGenerate accepts a
    # narrower set of models than Converse does. AllowedValues are stated in
    # lma-main.yaml, which always passes this through; as above, the default here
    # is only reached by a standalone deployment of this template.
    Default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"

  TavilyApiKeySecretArn:
    Type: String
    Default: ""
    Description: >-
      (Optional - STRANDS_BEDROCK only) ARN of the Secrets Manager secret holding the Tavily
      API key, which enables the web search tool. When provided, the Strands agent can search
      the web for current information during meetings. Leave blank to disable web search
      capability. The function reads the ARN from its environment and fetches the key on the
      first web search of each execution environment.

  TranscriptBedrockKnowledgeBaseId:
    Type: String
    Default: ""
    AllowedPattern: "^(|[0-9a-zA-Z]{10})$"

  WebAppBucket:
    Type: String
    Description: The LMA Web App Bucket Name.

  CloudFrontDistributionId:
    Type: String
    Description: The LMA web app CloudFront distribution id

  CloudFrontDomainName:
    Type: String
    Description: The domain name of the LMA CloudFront distribution

  AppSyncGraphQLUrl:
    Type: String
    Description: The AppSync GraphQL API URL

  EventApiHttpUrl:
    Type: String
    Default: ""
    Description: The AppSync Event API HTTP URL for MCP browser control

  MCPServersTableName:
    Type: String
    Default: ""
    Description: The DynamoDB table name for MCP server configurations

  FetchTranscriptFunctionArn:
    Type: String
    Description: ARN of Fetch Transcript function

  TranscriptSummaryFunctionArn:
    Type: String
    Description: ARN of Transcript Summary function (if defined)

  # Changes to Params below force MeetingAssist Setup to update.
  TranscribeLanguageCode:
    Type: String
  TranscriptLambdaHookFunctionArn:
    Type: String
  TranscriptLambdaHookFunctionNonPartialOnly:
    Type: String
  MeetingRecordExpirationInDays:
    Type: String
  TranscriptionExpirationInDays:
    Type: String
  EndOfCallTranscriptSummary:
    Type: String
  EndOfCallLambdaHookFunctionArn:
    Type: String
  Version:
    Type: String

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 14
    Description: The number of days log events are kept in CloudWatch Logs.

  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: ARN of the customer managed KMS key for encryption

  BedrockGuardrailId:
    Type: String
    Default: ""
    Description: >-
      (Optional) Bedrock Guardrail ID for the Strands agent -- the bare ID only
      (for example abcd1234efgh), not the full guardrail ARN. The ARN is built
      from this value. Leave blank to apply no guardrail.
    # Matches the bare-identifier half of the Bedrock guardrailIdentifier pattern.
    # Rejecting an ARN here is deliberate: pasting one would otherwise be
    # substituted into arn:...:guardrail/${BedrockGuardrailId} and produce a
    # malformed ARN that only surfaces later as an AccessDenied at request time.
    AllowedPattern: "^(|[a-z0-9]{1,64})$"
    ConstraintDescription: >-
      Must be empty, or a Bedrock guardrail ID of 1-64 lowercase alphanumeric
      characters. Supply the ID only, not the guardrail ARN.

  BedrockGuardrailVersion:
    Type: String
    Default: "DRAFT"
    Description: Bedrock Guardrail Version for the Strands agent

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM managed policy to use as permissions boundary for IAM roles.
      If provided, this policy will limit the maximum permissions that can be granted to IAM roles
      in this stack, providing an additional layer of security.

  # Inputs for the troubleshooting agent. Each defaults to empty so a
  # standalone deployment of this template still creates a stack. The agent is
  # created when the two table names are supplied, because without them it has
  # nothing to read; AppSyncApiId is optional and gates only the grants that
  # name this deployment's API — see ShouldDeployTroubleshootingAgent and
  # HasAppSyncApiId below.
  VirtualParticipantTableName:
    Type: String
    Default: ""
    Description: >-
      (Optional) Name of the VirtualParticipant DynamoDB table, read by the
      troubleshooting agent.

  LLMPromptTemplateTableName:
    Type: String
    Default: ""
    Description: >-
      (Optional) Name of the LLM prompt template DynamoDB table, which holds the
      troubleshooting agent's system prompt.

  AppSyncApiId:
    Type: String
    Default: ""
    Description: >-
      (Optional) AppSync GraphQL API id. Used to scope the troubleshooting
      agent's read of the API's service-managed log group to this deployment's
      API.

  EventSourcingTableName:
    Type: String
    Default: ""
    Description: >-
      (Optional) Name of the meeting table. When supplied, the meeting assistant
      records the token usage of each answer there, under the meeting's mtr#
      partition, for the meeting cost estimate.

Conditions:
  ShouldUseStrandsBedrock: !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK"]
  ShouldUseStrandsBedrockWithKBCreate: !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK_WITH_KB (Create)"]
  ShouldUseStrandsBedrockWithKBExisting: !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK_WITH_KB (Use Existing)"]
  ShouldUseStrandsBedrockWithKB: !Or [
    !Condition ShouldUseStrandsBedrockWithKBCreate,
    !Condition ShouldUseStrandsBedrockWithKBExisting
  ]
  ShouldDeployStrandsFunction: !Or [
    !Condition ShouldUseStrandsBedrock,
    !Condition ShouldUseStrandsBedrockWithKB
  ]
  HasSummaryLambdaFunction:
    !Not [!Equals [!Ref TranscriptSummaryFunctionArn, ""]]
  IsBedrockKnowledgeBaseS3BucketName:
    Fn::Not:
      - Fn::Equals:
          - ""
          - Ref: BedrockKnowledgeBaseS3BucketName
  ShouldConfigureTranscriptBedrockKB:
    !Not [!Equals [!Ref TranscriptBedrockKnowledgeBaseId, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  # BedrockGuardrailId is empty by default; the agent only applies a guardrail
  # when both the id and the version have a value.
  HasBedrockGuardrail: !And [
    !Not [!Equals [!Ref BedrockGuardrailId, ""]],
    !Not [!Equals [!Ref BedrockGuardrailVersion, ""]]
  ]
  # Empty unless the deployment configured a Tavily API key, in which case the
  # web search tool is available and the function is granted the one secret
  # that supplies it.
  HasTavilyApiKeySecret: !Not [!Equals [!Ref TavilyApiKeySecretArn, ""]]
  # The troubleshooting agent needs a prompt to run on and records to read, so
  # it is created only when both tables are named. lma-main.yaml always names
  # them; a standalone deployment of this template does not have to.
  ShouldDeployTroubleshootingAgent: !And [
    !Not [!Equals [!Ref LLMPromptTemplateTableName, ""]],
    !Not [!Equals [!Ref VirtualParticipantTableName, ""]]
  ]
  # Scoping the AppSync log-group grant needs the API id. Without it the grant
  # is omitted rather than widened, so the agent simply does not see AppSync's
  # own log group.
  HasAppSyncApiId: !Not [!Equals [!Ref AppSyncApiId, ""]]
  # Metering for the meeting cost estimate is written only when the meeting
  # table is named; a standalone deployment of this template meters nothing.
  HasEventSourcingTable: !Not [!Equals [!Ref EventSourcingTableName, ""]]
  # The Strands layer is shared by the two agents in this stack, and either one
  # alone is reason enough to build it. Without this the layer would exist only
  # when the meeting assistant is Strands-backed, and the troubleshooting agent
  # would reference a resource that is not there.
  ShouldDeployStrandsLayer: !Or [
    !Condition ShouldDeployStrandsFunction,
    !Condition ShouldDeployTroubleshootingAgent
  ]

Resources:
  Boto3Layer:
    Type: "AWS::Lambda::LayerVersion"
    Properties:
      Content: ./boto3_layer
      CompatibleRuntimes:
        - python3.12

  # Strands Lambda Layer for Strands SDK, shared by the meeting assistant and
  # the troubleshooting agent.
  StrandsLayer:
    Type: "AWS::Lambda::LayerVersion"
    Condition: ShouldDeployStrandsLayer
    Properties:
      LayerName: !Sub "${LMAStackName}-strands-layer"
      Description: "Strands Agents SDK, shared by the meeting assistant and the troubleshooting agent"
      Content: ./strands_layer
      CompatibleRuntimes:
        - python3.12

  StrandsMeetingAssistFunctionRole:
    Condition: ShouldDeployStrandsFunction
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - "bedrock:GetInferenceProfile"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Scoped to the guardrail named by BedrockGuardrailId. The
              # statement is omitted entirely when no guardrail is configured,
              # which is the default.
              - !If
                - HasBedrockGuardrail
                - Effect: Allow
                  Action:
                    - "bedrock:ApplyGuardrail"
                  Resource:
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
                - !Ref AWS::NoValue
          PolicyName: BedrockPolicy
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:Retrieve"
                  - "bedrock:RetrieveAndGenerate"
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
          PolicyName: BedrockKBPolicy
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:Query"
                  - "dynamodb:GetItem"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"
              - Effect: Allow
                Action:
                  - "dynamodb:Query"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MCPServersTableName}"
              - Effect: Allow
                Action:
                  - "dynamodb:UpdateItem"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MCPServersTableName}"
          PolicyName: DynamoDBPolicy
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:Encrypt"
                  - "kms:DescribeKey"
                Resource:
                  - !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
          PolicyName: KMSPolicy
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:Encrypt"
                  - "kms:GenerateDataKey"
                Resource:
                  - !Ref CustomerManagedEncryptionKeyArn
          PolicyName: KMSDecryptPolicy
        # Reads the one secret that supplies the Tavily API key for the web
        # search tool, by ARN. Absent when no key is configured, so a
        # deployment without web search grants no Secrets Manager access at
        # all. The kms:Decrypt statement is scoped to reads made through
        # Secrets Manager and keeps this grant self-contained; KMSDecryptPolicy
        # above already permits the key for the function's other uses.
        - !If
          - HasTavilyApiKeySecret
          - PolicyName: TavilyApiKeySecretPolicy
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action: "secretsmanager:GetSecretValue"
                  Resource: !Ref TavilyApiKeySecretArn
                - Effect: Allow
                  Action: "kms:Decrypt"
                  Resource: !Ref CustomerManagedEncryptionKeyArn
                  Condition:
                    StringEquals:
                      "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
          - !Ref AWS::NoValue
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "appsync:GraphQL"
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/addChatToken"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/toggleVNCPreview"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/executeMCPCommand"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/publishMCPResult"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getMCPCommand"
                  # get_meeting_frames: the meeting's key frames, with signed
                  # links to their images (docs/meeting-video.md).
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getVideoKeyframes"
              - Effect: Allow
                Action:
                  - "appsync:EventPublish"
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/channelNamespace/mcp-commands"
          PolicyName: AppSyncGraphQLPolicy
        - PolicyName: InlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action: lambda:InvokeFunction
                Effect: Allow
                Resource: !Ref FetchTranscriptFunctionArn
        # Metering records for the meeting cost estimate: PutItem only, and
        # only under the mtr# partitions of the meeting table. The KMS grant
        # the table's encryption needs is in KMSPolicy above.
        - !If
          - HasEventSourcingTable
          - PolicyName: MeteringPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: "dynamodb:PutItem"
                  Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventSourcingTableName}"
                  Condition:
                    ForAllValues:StringLike:
                      "dynamodb:LeadingKeys":
                        - "mtr#*"
          - !Ref AWS::NoValue

  StrandsMeetingAssistFunction:
    Condition: ShouldDeployStrandsFunction
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_116: "DLQ not required for meeting assist function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      FunctionName: !Sub "STRANDS-${LMAStackName}-MeetingAssist"
      Role: !GetAtt StrandsMeetingAssistFunctionRole.Arn
      Handler: strands_meeting_assist_function.handler
      Runtime: python3.12
      Layers:
        - !Ref Boto3Layer
        - !Ref StrandsLayer
      Timeout: 300
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          FETCH_TRANSCRIPT_FUNCTION_ARN: !Ref FetchTranscriptFunctionArn
          MODEL_ID: !Ref MeetingAssistServiceBedrockModelID
          KB_MODEL_ID: !Ref MeetingAssistKnowledgeBaseModelID
          KB_ID: !Ref BedrockKnowledgeBaseId
          KB_REGION: !Ref AWS::Region
          KB_ACCOUNT_ID: !Ref AWS::AccountId
          TRANSCRIPT_KB_ID: !Ref TranscriptBedrockKnowledgeBaseId
          # The ARN of the secret holding the key, not the key. Non-empty is
          # what tells the function the web search tool is configured, so the
          # tool can be registered without reading Secrets Manager; the value
          # itself is fetched on the first search and cached for the life of
          # the execution environment.
          TAVILY_API_KEY_SECRET_ARN: !Ref TavilyApiKeySecretArn
          APPSYNC_GRAPHQL_URL: !Ref AppSyncGraphQLUrl
          EVENT_API_HTTP_URL: !Ref EventApiHttpUrl
          ENABLE_STREAMING: "true"
          MCP_SERVERS_TABLE: !Ref MCPServersTableName
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          KMS_KEY_ID: !Ref CustomerManagedEncryptionKeyArn
          BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrailId
          BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
          # Token usage per answer, for the meeting cost estimate. Empty
          # disables metering (see call_metering.py).
          METERING_TABLE_NAME: !Ref EventSourcingTableName
          METERING_EXPIRATION_DAYS: !Ref MeetingRecordExpirationInDays
      Code: ./src
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/StrandsMeetingAssistFunction
    DependsOn:
      - StrandsMeetingAssistFunctionLogGroup

  StrandsMeetingAssistFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldDeployStrandsFunction
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/StrandsMeetingAssistFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # ── Troubleshooting agent ────────────────────────────────────────────────
  #
  # This agent has a role of its own, held separately from the meeting
  # assistant's. The two serve different audiences -- the meeting assistant
  # answers questions for whoever is in a meeting, while this one reads the
  # deployment's operational logs for an operator -- so their permissions are
  # kept apart and should stay apart. Merging them for convenience would be a
  # change of posture, not a refactor.
  #
  # Every grant below is scoped to this deployment's own resources. The role
  # reads and does not change anything it diagnoses. The grants that are not
  # reads do not touch the deployment either, and they are of exactly these
  # kinds — stated as kinds rather than as a count, because a count in a
  # comment goes stale the moment one is added:
  #
  #   * narration — appsync:GraphQL on the single addChatToken mutation, so
  #     the investigation can report its progress to the UI;
  #   * cleanup — logs:StopQuery, so a query this role itself started can be
  #     cancelled;
  #   * its own telemetry — writing its own log stream, and its own X-Ray
  #     trace segments.
  #
  # lma-ai-stack/test/test_troubleshooting_agent_iam.py enumerates the role's
  # entire action surface, so that is the authoritative list; this comment is
  # the explanation of why each kind is here.
  #
  # Two deliberate omissions:
  #
  # * lambda:InvokeFunction is not granted. None of this agent's tools needs
  #   it, and it is the broadest mutating capability an otherwise read-only
  #   role could carry.
  # * No ecs:*, no states:*. The tools that would use them are not in this
  #   increment, and an unused grant is one nobody re-reads before relying on.
  TroubleshootingAgentFunctionRole:
    Condition: ShouldDeployTroubleshootingAgent
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >-
              These actions support no resource-level permissions, so the
              statements that carry them cannot be narrowed:
              logs:DescribeLogGroups lists the account's log groups and takes
              no log group as input; logs:GetQueryResults and logs:StopQuery
              take a query id; xray:PutTraceSegments and
              xray:PutTelemetryRecords are what active tracing requires and
              name no resource. Which log groups the agent can read is bounded
              by logs:StartQuery, which is scoped to this deployment's own log
              groups, and the role carries no action that changes anything it
              diagnoses — see the role comment above for the kinds of non-read
              grant it does hold.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # No AWSLambdaBasicExecutionRole, and no managed policy at all. That one
      # grants logs:CreateLogGroup, CreateLogStream and PutLogEvents across the
      # whole account, which are writes — and a managed policy's contents are
      # not in this template, so attaching one would put permissions outside
      # the reach of the assertions in
      # lma-ai-stack/test/test_troubleshooting_agent_iam.py, which enumerate
      # this role's entire action surface. The function's own log writes are
      # granted inline below, scoped to the one log group it writes to.
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        # Writing this function's own logs, and nothing else's. CreateLogGroup
        # is not needed: the log group is a resource in this template and the
        # function names it through LoggingConfig.
        - PolicyName: OwnLogWritePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}/lambda/TroubleshootingAgentFunction:*"
        # What TracingConfig Mode: Active needs in order to record anything.
        # Neither action names a resource, so neither can be scoped. Granted
        # inline rather than through AWSXRayDaemonWriteAccess for the same
        # reason this role attaches no managed policy at all: a managed
        # policy's contents are not in this template, and every action this
        # role holds has to be visible to the tests that enumerate them.
        - PolicyName: XRayWritePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "xray:PutTraceSegments"
                  - "xray:PutTelemetryRecords"
                Resource: "*"
        # Reading this deployment's logs.
        #
        # Named per nested stack rather than by the bare "/${LMAStackName}-*"
        # prefix. A nested stack's log groups are named after its generated
        # name, "<parent>-<LOGICALID>-<suffix>", so including the logical id
        # keeps the grant to stacks this template's own parent created: in an
        # account holding both "LMA" and "LMA-dev", "/LMA-*" would also cover
        # the latter's groups, and this agent's whole value rests on the
        # evidence it quotes belonging to the deployment it was asked about.
        #
        # The MicroVM groups are named exactly for the same reason, and the
        # parent-stack prefix carries its trailing separator so it cannot match
        # a longer sibling name.
        - PolicyName: DiagnosticLogReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DescribeLogGroups returns the log groups of the whole account
              # and takes no log group as input, so the IAM service
              # authorization reference lists no resource type for it: the
              # logGroupNamePrefix in the request is a filter on the response,
              # not the resource authorized against. Scoping it would deny
              # every call. Which groups are *reported* is decided in
              # troubleshooting_discovery, and which can be *read* is decided
              # by the scoped StartQuery below.
              - Effect: Allow
                Action: "logs:DescribeLogGroups"
                Resource: "*"
              # DescribeLogStreams is deliberately not granted: no tool calls
              # it, and an unused grant is one nobody re-reads before relying
              # on it.
              - Effect: Allow
                Action: "logs:StartQuery"
                # One entry per nested stack lma-main.yaml deploys. Discovery
                # pages log groups for every nested stack the parent reports,
                # so a stack missing here is one whose groups are listed and
                # then cannot be queried -- and a single query naming it fails
                # as a whole, reported to the agent as a tool fault rather than
                # as a permission gap. test_troubleshooting_agent_iam.py
                # compares this list against lma-main.yaml so a new nested
                # stack cannot drift out of it.
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-AISTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-MEETINGASSISTSETUP-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-VIRTUALPARTICIPANTSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-WEBSOCKETTRANSCRIBERSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-ASRMICROVMSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-COGNITOSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-LLMTEMPLATESTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-CHATBUTTONCONFIGSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-NOVASONICONFIGSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-BROWSEREXTENSIONSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-DESKTOPCAPTUREAPPSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-BEDROCKKB-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-TRANSCRIPTBEDROCKKB-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${LMAStackName}-VPCSTACK-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-vp-logs*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-asr-logs*"
                  # The MicroVM groups images built before v0.3.11 log to,
                  # which a stack upgraded from that release keeps. Named
                  # exactly, as the group and as its streams, with no trailing
                  # wildcard on the name: "-vp*" would also cover a
                  # neighbouring "${LMAStackName}-vpn" deployment's groups.
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-vp"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-vp:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-asr"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/${LMAStackName}-asr:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${LMAStackName}-VIRTUALPARTICIPANTSTACK-*"
                  - !If
                    - HasAppSyncApiId
                    - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/apis/${AppSyncApiId}*"
                    - !Ref AWS::NoValue
              # Collecting and cancelling a query. Both take a query id, not a
              # log group, and support no resource-level permissions.
              - Effect: Allow
                Action:
                  - "logs:GetQueryResults"
                  - "logs:StopQuery"
                Resource: "*"
        # The two records the agent reads, by table, rather than table/*.
        - PolicyName: DiagnosticRecordReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "dynamodb:GetItem"
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VirtualParticipantTableName}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LLMPromptTemplateTableName}"
        # Which components this deployment runs, and which nested stacks it
        # owns. ListStackResources is what lets log-group discovery match this
        # deployment's own nested stacks by name instead of by a prefix that a
        # neighbouring stack could share; both calls are on the parent stack
        # alone, named exactly.
        - PolicyName: DiagnosticStackReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:ListStackResources"
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LMAStackName}/*"
        - PolicyName: BedrockPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action: "bedrock:GetInferenceProfile"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Omitted entirely when no guardrail is configured, which is the
              # default.
              - !If
                - HasBedrockGuardrail
                - Effect: Allow
                  Action: "bedrock:ApplyGuardrail"
                  Resource:
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
                - !Ref AWS::NoValue
        # Narrating the investigation to the UI: one mutation field, the same
        # one the meeting assistant streams through, on this deployment's own
        # API. Omitted entirely rather than widened to apis/* when no API id
        # was supplied — the deployment then simply publishes no thinking
        # steps, which costs narration and nothing else. lma-main.yaml always
        # supplies the id, so this only affects a standalone deployment of this
        # template.
        - !If
          - HasAppSyncApiId
          - PolicyName: AppSyncGraphQLPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: "appsync:GraphQL"
                  Resource:
                    - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AppSyncApiId}/types/Mutation/fields/addChatToken"
          - !Ref AWS::NoValue
        # Reading the CMK-encrypted tables and log groups. Scoped to reads made
        # through those two services, so the key is not usable for anything
        # else this role can reach.
        - PolicyName: KMSPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:DescribeKey"
                Resource:
                  - !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"
                      - !Sub "logs.${AWS::Region}.${AWS::URLSuffix}"

  TroubleshootingAgentFunction:
    Condition: ShouldDeployTroubleshootingAgent
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_116: "DLQ not applicable - invoked synchronously for one diagnosis at a time; a failed run is reported, never retried"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only reads AWS service APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency; it has no user-facing entry point in this release"
    # checkov:skip=CKV_AWS_173: "Environment variables hold resource names and model configuration, no sensitive data"
    Properties:
      FunctionName: !Sub "STRANDS-${LMAStackName}-Troubleshooting"
      Role: !GetAtt TroubleshootingAgentFunctionRole.Arn
      Handler: troubleshooting_agent_function.handler
      Runtime: python3.12
      Layers:
        - !Ref Boto3Layer
        - !Ref StrandsLayer
      # Comfortably longer than the agent's own wall-clock budget (240s by
      # default) so the agent reports running out of time rather than being
      # killed mid-answer.
      Timeout: 300
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          LMA_STACK_NAME: !Ref LMAStackName
          VIRTUAL_PARTICIPANT_TABLE_NAME: !Ref VirtualParticipantTableName
          LLM_PROMPT_TEMPLATE_TABLE_NAME: !Ref LLMPromptTemplateTableName
          APPSYNC_GRAPHQL_URL: !Ref AppSyncGraphQLUrl
          # Names the service-managed AppSync log group, and is the same
          # value the IAM grant for that group is scoped to, so the two
          # cannot disagree.
          APPSYNC_API_ID: !Ref AppSyncApiId
          # Tracks the meeting assistant's model so a deployment that selected a
          # stronger model gets a stronger diagnosis, without adding a
          # parameter of its own.
          TROUBLESHOOTING_MODEL_ID: !Ref MeetingAssistServiceBedrockModelID
          BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrailId
          BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
      Code: ./src
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/TroubleshootingAgentFunction
    DependsOn:
      - TroubleshootingAgentFunctionLogGroup

  # "A failed run is reported, never retried" is a property of the agent, and
  # this is what makes it true for every way the function can be invoked.
  # Lambda retries an asynchronous invocation twice by default, so a run that
  # timed out or was killed for memory would otherwise be re-run from the
  # original question -- paying again for every tool call it already made, for
  # a question whose answer has not changed.
  TroubleshootingAgentFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: ShouldDeployTroubleshootingAgent
    Properties:
      FunctionName: !Ref TroubleshootingAgentFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 0

  TroubleshootingAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldDeployTroubleshootingAgent
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/TroubleshootingAgentFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  SetupFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: InlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Effect: Allow
                Resource:
                  - !Ref AISTACK
              - Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Effect: Allow
                Resource:
                  - !Ref COGNITOSTACK
              - Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionConfiguration
                Effect: Allow
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LMAStackName}*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:STRANDS-${LMAStackName}*"
              - Action:
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                Effect: Allow
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
              - Action:
                  - s3:GetObject
                  - s3:PutObject
                Effect: Allow
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${WebAppBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${WebAppBucket}/*"
              - Action:
                  - cloudfront:CreateInvalidation
                Effect: Allow
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"

  SetupFunction:
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
          - id: W58
            reason: Managed policy already provides access to CloudWatch logs.
    # checkov:skip=CKV_AWS_116: "DLQ not required for setup/configuration function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      Role: !GetAtt SetupFunctionRole.Arn
      Handler: setup_function.handler
      Runtime: python3.12
      Timeout: 900
      TracingConfig:
        Mode: Active
      Code: ./src
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/SetupFunction
    DependsOn:
      - SetupFunctionLogGroup

  SetupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/SetupFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  SetupFunctionResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt SetupFunction.Arn
      AISTACK: !Ref AISTACK
      COGNITOSTACK: !Ref COGNITOSTACK
      MeetingAssistService: !Ref MeetingAssistService
      StrandsMeetingAssistFunction: !If
        - ShouldDeployStrandsFunction
        - !Ref StrandsMeetingAssistFunction
        - !Ref AWS::NoValue
      TranscriptBedrockKnowledgeBaseId: !If
        - ShouldConfigureTranscriptBedrockKB
        - !Ref TranscriptBedrockKnowledgeBaseId
        - !Ref AWS::NoValue
      CloudFrontDomainName: !Sub "https://${CloudFrontDomainName}/"
      # Changes to Params below force MeetingAssist Setup to execute.
      TranscribeLanguageCode: !Ref TranscribeLanguageCode
      TranscriptLambdaHookFunctionArn: !Ref TranscriptLambdaHookFunctionArn
      TranscriptLambdaHookFunctionNonPartialOnly: !Ref TranscriptLambdaHookFunctionNonPartialOnly
      MeetingRecordExpirationInDays: !Ref MeetingRecordExpirationInDays
      TranscriptionExpirationInDays: !Ref TranscriptionExpirationInDays
      EndOfCallTranscriptSummary: !Ref EndOfCallTranscriptSummary
      EndOfCallLambdaHookFunctionArn: !Ref EndOfCallLambdaHookFunctionArn
      Version: !Ref Version
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

Outputs:
  StrandsMeetingAssistFunctionArn:
    Description: ARN of the Strands Meeting Assist Lambda function
    Value: !If [ShouldDeployStrandsFunction, !GetAtt StrandsMeetingAssistFunction.Arn, "NA"]

  TroubleshootingAgentFunctionArn:
    Description: >-
      ARN of the troubleshooting agent Lambda function. It has no user-facing
      entry point in this release; invoke it with the AWS CLI or SDK to
      diagnose a deployment.
    Value: !If
      - ShouldDeployTroubleshootingAgent
      - !GetAtt TroubleshootingAgentFunction.Arn
      - "NA"
