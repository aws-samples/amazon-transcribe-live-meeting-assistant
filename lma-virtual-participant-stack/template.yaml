AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon Transcribe Live Meeting Assistant - Virtual Participant

Parameters:
  LMAStackName:
    Type: String
    Description: LMA Stack Name

  StrandsLambdaArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of the Strands agent Lambda function (ASYNC_AGENT_ASSIST_ORCHESTRATOR_ARN).
      When provided, enables Nova voice agent to delegate complex queries to the Strands agent.

  # {LMA_USER} token is replaced by user's name at runtime.

  LMAIdentity:
    Type: String
    Default: LMA ({LMA_USER})

  IntroMessage:
    Type: String
    Default: >-
      Hello. I am an AI Live Meeting Assistant (LMA).
      I was invited by {LMA_USER} to join this call.
      Anyone here can ask me to leave at any time by typing "LMA leave" (or "LMA end") in chat.
      To learn more please visit: https://amazon.com/live-meeting-assistant.

  StartRecordingMessage:
    Type: String
    Default: >-
      Live Meeting Assistant started.

  StopRecordingMessage:
    Type: String
    Default: >
      Live Meeting Assistant stopped.

  ExitMessage:
    Type: String
    Default: >
      Live Meeting Assistant has left the room.

  # networking parameters
  VPC:
    Description: VPC ID
    Type: String

  PrivateSubnet1:
    Description: Private subnet 1 for Fargate
    Type: String

  PrivateSubnet2:
    Description: Private subnet 2 for Fargate
    Type: String

  PublicSubnet1:
    Description: Public subnet 1 for ALB
    Type: String

  PublicSubnet2:
    Description: Public subnet 2 for ALB
    Type: String

  LMASettingsParameterName:
    Type: String
    Description: LCA settings SSM Parameter store

  UpdateLMASettingsFunctionArn:
    Type: String
    Description: Update LMA Settings Lambda function ARN

  GraphQLEndpoint:
    Type: String
    Description: AppSync GraphQL endpoint URL for Virtual Participant status updates

  AppSyncEventApiUrl:
    Type: String
    Description: AppSync Event API WebSocket URL for MCP command delivery

  CloudFrontDomainName:
    Type: String
    Description: CloudFront domain name for VNC WebSocket URL construction

  VPTaskRegistryTableName:
    Type: String
    Description: Name of the VPTaskRegistry DynamoDB table from AI stack

  DomSelectorCacheTableName:
    Type: String
    Description: Name of the DomSelectorCache DynamoDB table from AI stack (shared by VP tasks for AI-discovered selectors)

  VPProfilesBucketName:
    Type: String
    Description: Name of the S3 bucket holding per-user persisted Chromium profiles

  EventSourcingTableName:
    Type: String
    Description: Name of the EventSourcingTable (CallEventTable) DynamoDB table from AI stack

  VNCTargetGroupArn:
    Type: String
    Description: ARN of the VNC Target Group from AI stack

  VNCALBListenerArn:
    Type: String
    Description: ARN of the VNC ALB Listener for creating dynamic routing rules

  VPSecurityGroupId:
    Type: String
    Description: Security Group ID for Virtual Participant ECS tasks from AI stack
  
  VirtualParticipantTableName:
    Type: String
    Description: Name of the VirtualParticipant DynamoDB table from AI stack

  VirtualParticipantTableStreamArn:
    Type: String
    Description: ARN of the VirtualParticipant DynamoDB table stream from AI stack


  # container source code
  SourceCodeLocation:
    Type: String
    Description: S3 location of the browser extension source code zipfile

  ArtifactBucket:
    Type: String
    Default: ""
    Description: >-
      S3 bucket holding published artifacts. Used for the MicroVM launcher
      Lambda's deployment package (Code.S3Bucket needs the bucket alone, and
      SourceCodeLocation is a combined "bucket/key" string).

  MicrovmLauncherS3Key:
    Type: String
    Default: ""
    Description: >-
      S3 key of the MicroVM launcher Lambda deployment package. Only used when
      VPLaunchType=MICROVM.

  MicrovmSourceCodeLocation:
    Type: String
    Default: ""
    Description: >-
      S3 location of the VP source packaged with the Dockerfile at the ZIP ROOT,
      as CreateMicrovmImage requires (its codeArtifact takes a bare URI, so it
      cannot be pointed at a subdirectory of the main source zip). Only used when
      VPLaunchType=MICROVM.

  # transcibe parameters

  EnableAudioRecording:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable or disable recording of audio during a meeting. If set to false, the
      meeting will not be recorded.
      If set to true, the meeting will be recorded.

  ZoomMeetingSdkClientId:
    Type: String
    Default: ""
    Description: >-
      (Optional) Zoom Meeting SDK app Client ID. When both ZoomMeetingSdkClientId
      and ZoomMeetingSdkClientSecret are provided, the Virtual Participant joins
      Zoom meetings via the Zoom Meeting Web SDK instead of automating the public
      web client. Requires Zoom approval/allowlist of the SDK app for meetings
      outside the app owner's own account. Leave both blank to use the default
      web-client join.

  ZoomMeetingSdkClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) Zoom Meeting SDK app Client Secret. Paired with
      ZoomMeetingSdkClientId. Used to sign the SDK join signature.

  AcsConnectionString:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) Azure Communication Services connection string
      (endpoint=https://...;accesskey=...). When provided, the Virtual
      Participant joins Microsoft Teams meetings via the ACS calling SDK
      (Teams interoperability) instead of automating the Teams web client.
      Leave blank to use the default web-client join.

  EnableVideoRecording:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Default for capturing meeting video (X11 screen recording) in addition to
      audio. This is the per-deployment default; each Virtual Participant can
      override it with the "Record meeting video" toggle in the LMA UI.

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) API key for ElevenLabs text-to-speech and conversational AI.
      When provided, enables voice interaction capabilities in Virtual Participant.

  ElevenLabsAgentId:
    Type: String
    Default: ""
    Description: >-
      (Optional) ElevenLabs Conversational AI Agent ID for custom personality.
      Leave blank to use default conversational agent.

  SimliApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) API key for Simli avatar. The avatar feature requires BOTH
      SimliApiKey and SimliFaceId — leave both blank to disable, or set both
      to enable animated avatar video for the Virtual Participant's camera
      feed. The avatar lip-syncs with the voice assistant's audio output.

  SimliFaceId:
    Type: String
    Default: ""
    Description: >-
      (Optional) Simli Face ID for the avatar appearance. Required when
      SimliApiKey is set — the avatar is enabled only when BOTH parameters
      are non-empty. Get this from your Simli dashboard at simli.com.

  SimliTransportMode:
    Type: String
    Default: "livekit"
    AllowedValues:
      - "livekit"
      - "p2p"
    Description: >-
      Simli transport mode. 'livekit' is more firewall-friendly,
      'p2p' offers slightly lower latency.

  VoiceAssistantProvider:
    Type: String
    Default: "none"
    AllowedValues:
      - "none"
      - "elevenlabs"
      - "amazon_nova_sonic"
    Description: Voice AI assistant provider (none, elevenlabs, amazon_nova_sonic)

  VoiceAssistantActivationMode:
    Type: String
    Default: "wake_phrase"
    AllowedValues:
      - "always_active"
      - "wake_phrase"
      - "strands_tool (coming soon)"
    Description: Voice assistant activation mode

  VoiceAssistantWakePhrases:
    Type: String
    Default: "hey alex,ok alex,hi alex,hello alex"
    Description: Comma-separated list of wake phrases (case-insensitive)

  VoiceAssistantActivationDuration:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 300
    Description: How long voice assistant stays active after wake phrase (seconds)

  NovaSonicConfigTableName:
    Type: String
    Default: ""
    Description: >-
      (Optional) DynamoDB table name for Nova Sonic configuration.
      When provided, enables customizable prompts for Nova voice assistant.

  NovaModelId:
    Type: String
    Default: "amazon.nova-2-sonic-v1:0"
    Description: >-
      (Optional) AWS Bedrock Nova model ID for voice assistant.
      Used when VoiceAssistantProvider is set to 'amazon_nova_sonic'.

  NovaSystemPrompt:
    Type: String
    Default: "You are Alex, an AI meeting assistant. Be concise and helpful."
    Description: >-
      (Optional) System prompt for Nova voice assistant.
      Defines the personality and behavior of the AI assistant.

  S3BucketName:
    Type: String
    Description: >
      Existing bucket where call recording files will be stored.
    # yamllint disable rule:line-length
    AllowedPattern: '( *|(?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$))'
    # yamllint enable rule:line-length

  AudioFilePrefix:
    Type: String
    Default: lma-audio-recordings/
    Description: >-
      The Amazon S3 prefix where the merged output audio files will be saved (must end in "/")

  VideoRecordingsPrefix:
    Type: String
    Default: lma-video-recordings/
    Description: >-
      The Amazon S3 prefix where the final meeting video (.mp4) files will be saved (must end in "/")

  VideoChunksPrefix:
    Type: String
    Default: lma-video-chunks/
    Description: >-
      The Amazon S3 prefix for in-progress video segment uploads. Cleaned up after
      each meeting's video is assembled; a lifecycle rule reaps any leftovers (must end in "/")

  CallDataStreamName:
    Type: String
    Description: >-
      The Name of Kinesis Data Stream to write the call data to.


  IsContentRedactionEnabled:
    Type: String
    Default: "false"
    Description: >-
      Enable content redaction from Amazon Transcribe transcription output. This is only used when
      the 'en-US' language is selected in the TranscribeLanguageCode parameter.
    AllowedValues:
      - "true"
      - "false"

  TranscribeContentRedactionType:
    Type: String
    Default: PII
    Description: >-
      Type of content redaction from Amazon Transcribe transcription output
    AllowedValues:
      - PII

  TranscribeLanguageCode:
    Type: String
    Description: >-
      Language code or language detection setting for Amazon Transcribe. NOTE: Streaming language identification can't 
      be combined with custom language models or redaction.
    Default: en-US
    AllowedValues:
      - identify-language
      - identify-multiple-languages
      - en-US
      - es-US
      - en-GB
      - fr-CA
      - fr-FR
      - en-AU
      - it-IT
      - de-DE
      - pt-BR
      - ja-JP
      - ko-KR
      - zh-CN
      - hi-IN
      - th-TH

  TranscribeLanguageOptions:
    Type: String
    Default: "en-US, es-US"
    AllowedPattern: '^(?:\s*(?:en-US|es-US|en-GB|fr-CA|fr-FR|en-AU|it-IT|de-DE|pt-BR|ja-JP|ko-KR|zh-CN|hi-IN|th-TH)\s*(?:,\s*(?:en-US|es-US|en-GB|fr-CA|fr-FR|en-AU|it-IT|de-DE|pt-BR|ja-JP|ko-KR|zh-CN|hi-IN|th-TH)\s*)*)?$'
    ConstraintDescription: >-
      Unsupported language code. Allowed values are: en-US, es-US, en-GB, fr-CA, fr-FR, en-AU, it-IT, de-DE, pt-BR, ja-JP, ko-KR, zh-CN, hi-IN, th-TH
    Description: >-
      When TranscribeLanguageCode is set to 'identify-language' or 'identify-multiple-languages',  
      specify two or more comma separated language codes, e.g. "en-US,es-US" that represent the languages you 
      think may be used in your meeting. Including more than five is not recommended. 
      You can select only one language dialect per language per stream - i.e. you cannot select both en-US and en-AU as language options.
      Allowed values are: en-US, es-US, en-GB, fr-CA, fr-FR, en-AU, it-IT, de-DE, pt-BR, ja-JP, ko-KR, zh-CN, hi-IN, th-TH

  TranscribePreferredLanguage:
    Type: String
    Description: >-
      Select a preferred language from the set of language codes you provide for TranscribeLanguageOptions, when 
      TranscribeLanguageCode is set to identify-language or identify-multiple-languages.
    Default: None
    AllowedValues:
      - None
      - en-US
      - es-US
      - en-GB
      - fr-CA
      - fr-FR
      - en-AU
      - it-IT
      - de-DE
      - pt-BR
      - ja-JP
      - ko-KR
      - zh-CN
      - hi-IN
      - th-TH

  CustomVocabularyName:
    Type: String
    Default: ""
    Description: >-
      The name of the vocabulary to use when processing the transcription job. Leave blank if no
      custom vocabulary to be used. If yes, the custom vocabulary must pre-exist in your account.

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 14
    Description: The number of days log events are kept in CloudWatch Logs.

  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: ARN of the customer managed KMS key for encryption

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM managed policy to use as permissions boundary for IAM roles.
      If provided, this policy will limit the maximum permissions that can be granted to IAM roles
      in this stack, providing an additional layer of security.

  # Startup Optimization Parameters
  VPLaunchType:
    Type: String
    Default: MICROVM
    AllowedValues:
      - FARGATE
      - EC2
      - MICROVM
    Description: >-
      Compute platform for Virtual Participant containers. MICROVM (default) uses
      AWS Lambda MicroVMs — no load balancer, no autoscaling, no host patching,
      per-meeting billing, and a fast start from a Firecracker snapshot (live view
      ready in ~20-25s); meetings are capped at 8 hours. EC2 uses an ECS cluster
      with a warm-instance capacity provider and image caching. FARGATE uses
      serverless ECS tasks with SOCI lazy loading.
      IMPORTANT: MICROVM requires a region where Lambda MicroVMs is available
      (us-east-1, us-east-2, us-west-2, ap-northeast-1, eu-west-1) and is not
      available in GovCloud. Deploying MICROVM in an unsupported region fails
      with "Unrecognized resource types: [AWS::Lambda::MicrovmImage]" — set
      EC2 or FARGATE in those regions.

  VPInstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge
      - m5.large
      - m5.xlarge
    Description: >-
      EC2 instance type (only used if VPLaunchType=EC2).
      Defaults to t3.medium which fits 1 VP task (capped at 2500 MB).
      The capacity-provider auto-scaler launches additional hosts (up to
      VPMaxInstances) when concurrent demand exceeds the current cluster's
      capacity, so users running one meeting at a time pay the t3.medium
      baseline (~$30/month) and only scale up while multiple VPs are active.
      Bump to t3.large (3 VPs/host) or larger if you regularly run >3 concurrent
      meetings and want fewer scale-outs. For voice assistant + Simli avatar
      workloads, use c5.xlarge or larger for sustained CPU performance (no
      burstable throttling). t3 instances are burstable and may cause audio
      glitches under sustained load.

  VPMinInstances:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Minimum warm EC2 instances (only used if VPLaunchType=EC2)

  VPMaxInstances:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Maximum EC2 instances (only used if VPLaunchType=EC2)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: >-
      Logging level for ECS containers and Lambda functions. Set to DEBUG for
      troubleshooting, INFO for normal operation.


Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasStrandsLambdaArn: !Not [!Equals [!Ref StrandsLambdaArn, ""]]
  ShouldEnableContentRedaction: !And
    - !Equals [!Ref IsContentRedactionEnabled, "true"]
    - !Equals [!Ref TranscribeLanguageCode, "en-US"]
  UseEC2LaunchType: !Equals [!Ref VPLaunchType, "EC2"]
  UseFargateLaunchType: !Equals [!Ref VPLaunchType, "FARGATE"]
  UseMicrovmLaunchType: !Equals [!Ref VPLaunchType, "MICROVM"]
  # Everything ECS-shaped: the cluster, task definition, ECS service, ALB target
  # group / listener rules, and the RunTask dispatch paths. Gating on this (rather
  # than adding a third branch at each of the ~20 existing launch-type sites)
  # keeps MICROVM additive — under MICROVM none of that infrastructure is created.
  UseECSLaunchType: !Or
    - !Condition UseEC2LaunchType
    - !Condition UseFargateLaunchType

Resources:
  LogsPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "CloudWatch Logs requires broad access for log group and stream creation"
    # checkov:skip=CKV_AWS_111: "CloudWatch Logs requires broad access for log group and stream creation"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      Path: /
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: "*"

  ### Build Resources ###
  ImageRepo:
    Type: AWS::ECR::Repository
    # checkov:skip=CKV_AWS_51: "MUTABLE required to support rolling :latest deployments from CodeBuild; IMMUTABLE would break redeployment model. Push is restricted to the CodeBuild service role, repo is private and KMS-encrypted with ScanOnPush enabled."
    Properties:
      EmptyOnDelete: true
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CustomerManagedEncryptionKeyArn

  BuildRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    # checkov:skip=CKV_AWS_111: "CodeBuild build role requires broad action access (ECR push, ECS/ASG deployment) scoped to specific resources; wildcards only on Action portion, not Resource"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "codebuild.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: "ECRPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${SourceCodeLocation}"
              - Effect: "Allow"
                Action:
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:BatchGetImage"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:CompleteLayerUpload"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:PutImage"
                  - "ecr:UploadLayerPart"
                Resource:
                  - !GetAtt ImageRepo.Arn
              - Effect: "Allow"
                Action:
                  - "ecr:GetAuthorizationToken"
                Resource:
                  - "*"
        - PolicyName: "ECSDeploymentPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ecs:UpdateService"
                  - "ecs:DescribeServices"
                  - "ecs:ListServices"
                  - "ecs:DescribeClusters"
                  - "ecs:ListContainerInstances"
                  - "ecs:DescribeContainerInstances"
                Resource:
                  - "*"
              - Effect: "Allow"
                Action:
                  - "autoscaling:DescribeAutoScalingGroups"
                  - "autoscaling:TerminateInstanceInAutoScalingGroup"
                  - "autoscaling:SetDesiredCapacity"
                Resource:
                  - "*"
              - Effect: "Allow"
                Action:
                  - "ec2:DescribeInstances"
                  - "ec2:TerminateInstances"
                Resource:
                  - "*"

  VirtualParticipantBuildProject:
    Type: AWS::CodeBuild::Project
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-CB4
            reason: 'CodeBuild encryption uses AWS-managed KMS (default); customer can override via EncryptionKey parameter'
    Properties:
      Source:
        Location: !Sub "arn:aws:s3:::${SourceCodeLocation}"
        Type: S3
        BuildSpec: !Sub
          - |
            version: 0.2
            phases:
              pre_build:
                # CONTINUE (not the default ABORT) so a pre_build failure still
                # reaches post_build's finally, which is what posts the response
                # to CloudFormation. Aborting here would strand the stack until
                # the 1-hour custom-resource timeout with no diagnostic.
                on-failure: CONTINUE
                commands:
                  # Under VPLaunchType=MICROVM the image is built by
                  # CreateMicrovmImage from the S3 source zip, not by this
                  # project: there is no ECR image, no SOCI index and no ECS
                  # service to redeploy. Skip straight to reporting success so
                  # the custom resource completes.
                  - |
                    if [ "$VP_LAUNCH_TYPE" = "MICROVM" ]; then
                      echo "MICROVM launch type: skipping ECR/SOCI container build."
                      echo "The MicroVM image is built by Lambda from the S3 source artifact."
                      exit 0
                    fi
                  - echo Logging in to Amazon ECR...
                  - aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                  - echo Installing SOCI CLI for image optimization...
                  - wget --quiet https://github.com/awslabs/soci-snapshotter/releases/download/v0.12.1/soci-snapshotter-0.12.1-linux-amd64.tar.gz
                  - tar xzf soci-snapshotter-0.12.1-linux-amd64.tar.gz soci
                  - mv soci /usr/local/bin/soci
                  - soci --version
                  - echo SOCI CLI installed successfully
                  - export PASSWORD=$(aws ecr get-login-password --region ${AWS::Region})
              build:
                on-failure: CONTINUE
                commands:
                  # MICROVM: nothing to build here (see pre_build).
                  - |
                    if [ "$VP_LAUNCH_TYPE" = "MICROVM" ]; then
                      echo "MICROVM launch type: no container build required."
                      exit 0
                    fi
                  - echo Build started on `date`
                  - echo `pwd`
                  - echo `ls -altr`
                  - echo Building container image...
                  - docker build --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg BUILD_SOURCE=codebuild -t ${ImageRepo} backend
                  - docker tag ${ImageRepo}:latest ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest
                  - echo Pushing image to ECR...
                  - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest
                  - echo Exporting image for SOCI indexing...
                  - docker save ${ImageRepo}:latest -o ./image.tar
                  - echo Importing image to containerd...
                  - ctr image import ./image.tar
                  - echo Tagging for SOCI...
                  - ctr image tag docker.io/library/${ImageRepo}:latest ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest
              post_build:
                commands:
                  # pre_build/build use on-failure CONTINUE so the finally below
                  # always reports to CloudFormation; skip the SOCI/deploy work
                  # when an earlier phase already failed.
                  - |
                    if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
                      echo "Earlier phase failed — skipping SOCI index and ECS deploy."
                      exit 1
                    fi
                  # MICROVM: no ECR image to index and no ECS service to
                  # redeploy. Fall through to the `finally` block below, which
                  # is what posts SUCCESS to CloudFormation.
                  - |
                    if [ "$VP_LAUNCH_TYPE" = "MICROVM" ]; then
                      echo "MICROVM launch type: skipping SOCI index and ECS deploy."
                      exit 0
                    fi
                  - echo Generating SOCI index for faster startup...
                  - soci create ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest
                  - echo Pushing SOCI index to ECR...
                  - soci push --user AWS:$PASSWORD ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest
                  - echo Build completed on `date`
                  - |
                    echo "Deploying new image to ECS..."
                    # Find the ECS service for this stack
                    CLUSTER_ARN="${ClusterArn}"
                    SERVICE_NAME=$(aws ecs list-services --cluster $CLUSTER_ARN --region ${AWS::Region} --query 'serviceArns[0]' --output text)
                    
                    if [ "$SERVICE_NAME" != "None" ] && [ -n "$SERVICE_NAME" ]; then
                      echo "Found ECS service: $SERVICE_NAME"
                      
                      # Get service details to determine launch type
                      LAUNCH_TYPE=$(aws ecs describe-services --cluster $CLUSTER_ARN --services $SERVICE_NAME --region ${AWS::Region} --query 'services[0].launchType' --output text)
                      echo "Launch type: $LAUNCH_TYPE"
                      
                      # Force new deployment to pull latest image
                      echo "Forcing ECS service update to deploy new image..."
                      aws ecs update-service --cluster $CLUSTER_ARN --service $SERVICE_NAME --force-new-deployment --region ${AWS::Region}
                      
                      # For EC2 launch type, terminate instances to force fresh pull
                      if [ "$LAUNCH_TYPE" = "EC2" ]; then
                        echo "EC2 launch type detected - terminating instances to force image refresh..."
                        
                        # Get container instances
                        CONTAINER_INSTANCES=$(aws ecs list-container-instances --cluster $CLUSTER_ARN --region ${AWS::Region} --query 'containerInstanceArns' --output text)
                        
                        if [ -n "$CONTAINER_INSTANCES" ]; then
                          # Get EC2 instance IDs from container instances
                          for CONTAINER_INSTANCE in $CONTAINER_INSTANCES; do
                            EC2_INSTANCE_ID=$(aws ecs describe-container-instances --cluster $CLUSTER_ARN --container-instances $CONTAINER_INSTANCE --region ${AWS::Region} --query 'containerInstances[0].ec2InstanceId' --output text)
                            
                            if [ -n "$EC2_INSTANCE_ID" ] && [ "$EC2_INSTANCE_ID" != "None" ]; then
                              echo "Terminating EC2 instance: $EC2_INSTANCE_ID"
                              
                              # Check if instance is in an Auto Scaling Group
                              ASG_NAME=$(aws autoscaling describe-auto-scaling-instances --instance-ids $EC2_INSTANCE_ID --region ${AWS::Region} --query 'AutoScalingInstances[0].AutoScalingGroupName' --output text 2>/dev/null || echo "")
                              
                              if [ -n "$ASG_NAME" ] && [ "$ASG_NAME" != "None" ]; then
                                echo "Instance is in ASG: $ASG_NAME - terminating via ASG..."
                                aws autoscaling terminate-instance-in-auto-scaling-group --instance-id $EC2_INSTANCE_ID --should-decrement-desired-capacity false --region ${AWS::Region}
                              else
                                echo "Instance not in ASG - terminating directly..."
                                aws ec2 terminate-instances --instance-ids $EC2_INSTANCE_ID --region ${AWS::Region}
                              fi
                            fi
                          done
                          echo "EC2 instances terminated. Auto Scaling will launch new instances with fresh Docker image."
                        else
                          echo "No container instances found in cluster."
                        fi
                      else
                        echo "FARGATE launch type - service update will automatically use new image."
                      fi
                      
                      echo "Deployment initiated successfully!"
                    else
                      echo "No ECS service found in cluster - skipping deployment."
                    fi
                finally:
                  - |
                    if [ -n "$CFN_RESPONSE_URL" ]; then
                      if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
                        RESP_STATUS=SUCCESS; RESP_REASON="Container build and deploy completed"
                      else
                        RESP_STATUS=FAILED; RESP_REASON="Container build failed; see CodeBuild logs"
                      fi
                      RESP_PAYLOAD=$(printf '{"Status":"%s","Reason":"%s (build %s)","PhysicalResourceId":"vp-container-build","StackId":"%s","RequestId":"%s","LogicalResourceId":"%s","Data":{}}' "$RESP_STATUS" "$RESP_REASON" "$CODEBUILD_BUILD_ID" "$CFN_STACK_ID" "$CFN_REQUEST_ID" "$CFN_LOGICAL_RESOURCE_ID")
                      curl -s -X PUT -H 'Content-Type:' --data-binary "$RESP_PAYLOAD" "$CFN_RESPONSE_URL"
                    fi
          - { ImageRepo: !Ref ImageRepo, ClusterArn: !GetAtt Cluster.Arn }
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        # MEDIUM (4 vCPU / 7 GB) over SMALL (2 vCPU / 3 GB): the build is CPU/IO
        # bound (apt install of ~50 packages, npm ci/build, and the multi-GB
        # `docker save` SOCI round-trip), so the extra cores/RAM cut wall-clock
        # well beyond the modest per-minute price increase.
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: SOURCE_CODE_LOCATION
            Value: !Sub "${SourceCodeLocation}"
          - Name: CONTAINERD_ADDRESS
            Value: "/var/run/docker/containerd/containerd.sock"
          # Read by the buildspec to skip the ECR/SOCI/ECS pipeline entirely
          # under MICROVM, where Lambda builds the image from the S3 artifact.
          - Name: VP_LAUNCH_TYPE
            Value: !Ref VPLaunchType
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS

  ### Custom Resources ###

  BuildCustomResourceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "CodeBuild integration requires broad access for build project management"
    # checkov:skip=CKV_AWS_111: "CodeBuild integration requires broad access for build project management"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: BuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - "*"

  BuildCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with AWS services via APIs
          - id: W92
            reason: Function does not require reserved concurrency as it scales based on demand
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
    Properties:
      Handler: index.handler
      Role: !GetAtt BuildCustomResourceRole.Arn
      Timeout: 900
      Runtime: python3.12
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          # The container build exceeds the 15-minute Lambda ceiling, so this
          # function cannot wait for it. It starts the build with the callback
          # details injected as env vars; the buildspec's post_build "finally"
          # posts SUCCESS/FAILED to CloudFormation when the build completes.
          def handler(event, context):

            request_type = event['RequestType']
            print(request_type)

            try:
              if request_type in ['Create', 'Update']:
                client = boto3.client("codebuild")
                build_id = client.start_build(
                  projectName=event['ResourceProperties']['PROJECT'],
                  environmentVariablesOverride=[
                    {'name': 'CFN_RESPONSE_URL', 'value': event['ResponseURL']},
                    {'name': 'CFN_STACK_ID', 'value': event['StackId']},
                    {'name': 'CFN_REQUEST_ID', 'value': event['RequestId']},
                    {'name': 'CFN_LOGICAL_RESOURCE_ID', 'value': event['LogicalResourceId']},
                  ],
                )['build']['id']
                print(f"started {build_id}; build will post the CFN response")
                return

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, event.get('PhysicalResourceId'))
            except Exception as e:
              print(e)
              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)[:200]})

  BuildCustomResource:
    Type: Custom::BuildCode
    Properties:
      ServiceToken: !GetAtt BuildCustomResourceFunction.Arn
      PROJECT: !Ref VirtualParticipantBuildProject
      SOURCE_CODE_LOCATION: !Sub "${SourceCodeLocation}"

  ECSRoleCustomResourceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "ECS service-linked role creation requires broad IAM access"
    # checkov:skip=CKV_AWS_109: "ECS service-linked role creation requires broad IAM permissions management access"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
