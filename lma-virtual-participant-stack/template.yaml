      Path: "/"
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: IAMPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                  - iam:ListRoles
                  - iam:AttachRolePolicy
                Resource:
                  - "*"

  ECSRoleCustomResourceFunction:
    Type: "AWS::Lambda::Function"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with AWS services via APIs
          - id: W92
            reason: Function does not require reserved concurrency as it scales based on demand
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
    Properties:
      Handler: index.handler
      Role: !GetAtt ECSRoleCustomResourceRole.Arn
      Timeout: 300
      Runtime: python3.12
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: !Sub |
          import boto3
          from botocore.exceptions import ClientError
          import cfnresponse

          def handler(event, context):
              
            request_type = event['RequestType']
            print(request_type)

            if request_type == 'Create':
              desired_role_name = "AWSServiceRoleForECS"
              iam_client = boto3.client('iam')

              try:
                iam_client.get_role(RoleName=desired_role_name)
                role_exists = True
              except ClientError as e:
                if e.response['Error']['Code'] == 'NoSuchEntity':
                  role_exists = False
                else:
                  raise

              print(role_exists)
              if not role_exists:
                iam_client.create_service_linked_role(AWSServiceName="ecs.amazonaws.com")

            cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  ECSRoleCustomResource:
    Type: Custom::ECSRole
    Properties:
      ServiceToken: !GetAtt ECSRoleCustomResourceFunction.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Virtual participant requires broad Transcribe and Comprehend access for real-time processing"
    # checkov:skip=CKV_AWS_111: "Virtual participant requires broad Transcribe and Comprehend access for real-time processing"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # ecs-tasks for the EC2/FARGATE launch types; lambda for MICROVM,
              # where this same role is the MicroVM execution role. Sharing one
              # role is deliberate: a separate hand-written MicroVM role drifted
              # from this one and the VP failed at run time on missing
              # appsync:EventConnect, the VP profiles bucket, Bedrock, Secrets
              # Manager and more. One role means the MicroVM path automatically
              # inherits every permission the VP application needs.
              Service:
                - ecs-tasks.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: LMAPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject*
                  - s3:GetBucket*
                  - s3:List*
                  - s3:DeleteObject*
                  - s3:PutObject
                  - s3:PutObjectLegalHold
                  - s3:PutObjectRetention
                  - s3:PutObjectTagging
                  - s3:PutObjectVersionTagging
                  - s3:Abort*
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${bucket}"
                    - bucket: !Ref S3BucketName
                  - !Sub
                    - "arn:aws:s3:::${bucket}/*"
                    - bucket: !Ref S3BucketName
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                  - kinesis:DescribeStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${CallDataStreamName}"
        - PolicyName: TranscribePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:DeleteTranscriptionJob
                  - transcribe:GetTranscriptionJob
                  - transcribe:GetVocabulary
                  - transcribe:ListTranscriptionJobs
                  - transcribe:ListVocabularies
                  - transcribe:StartStreamTranscription
                  - transcribe:StartTranscriptionJob
                  - transcribe:StartCallAnalyticsStreamTranscription
                Resource: "*"
        - PolicyName: DetectPIIPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "comprehend:DetectPiiEntities"
                Resource: "*"
        - PolicyName: AppSyncPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "appsync:GraphQL"
                  - "appsync:EventConnect"
                  - "appsync:EventSubscribe"
                  - "appsync:EventPublish"
                Resource: "*"
        - PolicyName: VirtualParticipantTablePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:UpdateItem"
                  - "dynamodb:GetItem"
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*VirtualParticipant*"
        - PolicyName: VPTaskRegistryPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                  - "dynamodb:GetItem"
                  - "dynamodb:UpdateItem"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VPTaskRegistryTableName}"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:DescribeKey"
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
        - PolicyName: DomSelectorCachePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:PutItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:DeleteItem"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DomSelectorCacheTableName}"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:Encrypt"
                  - "kms:GenerateDataKey"
                  - "kms:DescribeKey"
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
        - PolicyName: ALBDynamicRoutingPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "elasticloadbalancing:CreateTargetGroup"
                  - "elasticloadbalancing:DeleteTargetGroup"
                  - "elasticloadbalancing:DescribeTargetGroups"
                  - "elasticloadbalancing:ModifyTargetGroupAttributes"
                  - "elasticloadbalancing:RegisterTargets"
                  - "elasticloadbalancing:DeregisterTargets"
                  - "elasticloadbalancing:DescribeTargetHealth"
                  - "elasticloadbalancing:CreateRule"
                  - "elasticloadbalancing:DeleteRule"
                  - "elasticloadbalancing:DescribeRules"
                  - "elasticloadbalancing:ModifyRule"
                  - "elasticloadbalancing:AddTags"
                Resource: "*"
        - PolicyName: VPProfilesPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # VP backend writes only under profiles/.
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${VPProfilesBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${VPProfilesBucketName}/profiles/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "s3.${AWS::Region}.amazonaws.com"
        - PolicyName: ZoomCredentialsReadPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${LMAStackName}/zoom-credentials/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
        - PolicyName: BedrockPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:InvokeModelWithBidirectionalStream"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-4-5*"
                  - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*claude-haiku-4-5*"
        - PolicyName: NovaSonicConfigAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:Query"
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*NovaSonicConfig*"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:DescribeKey"
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"
        - !If
          - HasStrandsLambdaArn
          - PolicyName: StrandsLambdaPolicy
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action:
                    - "lambda:InvokeFunction"
                  Resource:
                    - !Ref StrandsLambdaArn
          - !Ref AWS::NoValue

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 36000
      ManagedPolicyArns:
        # AWS managed policies required to allow ECS task to function properly.
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceEventsRole
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  Cluster:
    Type: "AWS::ECS::Cluster"
    # NOTE: capacity providers are attached via ClusterCapacityProviderAssociations
    # below (when UseEC2LaunchType is true) instead of inline here, because
    # both can't be set simultaneously. For Fargate-only deployments the
    # association resource is skipped and Fargate is implicitly available.
    #
    # Under VPLaunchType=MICROVM the cluster is created but stays empty. It is
    # kept (rather than made conditional) deliberately: ~14 places reference
    # Cluster/TaskDefinition — IAM policies, the CodeBuild redeploy buildspec,
    # stack outputs — and an empty ECS cluster with an unused task definition
    # costs nothing. Making them conditional would mean conditionalising all of
    # those references for no operational gain.
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
    DependsOn:
      - ECSRoleCustomResource

  # EC2 Launch Type Resources (conditional)
  
  VPInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: UseEC2LaunchType
    Properties:
      Roles:
        - !Ref VPInstanceRole

  VPInstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
    Condition: UseEC2LaunchType
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue

  VPLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: UseEC2LaunchType
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-VP-LaunchTemplate"
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id}}'
        InstanceType: !Ref VPInstanceType
        IamInstanceProfile:
          Arn: !GetAtt VPInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref VPSecurityGroupId
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Best-effort warm-cache only; ECS task-launch is source of truth.
            # NOTE: the per-boot `yum update -y --security` was REMOVED. These
            # hosts run AWS SSM Patch Manager (AWS-RunPatchBaseline with the
            # default RebootOption=RebootIfNeeded), which already owns OS
            # patching AND reboots the host to apply kernel/security updates.
            # Running yum here was redundant with that managed patching, only
            # slowed instance launch, and — worst of all — a freshly installed
            # security kernel left the host one Patch Manager scan away from an
            # in-place reboot that kills the live VP container mid-meeting
            # (observed: task stopped with EssentialContainerExited when the
            # host rebooted ~30 min after launch). Leave patching to Patch
            # Manager so the reboot cadence is governed by its baseline /
            # maintenance window rather than a kernel we pulled in at boot.
            # (yum update -y --security || yum update -y --security --skip-broken || true) \
            #   >> /var/log/lma-vp-yum-security.log 2>&1
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
            echo "ECS_IMAGE_PULL_BEHAVIOR=prefer-cached" >> /etc/ecs/ecs.config  # pragma: allowlist secret
            echo "ECS_ENABLE_CONTAINER_METADATA=true" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_TASK_IAM_ROLE=true" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=true" >> /etc/ecs/ecs.config
            # Newer ECS-optimized AMIs ship without aws-cli pre-installed.
            if ! command -v aws >/dev/null 2>&1; then
              yum install -y aws-cli >> /var/log/lma-vp-aws-cli-install.log 2>&1 || true
            fi
            if command -v aws >/dev/null 2>&1; then
              aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com >> /var/log/lma-vp-ecr-login.log 2>&1 || true
              docker pull ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest >> /var/log/lma-vp-docker-pull.log 2>&1 || true
            fi
            # ecs.service is already enabled on the AMI; using --now would deadlock
            # against cloud-final.service (ecs.service has After=cloud-final.service).
            systemctl enable ecs || true

  # Custom Resource to handle ASG deletion gracefully
  ASGDeletionHandlerRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Condition: UseEC2LaunchType
    # checkov:skip=CKV_AWS_111: "ASG deletion handler requires broad Autoscaling/EC2 API access for cleanup; wildcards only on Action, not Resource"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ASGDeletionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                  - autoscaling:SetInstanceProtection
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                  - ec2:DescribeInstances
                Resource: "*"

  ASGDeletionHandlerFunction:
    Type: AWS::Lambda::Function
    Condition: UseEC2LaunchType
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with AWS services via APIs
          - id: W92
            reason: Function does not require reserved concurrency as it scales based on demand
          - id: LAMBDA-011
            reason: CloudWatch alarms are an observability preference, not a security requirement
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # LAMBDA-011: CloudWatch alarms are an observability preference, not a security requirement
    Properties:
      Handler: index.handler
      Role: !GetAtt ASGDeletionHandlerRole.Arn
      Timeout: 300
      Runtime: python3.12
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          autoscaling = boto3.client('autoscaling')
          
          def handler(event, context):
              logger.info(f"Event: {event}")
              request_type = event['RequestType']
              asg_name = event['ResourceProperties'].get('AutoScalingGroupName')
              
              try:
                  if request_type == 'Delete':
                      logger.info(f"Preparing ASG {asg_name} for deletion")
                      
                      # Get ASG details
                      try:
                          response = autoscaling.describe_auto_scaling_groups(
                              AutoScalingGroupNames=[asg_name]
                          )
                          
                          if not response['AutoScalingGroups']:
                              logger.info(f"ASG {asg_name} not found, assuming already deleted")
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                              return
                          
                          asg = response['AutoScalingGroups'][0]
                          instances = asg.get('Instances', [])
                          
                          logger.info(f"Found {len(instances)} instances in ASG")
                          
                          # Remove scale-in protection from all instances
                          if instances:
                              instance_ids = [i['InstanceId'] for i in instances]
                              logger.info(f"Removing scale-in protection from instances: {instance_ids}")
                              
                              autoscaling.set_instance_protection(
                                  InstanceIds=instance_ids,
                                  AutoScalingGroupName=asg_name,
                                  ProtectedFromScaleIn=False
                              )
                              
                              logger.info("Scale-in protection removed successfully")
                              
                              # Set desired capacity to 0 to trigger instance termination
                              logger.info("Setting ASG desired capacity to 0")
                              autoscaling.update_auto_scaling_group(
                                  AutoScalingGroupName=asg_name,
                                  MinSize=0,
                                  DesiredCapacity=0
                              )
                              
                              # Wait a bit for instances to start terminating
                              time.sleep(5)
                              
                              # Force terminate any remaining instances
                              for instance_id in instance_ids:
                                  try:
                                      logger.info(f"Force terminating instance {instance_id}")
                                      autoscaling.terminate_instance_in_auto_scaling_group(
                                          InstanceId=instance_id,
                                          ShouldDecrementDesiredCapacity=False
                                      )
                                  except Exception as e:
                                      logger.warning(f"Failed to terminate instance {instance_id}: {e}")
                              
                              logger.info("All instances terminated or terminating")
                          else:
                              logger.info("No instances to terminate")
                          
                      except autoscaling.exceptions.ClientError as e:
                          if 'does not exist' in str(e):
                              logger.info(f"ASG {asg_name} already deleted")
                          else:
                              raise
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  
              except Exception as e:
                  logger.error(f"Error handling ASG deletion: {e}", exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  ASGDeletionHandler:
    Type: Custom::ASGDeletionHandler
    Condition: UseEC2LaunchType
    Properties:
      ServiceToken: !GetAtt ASGDeletionHandlerFunction.Arn
      AutoScalingGroupName: !Sub "${AWS::StackName}-VP-ASG"
    DependsOn:
      - VPAutoScalingGroup

  VPAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-AS3
            reason: 'Autoscaling SNS notifications not required for this deployment pattern'
    Condition: UseEC2LaunchType
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # Suspend health-check / replace / rebalance / alarm / scheduled processes
    # during a CFN-driven launch-template update so a stale ECS health-check
    # signal during the rollout doesn't churn the cluster while the new
    # instances are being launched. Without this, every CFN deploy that
    # touches the launch template triggers an ASG scale-out + scale-in that
    # can leave the cluster without an active host for several minutes —
    # the exact symptom we hit during today's testing. The capacity provider
    # still launches new hosts on demand at runtime; this only affects how
    # the ASG behaves during a stack update.
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: false
        MinSuccessfulInstancesPercent: 100
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
          - AZRebalance
          - AlarmNotification
          - ScheduledActions
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-VP-ASG"
      MinSize: !Ref VPMinInstances
      MaxSize: !Ref VPMaxInstances
      DesiredCapacity: !Ref VPMinInstances
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      LaunchTemplate:
        LaunchTemplateId: !Ref VPLaunchTemplate
        Version: !GetAtt VPLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      NewInstancesProtectedFromScaleIn: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-VP-Instance"
          PropagateAtLaunch: true
        # Patch group tag consumed by VPPatchBaseline / VPPatchMaintenanceWindow
        # below. This is what wires these hosts into SSM Patch Manager so OS
        # security updates are applied on a schedule (the UserData intentionally
        # does NOT patch at boot, to avoid startup slowdown and mid-meeting
        # reboots). Without a Patch Manager configuration referencing this tag,
        # nothing patches these hosts and they drift out of Mirador SLA.
        - Key: LMA-VP-PatchGroup
          Value: !Sub "${AWS::StackName}-VP"
          PropagateAtLaunch: true

  # ---------------------------------------------------------------------------
  # SSM Patch Manager — owns OS security patching for the VP EC2 hosts.
  #
  # The VP LaunchTemplate pins the AMI to the SSM "recommended" ECS-optimized
  # AL2 parameter, so a fresh launch is patched-at-launch. But long-lived hosts
  # still accrue OS CVEs between launches, and the UserData deliberately does
  # not run `yum update` at boot (it slowed launch and caused kernel-reboot
  # mid-meeting task kills). These resources apply security patches during a
  # scheduled maintenance window instead — no container-startup cost, and the
  # reboot cadence is governed by the window rather than an ad-hoc boot-time
  # kernel install.
  # ---------------------------------------------------------------------------
  VPPatchBaseline:
    Type: AWS::SSM::PatchBaseline
    Condition: UseEC2LaunchType
    Properties:
      Name: !Sub "${AWS::StackName}-VP-PatchBaseline"
      Description: "Security patch baseline for LMA Virtual Participant EC2 hosts (Amazon Linux 2)"
      OperatingSystem: AMAZON_LINUX_2
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Key: CLASSIFICATION
                  Values:
                    - Security
                    - Bugfix
                - Key: SEVERITY
                  Values:
                    - Critical
                    - Important
                    - Medium
            # Auto-approve after 0 days so security/bugfix updates are applied
            # at the next maintenance window rather than waiting out a delay.
            ApproveAfterDays: 0
            ComplianceLevel: HIGH
      PatchGroups:
        - !Sub "${AWS::StackName}-VP"

  VPPatchMaintenanceWindow:
    Type: AWS::SSM::MaintenanceWindow
    Condition: UseEC2LaunchType
    Properties:
      Name: !Sub "${AWS::StackName}-VP-PatchWindow"
      Description: "Weekly maintenance window to apply OS security patches to VP EC2 hosts"
      # Sundays 08:00 UTC — off-peak for meetings. Adjust per your ops calendar.
      Schedule: "cron(0 8 ? * SUN *)"
      ScheduleTimezone: "UTC"
      Duration: 2
      Cutoff: 1
      AllowUnassociatedTargets: false

  VPPatchMaintenanceWindowTarget:
    Type: AWS::SSM::MaintenanceWindowTarget
    Condition: UseEC2LaunchType
    Properties:
      WindowId: !Ref VPPatchMaintenanceWindow
      Name: !Sub "${AWS::StackName}-VP-PatchTargets"
      Description: "VP EC2 hosts selected by patch group tag"
      ResourceType: INSTANCE
      Targets:
        - Key: "tag:LMA-VP-PatchGroup"
          Values:
            - !Sub "${AWS::StackName}-VP"

  VPPatchMaintenanceWindowTask:
    Type: AWS::SSM::MaintenanceWindowTask
    Condition: UseEC2LaunchType
    Properties:
      WindowId: !Ref VPPatchMaintenanceWindow
      Name: !Sub "${AWS::StackName}-VP-RunPatchBaseline"
      Description: "Run AWS-RunPatchBaseline (Install) on VP EC2 hosts"
      TaskType: RUN_COMMAND
      TaskArn: AWS-RunPatchBaseline
      Priority: 1
      # 100% so a single-host ASG is still patched; raise MaxErrors tolerance so
      # one unreachable host doesn't fail the whole window.
      MaxConcurrency: "100%"
      MaxErrors: "100%"
      Targets:
        - Key: WindowTargetIds
          Values:
            - !Ref VPPatchMaintenanceWindowTarget
      TaskInvocationParameters:
        MaintenanceWindowRunCommandParameters:
          Parameters:
            Operation:
              - Install
            # RebootIfNeeded lets kernel/security updates take effect. It runs
            # only inside the maintenance window, so any task-killing reboot is
            # confined to the off-peak window rather than happening at boot.
            RebootOption:
              - RebootIfNeeded
          Comment: "LMA VP scheduled security patching"

  VPCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Condition: UseEC2LaunchType
    Properties:
      Name: !Sub "${AWS::StackName}-VP-CapacityProvider"
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref VPAutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          # TargetCapacity 100 = "scale up only when the cluster is fully reserved";
          # combined with the small step sizes below this gives a tight, demand-driven
          # scale-up. Scale-down happens automatically when reservation drops.
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 2
          InstanceWarmupPeriod: 90
        ManagedTerminationProtection: ENABLED

  # Wire the capacity provider as the cluster's default strategy. Without this
  # association ECS RunTask falls back to LaunchType=EC2 (the legacy behavior)
  # and never auto-scales the ASG when capacity is exhausted.
  VPClusterCapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Condition: UseEC2LaunchType
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders:
        - !Ref VPCapacityProvider
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref VPCapacityProvider
          Weight: 1

  ##########################################################################
  # MICROVM Launch Type (conditional)
  #
  # AWS Lambda MicroVMs run the same container image inside a Firecracker
  # microVM, booted from a memory+disk snapshot. Compared to the ECS launch
  # types this removes the ALB + target groups, the ASG/capacity provider, and
  # SSM host patching, and bills per meeting rather than per warm instance.
  #
  # Two roles, per the service model:
  #   BuildRole     - assumed while Lambda builds the image from the Dockerfile
  #   ExecutionRole - assumed by the running MicroVM (what the VP itself can do)
  ##########################################################################

  # Routes MicroVM outbound traffic through the same private subnets the ECS
  # launch types use, so it leaves via the VPC's NAT gateway and the meeting
  # platforms see the same stable Elastic IP.
  #
  # The Lambda-managed INTERNET_EGRESS connector was the default, but it exits
  # from an AWS-owned shared address pool. Zoom scores source-IP reputation and
  # redirected anonymous joins to a sign-in page with reCAPTCHA -- the container
  # image, fingerprint and code being byte-identical to the ECS path. Making
  # egress match ECS removes that as a variable.
  #
  # Costs no hourly charge (unlike an ALB); NAT data processing applies, which
  # the ECS launch types already pay.
  VPMicrovmEgressOperatorRole:
    Type: AWS::IAM::Role
    Condition: UseMicrovmLaunchType
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >-
              EC2 network-interface actions do not support resource-level
              permissions; this is the AWS-managed policy for the purpose.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            # No aws:SourceAccount condition. CreateNetworkConnector does NOT
            # populate that context key, so the condition evaluates to a deny
            # and the create fails with "The service is unable to assume the
            # provided NetworkConnectorOperatorRole." Same trap as the
            # iam:PassedToService condition on the launcher role below.
            # Verified: a role with no condition assumes fine.
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      # Lambda assumes this to create/delete the ENIs that carry MicroVM egress.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"

  VPMicrovmEgressConnector:
    Type: AWS::Lambda::NetworkConnector
    Condition: UseMicrovmLaunchType
    # cfn-lint 1.51 ships no schema for this resource type yet (service launched
    # 2026-04), so E3006 would otherwise fail `make lint-cfn`.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      Name: !Sub "${LMAStackName}-vp-egress"
      # REQUIRED despite the CloudFormation schema listing only Configuration:
      # the service rejects the create with "NetworkConnectorOperatorRole is
      # required for VPC_EGRESS connector type". Verified against a live create.
      OperatorRole: !GetAtt VPMicrovmEgressOperatorRole.Arn
      Configuration:
        VpcEgressConfiguration:
          # Private subnets only -- these are the ones with a NAT route.
          SubnetIds:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          # Reuse the VP task security group (all egress allowed), so MicroVM and
          # ECS traffic are governed by exactly one rule set.
          SecurityGroupIds:
            - !Ref VPSecurityGroupId
          NetworkProtocol: IPv4
          # "MicroVm" is the only permitted value today.
          AssociatedComputeResourceTypes:
            - MicroVm

  VPMicrovmBuildRole:
    Type: AWS::IAM::Role
    Condition: UseMicrovmLaunchType
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            # Confused-deputy guard: only this account's Lambda can assume it.
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: MicrovmImageBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read the zipped Dockerfile + app source that the image is built from.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::${MicrovmSourceCodeLocation}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"

  # The MicroVM image: a versioned Firecracker snapshot built from the same
  # Dockerfile the ECS launch types use.
  #
  # Snapshot semantics drive the hook config: /ready must return 200 only once
  # Xvfb/x11vnc/websockify/PulseAudio are serving, because that is the instant
  # the snapshot is taken. /validate additionally lets Lambda sample which
  # snapshot pages are touched so it can prefetch them on later launches.
  VPMicrovmImage:
    Type: AWS::Lambda::MicrovmImage
    Condition: UseMicrovmLaunchType
    # cfn-lint 1.51 ships no schema for this resource type yet (service launched
    # 2026-06), so E3006 would otherwise fail `make lint-cfn` in CI. Scoped to
    # this resource rather than disabling the rule globally.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      Name: !Sub "${LMAStackName}-vp"
      Description: !Sub "LMA Virtual Participant (${LMAStackName})"
      BaseImageArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:microvm-image:al2023-1"
      # NOTE: the CloudFormation resource marks EVERY property required, even
      # those the underlying API treats as optional (verified against
      # `describe-type AWS::Lambda::MicrovmImage`). So BaseImageVersion,
      # CpuConfigurations, Logging and EgressNetworkConnectors must all be set
      # explicitly rather than relying on service defaults.
      # Major version only. "1.0" is rejected at create time with
      # "Expected a single major version number (e.g., 1)". Valid values come
      # from `list-managed-microvm-image-versions` (currently "0" and "1").
      BaseImageVersion: "1"
      BuildRoleArn: !GetAtt VPMicrovmBuildRole.Arn
      # MicroVMs are ARM64-only; ARM_64 is the sole permitted value.
      CpuConfigurations:
        - Architecture: ARM_64
      Logging:
        CloudWatch:
          LogGroup: !Sub "/aws/lambda-microvms/${LMAStackName}-vp"
      # Egress via the VPC connector (see VPMicrovmEgressConnector) rather than
      # the Lambda-managed INTERNET_EGRESS pool, so the VP reaches
      # Zoom/Teams/Webex/Chime and the AWS public APIs from the VPC's NAT
      # Elastic IP -- the same source address the ECS launch types use.
      EgressNetworkConnectors:
        - !GetAtt VPMicrovmEgressConnector.Arn
      CodeArtifact:
        Uri: !Sub "s3://${MicrovmSourceCodeLocation}"
      Resources:
        # 4 GB baseline => 2 vCPU (CPU is allocated at a 2:1 memory:vCPU ratio),
        # bursting to 16 GB / 8 vCPU. Observed peak is ~1650 MB for Chromium +
        # Simli + Nova Sonic, so memory is not the constraint.
        #
        # An 8 GB baseline (4 vCPU) was tried to speed up browser launch and made
        # no difference — 135s at 4 GB vs 149s at 8 GB — so the launch delay is
        # not CPU-bound and the larger baseline was pure extra cost. Reverted.
        - MinimumMemoryInMiB: 4096
      # Chromium's sandbox needs namespace/capability access beyond the default
      # restricted set.
      AdditionalOsCapabilities:
        - ALL
      # BOOTSTRAP values only. Everything else is staged per launch in the VP task
      # registry (runHookPayload caps at 4096 bytes — see the launcher), but the
      # container needs these three to find that config in the first place:
      # without the table name it cannot read the registry, which is where the
      # table name would otherwise live. Keeping the set this small also means a
      # stack parameter change does not force an image rebuild.
      EnvironmentVariables:
        - Key: VP_LAUNCH_TYPE
          Value: MICROVM
        # NOT "AWS_REGION": that key is reserved by the service and rejected at
        # image-build time ("Environment variable key 'AWS_REGION' is reserved").
        # The MicroVM runtime may not populate it either, and the container's
        # fallback is us-east-1 — wrong for any other region — so pass the region
        # under our own name and prefer it in the container.
        - Key: VP_AWS_REGION
          Value: !Ref AWS::Region
        - Key: VP_TASK_REGISTRY_TABLE_NAME
          Value: !Ref VPTaskRegistryTableName
      Hooks:
        Port: 9000
        MicrovmImageHooks:
          Ready: ENABLED
          # Generous: a cold first boot pulls CloakBrowser Chromium into memory
          # and starts X + audio. Returning 503 until healthy is the contract.
          ReadyTimeoutInSeconds: 600
          Validate: ENABLED
          # Generous: /validate now launches a real Chromium so Lambda samples
          # (and can prefetch) its snapshot pages. That first launch is the slow
          # one — the very cost this is here to move off the hot path — so it
          # needs room to complete. Max allowed is 3600.
          ValidateTimeoutInSeconds: 900
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 30
          Suspend: ENABLED
          SuspendTimeoutInSeconds: 30
          Resume: ENABLED
          ResumeTimeoutInSeconds: 30
          Terminate: ENABLED
          TerminateTimeoutInSeconds: 30

  # EventBridge Scheduler assumes this to invoke the launcher for meetings booked
  # in advance (the MICROVM equivalent of TargetECSRole, which Scheduler uses to
  # call ecs:RunTask on the ECS launch types).
  VPScheduleInvokeLauncherRole:
    Type: AWS::IAM::Role
    Condition: UseMicrovmLaunchType
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: InvokeLauncher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VPMicrovmLauncherFunction.Arn

  VPMicrovmLauncherRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "RunMicrovm/CreateMicrovmAuthToken do not support resource-level permissions on the image"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'lambda-microvms actions are scoped by region/account; the service does not support resource-level permissions for RunMicrovm'
    Condition: UseMicrovmLaunchType
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Ref LogsPolicy
      Policies:
        - PolicyName: MicrovmLaunch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # cfn-lint's IAM action list predates Lambda MicroVMs (2026-06),
              # so these raise W3037 "not one of [...]". Left unsuppressed to
              # match how the equally-new bedrock:InvokeModelWithBidirectionalStream
              # is handled above: the warning clears when cfn-lint's spec catches
              # up, and `make lint-cfn` only fails on E-level findings.
              - Effect: Allow
                Action:
                  - lambda:RunMicrovm
                  - lambda:GetMicrovm
                  - lambda:TerminateMicrovm
                  - lambda:CreateMicrovmAuthToken
                Resource: "*"
              # Attaching ingress/egress connectors to a MicroVM is a separate,
              # explicitly-authorized action on the connector resource itself —
              # RunMicrovm permission alone is not sufficient.
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:ALL_INGRESS"
                  # The customer-owned VPC egress connector, not the
                  # Lambda-managed INTERNET_EGRESS one.
                  - !GetAtt VPMicrovmEgressConnector.Arn
              # Hand the MicroVM its runtime role.
              #
              # No iam:PassedToService condition: RunMicrovm does NOT populate
              # that context key, so any condition on it evaluates to a deny.
              # Confirmed with `aws iam simulate-principal-policy` — with the
              # key absent the request is implicitDeny, and the live call failed
              # with "no identity-based policy allows the iam:PassRole action".
              # Least privilege is preserved by Resource: this one role only.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TaskRole.Arn
              # Read the resolved static config (see TASK_DEFINITION_ARN above).
              - Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VPTaskRegistryTableName}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VirtualParticipantTableName}"
              # Both tables are encrypted with the customer-managed key, so
              # DynamoDB access alone is not enough — writes fail with a KMS
              # AccessDeniedException. Same pattern as TaskRole above.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"

  # Launches one MicroVM per meeting. Called by the scheduler state machine
  # (MICROVM dispatch path) and by EventBridge Scheduler for scheduled meetings,
  # since neither has a native lambda-microvms integration.
  VPMicrovmLauncherFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS'
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required; the state machine handles retries and failure states"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive ARNs and table names"
    Condition: UseMicrovmLaunchType
    Properties:
      FunctionName: !Sub "${LMAStackName}-VPMicrovmLauncher"
      Handler: index.lambda_handler
      Runtime: python3.12
      # RunMicrovm plus the wait for RUNNING; observed ~5s, but allow for
      # throttling backoff and a cold image.
      Timeout: 300
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Role: !GetAtt VPMicrovmLauncherRole.Arn
      Environment:
        Variables:
          MICROVM_IMAGE_ARN: !GetAtt VPMicrovmImage.ImageArn
          # Source of the ~60 static per-stack config values forwarded to the
          # container in runHookPayload. Read from the task definition so there
          # is one source of truth (see _static_config in the launcher).
          TASK_DEFINITION_ARN: !Ref TaskDefinition
          EXECUTION_ROLE_ARN: !GetAtt TaskRole.Arn
          # The ARN embeds a service-generated id, so it cannot be constructed
          # from the connector's Name.
          EGRESS_CONNECTOR_ARN: !GetAtt VPMicrovmEgressConnector.Arn
          VP_TABLE_NAME: !Ref VirtualParticipantTableName
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistryTableName
          LOG_LEVEL: !Ref LogLevel
      Code:
        # A real deployment package, not inline ZipFile: the handler imports
        # microvm_client.py, and inline code is a single file capped at 4 KB.
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref MicrovmLauncherS3Key

  # EventBridge Scheduler invokes this function ASYNCHRONOUSLY for scheduled
  # meetings, so Lambda's default async policy would retry a failed invocation
  # twice more, minutes apart -- putting a second and third bot in the same
  # meeting if the failure happened after RunMicrovm had already succeeded.
  # Retrying a meeting join minutes late is not useful anyway, so turn it off
  # and let the launcher report the failure instead.
  #
  # This affects ONLY asynchronous invocations. The "start now" state machine
  # calls the same function through states:::lambda:invoke (synchronous), which
  # keeps its own Retry/Catch and is unaffected.
  VPMicrovmLauncherAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: UseMicrovmLaunchType
    Properties:
      FunctionName: !Ref VPMicrovmLauncherFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  TaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-ECS2
            reason: 'Task environment variables contain only non-sensitive configuration (table names, bucket names, meeting IDs)'
    # checkov:skip=ECS-002: RECORDINGS_KEY_PREFIX is a naming prefix for S3 objects, not sensitive data
    Properties:
      ContainerDefinitions:
        - Memory: !If [UseEC2LaunchType, 3500, !Ref AWS::NoValue]
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: RECORDINGS_BUCKET_NAME
              Value: !Ref S3BucketName
            - Name: RECORDINGS_KEY_PREFIX
              Value: !Ref AudioFilePrefix
            - Name: CALL_DATA_STREAM_NAME
              Value: !Ref CallDataStreamName
            - Name: ENABLE_CONTENT_REDACTION
              Value: !If
                - ShouldEnableContentRedaction
                - "true"
                - "false"
            - Name: CONTENT_REDACTION_TYPE
              Value: !Ref TranscribeContentRedactionType
            - Name: TRANSCRIBE_CONTENT_REDACTION_TYPE
              Value: !Ref TranscribeContentRedactionType
            - Name: TRANSCRIBE_LANGUAGE_CODE
              Value: !Ref TranscribeLanguageCode
            - Name: TRANSCRIBE_LANGUAGE_OPTIONS
              Value: !Ref TranscribeLanguageOptions
            - Name: TRANSCRIBE_PREFERRED_LANGUAGE
              Value: !Ref TranscribePreferredLanguage
            - Name: CUSTOM_VOCABULARY_NAME
              Value: !Ref CustomVocabularyName
            - Name: LMA_IDENTITY
              Value: !Ref LMAIdentity
            - Name: INTRO_MESSAGE
              Value: !Ref IntroMessage
            - Name: START_RECORDING_MESSAGE
              Value: !Ref StartRecordingMessage
            - Name: STOP_RECORDING_MESSAGE
              Value: !Ref StopRecordingMessage
            - Name: EXIT_MESSAGE
              Value: !Ref ExitMessage
            - Name: GRAPHQL_ENDPOINT
              Value: !Ref GraphQLEndpoint
            - Name: APPSYNC_EVENTS_URL
              Value: !Ref AppSyncEventApiUrl
            - Name: VP_TASK_REGISTRY_TABLE_NAME
              Value: !Ref VPTaskRegistryTableName
            - Name: VP_TABLE_NAME
              Value: !Ref VirtualParticipantTableName
            - Name: DOM_SELECTOR_CACHE_TABLE_NAME
              Value: !Ref DomSelectorCacheTableName
            - Name: BEDROCK_DOM_RESOLVER_MODEL_ID
              Value: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
            - Name: VP_PROFILES_BUCKET
              Value: !Ref VPProfilesBucketName
            # Overridden at task launch by Step Functions when the user opts in.
            - Name: ZOOM_CREDENTIALS_SECRET_NAME
              Value: ""
            - Name: ZOOM_MEETING_SDK_CLIENT_ID
              Value: !Ref ZoomMeetingSdkClientId
            - Name: ZOOM_MEETING_SDK_CLIENT_SECRET
              Value: !Ref ZoomMeetingSdkClientSecret
            - Name: ACS_CONNECTION_STRING
              Value: !Ref AcsConnectionString
            - Name: LMA_USER_SUB
              Value: ""
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref EventSourcingTableName
            - Name: ENABLE_AUDIO_RECORDING
              Value: !Ref EnableAudioRecording
            # Deployment default for video recording; overridden per-VP at task
            # launch by the Step Functions / scheduler "Record meeting video" toggle.
            - Name: ENABLE_VIDEO_RECORDING
              Value: !Ref EnableVideoRecording
            - Name: VIDEO_RECORDINGS_KEY_PREFIX
              Value: !Ref VideoRecordingsPrefix
            - Name: VIDEO_CHUNKS_KEY_PREFIX
              Value: !Ref VideoChunksPrefix
            - Name: CLOUDFRONT_DOMAIN
              Value: !Ref CloudFrontDomainName
            - Name: VPC_ID
              Value: !Ref VPC
            - Name: ALB_LISTENER_ARN
              Value: !Ref VNCALBListenerArn
            - Name: ELEVENLABS_API_KEY
              Value: !Ref ElevenLabsApiKey
            - Name: ELEVENLABS_AGENT_ID
              Value: !Ref ElevenLabsAgentId
            - Name: SIMLI_API_KEY
              Value: !Ref SimliApiKey
            - Name: SIMLI_FACE_ID
              Value: !Ref SimliFaceId
            - Name: SIMLI_TRANSPORT_MODE
              Value: !Ref SimliTransportMode
            - Name: VOICE_ASSISTANT_PROVIDER
              Value: !Ref VoiceAssistantProvider
            - Name: VOICE_ASSISTANT_ACTIVATION_MODE
              Value: !Ref VoiceAssistantActivationMode
            - Name: VOICE_ASSISTANT_WAKE_PHRASES
              Value: !Ref VoiceAssistantWakePhrases
            - Name: VOICE_ASSISTANT_ACTIVATION_DURATION
              Value: !Ref VoiceAssistantActivationDuration
            - Name: NOVA_MODEL_ID
              Value: !Ref NovaModelId
            - Name: NOVA_SYSTEM_PROMPT
              Value: !Ref NovaSystemPrompt
            - Name: NOVA_SONIC_CONFIG_TABLE_NAME
              Value: !Ref NovaSonicConfigTableName
            - Name: STRANDS_LAMBDA_ARN
              Value: !Ref StrandsLambdaArn
          Essential: true
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}:latest"
          PortMappings:
            - ContainerPort: 5901
              Protocol: tcp
              Name: vnc-websocket
          LogConfiguration:
            LogDriver: "awslogs"
            Options:
              awslogs-group:
                Ref: VirtualParticipantTaskDefContainerLogGroup
              awslogs-stream-prefix: lmavirtualparticipant
              awslogs-region:
                Ref: AWS::Region
          Name: "scribe"
      Family: !Sub ${AWS::StackName}VirtualParticipantTaskDef
      TaskRoleArn: !GetAtt TaskRole.Arn
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      NetworkMode: "awsvpc"
      RequiresCompatibilities: !If
        - UseEC2LaunchType
        - - EC2
        - - FARGATE
      # Fargate requires task-level Cpu/Memory; EC2 sets them per container
      # instead (see ContainerDefinitions above). Keyed on "not EC2" rather than
      # UseFargateLaunchType so that under MICROVM — where this task definition
      # is created but never used, and RequiresCompatibilities falls back to
      # FARGATE — the template still describes a valid Fargate task.
      Cpu: !If [UseEC2LaunchType, !Ref AWS::NoValue, "2 vCPU"]
      Memory: !If [UseEC2LaunchType, !Ref AWS::NoValue, "4 GB"]
    DependsOn:
      - Cluster
      - BuildCustomResource

  # ECS Service to register tasks with target group
  VirtualParticipantService:
    Type: AWS::ECS::Service
    # Not created under MICROVM: `LaunchType` only accepts EC2/FARGATE, and the
    # service exists solely to keep an ALB target-group association (DesiredCount
    # is 0 — tasks are started per meeting by RunTask, not by this service).
    # MicroVMs have neither an ALB nor a task definition.
    Condition: UseECSLaunchType
    Properties:
      ServiceName: !Sub "${LMAStackName}-vp-service-${VPLaunchType}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 0
      LaunchType: !Ref VPLaunchType
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref VPSecurityGroupId
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: scribe
          ContainerPort: 5901
          TargetGroupArn: !Ref VNCTargetGroupArn
      PlacementStrategies: !If
        - UseEC2LaunchType
        - - Type: spread
            Field: instanceId
        - !Ref AWS::NoValue

  VirtualParticipantTaskDefContainerLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/fargate/VirtualParticipant
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: >-
              By default CloudWatchLogs LogGroups data is encrypted using the CloudWatch
              server-side encryption keys (AWS Managed Keys).

  ### Scheduler Resources ###

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup

  ECSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ECS task scheduling requires broad access for task execution and role passing"
    # checkov:skip=CKV_AWS_111: "ECS task scheduling requires broad access for task execution and role passing"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "ecs:RunTask"
            Resource: "*"
          - Effect: Allow
            Action: iam:PassRole
            Resource: "*"
            Condition:
              StringLike:
                iam:PassedToService: ecs-tasks.amazonaws.com

  TargetECSRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - scheduler.amazonaws.com
                - events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !GetAtt LogsPolicy.PolicyArn
        - !GetAtt ECSPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: TagPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:TagResource
                Resource: "*"
                Condition:
                  StringEquals:
                    ecs:CreateAction:
                      - RunTask

  SchedulerStateMachineLogGroup:
    Type: "AWS::Logs::LogGroup"
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 7
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}"
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  LMAVirtualParticipantSchedulerStateMachineRole:
    Type: "AWS::IAM::Role"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Step Functions state machine requires broad access for logging, tracing, and scheduling operations"
    # checkov:skip=CKV_AWS_111: "Step Functions state machine requires broad access for logging, tracing, and scheduling operations"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: states.amazonaws.com
            Action: "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - !GetAtt ECSPolicy.PolicyArn
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ExpandedLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogDelivery"
                  - "logs:CreateLogStream"
                  - "logs:GetLogDelivery"
                  - "logs:UpdateLogDelivery"
                  - "logs:DeleteLogDelivery"
                  - "logs:ListLogDeliveries"
                  - "logs:PutLogEvents"
                  - "logs:PutResourcePolicy"
                  - "logs:DescribeResourcePolicies"
                  - "logs:DescribeLogGroups"
                Resource: "*"
        - PolicyName: TracesPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
        # Only needed for the MICROVM dispatch path, where the state machine
        # invokes the launcher Lambda instead of using the optimized ECS
        # runTask integration.
        - !If
          - UseMicrovmLaunchType
          - PolicyName: InvokeMicrovmLauncher
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt VPMicrovmLauncherFunction.Arn
          - !Ref AWS::NoValue
        - PolicyName: SchedulePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:ListSchedules
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  - arn:aws:scheduler:*:*:schedule/*
                  - arn:aws:scheduler:*:*:schedule-group/default
        - PolicyName: PassRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TargetECSRole.Arn
                Condition:
                  StringLike:
                    iam:PassedToService: scheduler.amazonaws.com
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*VirtualParticipant*"
              # The VirtualParticipant DDB table is encrypted with the
              # customer-managed CMK. UpdateItem requires kms:Decrypt
              # and kms:GenerateDataKey on the key (DDB calls KMS via
              # service principal, scoped by kms:ViaService condition).
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "dynamodb.${AWS::Region}.amazonaws.com"

  LMAVirtualParticipantSchedulerStateMachine:
    Type: "AWS::StepFunctions::StateMachine"
    Properties:
      # StateMachine name is used in policy in AISTACK template
      StateMachineName: !Sub "${LMAStackName}-LMAVirtualParticipantScheduler"
      RoleArn: !GetAtt [LMAVirtualParticipantSchedulerStateMachineRole, Arn]
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt
                - SchedulerStateMachineLogGroup
                - Arn
        IncludeExecutionData: true
        Level: ALL
      StateMachineType: EXPRESS
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub
        - |
          {
            "StartAt": "Method Choice",
            "States": {
              "Method Choice": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.apiInfo.httpMethod",
                    "StringEquals": "POST",
                    "Next": "Time Choice"
                  },
                  {
                    "Variable": "$.apiInfo.httpMethod",
                    "StringEquals": "GET",
                    "Next": "ListSchedules"
                  },
                  {
                    "Variable": "$.apiInfo.httpMethod",
                    "StringEquals": "DELETE",
                    "Next": "DeleteSchedule"
                  }
                ],
                "Default": "Pass"
              },
              "Time Choice": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Not": {
                      "Variable": "$.data.meetingTime",
                      "StringMatches": ""
                    },
                    "Next": "CreateSchedule"
                  }
                ],
                "Default": "Resolve Zoom Secret"
              },
              "Resolve Zoom Secret": {
                "Type": "Choice",
                "Choices": [
                  {
                    "And": [
                      { "Variable": "$.data.userZoomSub", "IsPresent": true },
                      { "Variable": "$.data.userZoomSub", "IsString": true },
                      { "Not": { "Variable": "$.data.userZoomSub", "StringMatches": "" } }
                    ],
                    "Next": "Format Zoom Secret Name"
                  }
                ],
                "Default": "Empty Zoom Secret Name"
              },
              "Format Zoom Secret Name": {
                "Type": "Pass",
                "Comment": "Defaults written to $.computed; MergeZoomSecret JsonMerges with override=false so existing $.data fields win. Tolerates callers (MCP tool, scheduled meetings) that don't pass userSub/userZoomSub at all.",
                "Parameters": {
                  "zoomCredentialsSecretName.$": "States.Format('${LMAStackName}/zoom-credentials/{}', $.data.userZoomSub)",
                  "userSub": "",
                  "userZoomSub": "",
                  "enableVideoRecording": "true"
                },
                "ResultPath": "$.computed",
                "Next": "MergeZoomSecret"
              },
              "Empty Zoom Secret Name": {
                "Type": "Pass",
                "Parameters": {
                  "zoomCredentialsSecretName": "",
                  "userSub": "",
                  "userZoomSub": "",
                  "enableVideoRecording": "true"
                },
                "ResultPath": "$.computed",
                "Next": "MergeZoomSecret"
              },
              "MergeZoomSecret": {
                "Type": "Pass",
                "Comment": "JsonMerge(a, b, false) puts b's keys on top of a's on collision. We want $.data (user input, e.g. userSub from the UI) to WIN over $.computed (the empty defaults), so $.computed must be the FIRST argument.",
                "Parameters": {
                  "apiInfo.$": "$.apiInfo",
                  "data.$": "States.JsonMerge($.computed, $.data, false)"
                },
                "Next": "${DispatchStateName}"
              },
              ${DispatchStates}
              "End": {
                "Type": "Pass",
                "End": true
              },
              "MarkVPFailed": {
                "Type": "Task",
                "Comment": "RunTask failed (e.g. ECS capacity, IAM, image pull). Surface a FAILED status + error message on the VP DynamoDB row so the UI / MCP poller stops showing INITIALIZING forever.",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:dynamodb:updateItem",
                "Parameters": {
                  "TableName": "${VirtualParticipantTableName}",
                  "Key": {
                    "id": { "S.$": "$.data.virtualParticipantId" }
                  },
                  "UpdateExpression": "SET #s = :failed, #e = :err, #ea = :now",
                  "ExpressionAttributeNames": {
                    "#s": "status",
                    "#e": "errorMessage",
                    "#ea": "updatedAt"
                  },
                  "ExpressionAttributeValues": {
                    ":failed": { "S": "FAILED" },
                    ":err": { "S.$": "States.Format('VP launch failed: {}', $.runTaskError.Cause)" },
                    ":now": { "S.$": "$$.State.EnteredTime" }
                  }
                },
                "ResultPath": null,
                "End": true,
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "Next": "FailureLogged"
                  }
                ]
              },
              "FailureLogged": {
                "Type": "Pass",
                "Comment": "Best-effort: even if the DDB update fails, end the execution so the caller (MCP sync exec) gets a clean failure response.",
                "End": true
              },
              "CreateSchedule": {
                "Type": "Task",
                "Parameters": {
                  "ActionAfterCompletion": "DELETE",
                  "Description.$": "States.Format('{}_{}', $.data.meetingPlatform, $.data.meetingName)",
                  "FlexibleTimeWindow": {
                    "Mode": "OFF"
                  },
                  "GroupName": "${ScheduleGroup}",
                  "Name.$": "States.Format('{}_{}_{}_{}', $.data.meetingPlatform, $.data.meetingName, $.data.meetingID, States.MathRandom(0, 1000000))",
                  "ScheduleExpression.$": "States.Format('at({})', $.data.meetingTime)",
                  "ScheduleExpressionTimezone": "UTC",
                  "State": "ENABLED",
                  ${ScheduledMeetingTarget}
                },
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:scheduler:createSchedule",
                "End": true
              },
              "ListSchedules": {
                "Type": "Task",
                "Parameters": {
                  "GroupName": "${ScheduleGroup}"
                },
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:scheduler:listSchedules",
                "Next": "Map"
              },
              "Map": {
                "Type": "Map",
                "ItemProcessor": {
                  "ProcessorConfig": {
                    "Mode": "INLINE"
                  },
                  "StartAt": "GetSchedule",
                  "States": {
                    "GetSchedule": {
                      "Type": "Task",
                      "End": true,
                      "Parameters": {
                        "GroupName.$": "$.GroupName",
                        "Name.$": "$.Name"
                      },
                      "Resource": "arn:${AWS::Partition}:states:::aws-sdk:scheduler:getSchedule",
                      "ResultSelector": {
                        "CreationDate.$": "$.CreationDate",
                        "Description.$": "$.Description",
                        "GroupName.$": "$.GroupName",
                        "Name.$": "$.Name",
                        "ScheduleExpression.$": "$.ScheduleExpression",
                        "ScheduleExpressionTimezone.$": "$.ScheduleExpressionTimezone"
                      }
                    }
                  }
                },
                "End": true,
                "ItemsPath": "$.Schedules"
              },
              "DeleteSchedule": {
                "Type": "Task",
                "Parameters": {
                  "GroupName": "${ScheduleGroup}",
                  "Name.$": "$.data.source.meetingName"
                },
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:scheduler:deleteSchedule",
                "End": true
              },
              "Pass": {
                "Type": "Pass",
                "End": true
              }
            }
          }
        - ClusterArn: !GetAtt Cluster.Arn
          TargetECSRoleArn: !GetAtt TargetECSRole.Arn
          VPSecurityGroupId: !Ref VPSecurityGroupId
          VPLaunchType: !Ref VPLaunchType
          LMAStackName: !Ref LMAStackName
          # JSON fragment used in the RunTask state. For EC2, drive RunTask
          # via the capacity provider so ECS auto-scales the ASG when the
          # cluster is full. For Fargate, fall back to plain LaunchType.
          # Under MICROVM the RunTask state is never entered (see
          # DispatchStateName), but the fragment must still be valid JSON for
          # the state machine definition to parse.
          # Which dispatch state MergeZoomSecret hands off to. Both states exist
          # in every deployment (the definition is static); only the entry point
          # differs, which keeps this a one-line switch instead of two variants
          # of the whole state machine.
          DispatchStateName: !If [UseMicrovmLaunchType, "RunMicrovm", "RunTask"]
          # The dispatch states themselves.
          #
          # These cannot BOTH be present: Step Functions rejects a definition
          # containing unreachable states ("MISSING_TRANSITION_TARGET: State
          # \"RunTask\" is not reachable"), so only the active launch type's
          # states may be emitted. A block scalar is used rather than a quoted
          # string because the JSON contains both quote characters.
          # Plain block scalars, NOT !Sub: these fragments are spliced into the
          # OUTER !Sub, which is where ${ClusterArn} etc. are in scope. A nested
          # !Sub would try to resolve them against its own (empty) variable map
          # and fail cfn-lint E1019 / CloudFormation validation.
          DispatchStates: !If
            - UseMicrovmLaunchType
            - !Sub >-
              "RunMicrovm": {
              "Comment": "MICROVM launch type. Step Functions has no optimized integration for lambda-microvms, so this invokes the launcher Lambda, which calls RunMicrovm, waits for RUNNING, and writes the endpoint to the VP registry. Reuses MarkVPFailed for error handling exactly as RunTask does.",
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
              "FunctionName": "${VPMicrovmLauncherFunction.Arn}",
              "Payload.$": "$"
              },
              "Next": "MicrovmLaunched",
              "ResultPath": "$.microvmResult",
              "ResultSelector": {
              "payload.$": "$.Payload"
              },
              "Retry": [
              {
              "Comment": "RunMicrovm is rate-limited to 5 TPS per account; back off rather than failing the meeting.",
              "ErrorEquals": ["Lambda.TooManyRequestsException", "States.TaskFailed"],
              "IntervalSeconds": 3,
              "MaxAttempts": 4,
              "BackoffRate": 2.0
              }
              ],
              "Catch": [
              {
              "ErrorEquals": ["States.ALL"],
              "Next": "MarkVPFailed",
              "ResultPath": "$.runTaskError"
              }
              ]
              },
              "MicrovmLaunched": {
              "Comment": "The launcher reports ok=false for soft failures (quota exhausted, image not ready) that do not throw. Mirror CheckRunTaskFailures and route those to MarkVPFailed.",
              "Type": "Choice",
              "Choices": [
              {
              "Variable": "$.microvmResult.payload.ok",
              "BooleanEquals": false,
              "Next": "MarkMicrovmSoftFailure"
              }
              ],
              "Default": "End"
              },
              "MarkMicrovmSoftFailure": {
              "Type": "Pass",
              "Parameters": {
              "Error": "MicrovmLaunchFailed",
              "Cause.$": "States.Format('RunMicrovm did not start the VP. Reason: {}', $.microvmResult.payload.reason)"
              },
              "ResultPath": "$.runTaskError",
              "Next": "MarkVPFailed"
              },
            - !Sub >-
              "RunTask": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::ecs:runTask",
              "Parameters": {
              "Cluster": "${Cluster.Arn}",
              "TaskDefinition": "${TaskDefinition}",
              "LaunchType": "${VPLaunchType}",
              "NetworkConfiguration": {
              "AwsvpcConfiguration": {
              "AssignPublicIp": "DISABLED",
              "SecurityGroups": [
              "${VPSecurityGroupId}"
              ],
              "Subnets": [
              "${PrivateSubnet1}",
              "${PrivateSubnet2}"
              ]
              }
              },
              "Overrides": {
              "ContainerOverrides": [
              {
              "Name": "scribe",
              "Environment": [
              {
              "Name": "MEETING_PLATFORM",
              "Value.$": "$.data.meetingPlatform"
              },
              {
              "Name": "MEETING_ID",
              "Value.$": "$.data.meetingID"
              },
              {
              "Name": "MEETING_PASSWORD",
              "Value.$": "$.data.meetingPassword"
              },
              {
              "Name": "MEETING_NAME",
              "Value.$": "$.data.meetingName"
              },
              {
              "Name": "LMA_USER",
              "Value.$": "$.data.userName"
              },
              {
              "Name": "USER_ACCESS_TOKEN",
              "Value.$": "$.data.accessToken"
              },
              {
              "Name": "USER_ID_TOKEN",
              "Value.$": "$.data.idToken"
              },
              {
              "Name": "USER_REFRESH_TOKEN",
              "Value.$": "$.data.rereshToken"
              },
              {
              "Name": "VIRTUAL_PARTICIPANT_ID",
              "Value.$": "$.data.virtualParticipantId"
              },
              {
              "Name": "ZOOM_CREDENTIALS_SECRET_NAME",
              "Value.$": "$.data.zoomCredentialsSecretName"
              },
              {
              "Name": "LMA_USER_SUB",
              "Value.$": "$.data.userSub"
              },
              {
              "Name": "ENABLE_VIDEO_RECORDING",
              "Value.$": "$.data.enableVideoRecording"
              }
              ]
              }
              ]
              }
              },
              "Next": "CheckRunTaskFailures",
              "ResultPath": "$.runTaskResult",
              "ResultSelector": {
              "failures.$": "$.Failures",
              "tasks.$": "$.Tasks"
              },
              "Catch": [
              {
              "ErrorEquals": ["States.ALL"],
              "Next": "MarkVPFailed",
              "ResultPath": "$.runTaskError"
              }
              ]
              },
              "CheckRunTaskFailures": {
              "Comment": "ECS RunTask returns HTTP 200 with a non-empty `failures` array when capacity/agent/etc. issues prevent the task from being placed. The Catch above only catches thrown exceptions, not these soft failures — so we have to inspect the result and route to MarkVPFailed explicitly. Also detect `PROVISIONING` (task queued waiting for the capacity provider to launch a new EC2 host) and surface that to the user as WAITING_FOR_CAPACITY.",
              "Type": "Choice",
              "Choices": [
              {
              "Variable": "$.runTaskResult.failures[0]",
              "IsPresent": true,
              "Next": "MarkRunTaskSoftFailure"
              },
              {
              "Variable": "$.runTaskResult.tasks[0].LastStatus",
              "StringEquals": "PROVISIONING",
              "Next": "MarkWaitingForCapacity"
              }
              ],
              "Default": "End"
              },
              "MarkRunTaskSoftFailure": {
              "Type": "Pass",
              "Parameters": {
              "Cause.$": "States.Format('ECS RunTask returned without scheduling the task. Reason: {}, Detail: {}', $.runTaskResult.failures[0].Reason, $.runTaskResult.failures[0].Detail)"
              },
              "ResultPath": "$.runTaskError",
              "Next": "MarkVPFailed"
              },
              "MarkWaitingForCapacity": {
              "Type": "Task",
              "Comment": "Task is queued (lastStatus=PROVISIONING) waiting for the capacity provider to launch a new EC2 host. Write WAITING_FOR_CAPACITY to the VP record so the UI shows progress instead of sitting silently at INITIALIZING for 60-90s. The container's entrypoint.sh writes BOOTING as soon as the container starts, which overwrites this.",
              "Resource": "arn:${AWS::Partition}:states:::aws-sdk:dynamodb:updateItem",
              "Parameters": {
              "TableName": "${VirtualParticipantTableName}",
              "Key": {
              "id": { "S.$": "$.data.virtualParticipantId" }
              },
              "UpdateExpression": "SET #s = :status, #ea = :now",
              "ExpressionAttributeNames": {
              "#s": "status",
              "#ea": "updatedAt"
              },
              "ExpressionAttributeValues": {
              ":status": { "S": "WAITING_FOR_CAPACITY" },
              ":now": { "S.$": "$$.State.EnteredTime" }
              }
              },
              "ResultPath": null,
              "End": true,
              "Catch": [
              {
              "ErrorEquals": ["States.ALL"],
              "Next": "End"
              }
              ]
              },
          # EventBridge Scheduler target for meetings booked in advance.
          # Scheduler has a native ECS runTask target but none for
          # lambda-microvms, so MICROVM schedules invoke the launcher Lambda
          # instead. Both variants are single-line JSON fragments spliced into
          # the CreateSchedule state; keeping them here (rather than two copies
          # of the state) means the scheduled and immediate paths stay in step.
          ScheduledMeetingTarget: !If
            - UseMicrovmLaunchType
            - !Sub >-
              "Target": {"Arn": "${VPMicrovmLauncherFunction.Arn}",
              "RoleArn": "${VPScheduleInvokeLauncherRole.Arn}",
              "Input": {"data": {"meetingPlatform.$": "$.data.meetingPlatform",
              "meetingId.$": "$.data.meetingID",
              "meetingPassword.$": "$.data.meetingPassword",
              "meetingName.$": "$.data.meetingName",
              "meetingTime.$": "$.data.meetingTime",
              "userName.$": "$.data.userName",
              "virtualParticipantId.$": "$.data.virtualParticipantId",
              "accessToken.$": "$.data.accessToken",
              "idToken.$": "$.data.idToken",
              "rereshToken.$": "$.data.rereshToken"}}}
            - !Sub >-
              "Target": {"Arn": "${Cluster.Arn}",
              "RoleArn": "${TargetECSRole.Arn}",
              "EcsParameters": {"EnableECSManagedTags": false,
              "EnableExecuteCommand": false, "LaunchType": "${VPLaunchType}",
              "NetworkConfiguration": {"AwsvpcConfiguration":
              {"AssignPublicIp": "DISABLED",
              "SecurityGroups": ["${VPSecurityGroupId}"],
              "Subnets": ["${PrivateSubnet1}", "${PrivateSubnet2}"]}},
              "TaskCount": 1, "TaskDefinitionArn": "${TaskDefinition}"},
              "Input": {"containerOverrides": [{"name": "scribe",
              "environment": [{"name": "MEETING_PLATFORM",
              "value.$": "$.data.meetingPlatform"},
              {"name": "MEETING_ID", "value.$": "$.data.meetingID"},
              {"name": "MEETING_PASSWORD", "value.$": "$.data.meetingPassword"},
              {"name": "MEETING_NAME", "value.$": "$.data.meetingName"},
              {"Name": "LMA_USER", "Value.$": "$.data.userName"}]}]}}
          # Only invoked under MICROVM. A placeholder ARN keeps the definition
          # parseable for ECS deployments, where the launcher is not created.
          MicrovmLauncherFunctionArn: !If
            - UseMicrovmLaunchType
            - !GetAtt VPMicrovmLauncherFunction.Arn
            - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:unused-microvm-launcher"

  UpdateLMASettingsWithStateMachine:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !Ref UpdateLMASettingsFunctionArn
      LCASettingsName: !Ref LMASettingsParameterName
      LCASettingsKeyValuePairs:
        LMAVirtualParticipantSchedulerStateMachine:
          !GetAtt [LMAVirtualParticipantSchedulerStateMachine, Arn]
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  ##########################################################################
  # Virtual Participant Scheduler
  ##########################################################################

  # EventBridge Schedule Group for Virtual Participants
  VPScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${LMAStackName}-vp-schedules"

  # IAM Role for EventBridge Scheduler to execute ECS tasks
  VPSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - scheduler.amazonaws.com
                - events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECSTaskExecution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: 
                  - !Ref TaskDefinition
                  - !Sub "${TaskDefinition}:*"
              - Effect: Allow
                Action:
                  - ecs:TagResource
                Resource: "*"
                Condition:
                  StringEquals:
                    "ecs:CreateAction": "RunTask"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringLike:
                    "iam:PassedToService": "ecs-tasks.amazonaws.com"

  # IAM Role for Virtual Participant Scheduler Lambda Function
  VirtualParticipantSchedulerRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: SchedulerLambdaPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                Resource: 
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${VPScheduleGroup}/*"
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${VPScheduleGroup}"
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: 
                  - !Ref TaskDefinition
                  - !Sub "${TaskDefinition}:*"
              # CreateSchedule passes the role EventBridge Scheduler assumes at
              # fire time: the ECS runTask role for EC2/FARGATE, and additionally
              # the launcher-invoke role under MICROVM.
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !If
                  - UseMicrovmLaunchType
                  - - !GetAtt VPSchedulerExecutionRole.Arn
                    - !GetAtt VPScheduleInvokeLauncherRole.Arn
                  - - !GetAtt VPSchedulerExecutionRole.Arn
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !Ref VirtualParticipantTableStreamArn
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:DescribeKey"
                Resource: !Ref CustomerManagedEncryptionKeyArn

  # Virtual Participant Scheduler Lambda Function
  VirtualParticipantSchedulerFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for scheduler function; DynamoDB stream retries provide recovery"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive ARNs, table names, schedule group names, and config values; AWS-owned key encryption is sufficient"
    Properties:
      FunctionName: !Sub "${LMAStackName}-VPScheduler"
      Handler: index.lambda_handler
      Runtime: python3.12
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          import logging
          from datetime import datetime, timezone

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'INFO')))
          
          scheduler_client = boto3.client('scheduler')


          def _ecs_params(vp_id, new_image, launch_type, meeting_time_int,
                          user_sub, zoom_secret_name, enable_video_recording_str):
              """RunTask parameters for the EC2/FARGATE scheduled launch path."""
              return {
                  'ClientToken': vp_id,
                  'TaskDefinition': os.environ['TASK_DEFINITION_ARN'],
                  'Cluster': os.environ['CLUSTER_ARN'],
                  'LaunchType': launch_type,
                  'NetworkConfiguration': {
                      'AwsvpcConfiguration': {
                          'AssignPublicIp': 'DISABLED',
                          'SecurityGroups': json.loads(os.environ['SECURITY_GROUPS']),
                          'Subnets': json.loads(os.environ['SUBNETS']),
                      }
                  },
                  'Overrides': {
                      'ContainerOverrides': [{
                          'Name': os.environ['CONTAINER_NAME'],
                          'Environment': [
                              {'Name': 'VIRTUAL_PARTICIPANT_ID', 'Value': vp_id},
                              {'Name': 'MEETING_PLATFORM', 'Value': new_image.get('meetingPlatform', {}).get('S', '')},
                              {'Name': 'MEETING_ID', 'Value': new_image.get('meetingId', {}).get('S', '')},
                              {'Name': 'MEETING_PASSWORD', 'Value': new_image.get('meetingPassword', {}).get('S', '')},
                              {'Name': 'MEETING_NAME', 'Value': new_image.get('meetingName', {}).get('S', '')},
                              {'Name': 'MEETING_TIME', 'Value': str(meeting_time_int)},
                              {'Name': 'LMA_USER', 'Value': new_image.get('owner', {}).get('S', '')},
                              {'Name': 'LMA_USER_SUB', 'Value': user_sub},
                              {'Name': 'ZOOM_CREDENTIALS_SECRET_NAME', 'Value': zoom_secret_name},
                              {'Name': 'GRAPHQL_ENDPOINT', 'Value': os.environ.get('GRAPHQL_ENDPOINT', '')},
                              {'Name': 'CALL_DATA_STREAM_NAME', 'Value': os.environ.get('CALL_DATA_STREAM_NAME', '')},
                              {'Name': 'RECORDINGS_BUCKET_NAME', 'Value': os.environ.get('RECORDINGS_BUCKET_NAME', '')},
                              {'Name': 'VP_TASK_REGISTRY_TABLE_NAME', 'Value': os.environ.get('VP_TASK_REGISTRY_TABLE_NAME', '')},
                              {'Name': 'ENABLE_VIDEO_RECORDING', 'Value': enable_video_recording_str},
                          ]
                      }]
                  },
                  'EnableExecuteCommand': False
              }


          def lambda_handler(event, context):
              logger.info("Processing VP scheduler request")
              logger.info(f"Event: {json.dumps(event, default=str)}")
              
              try:
                  for record in event.get('Records', []):
                      event_name = record.get('eventName')
                      dynamodb_data = record.get('dynamodb', {})
                      
                      keys = dynamodb_data.get('Keys', {})
                      vp_id = keys.get('id', {}).get('S')
                      
                      if not vp_id:
                          logger.warning("No VP ID found in record, skipping")
                          continue
                          
                      logger.info(f"Processing {event_name} event for VP {vp_id}")
                      
                      if event_name == 'INSERT':
                          new_image = dynamodb_data.get('NewImage', {})
                          is_scheduled = new_image.get('isScheduled', {}).get('BOOL', False)
                          meeting_time = new_image.get('meetingTime', {}).get('N')
                          
                          if is_scheduled and meeting_time:
                              meeting_time_int = int(meeting_time)

                              # Schedule for future execution
                              delay_seconds = 120  # 2 minutes before meeting
                              scheduled_time = datetime.fromtimestamp(meeting_time_int - delay_seconds, tz=timezone.utc)

                              # User identity for persistent profile + stored Zoom creds.
                              # Absent on older rows / guest-only flows.
                              user_sub = new_image.get('userSub', {}).get('S', '')
                              user_zoom_sub = new_image.get('userZoomSub', {}).get('S', '')
                              # Per-VP video toggle. Default ON when absent (older rows).
                              # ECS env values must be strings, so coerce the bool.
                              enable_video_recording = new_image.get('enableVideoRecording', {}).get('BOOL', True)
                              enable_video_recording_str = 'true' if enable_video_recording else 'false'
                              stack_name = os.environ.get('LMA_STACK_NAME', '')
                              zoom_secret_name = (
                                  f"{stack_name}/zoom-credentials/{user_zoom_sub}"
                                  if user_zoom_sub and stack_name else ''
                              )

                              launch_type = os.environ.get('VP_LAUNCH_TYPE', 'FARGATE')

                              if launch_type == 'MICROVM':
                                  # EventBridge Scheduler has a native ECS runTask target but
                                  # none for lambda-microvms, so a MICROVM schedule invokes the
                                  # launcher Lambda instead -- the same target the "start now"
                                  # state machine uses (see ScheduledMeetingTarget). Forwarding
                                  # VP_LAUNCH_TYPE into an ecs:runTask LaunchType instead makes
                                  # ECS reject the fire with "launch type should be one of
                                  # [EC2,FARGATE,EXTERNAL]", and because the schedule is
                                  # ActionAfterCompletion=DELETE it then vanishes, leaving the
                                  # VP stuck at SCHEDULED with no visible error (issue #613).
                                  #
                                  # The launcher accepts this flat payload as well as the state
                                  # machine's {"data": {...}} shape; the key names below are the
                                  # ones its FIELD_MAP looks for. Cognito tokens are absent by
                                  # design -- they are minted per session and would have expired
                                  # by the meeting time -- which matches what the ECS scheduled
                                  # path passes today.
                                  target = {
                                      'Arn': os.environ['MICROVM_LAUNCHER_ARN'],
                                      'RoleArn': os.environ['SCHEDULE_INVOKE_LAUNCHER_ROLE_ARN'],
                                      'Input': json.dumps({
                                          'virtualParticipantId': vp_id,
                                          'meetingPlatform': new_image.get('meetingPlatform', {}).get('S', ''),
                                          'meetingId': new_image.get('meetingId', {}).get('S', ''),
                                          'meetingPassword': new_image.get('meetingPassword', {}).get('S', ''),
                                          'meetingName': new_image.get('meetingName', {}).get('S', ''),
                                          'meetingTime': str(meeting_time_int),
                                          'owner': new_image.get('owner', {}).get('S', ''),
                                          'userSub': user_sub,
                                          'zoomCredentialsSecretName': zoom_secret_name,
                                          'enableVideoRecording': enable_video_recording_str,
                                      })
                                  }
                              else:
                                  target = {
                                      'Arn': 'arn:aws:scheduler:::aws-sdk:ecs:runTask',
                                      'RoleArn': os.environ['SCHEDULER_ROLE_ARN'],
                                      'Input': json.dumps(_ecs_params(
                                          vp_id, new_image, launch_type, meeting_time_int,
                                          user_sub, zoom_secret_name, enable_video_recording_str,
                                      ))
                                  }

                              schedule_expression = f"at({scheduled_time.strftime('%Y-%m-%dT%H:%M:%S')})"

                              response = scheduler_client.create_schedule(
                                  ActionAfterCompletion='DELETE',
                                  FlexibleTimeWindow={'Mode': 'OFF'},
                                  GroupName=os.environ['SCHEDULE_GROUP_NAME'],
                                  Name=vp_id,
                                  ScheduleExpression=schedule_expression,
                                  ScheduleExpressionTimezone='UTC',
                                  State='ENABLED',
                                  Target=target
                              )

                              logger.info(
                                  f"Successfully scheduled VP {vp_id} ({launch_type}) "
                                  f"with schedule ARN: {response.get('ScheduleArn')}"
                              )
                          else:
                              logger.info(f"VP {vp_id} is not scheduled, skipping")

                      elif event_name == 'REMOVE':
                          try:
                              scheduler_client.delete_schedule(
                                  GroupName=os.environ['SCHEDULE_GROUP_NAME'],
                                  Name=vp_id
                              )
                              logger.info(f"Successfully unscheduled VP {vp_id}")
                          except scheduler_client.exceptions.ResourceNotFoundException:
                              logger.info(f"Schedule for VP {vp_id} not found (may have already been executed)")
                          except Exception as e:
                              logger.error(f"Error unscheduling VP {vp_id}: {str(e)}")
                  
                  return {'statusCode': 200, 'body': json.dumps({'message': 'Successfully processed VP scheduler events'})}
                  
              except Exception as e:
                  logger.error(f"Error processing VP scheduler events: {str(e)}")
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Description: Virtual Participant Scheduler with EventBridge Scheduler integration
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt VirtualParticipantSchedulerRole.Arn
      Environment:
        Variables:
          TASK_DEFINITION_ARN: !Ref TaskDefinition
          CLUSTER_ARN: !GetAtt Cluster.Arn
          SECURITY_GROUPS: !Sub '["${VPSecurityGroupId}"]'
          SUBNETS: !Sub '["${PrivateSubnet1}", "${PrivateSubnet2}"]'
          CONTAINER_NAME: "scribe"
          GRAPHQL_ENDPOINT: !Ref GraphQLEndpoint
          CALL_DATA_STREAM_NAME: !Ref CallDataStreamName
          RECORDINGS_BUCKET_NAME: !Ref S3BucketName
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistryTableName
          SCHEDULE_GROUP_NAME: !Ref VPScheduleGroup
          SCHEDULER_ROLE_ARN: !GetAtt VPSchedulerExecutionRole.Arn
          VP_LAUNCH_TYPE: !Ref VPLaunchType
          # MICROVM only: the schedule target is the launcher Lambda rather than
          # ecs:runTask, so it needs the function ARN and the role EventBridge
          # Scheduler assumes to invoke it. Both resources are conditional on
          # UseMicrovmLaunchType, so these are omitted for EC2/FARGATE.
          MICROVM_LAUNCHER_ARN: !If
            - UseMicrovmLaunchType
            - !GetAtt VPMicrovmLauncherFunction.Arn
            - !Ref AWS::NoValue
          SCHEDULE_INVOKE_LAUNCHER_ROLE_ARN: !If
            - UseMicrovmLaunchType
            - !GetAtt VPScheduleInvokeLauncherRole.Arn
            - !Ref AWS::NoValue
          LMA_STACK_NAME: !Ref LMAStackName
          LOG_LEVEL: !Ref LogLevel
  # DynamoDB Event Source Mapping for Scheduler Lambda
  VirtualParticipantSchedulerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref VirtualParticipantTableStreamArn
      FunctionName: !GetAtt VirtualParticipantSchedulerFunction.Arn
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5

  VirtualParticipantSchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/VPScheduler"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  # ----------------------------------------------------------------------
  # VP Task Reaper
  # ----------------------------------------------------------------------
  # When the underlying ECS host (EC2) is terminated externally — by a
  # deploy / ASG replacement / spot interruption / EC2 health check —
  # the container is killed without a SIGTERM, so the VP process never
  # runs its emergencyCleanup handler. The DDB row is left at whatever
  # status it last wrote (typically JOINING / CONNECTING / etc.) and
  # the UI shows an indefinite spinner.
  #
  # This reaper subscribes to ECS Task State Change events for our
  # cluster and, when a task transitions to lastStatus=STOPPED while
  # the matching VP DDB row is in a non-terminal status, flips the row
  # to FAILED with a descriptive errorMessage. Conditional updates make
  # this safe to fire alongside the normal happy-path cleanup — if the
  # VP process already wrote ENDED/COMPLETED/FAILED, the conditional
  # update is a no-op.
  VPTaskReaperRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by table/stream/log resources; standard CFN least-privilege pattern'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ReaperPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VirtualParticipantTableName}"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VPTaskRegistryTableName}"
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource:
                  - !Sub "arn:${AWS::Partition}:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${CallDataStreamName}"
              # The VirtualParticipant + VPTaskRegistry tables and the
              # CallData Kinesis stream are encrypted with the customer-managed
              # KMS key. Without these grants every UpdateItem/PutRecord the
              # reaper attempts fails with an AccessDeniedException (KMS key
              # access denied), so a row never flips to FAILED and the UI
              # sticks at JOINING/WAITING_FOR_CAPACITY — the exact failure this
              # reaper exists to prevent. Scoped by ViaService like the other
              # roles in this stack.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "dynamodb.${AWS::Region}.amazonaws.com"
                      - !Sub "kinesis.${AWS::Region}.amazonaws.com"

  VPTaskReaperFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS'
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required; EventBridge retries are sufficient"
    # checkov:skip=CKV_AWS_117: "VPC access not required; reaches AWS public APIs only"
    # checkov:skip=CKV_AWS_173: "Environment contains only non-sensitive table/stream names"
    Properties:
      FunctionName: !Sub "${LMAStackName}-VPTaskReaper"
      Handler: index.lambda_handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt VPTaskReaperRole.Arn
      Environment:
        Variables:
          VP_TABLE_NAME: !Ref VirtualParticipantTableName
          VP_TASK_REGISTRY_TABLE_NAME: !Ref VPTaskRegistryTableName
          KINESIS_STREAM_NAME: !Ref CallDataStreamName
          CLUSTER_ARN: !GetAtt Cluster.Arn
          LOG_LEVEL: !Ref LogLevel
      Code:
        ZipFile: |
          # ECS Task State Change reaper. Marks the VP DDB row FAILED
          # when its task stops while the row is still in a non-terminal
          # status — covers host EC2 termination, OOM kill, agent loss,
          # and any other path where the container dies without running
          # its own SIGTERM cleanup.
          import json
          import logging
          import os
          from datetime import datetime, timezone

          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'INFO')))

          ddb = boto3.client('dynamodb')
          kinesis = boto3.client('kinesis')

          VP_TABLE = os.environ['VP_TABLE_NAME']
          REGISTRY_TABLE = os.environ['VP_TASK_REGISTRY_TABLE_NAME']
          KINESIS_STREAM = os.environ.get('KINESIS_STREAM_NAME', '')
          CLUSTER_ARN = os.environ['CLUSTER_ARN']

          # Statuses that indicate the VP is still active. If we see a
          # task stop while the row is in one of these, we know the VP
          # process didn't get a chance to clean up — flip to FAILED.
          # FAILED/COMPLETED/ENDED/CANCELLED are terminal: the VP (or
          # the manage-Lambda) already wrote them, so we leave alone.
          TERMINAL_STATUSES = {'FAILED', 'COMPLETED', 'ENDED', 'CANCELLED'}

          def _vpid_from_overrides(detail):
              # ECS Task State Change events contain overrides under
              # `detail.overrides.containerOverrides[].environment[]`
              # (Title-cased on the ECS event, lower-cased on the SDK).
              # Try both shapes.
              overrides = detail.get('overrides') or detail.get('Overrides') or {}
              container_overrides = (
                  overrides.get('containerOverrides')
                  or overrides.get('ContainerOverrides')
                  or []
              )
              for co in container_overrides:
                  env = co.get('environment') or co.get('Environment') or []
                  for kv in env:
                      name = kv.get('name') or kv.get('Name')
                      value = kv.get('value') or kv.get('Value')
                      if name == 'VIRTUAL_PARTICIPANT_ID' and value:
                          return value
              return None

          def _vpid_from_registry(task_arn):
              # Fallback: scan the VPTaskRegistry by taskArn. The registry
              # is small (one row per active VP, TTL'd) so a scan is fine.
              try:
                  paginator = ddb.get_paginator('scan')
                  for page in paginator.paginate(
                      TableName=REGISTRY_TABLE,
                      FilterExpression='taskArn = :ta',
                      ExpressionAttributeValues={':ta': {'S': task_arn}},
                      ProjectionExpression='vpId',
                  ):
                      for item in page.get('Items', []):
                          vp_id = item.get('vpId', {}).get('S')
                          if vp_id:
                              return vp_id
              except ClientError as e:
                  logger.warning(f'Registry scan failed for taskArn={task_arn}: {e}')
              return None

          def _get_vp_callid(vp_id):
              try:
                  resp = ddb.get_item(
                      TableName=VP_TABLE,
                      Key={'id': {'S': vp_id}},
                      ProjectionExpression='CallId',
                  )
                  return resp.get('Item', {}).get('CallId', {}).get('S')
              except ClientError as e:
                  logger.warning(f'GetItem on VP row failed for vp_id={vp_id}: {e}')
                  return None

          def _send_end_to_kinesis(call_id):
              # Best-effort END to close the meeting transcript so the
              # call_event_processor stops showing it as in-progress.
              # Mirrors send_end_meeting_event in virtual_participant_manager.
              if not (KINESIS_STREAM and call_id):
                  return
              try:
                  kinesis.put_record(
                      StreamName=KINESIS_STREAM,
                      PartitionKey=call_id,
                      Data=json.dumps({
                          'EventType': 'END',
                          'CallId': call_id,
                          'CustomerPhoneNumber': 'Virtual Participant',
                          'SystemPhoneNumber': 'LMA System',
                          'CreatedAt': datetime.now(timezone.utc).isoformat(),
                          'AgentId': 'VPTaskReaper',
                          'AccessToken': '',
                          'IdToken': '',
                          'RefreshToken': '',
                      }).encode('utf-8'),
                  )
                  logger.info(f'Sent END Kinesis event for CallId={call_id}')
              except ClientError as e:
                  logger.warning(f'Kinesis PutRecord failed for CallId={call_id}: {e}')

          def _delete_registry_entry(vp_id):
              try:
                  ddb.delete_item(
                      TableName=REGISTRY_TABLE,
                      Key={'vpId': {'S': vp_id}},
                  )
              except ClientError as e:
                  logger.warning(f'Registry delete failed for vp_id={vp_id}: {e}')

          def _mark_failed(vp_id, error_message):
              # Conditional update: only flip to FAILED if the row is
              # still in a non-terminal status. This makes us safe to
              # race against the VP's own emergencyCleanup and against
              # the manage-Lambda's user-initiated end.
              now = datetime.now(timezone.utc).isoformat()
              try:
                  ddb.update_item(
                      TableName=VP_TABLE,
                      Key={'id': {'S': vp_id}},
                      UpdateExpression=(
                          'SET #s = :failed, #e = :err, #ea = :now, #endedAt = :now'
                      ),
                      ConditionExpression=(
                          'attribute_exists(id) AND NOT (#s IN '
                          '(:failed, :completed, :ended, :cancelled))'
                      ),
                      ExpressionAttributeNames={
                          '#s': 'status',
                          '#e': 'errorMessage',
                          '#ea': 'updatedAt',
                          '#endedAt': 'endedAt',
                      },
                      ExpressionAttributeValues={
                          ':failed': {'S': 'FAILED'},
                          ':completed': {'S': 'COMPLETED'},
                          ':ended': {'S': 'ENDED'},
                          ':cancelled': {'S': 'CANCELLED'},
                          ':err': {'S': error_message[:1000]},
                          ':now': {'S': now},
                      },
                  )
                  logger.info(
                      f'VP {vp_id} flipped to FAILED by reaper: {error_message}'
                  )
                  return True
              except ClientError as e:
                  if e.response.get('Error', {}).get('Code') == 'ConditionalCheckFailedException':
                      logger.info(
                          f'VP {vp_id} already in terminal state — reaper no-op'
                      )
                      return False
                  logger.error(f'UpdateItem failed for vp_id={vp_id}: {e}')
                  raise

          # ECS reports a host that was reclaimed / rebooted out from under a
          # running task as EssentialContainerExited (the container process was
          # SIGKILLed when the instance went down). The single most common cause
          # on these EC2 hosts is an in-place AWS SSM Patch Manager reboot
          # (AWS-RunPatchBaseline, RebootOption=RebootIfNeeded) applying a
          # kernel/security update. That is infrastructure maintenance, NOT a
          # meeting/credentials problem, so we surface a message that says so
          # rather than the misleading generic "check your meeting ID/password"
          # guidance the UI would otherwise show.
          def _build_error_message(stop_code, stopped_reason):
              if stop_code == 'EssentialContainerExited':
                  return (
                      'The meeting was interrupted because its host server was '
                      'restarted for routine infrastructure maintenance (e.g. an '
                      'automatic security patch reboot) — not because of a problem '
                      'with the meeting link or password. Please re-add the Virtual '
                      'Participant to rejoin the meeting. '
                      f'(stopCode={stop_code}: '
                      f'{stopped_reason or "no reason given"}).'
                  )
              return (
                  f'Virtual Participant task stopped unexpectedly '
                  f'(stopCode={stop_code or "unknown"}: '
                  f'{stopped_reason or "no reason given"}).'
              )

          def lambda_handler(event, context):
              logger.debug(f'Event: {json.dumps(event, default=str)[:2000]}')
              detail = event.get('detail', {}) or {}

              # Only act on STOPPED transitions for our cluster. The
              # EventBridge rule already filters on these but defense-
              # in-depth is cheap and protects against rule changes.
              if detail.get('lastStatus') != 'STOPPED':
                  return {'skipped': 'not STOPPED'}
              if detail.get('clusterArn') != CLUSTER_ARN:
                  return {'skipped': 'wrong cluster'}

              task_arn = detail.get('taskArn', '')
              stop_code = detail.get('stopCode', '')
              stopped_reason = detail.get('stoppedReason', '')

              vp_id = _vpid_from_overrides(detail) or _vpid_from_registry(task_arn)
              if not vp_id:
                  logger.info(
                      f'No vp_id resolved for taskArn={task_arn} '
                      f'(stopCode={stop_code}, reason={stopped_reason!r}) — skipping'
                  )
                  return {'skipped': 'no vp_id'}

              error_message = _build_error_message(stop_code, stopped_reason)

              flipped = _mark_failed(vp_id, error_message)
              if flipped:
                  call_id = _get_vp_callid(vp_id)
                  _send_end_to_kinesis(call_id)
                  _delete_registry_entry(vp_id)
              else:
                  # Even if the VP row was already terminal, the registry
                  # entry is now stale — its TTL will eventually clean up,
                  # but explicit delete avoids a small window of confusion.
                  _delete_registry_entry(vp_id)

              return {
                  'vpId': vp_id,
                  'taskArn': task_arn,
                  'flipped': flipped,
              }

  VPTaskReaperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/VPTaskReaper"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

  VPTaskReaperRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${LMAStackName}-VPTaskReaper"
      Description: >-
        Invokes VPTaskReaper when an ECS task in the VP cluster transitions
        to STOPPED, so the VP DDB row is flipped to FAILED if the VP
        process didn't have a chance to update it itself.
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          clusterArn:
            - !GetAtt Cluster.Arn
          lastStatus:
            - STOPPED
      State: ENABLED
      Targets:
        - Arn: !GetAtt VPTaskReaperFunction.Arn
          Id: VPTaskReaperFunctionTarget

  VPTaskReaperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt VPTaskReaperFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VPTaskReaperRule.Arn

Outputs:
  StepFunctions:
    Description: Step Functions State Machine ARN
    Value: !Ref LMAVirtualParticipantSchedulerStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-StateMachineArn"

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt Cluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-TaskDefinitionArn"

  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepo}"
    Export:
      Name: !Sub "${AWS::StackName}-ECRRepositoryUri"

  VPScheduleGroupName:
    Description: Name of the EventBridge Schedule Group for Virtual Participants
    Value: !Ref VPScheduleGroup
    Export:
      Name: !Sub "${AWS::StackName}-VPScheduleGroupName"

  VPSchedulerExecutionRoleArn:
    Description: ARN of the EventBridge Scheduler execution role
    Value: !GetAtt VPSchedulerExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VPSchedulerExecutionRoleArn"

  VirtualParticipantSchedulerFunctionArn:
    Description: ARN of the Virtual Participant Scheduler Lambda function
    Value: !GetAtt VirtualParticipantSchedulerFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VPSchedulerFunctionArn"
