AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template creates a CloudFormation Service Role for the Live Meeting Assistant (LMA) solution.
  This role grants permissions to create, update, and delete LMA CloudFormation
  stacks and their resources. It follows the principle of least privilege
  by allowing only the necessary actions for stack management. This template also
  creates a user permission policy that allows users to pass the CloudFormation
  service role to CloudFormation. The iam:PassRole policy must be attached to
  the user or role that will be using the CloudFormation Service Role in order
  to successfully pass the role.

Parameters:
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Recommended) ARN of an existing IAM managed policy to require as the permissions
      boundary on every IAM role this service role creates. When set, iam:CreateRole,
      iam:PutRolePolicy and iam:AttachRolePolicy are allowed only for roles that carry
      this boundary, so the roles the LMA stacks create cannot hold more permission than
      the boundary allows. Set the LMA stack's own PermissionsBoundaryArn parameter to the
      same ARN so that every role the stacks define attaches it. Leave empty to keep the
      previous behaviour, in which role creation is not constrained to a boundary.
    AllowedPattern: '^(|arn:aws[a-zA-Z-]*:iam::\d{12}:policy/.+)$'
    ConstraintDescription: >-
      Must be empty, or the ARN of an IAM managed policy
      (arn:aws:iam::<account-id>:policy/<policy-name>).

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Broad permissions required for non-admin users to deploy LMA stacks via delegated CloudFormation service role"
          - id: W28
            reason: "Explicit role name required for consistent cross-stack references in delegated deployment model"
          - id: F38
            reason: "Resource wildcard needed with broad permissions required for non-admin users to deploy LMA stacks via delegated CloudFormation service role"
          - id: W76
            reason: "Suppressing W76: SPCM for IAM policy document is higher than 25"
          - id: F3
            reason: "Suppressing F3: wildcard action on named services required for CloudFormation service role, to allow CRUD on stack resources"
          - id: AwsSolutions-IAM5
            reason: "Broad permissions required for non-admin users to deploy LMA stacks via delegated CloudFormation service role"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "CloudFormation service role requires broad permissions to deploy and manage the full LMA application stack. Assumable only by cloudformation.amazonaws.com. All operations logged in CloudTrail."
          - id: AwsSolutions-IAM4
            reason: "AWS managed policies not used. All policies are inline and custom-scoped."
    # checkov:skip=CKV_AWS_110: "CloudFormation service role requires IAM permissions to create Lambda execution roles and service-linked roles during stack deployment. Trust policy restricts to cloudformation.amazonaws.com service principal."
    # checkov:skip=CKV_AWS_109: "CloudFormation service role requires IAM policy management permissions to attach policies to created roles during infrastructure deployment. Constrained by trust policy."
    # checkov:skip=CKV_AWS_108: "CloudFormation service role requires S3/KMS permissions to create and configure encrypted data buckets for the LMA solution. All buckets use customer-managed KMS encryption."
    # checkov:skip=CKV_AWS_111: "CloudFormation service role requires write permissions across AWS services to deploy complete LMA infrastructure. Trust policy limits to CloudFormation service. Use in conjunction with CloudTrail auditing."
    # checkov:skip=CKV_AWS_107: "CloudFormation service role may need to create/configure secrets for service integrations. Actual secret values are provided via parameters, not embedded in templates."
    Properties:
      RoleName: !Sub '${AWS::StackName}-CFServiceRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub 'cloudformation.${AWS::URLSuffix}'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudFormationPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationFullAccess
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Sid: CloudFormationTransform
                Effect: Allow
                Action:
                  - serverlessrepo:CreateCloudFormationChangeSet
                  - serverlessrepo:GetApplication
                Resource: '*'
              # Role, policy and instance-profile lifecycle actions, granted
              # unconditionally. Role CREATION and policy ATTACHMENT are not here;
              # they are in the boundary-aware statement that follows.
              #
              # iam:DeleteRolePolicy and iam:DetachRolePolicy do support the
              # iam:PermissionsBoundary condition key and are nonetheless left
              # unconditioned on purpose: CloudFormation uses them when updating
              # and deleting stacks, including for roles that predate the boundary
              # or that never carried one (SAM implicit function roles never do).
              # Conditioning them would leave those roles impossible to clean up
              # and a stack delete unable to finish. The consequence to be aware
              # of is that a boundary configured here constrains what the roles
              # created through this service role may DO; it does not prevent this
              # service role from detaching a policy from, or deleting, a role.
              - Sid: IAMRolesAndPolicies
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:ListEntitiesForPolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:GetInstanceProfile
                Resource: '*'
              # Role creation and inline/managed policy attachment. When
              # PermissionsBoundaryArn is supplied, the iam:PermissionsBoundary
              # condition key ties all three actions to roles carrying that
              # boundary: a role can only be created with it, and its policies can
              # only be written while it still has it. The invariant this keeps is
              # that every role reachable through this service role stays inside
              # the boundary policy. The two branches are alternatives selected by
              # HasPermissionsBoundary — with no boundary supplied the statement is
              # the same as before, so the template stays usable as-is.
              - !If
                - HasPermissionsBoundary
                - Sid: IAMCreateRoleAndAttachPoliciesWithinBoundary
                  Effect: Allow
                  Action:
                    - iam:CreateRole
                    - iam:PutRolePolicy
                    - iam:AttachRolePolicy
                    # Needed when a stack UPDATE adds the boundary to a role that
                    # was created before it was configured; CreateRole sets the
                    # boundary inline, so this is only reached on updates.
                    - iam:PutRolePermissionsBoundary
                    # And needed for the reverse update, so that going back to
                    # PermissionsBoundaryArn="" can complete instead of failing
                    # part-way through (a failed rollback here would leave the role
                    # that deploys the whole solution in UPDATE_ROLLBACK_FAILED).
                    #
                    # Placing it inside this statement is INTENDED to restrict
                    # removal to a role that currently carries exactly this
                    # boundary, which is the only case the back-out needs. That
                    # intent is not verified against a live account: whether IAM
                    # populates iam:PermissionsBoundary in the request context for
                    # this particular action was not established from the published
                    # reference. If it does not, the condition never matches and the
                    # grant is inert — in which case move this action to the
                    # unconditioned statement above so that the revert can still
                    # complete. Confirm on a throwaway account before relying on it.
                    #
                    # No paired explicit Deny: this template grants no iam:*
                    # wildcard, so there is no broader grant of this action to claw
                    # back, and a Deny here would block the back-out it exists to
                    # enable.
                    - iam:DeleteRolePermissionsBoundary
                  Resource: '*'
                  Condition:
                    StringEquals:
                      iam:PermissionsBoundary: !Ref PermissionsBoundaryArn
                - Sid: IAMCreateRoleAndAttachPolicies
                  Effect: Allow
                  Action:
                    - iam:CreateRole
                    - iam:PutRolePolicy
                    - iam:AttachRolePolicy
                  Resource: '*'
              - Sid: IAMCreateServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/aws-service-role/ecs.amazonaws.com/AWSServiceRoleForECS'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ecs.amazonaws.com
              - Sid: IAMPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
        - PolicyName: LMAInfraAndDataPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaManagement
                Effect: Allow
                Action:
                  - lambda:*
                Resource: '*'
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:*
                Resource: '*'
              - Sid: S3Management
                Effect: Allow
                Action:
                  - s3:*
                Resource: '*'
              - Sid: S3Vectors
                Effect: Allow
                Action:
                  - s3vectors:*
                Resource: '*'
              - Sid: KinesisDataStreams
                Effect: Allow
                Action:
                  - kinesis:*
                Resource: '*'
              - Sid: KMS
                Effect: Allow
                Action:
                  - kms:*
                Resource: '*'
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:*
                Resource: '*'
              - Sid: SNS
                Effect: Allow
                Action:
                  - sns:*
                Resource: '*'
              - Sid: SES
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Sid: SSMParameterStore
                Effect: Allow
                Action:
                  - ssm:*
                Resource: '*'
              - Sid: EventBridge
                Effect: Allow
                Action:
                  - events:*
                Resource: '*'
              - Sid: EventBridgeScheduler
                Effect: Allow
                Action:
                  - scheduler:*
                Resource: '*'
              - Sid: StepFunctions
                Effect: Allow
                Action:
                  - states:*
                Resource: '*'
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - codebuild:*
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
        - PolicyName: LMAFrontendComputePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AppSync
                Effect: Allow
                Action:
                  - appsync:*
                Resource: '*'
              - Sid: CognitoUserPoolAndIdentity
                Effect: Allow
                Action:
                  - cognito-idp:*
                  - cognito-identity:*
                Resource: '*'
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:*
                Resource: '*'
              - Sid: BedrockModelsAndKnowledgeBases
                Effect: Allow
                Action:
                  - bedrock:*
                Resource: '*'
              - Sid: BedrockAgentCore
                Effect: Allow
                Action:
                  - bedrock-agentcore:*
                Resource: '*'
              - Sid: AWSMarketplace
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:Unsubscribe
                  - aws-marketplace:ViewSubscriptions
                Resource: '*'
              - Sid: Transcribe
                Effect: Allow
                Action:
                  - transcribe:*
                Resource: '*'
              - Sid: TranslateAndComprehend
                Effect: Allow
                Action:
                  - translate:TranslateText
                  - comprehend:DetectSentiment
                  - comprehend:DetectDominantLanguage
                Resource: '*'
              - Sid: ECSAndFargate
                Effect: Allow
                Action:
                  - ecs:*
                Resource: '*'
              - Sid: ECR
                Effect: Allow
                Action:
                  - ecr:*
                Resource: '*'
              - Sid: EC2AndVPC
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
              - Sid: ElasticLoadBalancing
                Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'
              - Sid: AutoScaling
                Effect: Allow
                Action:
                  - autoscaling:*
                Resource: '*'
              - Sid: XRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'

  PassRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit policy name required for consistent cross-stack references in delegated deployment model"
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-PassRolePolicy'
      Description: Policy to allow passing the LMA CloudFormation service role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:PassRole
            Resource: !GetAtt CloudFormationServiceRole.Arn

Outputs:
  ServiceRoleArn:
    Description: ARN of the CloudFormation service role
    Value: !GetAtt CloudFormationServiceRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ServiceRoleArn'
  PassRolePolicyArn:
    Description: ARN of the PassRole policy for admins to assign to users
    Value: !Ref PassRolePolicy
    Export:
      Name: !Sub '${AWS::StackName}-PassRolePolicyArn'
  RequiredPermissionsBoundaryArn:
    Description: >-
      Permissions boundary required on roles created through this service role, or
      empty if none was configured. Pass this same value as the LMA stack's
      PermissionsBoundaryArn parameter.
    Value: !Ref PermissionsBoundaryArn
    Export:
      Name: !Sub '${AWS::StackName}-RequiredPermissionsBoundaryArn'
