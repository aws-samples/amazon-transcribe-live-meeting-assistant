        default: Zoom Meeting SDK Client ID (Optional)
      ZoomMeetingSdkClientSecret:
        default: Zoom Meeting SDK Client Secret (Optional)
      ZoomMeetingSdkClientSecretArn:
        default: Existing Secret ARN Holding the Zoom Meeting SDK Client Secret (Optional)
      AcsConnectionString:
