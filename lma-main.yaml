Rules:
  # check required parameters
  StrandsBedrockKBUseExisting:
    RuleCondition:
      !Equals [
        !Ref MeetingAssistService,
        "STRANDS_BEDROCK_WITH_KB (Use Existing)",
      ]
    Assertions:
      - Assert: !Not [!Equals [!Ref BedrockKnowledgeBaseId, ""]]
        AssertDescription:
          BedrockKnowledgeBaseId is required when MeetingAssistService
          is 'STRANDS_BEDROCK_WITH_KB (Use Existing)'

  # Meeting video arrives on a second WebSocket connection that only the task
  # already hosting that meeting's audio session can attach, and the load
  # balancer cannot pin a client to a task, so a multi-task transcriber service
  # refuses video whenever the two connections land on different tasks. Rejecting
  # the combination at deploy time turns a silent per-meeting failure into an
  # error on the parameters page. TranscriberDesiredTaskCount has MinValue 1, so
  # asserting equality with 1 is the same as asserting it is not greater.
  TranscriberSingleTaskWhenVideoRecordingEnabled:
    RuleCondition: !Equals [!Ref EnableVideoRecording, "true"]
    Assertions:
      - Assert: !Equals [!Ref TranscriberDesiredTaskCount, "1"]
        AssertDescription:
          TranscriberDesiredTaskCount must be 1 when EnableVideoRecording is
          'true' — meeting video can only be attached by the task holding that
          meeting's audio session. Set EnableVideoRecording to 'false' to run
          more than one transcriber task.
      - Assert: !Equals [!Ref TranscriberAutoScalingEnabled, "false"]
        AssertDescription:
          TranscriberAutoScalingEnabled must be 'false' when
          EnableVideoRecording is 'true' — scaling out would place meeting video
          connections on tasks that do not hold the matching audio session.

  # Each third-party credential is supplied in exactly one of two forms: the
  # value itself (this stack stores it in a secret of its own) or the ARN of a
  # secret that already holds it. Supplying both leaves no single answer to
  # which one the consumers should read, so it is rejected on the parameters
  # page rather than resolved by precedence.
  TavilyApiKeyCredentialForm:
    RuleCondition: !Not [!Equals [!Ref TavilyApiKey, ""]]
    Assertions:
      - Assert: !Equals [!Ref TavilyApiKeySecretArn, ""]
        AssertDescription:
          Supply either TavilyApiKey or TavilyApiKeySecretArn, not both. Clear
          TavilyApiKey to point the stack at your own secret, or clear
          TavilyApiKeySecretArn to have the stack store the key for you.

  ElevenLabsApiKeyCredentialForm:
    RuleCondition: !Not [!Equals [!Ref ElevenLabsApiKey, ""]]
    Assertions:
      - Assert: !Equals [!Ref ElevenLabsApiKeySecretArn, ""]
        AssertDescription:
          Supply either ElevenLabsApiKey or ElevenLabsApiKeySecretArn, not both.

  SimliApiKeyCredentialForm:
    RuleCondition: !Not [!Equals [!Ref SimliApiKey, ""]]
    Assertions:
      - Assert: !Equals [!Ref SimliApiKeySecretArn, ""]
        AssertDescription:
          Supply either SimliApiKey or SimliApiKeySecretArn, not both.

  ZoomMeetingSdkClientSecretCredentialForm:
    RuleCondition: !Not [!Equals [!Ref ZoomMeetingSdkClientSecret, ""]]
    Assertions:
      - Assert: !Equals [!Ref ZoomMeetingSdkClientSecretArn, ""]
        AssertDescription:
          Supply either ZoomMeetingSdkClientSecret or
          ZoomMeetingSdkClientSecretArn, not both.

  AcsConnectionStringCredentialForm:
    RuleCondition: !Not [!Equals [!Ref AcsConnectionString, ""]]
    Assertions:
      - Assert: !Equals [!Ref AcsConnectionStringSecretArn, ""]
        AssertDescription:
          Supply either AcsConnectionString or AcsConnectionStringSecretArn,
          not both.

Mappings:
  # Deploy-time values for the on-demand ASR engine that are deliberately not
  # CloudFormation parameters: EnableMicrovmAsr is the only deploy-time question,
  # and the bundle carries its own calibrated operating point.
  #
  # ModelBundle must name a bundle in lma-asr-microvm-stack/source/catalog.json
  # (scripts/sync_bundles.py --check enforces it); changing it rebuilds the MicroVM
  # image (~20 min). MaxMeetingSeconds is the per-MicroVM lifetime ceiling and the
  # cost backstop if a transcriber task dies without releasing one (max 28800).
  AsrDefaults:
    Engine:
      ModelBundle: parakeet-tdt-v3-live-nemotron35-sortformer
      MaxMeetingSeconds: "14400"

  # Console hostname per partition, for the console links in Outputs.
  # AWS::URLSuffix does not help here: the console is not reached at
  # <service>.<urlsuffix>, and its hostname differs per partition in a way that
  # no pseudo parameter exposes. Keyed on AWS::Partition so a GovCloud or China
  # deployment emits links that resolve there.
  ConsoleDomain:
    aws:
      Domain: console.aws.amazon.com
    aws-us-gov:
      Domain: console.amazonaws-us-gov.com
    aws-cn:
      Domain: console.amazonaws.cn

Conditions:
  ShouldRetainDataOnDelete: !Equals [!Ref EnableDataRetentionOnDelete, "true"]
  ShouldDeleteDataOnDelete: !Equals [!Ref EnableDataRetentionOnDelete, "false"]
  ShouldCreateRecordingBucket: !Equals ["", ""]
  ShouldUseStrandsBedrock:
    !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK"]
  ShouldUseStrandsBedrockWithKBCreate:
    !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK_WITH_KB (Create)"]
  ShouldUseStrandsBedrockWithKBExisting:
    !Equals [!Ref MeetingAssistService, "STRANDS_BEDROCK_WITH_KB (Use Existing)"]
  ShouldUseStrandsBedrockWithKB:
    !Or [
      !Condition ShouldUseStrandsBedrockWithKBCreate,
      !Condition ShouldUseStrandsBedrockWithKBExisting
    ]
  ShouldUseAnyStrandsBedrock:
    !Or [
      !Condition ShouldUseStrandsBedrock,
      !Condition ShouldUseStrandsBedrockWithKB
    ]
  ShouldCreateBedrockKnowledgeBase: !Condition ShouldUseStrandsBedrockWithKBCreate
  ShouldCreateVPC: !Equals [!Ref UseExistingVPC, "false"]
  ShouldCreateTranscriptKnowledgeBase:
    !Equals [!Ref TranscriptKnowledgeBase, "BEDROCK_KNOWLEDGE_BASE (Create)"]
  ShouldUseTranscriptKnowledgeBase: !Condition ShouldCreateTranscriptKnowledgeBase
  ShouldEnableMCP: !Equals [!Ref EnableMCP, "true"]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

  # Operator-supplied third-party credentials. "...Value" means the credential
  # itself was typed into the parameter, so this stack creates the secret that
  # holds it; "...SecretArn" means an existing secret was named instead. The
  # Rules above allow at most one of the two per credential, and the consuming
  # stacks only ever receive the resulting ARN.
  HasTavilyApiKeyValue: !Not [!Equals [!Ref TavilyApiKey, ""]]
  HasTavilyApiKeySecretArn: !Not [!Equals [!Ref TavilyApiKeySecretArn, ""]]
  HasElevenLabsApiKeyValue: !Not [!Equals [!Ref ElevenLabsApiKey, ""]]
  HasElevenLabsApiKeySecretArn: !Not [!Equals [!Ref ElevenLabsApiKeySecretArn, ""]]
  HasSimliApiKeyValue: !Not [!Equals [!Ref SimliApiKey, ""]]
  HasSimliApiKeySecretArn: !Not [!Equals [!Ref SimliApiKeySecretArn, ""]]
  HasZoomMeetingSdkClientSecretValue:
    !Not [!Equals [!Ref ZoomMeetingSdkClientSecret, ""]]
  HasZoomMeetingSdkClientSecretArn:
    !Not [!Equals [!Ref ZoomMeetingSdkClientSecretArn, ""]]
  HasAcsConnectionStringValue: !Not [!Equals [!Ref AcsConnectionString, ""]]
  HasAcsConnectionStringSecretArn:
    !Not [!Equals [!Ref AcsConnectionStringSecretArn, ""]]

  # Either form of the Zoom SDK client secret enables the SDK join path, which
  # is what the UI's ZoomSdkEnabled setting reports.
  ZoomSdkEnabled: !And
    - !Not [!Equals [!Ref ZoomMeetingSdkClientId, ""]]
    - !Or
      - !Condition HasZoomMeetingSdkClientSecretValue
      - !Condition HasZoomMeetingSdkClientSecretArn
  ShouldDeployMicrovmAsr: !Equals [!Ref EnableMicrovmAsr, "true"]
  ShouldCreateOperationalAlarms: !Equals [!Ref EnableOperationalAlarms, "true"]
  # AdminEmail is a required parameter with an AllowedPattern that an empty
  # string does not match, so in practice this is always true. It is asserted
  # anyway so that the subscription resource states the contract it depends on:
  # SNS rejects a subscription with an empty endpoint, which would fail the
  # whole stack rather than just the subscription.
  ShouldSubscribeAdminEmailToAlerts: !Not [!Equals [!Ref AdminEmail, ""]]
  # The stale-meeting reaper's schedule rule is created with State DISABLED when
  # the timeout is 0, so the function exists but is never invoked. An alarm on
  # "no invocations" would then be permanently in ALARM, so it is not created.
  ShouldAlarmOnStaleMeetingReaper: !And
    - !Condition ShouldCreateOperationalAlarms
    - !Not [!Equals [!Ref MeetingInactivityTimeoutInMinutes, 0]]
  ShouldEnableAsrDiarization: !And
    - !Condition ShouldDeployMicrovmAsr
    - !Not
      - !Equals
        - !FindInMap [AsrDefaults, Engine, ModelBundle]
        - "fastconformer-transcription-only"

Resources:
  ##########################################################################
  # Customer Managed KMS Key for encryption across all resources
  ##########################################################################
  CustomerManagedEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "Customer managed KMS key for ${AWS::StackName} encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:CreateAlias"
              - "kms:CreateGrant"
              - "kms:CreateKey"
              - "kms:DescribeKey"
              - "kms:EnableKey"
              - "kms:EnableKeyRotation"
              - "kms:ListAliases"
              - "kms:ListGrants"
              - "kms:ListKeys"
              - "kms:ListKeyPolicies"
              - "kms:ListResourceTags"
              - "kms:PutKeyPolicy"
              - "kms:UpdateAlias"
              - "kms:UpdateKeyDescription"
              - "kms:RevokeGrant"
              - "kms:DisableKey"
              - "kms:DisableKeyRotation"
              - "kms:GetKeyPolicy"
              - "kms:GetKeyRotationStatus"
              - "kms:DeleteAlias"
              - "kms:TagResource"
              - "kms:UntagResource"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncryptFrom"
              - "kms:ReEncryptTo"
              - "kms:GenerateDataKey"
              - "kms:GenerateDataKeyWithoutPlaintext"
            Resource: "*"
          - Sid: Allow DynamoDB Service
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: Allow CloudWatch Logs Service
            Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: Allow S3 Service
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: Allow SNS Service
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: Allow SQS Service
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          # CloudWatch is the publisher when an alarm notifies the operational
          # alerts topic, and SNS requires the publisher itself to hold
          # kms:GenerateDataKey* and kms:Decrypt on the topic's key. Granted
          # unconditionally and with no condition keys: EnableOperationalAlarms
          # can be switched on by a stack update at any time, and without this
          # grant an alarm shows ALARM in the console while the notification is
          # silently dropped, which is the one failure an alerting stack cannot
          # afford. kms:Decrypt is needed because SNS re-reads the data key it
          # was given, and the grant covers no other action.
          - Sid: Allow CloudWatch Alarms To Publish To Encrypted Topics
            Effect: Allow
            Principal:
              Service: !Sub "cloudwatch.${AWS::URLSuffix}"
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
          - Sid: Allow S3 Vectors indexing service
            Effect: Allow
            Principal:
              Service: indexing.s3vectors.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"

  CustomerManagedEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-encryption-key"
      TargetKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Third-party integration credentials
  #
  # One secret per operator-supplied credential, created only when that
  # credential was typed into its parameter. The parameters themselves are
  # unchanged: an operator still enters the key in the same box, and this stack
  # is what decides where it is kept. What travels on to the consuming stacks is
  # the secret's ARN — the ECS task definition names the ARN and the ECS agent
  # injects the value at task start, and the meeting-assist function reads the
  # ARN and fetches the value on first use.
  #
  # Each is named under ${AWS::StackName}/integrations/ so an operator rotating
  # one can address it by a name they can predict, next to the per-user
  # credentials this deployment already keeps there
  # (${AWS::StackName}/zoom-credentials/<cognito sub>). That is a deliberate
  # difference from the four secrets the AI stack and the WebSocket transcriber
  # stack create, which set no Name and so get a generated one: nothing
  # addresses those by name, and the rotation procedures for these do.
  #
  # DeletionPolicy is Delete, not the EnableDataRetentionOnDelete conditional
  # used for DynamoDB tables and S3 buckets. The value here is an operator
  # input that also exists at the provider and in the stack parameter, so a
  # retained copy preserves nothing that is not already recoverable, and with a
  # fixed name a retained copy would hold that name indefinitely. Delete
  # releases it once Secrets Manager's recovery window elapses; the window
  # itself cannot be shortened from CloudFormation (the resource exposes no
  # RecoveryWindowInDays), so the two cases where a held name fails a stack
  # update are documented in
  # docs/infrastructure-and-security.md#the-30-day-recovery-window.
  ##########################################################################
  TavilyApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasTavilyApiKeyValue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_149: "Encrypted with this stack's customer-managed key"
    Properties:
      Name: !Sub "${AWS::StackName}/integrations/tavily-api-key"
      Description: !Sub "Tavily API key for the ${AWS::StackName} web search tool"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      SecretString: !Ref TavilyApiKey

  ElevenLabsApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasElevenLabsApiKeyValue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_149: "Encrypted with this stack's customer-managed key"
    Properties:
      Name: !Sub "${AWS::StackName}/integrations/elevenlabs-api-key"
      Description: !Sub "ElevenLabs API key for the ${AWS::StackName} voice assistant"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      SecretString: !Ref ElevenLabsApiKey

  SimliApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasSimliApiKeyValue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_149: "Encrypted with this stack's customer-managed key"
    Properties:
      Name: !Sub "${AWS::StackName}/integrations/simli-api-key"
      Description: !Sub "Simli API key used by the ${AWS::StackName} Virtual Participant avatar"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      SecretString: !Ref SimliApiKey

  ZoomMeetingSdkClientSecretSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasZoomMeetingSdkClientSecretValue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_149: "Encrypted with this stack's customer-managed key"
    Properties:
      Name: !Sub "${AWS::StackName}/integrations/zoom-meeting-sdk-client-secret"
      Description: !Sub "Zoom Meeting SDK client secret for ${AWS::StackName} join signatures"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      SecretString: !Ref ZoomMeetingSdkClientSecret

  AcsConnectionStringSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasAcsConnectionStringValue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # checkov:skip=CKV_AWS_149: "Encrypted with this stack's customer-managed key"
    Properties:
      Name: !Sub "${AWS::StackName}/integrations/acs-connection-string"
      Description: !Sub "ACS connection string for ${AWS::StackName} Teams interop tokens"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      SecretString: !Ref AcsConnectionString

  # EventBridge rule for KMS key monitoring
  KMSKeyMonitoringEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-KMS-Key-Monitoring"
      Description: "EventBridge rule to monitor KMS key events for compliance and security"
      EventPattern:
        source:
          - "aws.kms"
        detail:
          eventSource:
            - "kms.amazonaws.com"
          eventName:
            - "DisableKey"
            - "ScheduleKeyDeletion"
            - "CancelKeyDeletion"
            - "CreateKey"
            - "PutKeyPolicy"
            - "EnableKey"
            - "DisableKeyRotation"
            - "EnableKeyRotation"
          resources:
            - !GetAtt CustomerManagedEncryptionKey.Arn
      State: ENABLED
      Targets:
        - Arn: !GetAtt KMSKeyMonitoringFunction.Arn
          Id: "KMSKeyMonitoringTarget"

  # Lambda function for KMS key monitoring
  KMSKeyMonitoringFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_116: "DLQ not required for monitoring function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Description: "Lambda function to process KMS key events for monitoring and compliance"
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      InlineCode: |
        import json
        import os
        import boto3
        import logging

        logger = logging.getLogger()
        logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'INFO')))

        def handler(event, context):
            """
            Process KMS key events for monitoring and compliance.
            This function logs KMS key events and can be extended to send alerts.
            """
            try:
                logger.info(f"Received KMS event: {json.dumps(event)}")
                
                # Extract event details
                detail = event.get('detail', {})
                event_name = detail.get('eventName', 'Unknown')
                event_source = detail.get('eventSource', 'Unknown')
                source_ip = detail.get('sourceIPAddress', 'Unknown')
                user_identity = detail.get('userIdentity', {})
                
                # Log key information
                logger.info(f"KMS Event: {event_name}")
                logger.info(f"Source: {event_source}")
                logger.info(f"Source IP: {source_ip}")
                logger.info(f"User Identity: {json.dumps(user_identity)}")
                
                # Add custom logic here for specific event handling
                if event_name in ['DisableKey', 'ScheduleKeyDeletion']:
                    logger.warning(f"CRITICAL KMS EVENT: {event_name} - Key security may be compromised")
                elif event_name == 'PutKeyPolicy':
                    logger.info(f"KMS key policy updated - review for compliance")
                
                return {
                    'statusCode': 200,
                    'body': json.dumps({
                        'message': f'Successfully processed KMS event: {event_name}',
                        'eventProcessed': True
                    })
                }
                
            except Exception as e:
                logger.error(f"Error processing KMS event: {str(e)}")
                return {
                    'statusCode': 500,
                    'body': json.dumps({
                        'message': f'Error processing KMS event: {str(e)}',
                        'eventProcessed': False
                    })
                }
      LoggingConfig:
        LogGroup:
          Fn::Sub: /${AWS::StackName}/lambda/KMSKeyMonitoringFunction
    DependsOn:
      - KMSKeyMonitoringFunctionLogGroup

  KMSKeyMonitoringFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /${AWS::StackName}/lambda/KMSKeyMonitoringFunction
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
