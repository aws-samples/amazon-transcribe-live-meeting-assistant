  ##########################################################################
  # Custom Resource to empty S3 buckets before deletion
  ##########################################################################
  S3BucketCleanupRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
          - id: AwsSolutions-IAM5
            reason: 'Wildcards scoped by service/resource or PassedToService condition; standard CFN least-privilege pattern'
    Condition: ShouldDeleteDataOnDelete
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: S3BucketCleanupPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:DeleteBucket
