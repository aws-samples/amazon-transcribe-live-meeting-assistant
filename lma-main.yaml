  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub "${LoggingBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: 
              - !Sub "${LoggingBucket.Arn}/*"
              - !Sub "${LoggingBucket.Arn}"
            Condition:
              Bool:
                'aws:SecureTransport': false

  ## BUCKET TO STORE STEREO RECORDINGS AND TRANSCRIPTS FILES
  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ShouldRetainDataOnDelete, Retain, Delete]
    UpdateReplacePolicy: Retain
    Condition: ShouldCreateRecordingBucket
    Properties:
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: "recordings-bucket-logs/"
      LifecycleConfiguration:
        Rules:
          - Id: AudioRetention
            Status: Enabled
            Prefix: "lma-audio-recordings/"
            ExpirationInDays: !Ref AudioRecordingExpirationInDays
          - Id: VideoRetention
            Status: Enabled
            Prefix: "lma-video-recordings/"
            ExpirationInDays: !Ref AudioRecordingExpirationInDays
          - Id: VideoChunkCleanup
            Status: Enabled
            # In-progress video segments are deleted by the VP after the final
            # .mp4 is assembled; this rule is a backstop for chunks orphaned by a
            # container crash so they never accumulate cost.
            Prefix: "lma-video-chunks/"
            ExpirationInDays: 1
          - Id: TranscriptRetention
            Status: Enabled
            Prefix: "lma-transcripts/"
            ExpirationInDays: !Ref TranscriptionExpirationInDays
          # Key frames of the shared screen (docs/meeting-video.md). Their items
          # carry the transcript's DynamoDB TTL, so the images are kept exactly
          # as long, and the timeline never shows a frame whose image is gone.
          - Id: VideoKeyframeRetention
            Status: Enabled
            Prefix: "lma-video-keyframes/"
            ExpirationInDays: !Ref TranscriptionExpirationInDays
          - Id: PendingUploadCleanup
            Status: Enabled
            Prefix: "lma-uploads-pending/"
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - Id: LmaUploadsPendingPutFromBrowser
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "content-type"
              - "Content-Type"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  RecordingsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateRecordingBucket
    Properties:
      Bucket: !Ref RecordingsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EnforceSSLOnly
            Action:
              - "s3:*"
            Effect: "Deny"
            Principal: "*"
            Resource:
              - !GetAtt RecordingsBucket.Arn
              - !Sub "${RecordingsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Sid: AllowTranscribeRead
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action:
              - s3:GetObject
            Resource:
              - !Sub "${RecordingsBucket.Arn}/lma-uploads-pending/*"
              - !Sub "${RecordingsBucket.Arn}/lma-audio-recordings/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
          - Sid: AllowTranscribeWrite
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action:
              - s3:PutObject
            Resource:
              - !Sub "${RecordingsBucket.Arn}/lma-transcripts/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
                "s3:x-amz-acl": "bucket-owner-full-control"

  RecordingsBucketNotificationFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: 'AWS-managed policies are used intentionally for standard Lambda execution; scope is narrow'
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
    Condition: ShouldCreateRecordingBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: ManageBucketNotification
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                  - s3:GetBucketNotificationConfiguration
                  - s3:PutBucketNotificationConfiguration
                Resource: !GetAtt RecordingsBucket.Arn

  RecordingsBucketNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldCreateRecordingBucket
    Properties:
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

  RecordingsBucketNotificationFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldCreateRecordingBucket
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Function does not require reserved concurrency
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for one-shot Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt RecordingsBucketNotificationFunctionRole.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      Code:
        ZipFile: |
          """Installs (or removes on Delete) an S3 ObjectCreated notification
          on RecordingsBucket routed to the upload processor Lambda in AISTACK.
          Implemented as a custom resource to break the AISTACK ↔
          RecordingsBucket CloudFormation cycle."""
          import json
          import os
          import logging
          import boto3
          import cfnresponse

          log = logging.getLogger()
          log.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'INFO')))
          s3 = boto3.client("s3")

          def handler(event, context):
              log.info("event=%s", json.dumps(event))
              status = cfnresponse.SUCCESS
              reason = "ok"
              try:
                  props = event["ResourceProperties"]
                  bucket = props["Bucket"]
                  request_type = event["RequestType"]

                  if request_type == "Delete":
                      # Remove only Lambda notifications; preserve any other config.
                      current = s3.get_bucket_notification_configuration(Bucket=bucket)
                      current.pop("ResponseMetadata", None)
                      current.pop("LambdaFunctionConfigurations", None)
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=current,
                      )
                  else:
                      lambda_arn = props["LambdaArn"]
                      prefix = props.get("Prefix", "")
                      events = props.get("Events", ["s3:ObjectCreated:*"])
                      notif_id = props.get("Id", "LmaUploadsPendingProcessor")
                      cfg = {
                          "LambdaFunctionConfigurations": [
                              {
                                  "Id": notif_id,
                                  "LambdaFunctionArn": lambda_arn,
                                  "Events": events,
                                  "Filter": {
                                      "Key": {
                                          "FilterRules": [
                                              {"Name": "prefix", "Value": prefix}
                                          ]
                                      }
                                  },
                              }
                          ]
                      }
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=cfg,
                      )
              except Exception as err:
                  log.exception("Failed to set bucket notification: %s", err)
                  status = cfnresponse.FAILED
                  reason = str(err)[:1024]
              cfnresponse.send(event, context, status, {}, reason=reason)
      LoggingConfig:
        LogGroup: !Ref RecordingsBucketNotificationFunctionLogGroup
    DependsOn:
      - RecordingsBucketNotificationFunctionLogGroup

  RecordingsBucketNotification:
    Type: AWS::CloudFormation::CustomResource
    Condition: ShouldCreateRecordingBucket
    DependsOn:
      - RecordingsBucketPolicy
    Properties:
      ServiceToken: !GetAtt RecordingsBucketNotificationFunction.Arn
      Bucket: !Ref RecordingsBucket
      LambdaArn: !GetAtt AISTACK.Outputs.UploadMeetingProcessorFunctionArn
      Prefix: "lma-uploads-pending/"
      Events:
        - "s3:ObjectCreated:*"
      Id: LmaUploadsPendingProcessor

  ToJSONFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Customer can use VPC if desired
          - id: W92
            reason: Customer can choose reserved concurrency based on their requirement.
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      Handler: index.handler
      Runtime: python3.12
      InlineCode: |
        import cfnresponse
        import json
        def handler(event, context):
            print(json.dumps(event))
            status = cfnresponse.SUCCESS
            reason = "Sucessful"
            result = {}
            if event['RequestType'] in ["Create", "Update"]:
              output = {}
              for k, v in event['ResourceProperties'].items():
                if k != "ServiceToken":
                  output[k] = v
              outputJSON = json.dumps(output)
              result = {"Output": outputJSON}
            else:
              print(f"Request type is {event['RequestType']} - skipping")
            cfnresponse.send(event, context, status, result, reason=reason)
      LoggingConfig:
        LogGroup:
          Ref: ToJSONFunctionLogGroup
    DependsOn:
      - ToJSONFunctionLogGroup

  ToJSONFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays:
        Ref: CloudWatchLogsExpirationInDays
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

  LLMTEMPLATESTACK:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-llm-template-setup-stack/llm-template-setup.yaml
      Parameters:
        # Keep in step with the Domain passed to AISTACK: this stack still seeds
        # the table a rollback reads, and the two disagreeing would leave one
        # holding the general summary prompts and the other the healthcare ones.
        Domain: "Default"
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete

  CHATBUTTONCONFIGSTACK:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-chat-button-config-stack/chat-button-config.yaml
      Parameters:
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete

  NOVASONICONFIGSTACK:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-nova-sonic-config-stack/deployment/nova-sonic-config.yaml
      Parameters:
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete

  COGNITOSTACK:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      # yamllint disable rule:line-length
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-cognito-stack/template.yaml
      # yamllint enable rule:line-length
      Parameters:
        LMAStackName: !Ref AWS::StackName
        S3BucketName: !If
          - ShouldCreateRecordingBucket
          - !Ref RecordingsBucket
          - ""
        AdminEmail: !Ref AdminEmail
        AllowedSignUpEmailDomain: !Ref AllowedSignUpEmailDomain
        LMASettingsParameterName: !Ref LMASettingsParameter
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete
        # The cognito stack defines PermissionsBoundaryArn and attaches it to all
        # three of its roles; without this line those properties always resolved
        # to AWS::NoValue.
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        LMAVersion: "<VERSION_TOKEN>"
        BuildDateTime: "<BUILD_DATE_TIME_TOKEN>"

  AISTACK:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      # yamllint disable rule:line-length
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-ai-stack/<VERSION_TOKEN>/template.yaml
      # yamllint enable rule:line-length
      Parameters:
        LMAStackName: !Ref AWS::StackName
        AllowedSignUpEmailDomain: !Ref AllowedSignUpEmailDomain
        AssistantWakePhraseRegEx: !Ref AssistantWakePhraseRegEx
        AudioRecordingExpirationInDays: !Ref AudioRecordingExpirationInDays
        EnableVoiceToneAnalysis: "false"
        CallAudioSource: "Genesys Cloud Audiohook Web Socket"
        S3BucketName: !If
          - ShouldCreateRecordingBucket
          - !Ref RecordingsBucket
          - ""
        AudioFilePrefix: "lma-audio-recordings/"
        TranscriptFilePrefix: "lma-transcripts/"
        IsSentimentAnalysisEnabled: "false"
        CloudFrontPriceClass: !Ref CloudFrontPriceClass
        CloudFrontAllowedGeos: !Ref CloudFrontAllowedGeos
        IsLambdaAgentAssistEnabled: "true"
        AgentAssistExistingLambdaFunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:STRANDS-${AWS::StackName}-MeetingAssist"
        MeetingRecordExpirationInDays: !Ref MeetingRecordExpirationInDays
        TranscriptionExpirationInDays: !Ref TranscriptionExpirationInDays
        MeetingInactivityTimeoutInMinutes: !Ref MeetingInactivityTimeoutInMinutes
        MeetingInactivityLookbackInDays: !Ref MeetingInactivityLookbackInDays
        TranscriptLambdaHookFunctionArn: !Ref TranscriptLambdaHookFunctionArn
        TranscriptLambdaHookFunctionNonPartialOnly: !Ref TranscriptLambdaHookFunctionNonPartialOnly
        EndOfCallTranscriptSummary: !Ref EndOfCallTranscriptSummary
        BedrockModelId: !Ref BedrockModelId
        EndOfCallLambdaHookFunctionArn: !Ref EndOfCallLambdaHookFunctionArn
        StartOfCallLambdaHookFunctionArn: !Ref StartOfCallLambdaHookFunctionArn
        PostCallSummaryLambdaHookFunctionArn: !Ref PostCallSummaryLambdaHookFunctionArn
        LLMPromptTemplateTableName: !GetAtt LLMTEMPLATESTACK.Outputs.LLMPromptTemplateTableName
        # Keep in step with the Domain passed to LLMTEMPLATESTACK above; see the
        # comment there.
        Domain: "Default"
        # Substituted by the publish step with a digest of the shipped
        # configuration content and of the code that processes it. It is what
        # makes CloudFormation re-run the configuration seeder when either
        # changes; a property that never changes is a custom resource that is
        # never invoked again after the first deployment.
        ConfigurationSeedHash: "<CONFIGURATION_SEED_HASH_TOKEN>"
        ChatButtonConfigTableName: !GetAtt CHATBUTTONCONFIGSTACK.Outputs.ChatButtonConfigTableName
        NovaSonicConfigTableName: !GetAtt NOVASONICONFIGSTACK.Outputs.NovaSonicConfigTableName
        AsrConfigTableName: !If
          - ShouldDeployMicrovmAsr
          - !GetAtt ASRMICROVMSTACK.Outputs.AsrConfigTableName
          - ""
        AsrLauncherFunctionArn: !If
          - ShouldDeployMicrovmAsr
          - !GetAtt ASRMICROVMSTACK.Outputs.AsrLauncherFunctionArn
          - ""
        AsrConfigTableArn: !If
          - ShouldDeployMicrovmAsr
          - !GetAtt ASRMICROVMSTACK.Outputs.AsrConfigTableArn
          - ""
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CallDataStream: !Ref CallDataStream
        CallDataStreamArn: !GetAtt CallDataStream.Arn
        LMASettingsParameterName: !Ref LMASettingsParameter
        EnableAppSyncApiCache: !Ref EnableAppSyncApiCache
        AppSyncApiCacheInstanceType: !Ref AppSyncApiCacheInstanceType
        UserPoolId: !GetAtt COGNITOSTACK.Outputs.UserPoolId
        CognitoClientId: !GetAtt COGNITOSTACK.Outputs.CognitoClientId
        AppIdentityPoolId: !GetAtt COGNITOSTACK.Outputs.AppIdentityPoolId
        UpdateLMASettingsFunctionArn: !GetAtt UpdateLMASettingsFunction.Arn
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        LoggingBucketName: !Ref LoggingBucket
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete
        VPC: !If
          - ShouldCreateVPC
          - !GetAtt VPCSTACK.Outputs.VPC
          - !Ref VPC
        PublicSubnet1: !If
          - ShouldCreateVPC
          - !GetAtt VPCSTACK.Outputs.PublicSubnet1
          - !Ref PublicSubnet1
        PublicSubnet2: !If
          - ShouldCreateVPC
          - !GetAtt VPCSTACK.Outputs.PublicSubnet2
          - !Ref PublicSubnet2
        # Lets AISTACK skip the VNC ALB (plus its target group, listener,
        # security groups, CloudFront origin and Lambda@Edge auth function) when
        # Virtual Participants run on MicroVMs, which reach the viewer through
        # their own HTTPS endpoints instead.
        VPLaunchType: !Ref VPLaunchType
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        BedrockKnowledgeBaseID: !If
          - ShouldUseTranscriptKnowledgeBase
          - !GetAtt TRANSCRIPTBEDROCKKB.Outputs.KnowledgeBaseID
          - ""
        EnableMCPServer: !Ref EnableMCP
        MCPServerCallbackURLs: !Ref MCPServerCallbackURLs
        CognitoUserPoolDomain: !GetAtt COGNITOSTACK.Outputs.CognitoUserPoolDomain
        VoiceAssistantActivationMode: !Ref VoiceAssistantActivationMode
        EnableVoiceEnrollment: !Ref EnableVoiceEnrollment
        VoiceEnrollmentRetentionDays: !Ref VoiceEnrollmentRetentionDays
        VoiceEnrollmentTermsVersion: !Ref VoiceEnrollmentTermsVersion
        LogLevel: !Ref LogLevel

  BEDROCKKB:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateBedrockKnowledgeBase
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-bedrockkb-stack/template.yaml
      Parameters:
        pKnowledgeBaseBucketName: !Ref BedrockKnowledgeBaseS3BucketName
        pInputDocumentUploadFolderPrefix: !Ref BedrockKnowledgeBaseS3DocumentUploadFolderPrefix
        pS3SyncScheduleExpression: "cron(0 0 * * ? *)"  # default once a day at midnight
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn

  TRANSCRIPTBEDROCKKB:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateTranscriptKnowledgeBase
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-bedrockkb-stack/template.yaml
      Parameters:
        pKnowledgeBaseBucketName: !Ref RecordingsBucket
        pInputDocumentUploadFolderPrefix: "lma-transcripts/"
        pS3SyncScheduleExpression: "cron(0/15 * ? * * *)"  # default is to sync transcripts every 15 minutes
        EnableDataRetentionOnDelete: !Ref EnableDataRetentionOnDelete
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn


  MEETINGASSISTSETUP:
    Type: AWS::CloudFormation::Stack
    Properties:
      # yamllint disable rule:line-length
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-meetingassist-setup-stack/template.yaml
      # yamllint enable rule:line-length
      Parameters:
        LMAStackName: !Ref AWS::StackName
        AISTACK: !Ref AISTACK
        COGNITOSTACK: !Ref COGNITOSTACK
        MeetingAssistService: !Ref MeetingAssistService
        BedrockKnowledgeBaseId: !If
          - ShouldUseStrandsBedrockWithKBExisting
          - !Ref BedrockKnowledgeBaseId
          - !If
            - ShouldCreateBedrockKnowledgeBase
            - !GetAtt BEDROCKKB.Outputs.KnowledgeBaseID
            - ""
        BedrockKnowledgeBaseS3BucketName: !Ref BedrockKnowledgeBaseS3BucketName
        MeetingAssistServiceBedrockModelID: !Ref MeetingAssistServiceBedrockModelID
        MeetingAssistKnowledgeBaseModelID: !Ref MeetingAssistKnowledgeBaseModelID
        # The ARN of the secret holding the key, never the key: whichever form
        # the operator used, the meeting-assist function fetches the value for
        # itself. Empty when web search is not configured.
        TavilyApiKeySecretArn: !If
          - HasTavilyApiKeySecretArn
          - !Ref TavilyApiKeySecretArn
          - !If [HasTavilyApiKeyValue, !Ref TavilyApiKeySecret, ""]
        WebAppBucket: !GetAtt AISTACK.Outputs.WebAppBucket
        CloudFrontDistributionId: !GetAtt AISTACK.Outputs.CloudFrontDistributionId
        TranscriptBedrockKnowledgeBaseId: !If
          - ShouldUseTranscriptKnowledgeBase
          - !GetAtt TRANSCRIPTBEDROCKKB.Outputs.KnowledgeBaseID
          - ""
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        # Changes to Params below force MeetingAssist Setup to update.
        TranscribeLanguageCode: !Ref TranscribeLanguageCode
        TranscriptLambdaHookFunctionArn: !Ref TranscriptLambdaHookFunctionArn
        TranscriptLambdaHookFunctionNonPartialOnly: !Ref TranscriptLambdaHookFunctionNonPartialOnly
        MeetingRecordExpirationInDays: !Ref MeetingRecordExpirationInDays
        TranscriptionExpirationInDays: !Ref TranscriptionExpirationInDays
        EndOfCallTranscriptSummary: !Ref EndOfCallTranscriptSummary
        EndOfCallLambdaHookFunctionArn: !Ref EndOfCallLambdaHookFunctionArn
        CloudFrontDomainName: !GetAtt AISTACK.Outputs.CloudFrontDomainName
        AppSyncGraphQLUrl: !GetAtt AISTACK.Outputs.AppSyncGraphQLUrl
        EventApiHttpUrl: !GetAtt AISTACK.Outputs.AppSyncEventApiHttpUrl
        MCPServersTableName: !GetAtt AISTACK.Outputs.MCPServersTableName
        FetchTranscriptFunctionArn: !GetAtt AISTACK.Outputs.FetchTranscriptArn
        TranscriptSummaryFunctionArn: !GetAtt AISTACK.Outputs.TranscriptSummaryFunctionArn
        BedrockGuardrailId: !Ref BedrockGuardrailId
        BedrockGuardrailVersion: !Ref BedrockGuardrailVersion
        # Inputs for the troubleshooting agent: the records it reads, the table
        # holding its system prompt, and the API id that scopes its read of
        # AppSync's service-managed log group.
        VirtualParticipantTableName: !GetAtt AISTACK.Outputs.VirtualParticipantTableName
        LLMPromptTemplateTableName: !GetAtt LLMTEMPLATESTACK.Outputs.LLMPromptTemplateTableName
        AppSyncApiId: !GetAtt AISTACK.Outputs.AppSyncApiId
        # Where the meeting assistant records each answer's token usage for the
        # meeting cost estimate.
        EventSourcingTableName: !GetAtt AISTACK.Outputs.EventSourcingTableName
        # Threaded through so this nested stack's IAM roles carry the
        # deployment's permissions boundary, as the other nested stacks' do.
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        Version: v0.8.8

  VPCSTACK:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateVPC
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      # yamllint disable rule:line-length
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-vpc-stack/template.yaml
      Parameters:
        LMAStackName: !Ref "AWS::StackName"
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        CloudWatchLogsExpirationInDays: !Ref CloudWatchLogsExpirationInDays

  # On-demand streaming ASR + speaker diarization on AWS Lambda MicroVMs, used by
  # the WebSocket transcriber as an alternative to Amazon Transcribe streaming.
  # One MicroVM per meeting, launched at meeting start and terminated at the end.
  ASRMICROVMSTACK:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployMicrovmAsr
    DependsOn:
      - IsStacknameLengthOK
      - ValidateParameters
    Properties:
      # yamllint disable rule:line-length
      TemplateURL: https://s3.<REGION_TOKEN>.amazonaws.com/<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/lma-asr-microvm-stack/template.yaml
      # yamllint enable rule:line-length
      Parameters:
        LMAStackName: !Ref AWS::StackName
        # Image build context with the Dockerfile at the zip ROOT, which is what
        # CreateMicrovmImage requires. Rewritten per deployment with the resolved
        # model selection by the stack's AsrImageSource custom resource.
