---
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Amazon Transcribe Live Meeting Assist - LMA (v<VERSION_TOKEN>) (SO9497)

Parameters:
  MeetingAssistService:
    Default: "STRANDS_BEDROCK"
    Type: String
    AllowedValues:
      - "STRANDS_BEDROCK"
      - "STRANDS_BEDROCK_WITH_KB (Create)"
      - "STRANDS_BEDROCK_WITH_KB (Use Existing)"
    Description: >-
      Choose the meeting assistant service. STRANDS_BEDROCK provides agentic capabilities with built-in tools.
      STRANDS_BEDROCK_WITH_KB (Create) automatically creates a Bedrock Knowledge Base for document search.
      STRANDS_BEDROCK_WITH_KB (Use Existing) uses an existing Bedrock Knowledge Base you provide.

  MeetingAssistServiceBedrockModelID:
    Type: String
    Default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
    AllowedValues:
      - "amazon.nova-micro-v1:0"
      - "amazon.nova-lite-v1:0"
      - "amazon.nova-pro-v1:0"
      - "us.amazon.nova-premier-v1:0"
      - "global.amazon.nova-2-lite-v1:0"
      - "us.amazon.nova-2-lite-v1:0"
      - "us.anthropic.claude-opus-4-20250514-v1:0"
      - "us.anthropic.claude-opus-4-1-20250805-v1:0"
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-4-6"
      - "us.anthropic.claude-opus-4-6-v1"
      - "us.anthropic.claude-haiku-5-5"
      - "us.anthropic.claude-sonnet-5-5"
      - "us.anthropic.claude-opus-5-5"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "global.anthropic.claude-sonnet-4-6"
      - "global.anthropic.claude-opus-4-6-v1"
      - "global.anthropic.claude-haiku-5-5"
      - "global.anthropic.claude-sonnet-5-5"
      - "global.anthropic.claude-opus-5-5"
    Description: >-
      Select a Bedrock LLM model for the meeting assistant. Includes Nova models (cost-effective)
      and Claude 4+ models (cutting-edge). Some models require inference profiles. The Claude 5
      generation reasons before it answers, which raises answer quality but also raises output
      token use several-fold, so it costs more per meeting than Claude 4.5 at the same size.

  MeetingAssistKnowledgeBaseModelID:
    Type: String
    Default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
    # A knowledge base supplies its own orchestration and generation prompt
    # templates, and RetrieveAndGenerate rejects any model those templates do not
    # cover, so the models usable here are a narrower set than the agent can run
    # on and the list must stay a subset of
    # MeetingAssistServiceBedrockModelID's.
    #
    # Which models those are is a property of the individual model, not of its
    # generation: us.anthropic.claude-opus-4-1-20250805-v1:0 is refused while
    # us.anthropic.claude-opus-4-6-v1 is accepted, and both are Claude 4. So every
    # id below has been verified by a RetrieveAndGenerate call against a live
    # knowledge base (us-west-2, 2026-10-21) and nothing is added without one;
    # test_meeting_assist_kb_model.py holds the evidence and fails if this list
    # and that record disagree.
    AllowedValues:
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-4-6"
      - "us.anthropic.claude-opus-4-6-v1"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "global.anthropic.claude-sonnet-4-6"
      - "global.anthropic.claude-opus-4-6-v1"
    Description: >-
      Select the Bedrock model the Meeting Assistant's knowledge bases use to generate an answer
      from what they retrieve -- the document-search tool and the past-meeting-search tool. This
      is separate from MeetingAssistServiceBedrockModelID so that the agent can run on any model
      it supports, including models a knowledge base cannot generate with. Whether a knowledge
      base can generate with a model is a property of that model, so only models verified against
      a live knowledge base are offered here. Enable access to the model you pick in the Amazon
      Bedrock console for your region.

  TavilyApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional - STRANDS_BEDROCK only) API key for Tavily web search service to enable web search tool.
      Get your API key from https://tavily.com. When provided, the Strands agent can search the web
      for current information during meetings. Leave blank to disable web search capability.
    AllowedPattern: "^(|[a-zA-Z0-9_-]{20,})$"
    ConstraintDescription: "Must be empty or a valid Tavily API key (20+ characters)"

  # Second form of the same setting, for a deployment that already keeps the key
  # in Secrets Manager (provisioned by its own tooling, rotated on its own
  # schedule). Either form supplies the stack with one thing: a secret ARN. The
  # TavilyApiKeyCredentialForm rule below rejects both at once.
  TavilyApiKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$"
    ConstraintDescription: >-
      Must be empty, or the ARN of a Secrets Manager secret
      (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
    Description: >-
      (Optional) ARN of an existing Secrets Manager secret whose value is the
      Tavily API key. Use this instead of TavilyApiKey when the key is already
      provisioned in Secrets Manager. Supply one form or the other, not both.
      A secret encrypted with your own KMS key must grant kms:Decrypt to the
      meeting-assist function's role in that key's policy.

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) API key for ElevenLabs text-to-speech service to enable Virtual Participant voice responses.
      Get your API key from https://elevenlabs.io. When provided, the Virtual Participant can speak
      agent responses in meetings using natural-sounding voices. Leave blank to disable TTS capability.
    AllowedPattern: "^(|[a-zA-Z0-9_-]{20,})$"
    ConstraintDescription: "Must be empty or a valid ElevenLabs API key (20+ characters)"

  # See TavilyApiKeySecretArn for how the two forms relate.
  ElevenLabsApiKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$"
    ConstraintDescription: >-
      Must be empty, or the ARN of a Secrets Manager secret
      (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
    Description: >-
      (Optional) ARN of an existing Secrets Manager secret whose value is the
      ElevenLabs API key. Use this instead of ElevenLabsApiKey when the key is
      already provisioned in Secrets Manager. Supply one form or the other, not
      both. A secret encrypted with your own KMS key must grant kms:Decrypt in
      that key's policy to whichever role reads it: the MicroVM launcher
      function's role under VPLaunchType MICROVM (the default), or the Virtual
      Participant task execution role on FARGATE and EC2. See
      docs/infrastructure-and-security.md#bringing-your-own-secret.

  ElevenLabsAgentId:
    Type: String
    Default: ""
    Description: >-
      (Optional) ElevenLabs Conversational AI Agent ID for customized voice assistant behavior.
      Create an agent at https://elevenlabs.io/app/conversational-ai and copy its ID here.
      Leave blank to use default conversational AI without custom personality.
    AllowedPattern: "^(|[a-zA-Z0-9_-]{10,})$"
    ConstraintDescription: "Must be empty or a valid ElevenLabs Agent ID"

  SimliApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) API key for Simli avatar. The avatar feature requires BOTH
      SimliApiKey and SimliFaceId — leave both blank to disable the avatar,
      or set both to enable an animated lip-synced avatar as the Virtual
      Participant's camera feed.
      Get your API key from https://simli.com. Leave blank to disable avatar.

  # See TavilyApiKeySecretArn for how the two forms relate.
  SimliApiKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$"
    ConstraintDescription: >-
      Must be empty, or the ARN of a Secrets Manager secret
      (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
    Description: >-
      (Optional) ARN of an existing Secrets Manager secret whose value is the
      Simli API key. Use this instead of SimliApiKey when the key is already
      provisioned in Secrets Manager. Supply one form or the other, not both.
      SimliFaceId is still required alongside it. A secret encrypted with your
      own KMS key must grant kms:Decrypt in that key's policy to whichever role
      reads it: the MicroVM launcher function's role under VPLaunchType MICROVM
      (the default), or the Virtual Participant task execution role on FARGATE
      and EC2. See docs/infrastructure-and-security.md#bringing-your-own-secret.

  SimliFaceId:
    Type: String
    Default: ""
    Description: >-
      (Optional) Simli Face ID for the avatar appearance. Required when
      SimliApiKey is set — the avatar is enabled only when BOTH parameters
      are non-empty. Get this from your Simli dashboard at https://simli.com.

  VoiceAssistantProvider:
    Type: String
    Default: "none"
    AllowedValues:
      - "none"
      - "elevenlabs"
      - "amazon_nova_sonic"
    Description: >-
      Voice AI assistant provider for Virtual Participant. Choose 'none' to
      disable voice responses (default), 'elevenlabs' for ElevenLabs
      Conversational AI (requires API key above), or 'amazon_nova_sonic' for
      Amazon Nova Sonic, which needs no API key and is configured on the Nova
      Sonic page in the LMA UI.

  AmazonNovaSonicRegion:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z]{2,4}(-[a-z]+)+-[0-9]+$"
    ConstraintDescription: >-
      Must be empty, or an AWS Region name such as us-east-1.
    Description: >-
      Region to reach Amazon Nova Sonic in, when it differs from the region
      this stack is deployed to. Leave empty to use the stack's own region.
      Nova Sonic is available in fewer regions than LMA itself, so a
      deployment constrained to a particular region for compliance can keep
      everything else local and reach the voice assistant elsewhere. Only
      used when VoiceAssistantProvider is amazon_nova_sonic.

  VoiceAssistantActivationMode:
    Type: String
    Default: "wake_phrase"
    AllowedValues:
      - "always_active"
      - "wake_phrase"
      - "strands_tool (coming soon)"
    Description: >-
      How the voice assistant is activated. 'always_active' for interviewer/meeting leader use cases (agent leads conversation),
      'wake_phrase' to activate only when wake phrase is detected (max 300 seconds), or 'strands_tool' for intelligent activation by Strands agent.

  VoiceAssistantWakePhrases:
    Type: String
    Default: "hey alex,ok alex,hi alex,hello alex"
    Description: >-
      Comma-separated list of wake phrases for voice assistant activation (case-insensitive).
      Only used when VoiceAssistantActivationMode is 'wake_phrase'. Example: "hey alex,ok alex,hi alex"

  VoiceAssistantActivationDuration:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 300
    Description: >-
      How long the voice assistant stays active after wake phrase detection (in seconds).
      Only used when VoiceAssistantActivationMode is 'wake_phrase'. Default is 30 seconds. Maximum is 300 seconds.

  BedrockGuardrailId:
    Type: String
    Default: ""
    AllowedPattern: "^(|[a-z0-9]+)$"
    Description: >
      Optionally provide the *Id* (not name) of an *existing* Bedrock Guardrail to be applied
      to the Strands meeting assistant agent and Knowledge Base queries.

  BedrockGuardrailVersion:
    Type: String
    Default: "DRAFT"
    AllowedPattern: "^(|(([1-9][0-9]{0,7})|(DRAFT)))$"
    Description: >
      If you provided a Bedrock Guardrail Id above, provide the corresponding Guardrail version here.

  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
    AllowedPattern: "^(|[0-9a-zA-Z]{10})$"
    Description: >
      If MeetingAssistService is 'STRANDS_BEDROCK_WITH_KB (Use Existing)', provide the knowledge base
      *Id* (not name) of an *existing* Bedrock Knowledge Base to be used for document search.

  BedrockKnowledgeBaseS3BucketName:
    Type: String
    Default: ""
    Description: >-
      If MeetingAssistService is 'STRANDS_BEDROCK_WITH_KB (Create)', provide the bucket 
      name of an existing bucket with documents to ingest, or leave blank if you don't need an S3 data source.

  BedrockKnowledgeBaseS3DocumentUploadFolderPrefix:
    Type: String
    Default: ""
    Description: >-
      If MeetingAssistService is 'STRANDS_BEDROCK_WITH_KB (Create)', provide comma separated list of optional S3 prefixes 
      with the paths to your source documents e.g. "prefix1/, prefix2/". If you leave blank, all documents in your S3 bucket will be scanned.

  AssistantWakePhraseRegEx:
    Type: String
    Default: "(OK|Okay)[.,! ]*[Aa]ssistant"
    Description: >
      A regular expression for the wake phrase that invokes the Meeting Assistant.
      Default is 'OK Assistant'

  TranscriptKnowledgeBase:
    Default: "BEDROCK_KNOWLEDGE_BASE (Create)"
    Type: String
    AllowedValues:
      - "DISABLED"
      - "BEDROCK_KNOWLEDGE_BASE (Create)"
    Description: Use meeting transcripts as knowledge base content

  EnableMCP:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Enable MCP server integration for external application access
      (Amazon Quick Suite, Claude Desktop, etc.). Provides standardized API for agentic systems.

  MCPServerCallbackURLs:
    Type: String
    Default: "https://us-east-1.quicksight.aws.amazon.com/sn/oauthcallback,https://us-west-2.quicksight.aws.amazon.com/sn/oauthcallback,http://localhost:3000/callback"
    Description: >-
      Comma-separated list of OAuth callback URLs for MCP clients.
      Default includes Quick Suite (us-east-1, us-west-2) and localhost for testing.
      Add your custom MCP client callback URLs here.
      Example: https://my-app.com/callback,https://another-app.com/oauth/callback

  IsPartialTranscriptEnabled:
    Type: String
    Default: "true"
    Description: >-
      Enable partial transcripts to receive low latency evolving transcriptions for
      each conversation turn. Set to false to process only the
      final version of each conversation turn.
    AllowedValues:
      - "true"
      - "false"

  IsContentRedactionEnabled:
    Type: String
    Default: "false"
    Description: >-
      Enable content redaction from Amazon Transcribe transcription output. This is
      only used when
      the 'en-US' language is selected in the TranscribeLanguageCode parameter.
    AllowedValues:
      - "true"
      - "false"

  TranscribeContentRedactionType:
    Type: String
    Default: PII
    Description: >-
      Type of content redaction from Amazon Transcribe transcription output
    AllowedValues:
      - PII

  TranscribeLanguageCode:
    Type: String
    Description: >-
      Language code or language identification setting for Amazon Transcribe. NOTE:
      Language identification can't  be combined with custom language models or redaction.

    Default: en-US
    AllowedValues:
      - identify-language
      - identify-multiple-languages
      - en-US
      - es-US
      - en-GB
      - fr-CA
      - fr-FR
      - en-AU
      - it-IT
      - de-DE
      - pt-BR
      - ja-JP
      - ko-KR
      - zh-CN
      - hi-IN
      - th-TH

  TranscribeLanguageOptions:
    Type: String
    Default: "en-US, es-US"
    AllowedPattern: '^(?:\s*(?:en-US|es-US|en-GB|fr-CA|fr-FR|en-AU|it-IT|de-DE|pt-BR|ja-JP|ko-KR|zh-CN|hi-IN|th-TH)\s*(?:,\s*(?:en-US|es-US|en-GB|fr-CA|fr-FR|en-AU|it-IT|de-DE|pt-BR|ja-JP|ko-KR|zh-CN|hi-IN|th-TH)\s*)*)?$'
    ConstraintDescription: >-
      Unsupported language code or invalid syntax. Allowed values are: en-US, es-US,
      en-GB, fr-CA, fr-FR, en-AU, it-IT, de-DE, pt-BR, ja-JP, ko-KR, zh-CN, hi-IN,
      th-TH
    Description: >-
      When using language identification, specify two or more language codes, e.g.
      "en-US, es-US" that represent the languages that may be  used in your meeting.
      Including more than five is not recommended.  Enter only one language dialect
      per language - e.g. 'en-US, en-AU' is not allowed.
      Allowed values are: en-US, es-US, en-GB, fr-CA, fr-FR, en-AU, it-IT, de-DE,
      pt-BR, ja-JP, ko-KR, zh-CN, hi-IN, th-TH
      NOTE: The identify-language feature has not yet been applied to the virtual participant. 
      If selected, the virtual participant will use the value of TranscribePreferredLanguage (if set) or 'en-US' (by default).

  TranscribePreferredLanguage:
    Type: String
    Description: >-
      Optionally select a preferred language when using language identification -
      must be one of the languages entered for TranscribeLanguageOptions.
    Default: None
    AllowedValues:
      - None
      - en-US
      - es-US
      - en-GB
      - fr-CA
      - fr-FR
      - en-AU
      - it-IT
      - de-DE
      - pt-BR
      - ja-JP
      - ko-KR
      - zh-CN
      - hi-IN
      - th-TH

  ShowSpeakerLabel:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Default for Amazon Transcribe speaker partitioning (diarization) on
      WebSocket streaming sessions - the desktop capture app and the Stream Audio
      browser tab. When enabled, Transcribe tells apart individual voices within
      an audio channel and each distinct voice is appended to the channel's
      speaker name as "(spk_0)", "(spk_1)", and so on. Works best with five or
      fewer voices per channel. This is only the DEFAULT: clients that offer
      per-channel speaker identification settings (the desktop capture app and
      the Stream Audio tab) send their own choice per meeting, which takes
      precedence. Leave "false" unless you want it on for clients that do not.

  TranscribePiiEntityTypes:
    Type: String
    Default: BANK_ACCOUNT_NUMBER,BANK_ROUTING,CREDIT_DEBIT_NUMBER,CREDIT_DEBIT_CVV,CREDIT_DEBIT_EXPIRY,PIN,EMAIL,ADDRESS,NAME,PHONE,SSN
    Description: >-
      Select the PII entity types you want to identify or redact. Remove the values
      that you don't want to redact from the default.  DO NOT ADD CUSTOM VALUES HERE.

  CustomVocabularyName:
    Type: String
    Default: ""
    Description: >-
      The name of the vocabulary to use when processing the transcription job. Leave
      blank if no custom vocabulary to be used. If yes, the custom
      vocabulary must pre-exist in your account.

  CustomLanguageModelName:
    Type: String
    Default: ""
    Description: >-
      The name of the custom language model to use when processing the transcription
      job. Leave blank if no
      custom language model is to be used. If specified, the custom language model
      must pre-exist in your account,  match the Language Code selected above, and
      use the 'Narrow Band' base model.

  EnableMicrovmAsr:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Deploys the EXPERIMENTAL on-demand speech engine (open-source models on AWS
      Lambda MicroVMs in this account) alongside Amazon Transcribe. Nothing changes
      until an admin moves Stream Audio, Chrome extension and Desktop Capture
      meetings, or Virtual Participants, onto it on the Transcription Engine page.
      English only; requires a region with AWS Lambda MicroVMs. See
      docs/microvm-asr.md.

  EnableVoiceEnrollment:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Let people enrol their voice so they are labelled by name in meetings from
      their first word. A voiceprint is biometric data about a person: while this
      is false the enrollment table, the consent log and the consent portal do
      not exist in the deployment at all. Turning it on creates obligations that
      are yours -- biometric data is separately regulated in many jurisdictions
      and typically requires informed consent before collection, a published
      retention schedule and deletion on request. See docs/voice-enrollment.md.
      Matching also needs EnableMicrovmAsr=true, since Amazon Transcribe exposes
      no speaker embedding.

  VoiceEnrollmentRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    MaxValue: 3650
    Description: >-
      How long a voice-enrollment consent stands before it must be renewed. When
      it lapses the voiceprint is deleted and the person is asked to consent
      again. Consent that never expires is not meaningfully informed.

  VoiceEnrollmentTermsVersion:
    Type: String
    Default: "1"
    AllowedPattern: "^[A-Za-z0-9._-]{1,32}$"
    Description: >-
      Bump this to require everybody to re-consent. An enrollment whose consent
      is to a superseded version stops being used for matching until its owner
      agrees to the current terms.

  ModelValidation:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Specifies if Amazon Bedrock model access is validated during deployment.
      Setting this parameter to "false" is useful for automated deployments (e.g. AWS Workshop
      Studio) where Amazon Bedrock model access permissions may not be set up yet.

  TranscriptLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) If present, the specified Lambda function is invoked by the LMA Call
      Event Processor Lambda function for each completed  (non-partial) transcript
      segment. The function can capture and/or modify the text of the transcript,
      for example to implement custom
      redaction logic, profanity filtering, or custom rules to highlight patterns
      in the transcript.

  TranscriptLambdaHookFunctionNonPartialOnly:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Specifies if Transcript Lambda Hook Function (if specified) is invoked for Non-Partial
      transcript segments only (true), or for
      both Partial and Non-Partial transcript segments (false).

  EndOfCallTranscriptSummary:
    Default: "BEDROCK"
    Type: String
    AllowedValues:
      - "BEDROCK"
      - "LAMBDA"

    Description: >
      Set to enable call summarization by a Large Language Model. Currently only BEDROCK
      and LAMBDA are supported.
      BEDROCK option requires you to choose one of the supported model IDs from the  provided
      list (BedrockModelId). The LAMBDA option requires you to provide a function
      ARN below.

  BedrockModelId:
    Default: "global.anthropic.claude-sonnet-5-5"
    Type: String
    AllowedValues:
      - "amazon.nova-micro-v1:0"
      - "amazon.nova-lite-v1:0"
      - "amazon.nova-pro-v1:0"
      - "us.amazon.nova-premier-v1:0"
      - "global.amazon.nova-2-lite-v1:0"
      - "us.amazon.nova-2-lite-v1:0"
      - "us.anthropic.claude-opus-4-20250514-v1:0"
      - "us.anthropic.claude-opus-4-1-20250805-v1:0"
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-4-6"
      - "us.anthropic.claude-opus-4-6-v1"
      - "us.anthropic.claude-haiku-5-5"
      - "us.anthropic.claude-sonnet-5-5"
      - "us.anthropic.claude-opus-5-5"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "global.anthropic.claude-sonnet-4-6"
      - "global.anthropic.claude-opus-4-6-v1"
      - "global.anthropic.claude-haiku-5-5"
      - "global.anthropic.claude-sonnet-5-5"
      - "global.anthropic.claude-opus-5-5"
    Description: >
      If EndOfCallTranscriptSummary is BEDROCK, then choose a model ID from the list
      of supported models. Includes Nova models (cost-effective) and Claude 4+ (cutting-edge).
      Some models require inference profiles. The Claude 5 generation reasons before it answers,
      which raises summary quality but also raises output token use several-fold, so it costs
      more per meeting than Claude 4.5 at the same size.
      Defaults to 'global.anthropic.claude-sonnet-5-5'

  EndOfCallLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) If 'End Of Call Transcript Summary' is LAMBDA, provide ARN for a
      Lambda function. The specified Lambda function is invoked by the LMA Call Event
      Processor Lambda function  for end of call event. The function is passed en
      event with CallId as input.
      This function can implement custom logic that is relevant to end of call processing,
      for example, creating a call summary.

  StartOfCallLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) The specified Lambda function is invoked by the LMA Call Event Processor
      Lambda function for beginning or start of  call event. This function can implement
      custom logic that is relevant to beginning of call processing, for example,
      retrieving
      call summary details logged into a case in a CRM.

  PostCallSummaryLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws:lambda:.*)$"
    Description: >
      (Optional) The specified Lambda function is invoked by the LMA Call Event Processor
      Lambda function after the call summary is processed.
      This function can implement custom logic that is relevant to post processing,
      for example, updating the call summary to a CRM system.

  AdminEmail:
    Type: String
    Description: >-
      Email address of the admin user (e.g. jdoe+admin@example.com) that has access to all meetings 
      for administrative purposes. 
      An initial temporary password will be automatically sent to this user via email.
    AllowedPattern: '^[\w.+-]+@([\w-]+\.)+[\w-]{2,6}$'

  AllowedSignUpEmailDomain:
    Type: String
    Default: ""
    Description: >-
      Email address domain (example.com) or comma separated list of email domains  (example1.com,
      example2.com) allowed to signin and signup using the web UI.
      If left empty, signup via the web UI is disabled and users will have to be created
      using
      Cognito.
    AllowedPattern: '^(|([\w-]+\.)+[\w-]{2,6}(, *([\w-]+\.)+[\w-]{2,6})*)$'

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    Description: >-
      Specify the CloudFront price class. See https://aws.amazon.com/cloudfront/pricing/
      for a
      description of each price class.
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    ConstraintDescription: >-
      Allowed Price Classes PriceClass_100 PriceClass_200 and PriceClass_All

  CloudFrontAllowedGeos:
    Type: String
    Default: ""
    Description: >-
      Specify a comma separated list of two letter country codes (uppercase ISO 3166-1)
      that are
      allowed to access the web user interface via CloudFront. For example: US,CA.
      Leave empty if
      you do not want geo restrictions to be applied.
    AllowedPattern: "^(|[A-Z]{2}(,[A-Z]{2})*)$"
    ConstraintDescription: >-
      Comma separated list of uppercase two letter country codes or empty

  EnableAudioRecording:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable or disable recording of audio during a meeting. If set to false, the
      meeting will not be recorded.
      If set to true, the meeting will be recorded.

  ZoomMeetingSdkClientId:
    Type: String
    Default: ""
    Description: >-
      (Optional) Zoom Meeting SDK app Client ID. When both ZoomMeetingSdkClientId
      and ZoomMeetingSdkClientSecret are provided, the Virtual Participant joins
      Zoom meetings via the Zoom Meeting Web SDK instead of automating the public
      web client. Requires Zoom approval/allowlist of the SDK app for meetings
      outside the app owner's own account. Leave both blank to use the default
      web-client join.

  ZoomMeetingSdkClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      (Optional) Zoom Meeting SDK app Client Secret. Paired with
      ZoomMeetingSdkClientId. Used to sign the SDK join signature.

  # See TavilyApiKeySecretArn for how the two forms relate.
  ZoomMeetingSdkClientSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$"
    ConstraintDescription: >-
      Must be empty, or the ARN of a Secrets Manager secret
      (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
    Description: >-
      (Optional) ARN of an existing Secrets Manager secret whose value is the
      Zoom Meeting SDK app client secret. Use this instead of
      ZoomMeetingSdkClientSecret when the secret is already provisioned in
      Secrets Manager. Supply one form or the other, not both.
      ZoomMeetingSdkClientId is still required alongside it. A secret encrypted
      with your own KMS key must grant kms:Decrypt in that key's policy to
      whichever role reads it: the MicroVM launcher function's role under
      VPLaunchType MICROVM (the default), or the Virtual Participant task
      execution role on FARGATE and EC2. See
      docs/infrastructure-and-security.md#bringing-your-own-secret.

  AcsConnectionString:
    Type: String
    NoEcho: true
    Default: ""
    AllowedPattern: "^(|endpoint=https://.+;accesskey=.+)$"
    ConstraintDescription: >-
      Must be blank, or a full Azure Communication Services connection string of
      the form endpoint=https://<resource>.communication.azure.com/;accesskey=<key>
      (copy the "Connection string" field from Settings > Keys in the Azure portal —
      not the endpoint or key on their own).
    Description: >-
      (Optional) Azure Communication Services connection string
      (endpoint=https://...;accesskey=...). When provided, the Virtual
      Participant joins Microsoft Teams meetings via the ACS calling SDK
      (Teams interoperability) instead of automating the Teams web client.
      Leave blank to use the default web-client join.

  # See TavilyApiKeySecretArn for how the two forms relate.
  AcsConnectionStringSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+)$"
    ConstraintDescription: >-
      Must be empty, or the ARN of a Secrets Manager secret
      (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
    Description: >-
      (Optional) ARN of an existing Secrets Manager secret whose value is the
      full Azure Communication Services connection string. Use this instead of
      AcsConnectionString when the connection string is already provisioned in
      Secrets Manager. Supply one form or the other, not both. A secret
      encrypted with your own KMS key must grant kms:Decrypt in that key's
      policy to whichever role reads it: the MicroVM launcher function's role
      under VPLaunchType MICROVM (the default), or the Virtual Participant task
      execution role on FARGATE and EC2. See
      docs/infrastructure-and-security.md#bringing-your-own-secret.

  EnableVideoRecording:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enables meeting video (screen recording) in addition to audio, for BOTH
      video sources: the Virtual Participant and the Desktop Capture App. For the
      Virtual Participant this is the deployment-wide default and users can
      override it per meeting with the "Record meeting video" toggle in the LMA
      UI; for the Desktop Capture App it is a hard on/off (users opt in per
      machine in the app's Settings, and the server discards video when this is
      false). Video recordings consume additional CPU, ephemeral storage, and S3
      storage. Leaving this at "true" also pins the WebSocket transcriber service
      to a single task and forbids transcriber auto scaling, because Desktop
      Capture App video arrives on a separate connection that must reach the task
      holding that meeting's audio session; TranscriberDesiredTaskCount above 1
      and TranscriberAutoScalingEnabled are rejected while this is "true". Only
      the Desktop Capture App imposes that constraint — Virtual Participant video
      does not — so scaling the transcriber means giving up desktop video
      recording, not video recording in principle.

  AudioRecordingExpirationInDays:
    Type: Number
    Description:
      "Whole number of days after which audio recordings will be deleted
      from the Recordings bucket."
    Default: 90

  MeetingRecordExpirationInDays:
    Type: Number
    Default: 90
    Description: >-
      Number of days to retain meeting records. Meetings will be automatically deleted
      from LMA after this time.
      Specify partial days like 0.5 to retain meeting records for half a day.

  TranscriptionExpirationInDays:
    Type: Number
    Default: 90
    Description: >-
      Number of days to retain turn by turn meeting transcriptions.  Transcriptions
      will be automatically deleted from LMA after this time.
      Specify partial days like 0.5 to retain transcriptions for half a day.

  MeetingInactivityTimeoutInMinutes:
    Type: Number
    Default: 240
    MinValue: 0
    MaxValue: 10080
    Description: >-
      Number of minutes a meeting may go without producing a finalized transcript
      segment before LMA ends it on the meeting's behalf. A meeting whose client
      disconnects without sending its end-of-meeting event stays "In Progress"
      until this timeout elapses. A meeting that is still connected but silent for
      longer than the timeout is also ended, so keep it comfortably longer than the
      longest quiet stretch your meetings have. Set to 0 to leave such meetings open.

  MeetingInactivityLookbackInDays:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 90
    Description: >-
      How far back to look for meetings to close. A meeting that started longer
      ago than this is never closed automatically, so raise it temporarily if you
      are updating a deployment that has accumulated older meetings stuck in
      progress. Higher values read more meeting records on every run.

  CloudWatchLogsExpirationInDays:
    Type: Number
    Default: 90
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1096,
        1827,
        2192,
        2557,
        2922,
        3288,
        3653,
      ]
    Description: >-
      Number of days to retain CloudWatch log records. Logs will be automatically
      deleted after this time.

  VPSchedulerStateMachineLogsExpirationInDays:
    Type: Number
    Default: 7
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1096,
        1827,
        2192,
        2557,
        2922,
        3288,
        3653,
      ]
    Description: >-
      Number of days to retain the scheduled Virtual Participant state machine's
      execution history logs. Shorter than CloudWatchLogsExpirationInDays by
      default because the state machine logs every state transition of every
      scheduled Virtual Participant. Raise it while investigating a scheduled
      Virtual Participant that did not start.

  EnableAppSyncApiCache:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable or disable the AppSync Api Cache.

  AppSyncApiCacheInstanceType:
    Type: String
    Default: SMALL
    AllowedValues:
      - SMALL
      - MEDIUM
      - LARGE
      - XLARGE
    Description: >-
      If you set the EnableAppSyncApiCache is true, choose a value that meets your workload requirements. 
      This parameter is ignored if the EnableAppSyncApiCache parameter is set to false (default behavior).

  UseExistingVPC:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Use an existing VPC for the solution instead of creating a new one. If set to
      true, the VPC ID and subnets must be provided. DO NOT CHANGE VALUE WHEN UPDATING AN EXISTING STACK.

  VPC:
    Type: String
    Default: ""
    Description: >-
      ID of the VPC to use for the solution. Required if UseExistingVPC is true. DO NOT CHANGE VALUE WHEN 
      UPDATING AN EXISTING STACK.
    AllowedPattern: "^(|vpc-[a-zA-Z0-9-]+)$"

  PublicSubnet1:
    Type: String
    Default: ""
    Description: >-
      ID of the public subnet in Availability Zone 1. Required if UseExistingVPC is
      true. DO NOT CHANGE VALUE WHEN UPDATING AN EXISTING STACK.
    AllowedPattern: "^(|subnet-[a-zA-Z0-9-]+)$"

  PublicSubnet2:
    Type: String
    Default: ""
    Description: >-
      ID of the public subnet in Availability Zone 2. Required if UseExistingVPC is
      true. DO NOT CHANGE VALUE WHEN UPDATING AN EXISTING STACK.
    AllowedPattern: "^(|subnet-[a-zA-Z0-9-]+)$"

  PrivateSubnet1:
    Type: String
    Default: ""
    Description: >-
      ID of the private subnet in Availability Zone 1. Required if UseExistingVPC is
      true. DO NOT CHANGE VALUE WHEN UPDATING AN EXISTING STACK.
    AllowedPattern: "^(|subnet-[a-zA-Z0-9-]+)$"

  PrivateSubnet2:
    Type: String
    Default: ""
    Description: >-
      ID of the private subnet in Availability Zone 2. Required if UseExistingVPC is
      true. DO NOT CHANGE VALUE WHEN UPDATING AN EXISTING STACK.
    AllowedPattern: "^(|subnet-[a-zA-Z0-9-]+)$"

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM managed policy to use as permissions boundary for IAM roles.
      If provided, this policy will limit the maximum permissions that can be granted to IAM roles
      in this stack, providing an additional layer of security.

  # Virtual Participant Startup Optimization Parameters
  VPLaunchType:
    Type: String
    Default: MICROVM
    AllowedValues:
      - FARGATE
      - EC2
      - MICROVM
    Description: >-
      Compute platform for Virtual Participant containers.
      MICROVM (default): AWS Lambda MicroVMs — each meeting runs in its own
      Firecracker microVM resumed from a snapshot. Live view ready in ~20-25s,
      billed per meeting rather than per warm instance, and needs no load
      balancer, no autoscaling and no OS patching. Requires a region where
      Lambda MicroVMs are available (us-east-1, us-east-2, us-west-2,
      ap-northeast-1, eu-west-1 — not GovCloud); meetings are capped at 8 hours.
      EC2: Warm instances with cached images; ~$33/month per always-on instance,
      plus autoscaling and OS patching to manage. Use where MicroVMs are
      unavailable and startup latency matters.
      FARGATE: Serverless, ~$2/month base, but 1-2 minute startup. Use where
      MicroVMs are unavailable and cost matters more than latency.

  VPInstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge
      - m5.large
      - m5.xlarge
    Description: >-
      EC2 instance type for Virtual Participant (only used if VPLaunchType=EC2).
      t3.medium recommended for basic transcription. For voice assistant + Simli avatar
      workloads, use c5.xlarge or larger for sustained CPU performance (no burstable throttling).

  VPMinInstances:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: >-
      Minimum number of warm EC2 instances (only used if VPLaunchType=EC2).
      Set to 1 for fastest startup, 0 to save costs when not in use.

  VPMaxInstances:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >-
      Maximum number of EC2 instances for scaling (only used if VPLaunchType=EC2).

  VPAttendeePollMs:
    Type: Number
    Default: 20000
    MinValue: 1000
    MaxValue: 120000
    Description: >-
      How often a Teams Virtual Participant samples the meeting UI to
      decide whether the meeting is still running, in milliseconds.
      Leave at the default unless advised otherwise.

  VPPollsBeforeEnd:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 90
    Description: >-
      Consecutive polls on which a Teams meeting must show one or fewer
      attendees before the Virtual Participant leaves. 3 polls at the default
      cadence is about 60 seconds.

  VPPollsBeforeEndMissing:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 90
    Description: >-
      Consecutive polls on which a Teams meeting must show neither a readable
      attendee count nor any in-meeting controls before the Virtual Participant
      leaves. 15 polls at the default cadence is about 5 minutes. Raise
      this if participants report the Virtual Participant leaving meetings
      that are still in progress. A value producing a tolerance outside 4 to
      30 minutes at the chosen cadence is adjusted into that range, so at the
      default cadence anything below 12 is raised.

  TranscriberDesiredTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 20
    Description: >-
      Number of Fargate tasks running the WebSocket transcriber service (used by
      the Stream Audio page and the desktop capture apps). Leave at 1 unless
      EnableVideoRecording is false: with video recording enabled, the desktop
      video stream arrives as a separate connection that must reach the task
      holding the meeting's audio session, which only a single task guarantees.

  TranscriberAutoScalingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Scale the WebSocket transcriber service on average CPU utilization.
      Requires EnableVideoRecording to be false, for the same reason as
      TranscriberDesiredTaskCount. Capacity is only ever added automatically, so
      that scaling never interrupts a meeting in progress; it stays at its high
      water mark until you reduce it deliberately, or until you set this back to
      "false" and the task count returns to TranscriberDesiredTaskCount.

  TranscriberMinTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 20
    Description: >-
      Minimum number of WebSocket transcriber tasks when
      TranscriberAutoScalingEnabled is true.

  TranscriberMaxTaskCount:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 50
    Description: >-
      Maximum number of WebSocket transcriber tasks when
      TranscriberAutoScalingEnabled is true.

  TranscriberScalingCpuTargetPercent:
    Type: Number
    Default: 35
    MinValue: 10
    MaxValue: 90
    Description: >-
      Average CPU utilization that WebSocket transcriber auto scaling aims to
      hold. Kept below the load at which a task reports itself unhealthy to the
      load balancer.

  EnableDataRetentionOnDelete:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable data retention on stack deletion for compliance requirements.
      When true (default): DynamoDB tables, S3 buckets (recordings and logs), and encryption key will be retained.
      When false: All resources deleted for clean stack removal.
      Enterprise customers with compliance requirements should set to true.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: >-
      Default logging level for all Lambda functions. Set to DEBUG for
      troubleshooting, INFO for normal operation.

  EnableOperationalAlarms:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Create the CloudWatch alarms that watch the transcription pipeline and
      notify the operational alerts SNS topic. Set to 'false' if you forward
      these signals from somewhere else, or if your organisation manages alarms
      outside the application stack. The operational dashboard and the alerts
      topic are created either way, so turning this off removes the
      notifications rather than the visibility. See docs/monitoring.md.

  TranscribeConcurrentStreamAlarmThreshold:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Number of concurrent Amazon Transcribe streaming sessions at which the
      'transcribe-concurrent-streams-near-quota' alarm notifies. The default of
      20 is 80% of the default account quota of 25 concurrent streams, which
      leaves headroom to request an increase before meetings start being
      refused. If you raise the quota, raise this with it — the alarm has no way
      to read your account's current quota, so left at 20 it keeps notifying at
      a level that is no longer close to the limit.

