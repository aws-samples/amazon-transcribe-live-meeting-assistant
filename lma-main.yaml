                    - !Ref AWS::NoValue

  # Named independently of the function on purpose: !Sub-ing the function's
  # generated physical name would make this group depend on the function, so
  # CloudFormation would create the function first and the first invocation
  # would let Lambda create the group itself.
  S3BucketCleanupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldDeleteDataOnDelete
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/S3BucketCleanupFunction"
      RetentionInDays: !Ref CloudWatchLogsExpirationInDays
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

  S3BucketCleanupFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldDeleteDataOnDelete
    DependsOn:
      - S3BucketCleanupFunctionLogGroup
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-L1
            reason: 'python3.12 is an actively supported Lambda runtime per AWS; upgrade to 3.13 is an availability/testing consideration'
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with AWS services via APIs
          - id: W92
            reason: Function does not require reserved concurrency as it scales based on demand
          - id: LAMBDA-011
            reason: CloudWatch alarms are an observability preference, not a security requirement
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # LAMBDA-011: CloudWatch alarms are an observability preference, not a security requirement
    Properties:
      Handler: index.handler
      Role: !GetAtt S3BucketCleanupRole.Arn
      Timeout: 900
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Ref S3BucketCleanupFunctionLogGroup
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          LOGGING_BUCKET_NAME: !Ref LoggingBucket
          RECORDINGS_BUCKET_NAME: !If
            - ShouldCreateRecordingBucket
            - !Ref RecordingsBucket
            - ""
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'INFO')))
          
          s3 = boto3.client('s3')
          
          def empty_bucket(bucket_name):
              """Empty all objects and versions from an S3 bucket"""
              try:
                  logger.info(f"Emptying bucket: {bucket_name}")
                  
                  # Check if bucket exists
                  try:
                      s3.head_bucket(Bucket=bucket_name)
                  except s3.exceptions.NoSuchBucket:
                      logger.info(f"Bucket {bucket_name} does not exist, skipping")
                      return
                  except Exception as e:
                      logger.warning(f"Error checking bucket {bucket_name}: {e}")
                      return
                  
                  # Check if versioning is enabled
                  try:
                      versioning = s3.get_bucket_versioning(Bucket=bucket_name)
                      is_versioned = versioning.get('Status') == 'Enabled'
                  except Exception as e:
                      logger.warning(f"Could not get versioning status: {e}")
                      is_versioned = False
                  
                  # Delete all object versions
                  if is_versioned:
                      logger.info(f"Bucket {bucket_name} has versioning enabled, deleting all versions")
                      paginator = s3.get_paginator('list_object_versions')
                      
                      for page in paginator.paginate(Bucket=bucket_name):
                          # Delete versions
                          versions = page.get('Versions', [])
                          if versions:
                              objects_to_delete = [{'Key': obj['Key'], 'VersionId': obj['VersionId']} 
                                                 for obj in versions]
                              if objects_to_delete:
                                  logger.info(f"Deleting {len(objects_to_delete)} object versions")
                                  s3.delete_objects(
                                      Bucket=bucket_name,
                                      Delete={'Objects': objects_to_delete, 'Quiet': True}
                                  )
                          
                          # Delete delete markers
                          delete_markers = page.get('DeleteMarkers', [])
                          if delete_markers:
                              markers_to_delete = [{'Key': obj['Key'], 'VersionId': obj['VersionId']} 
                                                 for obj in delete_markers]
                              if markers_to_delete:
                                  logger.info(f"Deleting {len(markers_to_delete)} delete markers")
                                  s3.delete_objects(
                                      Bucket=bucket_name,
                                      Delete={'Objects': markers_to_delete, 'Quiet': True}
                                  )
                  else:
                      # Delete all objects (non-versioned bucket)
                      logger.info(f"Bucket {bucket_name} is not versioned, deleting all objects")
                      paginator = s3.get_paginator('list_objects_v2')
                      
                      for page in paginator.paginate(Bucket=bucket_name):
                          objects = page.get('Contents', [])
                          if objects:
                              objects_to_delete = [{'Key': obj['Key']} for obj in objects]
                              if objects_to_delete:
                                  logger.info(f"Deleting {len(objects_to_delete)} objects")
                                  s3.delete_objects(
                                      Bucket=bucket_name,
                                      Delete={'Objects': objects_to_delete, 'Quiet': True}
                                  )
                  
                  logger.info(f"Successfully emptied bucket: {bucket_name}")
                  
              except Exception as e:
                  logger.error(f"Error emptying bucket {bucket_name}: {e}", exc_info=True)
                  raise
          
          def delete_bucket_with_retry(bucket_name, max_retries=5):
              """Delete bucket with retry logic to handle async writes"""
              for attempt in range(max_retries):
                  try:
                      logger.info(f"Attempt {attempt + 1}/{max_retries}: Emptying and deleting bucket {bucket_name}")
                      
                      # Empty the bucket
                      empty_bucket(bucket_name)
                      
                      # Immediately try to delete the bucket
                      logger.info(f"Deleting bucket: {bucket_name}")
                      s3.delete_bucket(Bucket=bucket_name)
                      logger.info(f"Successfully deleted bucket: {bucket_name}")
                      return True
                      
                  except s3.exceptions.NoSuchBucket:
                      logger.info(f"Bucket {bucket_name} already deleted")
                      return True
                      
                  except Exception as e:
                      error_msg = str(e)
                      if 'BucketNotEmpty' in error_msg or 'not empty' in error_msg.lower():
                          logger.warning(f"Bucket {bucket_name} not empty after cleanup (attempt {attempt + 1}/{max_retries})")
                          if attempt < max_retries - 1:
                              logger.info("Waiting 3 seconds before retry...")
                              import time
                              time.sleep(3)
                          else:
                              logger.error(f"Failed to delete bucket {bucket_name} after {max_retries} attempts")
                              raise
                      else:
                          logger.error(f"Error deleting bucket {bucket_name}: {e}")
                          raise
              
              return False
          
          def handler(event, context):
              logger.info(f"Event: {event}")
              request_type = event['RequestType']
              
              try:
                  if request_type == 'Delete':
                      # Get exact bucket names from environment variables
                      import os
                      logging_bucket = os.environ.get('LOGGING_BUCKET_NAME', '')
                      recordings_bucket = os.environ.get('RECORDINGS_BUCKET_NAME', '')
                      
                      bucket_names = [b for b in [logging_bucket, recordings_bucket] if b]
                      logger.info(f"Deleting buckets: {bucket_names}")
                      
                      # Delete each bucket with retry logic
                      for bucket_name in bucket_names:
                          delete_bucket_with_retry(bucket_name)
                      
                      logger.info("All buckets deleted successfully")
                  else:
                      logger.info(f"Request type is {request_type}, no action needed")
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  
              except Exception as e:
                  logger.error(f"Error handling bucket cleanup: {e}", exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  # Note: This custom resource intentionally has NO dependencies on the buckets
  # Bucket names are passed via Lambda environment variables to avoid implicit dependencies
  # This ensures the handler is deleted LAST during stack deletion
  S3BucketCleanupHandler:
